<style>
/* Layout: sticky header · game index chips · one article per game (photo masthead, deck, three fact columns, live model strip) */
:root{
  --bg:#0a0e13; --bg2:#0d131a; --panel:#111821; --panel2:#17202b; --line:#22303f; --text:#e7eef6; --mute:#8796a8;
  --accent:#3ddc97; --accent-ink:#06210f; --blue:#5aa9ff; --warn:#ffb547; --glow:61,220,151; --radius:14px; color-scheme:dark;
  --f-ui:"Exo 2",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f-disp:"Oxanium","Exo 2",-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){--bg:#f3f5f8;--bg2:#eaeef3;--panel:#fff;--panel2:#eef2f6;--line:#dbe2ea;--text:#111821;--mute:#5a697b;--accent:#0d9a60;--accent-ink:#fff;--blue:#1d6bd0;--warn:#a96400;--glow:13,154,96;color-scheme:light}
  :root:not([data-theme="dark"]) .lg-d{display:none} :root:not([data-theme="dark"]) .lg-l{display:inline-block}
}
:root[data-theme="light"]{--bg:#f3f5f8;--bg2:#eaeef3;--panel:#fff;--panel2:#eef2f6;--line:#dbe2ea;--text:#111821;--mute:#5a697b;--accent:#0d9a60;--accent-ink:#fff;--blue:#1d6bd0;--warn:#a96400;--glow:13,154,96;color-scheme:light}
:root[data-theme="light"] .lg-d{display:none} :root[data-theme="light"] .lg-l{display:inline-block}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 var(--f-ui)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
.lg-l{display:none}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;height:60px}
.brand{font-family:var(--f-disp);font-weight:800;font-size:18px;letter-spacing:.6px;text-transform:uppercase;white-space:nowrap;text-decoration:none}
.brand b{color:var(--accent)}
.hright{margin-left:auto;display:flex;align-items:center;gap:8px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:none;padding:5px 8px;font-size:12px;font-weight:700;border-radius:8px;color:var(--mute)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:10px;width:34px;height:32px;display:grid;place-items:center;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px;border-radius:10px;padding:9px 15px;border:1px solid transparent;white-space:nowrap;text-decoration:none}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:var(--line);background:var(--panel)}
.btn.ghost:hover{border-color:var(--accent)}

.intro{padding:34px 0 18px}
.eyebrow{font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--f-disp);font-weight:800;font-size:clamp(30px,4.4vw,46px);line-height:1.08;margin:8px 0 10px;text-wrap:balance}
.intro p{color:var(--mute);margin:0;max-width:640px}
.index{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.index a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-family:var(--f-disp);font-weight:700;font-size:14px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.index a:hover{border-color:var(--accent)}
.index img{width:20px;height:20px}
.index small{font-family:var(--f-ui);font-weight:600;color:var(--mute);font-size:12px}

article{margin:26px 0 44px;scroll-margin-top:76px}
.mast{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:21/9;background:#0b0f14;max-width:100%}
.mast img.ph{width:100%;height:100%;object-fit:cover}
.mast::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,8,12,.05) 30%,rgba(5,8,12,.88) 100%)}
.mtext{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:22px 26px;color:#f3f7fb}
.kick{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
.kick .lgs{display:inline-flex;gap:4px}
.kick .lgs img{width:26px;height:26px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.kick .when{color:#c9d4df;font-family:var(--f-ui);font-weight:600;letter-spacing:.3px;text-transform:none}
.mtext h2{font-family:var(--f-disp);font-weight:800;font-size:clamp(22px,3.2vw,34px);line-height:1.12;margin:8px 0 0;text-wrap:balance;max-width:860px;text-shadow:0 2px 12px rgba(0,0,0,.45)}
.credit{position:absolute;top:10px;right:12px;z-index:1;font-size:10.5px;color:#fff;opacity:.8;text-shadow:0 1px 2px #000}
.credit a{color:#fff}

.deck{font-size:18.5px;line-height:1.6;margin:20px 0 0;max-width:820px}
.strip{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;margin:20px 0 0;padding:14px 18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.strip .teams{display:flex;align-items:center;gap:10px;font-family:var(--f-disp);font-weight:800;font-size:18px}
.strip .teams img{width:30px;height:30px}
.strip .teams span{color:var(--mute);font-weight:700;font-size:15px}
.strip .bar{min-width:0}
.wpb{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--panel2)}
.wpb i:first-child{background:var(--blue)}.wpb i:last-child{background:var(--accent)}
.strip .lbl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute);margin-top:6px;gap:8px;flex-wrap:wrap}
.strip .lbl b{color:var(--text)}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:18px}
.col{border-top:2px solid var(--line);padding-top:12px;min-width:0}
.col.bet{border-top-color:var(--accent)}
.col h3{font-family:var(--f-disp);font-size:12.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--mute);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.col.bet h3{color:var(--accent)}
.col h3 svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.col ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.col li::marker{color:var(--accent)}
.foot{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;margin-top:18px;font-size:12.5px;color:var(--mute)}
.foot .src a{color:var(--mute)}
.foot .src a:hover{color:var(--accent)}
.note{color:var(--mute);font-size:12.5px;border-top:1px solid var(--line);padding-block:20px 40px}
.empty{padding:60px 0;color:var(--mute)}
footer a{color:inherit;text-decoration:underline;text-underline-offset:2px}footer{line-height:1.5;border-top:1px solid var(--line);padding-block:22px calc(22px + env(safe-area-inset-bottom,0px));color:var(--mute);font-size:13px}
@media (max-width:860px){.cols{grid-template-columns:1fr}.mast{aspect-ratio:16/10}.strip{grid-template-columns:1fr}.deck{font-size:17px}}
@media (max-width:560px){.hide-m{display:none}.kick .when{flex-basis:100%}.btn.pri{padding:8px 11px;font-size:13px}.mast{aspect-ratio:4/3.3;border-radius:14px}.mtext{padding:16px}.top{gap:8px}.brand{font-size:15px}}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}
</style>

<script>
/* colour themes: the accent (buttons, tabs, logo, highlights, heatmap) follows the visitor's choice;
   meaning colours (green = good/value, red = bad, amber = warning) never change */
(function(){
  const A = {
    rink:  {en:"Rink",  sv:"Rink",  c:"#3ddc97", bg:"#111821", d:null, l:null},
    ember: {en:"Ember", sv:"Glöd",  c:"#ff8a3d", bg:"#1a1410",
      d:{bg:"#110d0a",bg2:"#15100c",panel:"#1a1410",panel2:"#231a14",line:"#35281e",text:"#f5ede5",mute:"#a9988b",chip:"#271d16",
         accent:"#ff8a3d","accent-ink":"#2a1100",heat:"255,138,61",glow:"255,138,61",pc1:"#ff8a3d",pc3:"#2ee6c5",line2:"#ffc27a",hit:"#ff8a3d",accent2:"#f2c99a",pc2:"#f2c99a",good:"#ff8a3d",bad:"#ff4d6d"},
      l:{bg:"#faf5ef",bg2:"#f3ebe2",panel:"#ffffff",panel2:"#f7efe6",line:"#eadccd",text:"#1e1611",mute:"#76655a",chip:"#f3e8dc",
         accent:"#c2560e","accent-ink":"#ffffff",heat:"194,86,14",glow:"194,86,14",pc1:"#c2560e",pc3:"#0b8f7b",line2:"#b8661a",hit:"#d9681c",accent2:"#8a5a32",pc2:"#8a5a32",good:"#c2560e",bad:"#c8203f"}},
    neon:  {en:"Neon",  sv:"Neon",  c:"#ff4fa8", bg:"#1a111d",
      d:{bg:"#100a12",bg2:"#140c17",panel:"#1a111d",panel2:"#241827",line:"#37253b",text:"#f7ebf4",mute:"#aa93a5",chip:"#27192b",
         accent:"#ff4fa8","accent-ink":"#2b0016",heat:"255,79,168",glow:"255,79,168",pc1:"#ff4fa8",pc4:"#a78bfa",line2:"#ff9ad5",hit:"#ff4fa8",accent2:"#b794ff",pc2:"#b794ff",good:"#ff4fa8",bad:"#ff6a3d"},
      l:{bg:"#fbf4f8",bg2:"#f5e9f0",panel:"#ffffff",panel2:"#f8edf3",line:"#ecd8e3",text:"#1d1219",mute:"#75616d",chip:"#f5e5ee",
         accent:"#c21d78","accent-ink":"#ffffff",heat:"194,29,120",glow:"194,29,120",pc1:"#c21d78",pc4:"#6a48d6",line2:"#b0337f",hit:"#d6328c",accent2:"#7a4fd6",pc2:"#7a4fd6",good:"#c21d78",bad:"#c43d12"}}
  };
  const OLD = {green:"rink", blue:"rink", mint:"rink", violet:"neon", pink:"neon", gold:"ember"};
  const VARS = ["bg","bg2","panel","panel2","line","text","mute","chip","accent","accent-ink","heat","glow","pc1","pc2","pc3","pc4","line2","hit","accent2","good","bad"];
  const get = () => "neon";   // one look for everyone: Neon (light and dark stay switchable)
  const set = v => { try { localStorage.setItem("set:accent", v); } catch(e){} };
  const theme = () => { const a = document.documentElement.getAttribute("data-theme"); if (a==="light"||a==="dark") return a; return matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"; };
  function apply(){
    const k = get(), v = A[k][theme()==="light" ? "l" : "d"], st = document.documentElement.style;
    VARS.forEach(p => st.removeProperty("--" + p));
    document.querySelectorAll("img[data-shot]").forEach(im => { const src = "assets/" + im.dataset.shot + (k === "rink" ? "" : "-" + k) + ".webp"; if (im.getAttribute("src") !== src) im.setAttribute("src", src); });
    if (v) Object.entries(v).forEach(([p, x]) => st.setProperty("--" + p, x));
    const mc = document.querySelector('meta[name="theme-color"]'); if (mc){ if (!mc.dataset.c0) mc.dataset.c0 = mc.getAttribute("content") || ""; mc.setAttribute("content", v ? v.bg : mc.dataset.c0); }
    document.documentElement.dataset.accent = k;
  }
  apply();
  document.addEventListener("DOMContentLoaded", apply);
  new MutationObserver(apply).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});
  try { matchMedia("(prefers-color-scheme: light)").addEventListener("change", apply); } catch(e){}
  const css = document.createElement("style");
  css.textContent = `.accbtn{display:none!important}.accbtn i{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
#accpop{position:absolute;z-index:200;background:var(--panel,#111821);border:1px solid var(--line,#22303f);border-radius:14px;padding:6px;box-shadow:0 18px 50px -12px rgba(0,0,0,.55);display:grid;gap:2px;min-width:170px;font:600 13.5px var(--f-ui,system-ui)}
#accpop .ah{font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--mute,#8796a8);padding:6px 10px 4px}
#accpop button{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--text,#e7eef6);padding:8px 10px;border-radius:9px;cursor:pointer;text-align:left;font:inherit}
#accpop button:hover{background:var(--panel2,#17202b)}
#accpop button i{width:16px;height:16px;border-radius:50%;flex:none}
#accpop button.on{background:var(--panel2,#17202b)}#accpop button.on::after{content:"✓";margin-left:auto;color:var(--text,#e7eef6)}`;
  document.head.appendChild(css);
  const close = () => { const p = document.getElementById("accpop"); if (p) p.remove(); };
  document.addEventListener("click", e => {
    const b = e.target.closest(".accbtn");
    if (b){
      e.stopPropagation();
      if (document.getElementById("accpop")){ close(); return; }
      const sv = (document.documentElement.lang||"").startsWith("sv");
      const r = b.getBoundingClientRect(), p = document.createElement("div");
      p.id = "accpop"; p.setAttribute("role", "menu");
      p.innerHTML = `<div class="ah">${sv ? "Tema" : "Theme"}</div>` + Object.entries(A).map(([k,x]) => `<button type="button" role="menuitemradio" aria-checked="${get()===k}" data-acc="${k}" class="${get()===k?"on":""}"><i style="background:linear-gradient(135deg,${x.bg} 0 50%,${x.c} 50% 100%);box-shadow:0 0 0 1.5px ${x.c}"></i><span>${sv ? x.sv : x.en}</span></button>`).join("");
      document.body.appendChild(p);
      const w = p.offsetWidth;
      p.style.top = (r.bottom + 8 + scrollY) + "px";
      p.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.right - w)) + scrollX + "px";
      return;
    }
    const o = e.target.closest("[data-acc]");
    if (o){ set(o.dataset.acc); apply(); close(); return; }
    if (!e.target.closest("#accpop")) close();
  }, true);
  addEventListener("keydown", e => { if (e.key === "Escape") close(); });
  addEventListener("resize", close);
})();
</script>

  betting:'<path d="M4 18l5-6 4 3 7-9"/><path d="M14 6h6v6"/>' };

function currentTheme(){ return document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"); }
function applyTheme(th){ if (th) document.documentElement.dataset.theme = th; else delete document.documentElement.dataset.theme; ["#theme","#theme2"].forEach(id => { const b=$(id); if(b) b.textContent = currentTheme()==="light" ? "☾" : "☀"; }); }

function render(){
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-t]").forEach(el => { if (el.dataset.t==="rg") el.innerHTML = t("rg"); else el.textContent = t(el.dataset.t); });
  document.querySelectorAll("#lang button").forEach(b => b.classList.toggle("on", b.dataset.l===LANG));
  const P = PDATA?.previews || [], G = PDATA?.games || {};
  if (!P.length){ $("#main").innerHTML = `<div class="intro"><div class="eyebrow">${t("eyebrow")}</div><h1>${t("eyebrow")}</h1></div><p class="empty">${t("none")}</p>`; return; }
  const day = (()=>{ try { return new Date(PDATA.date+"T12:00:00").toLocaleDateString(LOCALE(),{weekday:"long",day:"numeric",month:"long"}); } catch(e){ return PDATA.date; } })();
  const head = `<div class="intro"><div class="eyebrow">${t("eyebrow")}</div><h1>${esc(t("h1_any",{d:day.charAt(0).toUpperCase()+day.slice(1)}))}</h1><p>${t("intro")}</p>
    <nav class="index">${P.map(p=>{ const g=G[p.id]||{}; return `<a href="#g${p.id}">${logo(g.away,20)}${esc(g.away||"")} <small>@</small> ${esc(g.home||"")}${logo(g.home,20)}</a>`; }).join("")}</nav></div>`;
  const arts = P.map(p => {
    const g = G[p.id] || {}; const L = p[LANG] || p.en; const ph = p.photo || {};
    const list = (k) => `<div class="col ${k==="betting"?"bet":""}"><h3><svg viewBox="0 0 24 24">${ICON[k]}</svg>${t(k)}</h3><ul>${(L[k]||[]).map(x=>x === "\u0000LOCK" ? `<li class="pwli"><a href="APP_URL" style="filter:none">🔒 ${LANG==="sv" ? "Spelarchanser (modell mot marknad) finns i Pro" : "Player chances (model vs market) are in Pro"}</a></li>` : `<li>${esc(x)}</li>`).join("")}</ul></div>`;
    const strip = g.home ? `<div class="strip">
        <div class="teams">${logo(g.away,30)}${g.away} <span>${g.ma.toFixed(1)} – ${g.mh.toFixed(1)}</span> ${g.home}${logo(g.home,30)}</div>
        <div class="bar"><div class="wpb"><i style="width:${g.pa*100}%"></i><i style="width:${g.ph*100}%"></i></div>
          <div class="lbl"><span><b>${pct(g.pa)}</b> ${g.away} ${t("win")}</span><span>${t("total",{x:g.exp.toFixed(1)})}</span><span>${g.home} ${t("win")} <b>${pct(g.ph)}</b></span></div></div>
        <a class="btn ghost" href="${APP}#g${p.id}">${t("open_match")}</a></div>` : "";
    return `<article id="g${p.id}">
      <div class="mast">${ph.src?`<img class="ph" src="${esc(ph.src)}" alt="${esc(ph.alt||"")}" style="object-position:${esc(ph.pos||"center")}" loading="lazy">`:""}
        ${ph.author?`<span class="credit">${t("photo")}: ${esc(ph.author)} · <a href="${esc(ph.license_url)}" target="_blank" rel="noopener license">${esc(ph.license)}</a> · <a href="${esc(ph.page)}" target="_blank" rel="noopener">Wikimedia Commons</a></span>`:""}
        <div class="mtext"><div class="kick"><span class="lgs">${logo(g.away,26)}${logo(g.home,26)}</span>${esc(L.kicker||"")}<span class="when">${when(g.start)}${g.venue?" · "+esc(g.venue):""}</span></div><h2>${esc(L.title)}</h2></div></div>
      <p class="deck">${esc(L.deck)}</p>
      ${strip}
      <div class="cols">${list("news")}${list("records")}${list("betting")}</div>
    </article>`;
  }).join("");
  $("#main").innerHTML = head + arts + `<p class="note">${t("note")}</p>`;
  if (location.hash){ const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }
}
$("#lang").addEventListener("click", e => { const b=e.target.closest("button[data-l]"); if(!b) return; LANG=b.dataset.l; store.set("set:lang",LANG); render(); });
["#theme","#theme2"].forEach(id => $(id).addEventListener("click", () => { const nx = currentTheme()==="light"?"dark":"light"; store.set("set:theme",nx); applyTheme(nx); }));
applyTheme(store.get("set:theme"));
render();
</script>

<div id="agegate" hidden><div class="agbox" role="dialog" aria-modal="true" aria-labelledby="ag_h">
  <div class="agbadge">18+</div><h3 id="ag_h"></h3><p id="ag_p"></p>
  <div class="agrow"><button type="button" id="ag_yes" class="agbtn pri"></button><button type="button" id="ag_no" class="agbtn"></button></div>
  <p id="ag_msg" class="agmsg" hidden></p></div></div>
<style>
#agegate{position:fixed;inset:0;z-index:100;background:rgba(5,8,12,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}
#agegate[hidden]{display:none}
.agbox{width:min(420px,100%);background:var(--panel,#121820);color:var(--text,#e8edf3);border:1px solid var(--line,#26303b);border-radius:16px;padding:24px;text-align:center;box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
.agbadge{display:inline-grid;place-items:center;width:52px;height:52px;border:2.5px solid currentColor;border-radius:50%;font-weight:800;font-size:16px;margin-bottom:10px}
.agbox h3{margin:4px 0 8px;font-size:20px}.agbox p{margin:0 0 16px;color:var(--mute,#8b97a6);font-size:14px;line-height:1.5}
.agrow{display:flex;gap:10px}.agbtn{flex:1;border:1px solid var(--line,#26303b);background:transparent;color:inherit;border-radius:10px;padding:12px 14px;font:700 15px/1 inherit;cursor:pointer}
.agbtn.pri{background:var(--accent,#1fb36b);border-color:var(--accent,#1fb36b);color:#06210f}
.agmsg{margin:14px 0 0!important;color:var(--text,#e8edf3)!important}.agmsg a{color:var(--accent,#1fb36b)}
</style>
<script>
(function(){
  const S = {
    en:{h:"Are you 18 or older?", p:"NHL Props Lab is an analysis tool for sports betting and is only for adults. We don't take bets.", yes:"Yes, I'm 18+", no:"No",
        msg:'Sorry, this site is only for people aged 18 and over. Worried about gambling? <a href="https://www.stodlinjen.se" rel="noopener">Stödlinjen</a> 020-81 91 00.'},
    sv:{h:"Är du 18 år eller äldre?", p:"NHL Props Lab är ett analysverktyg för sportspel och är bara för vuxna. Vi tar inte emot spel.", yes:"Ja, jag är 18+", no:"Nej",
        msg:'Tyvärr, sajten är bara för personer som fyllt 18. Orolig för spel? <a href="https://www.stodlinjen.se" rel="noopener">Stödlinjen</a> 020-81 91 00.'}};
  let ok = null; try { ok = localStorage.getItem("age18"); } catch(e) {}
  if (ok === "1") return;
  let L = "en"; try { const s = localStorage.getItem("set:lang"); L = s==="sv"||s==="en" ? s : ((navigator.language||"").toLowerCase().startsWith("sv") ? "sv" : "en"); } catch(e) {}
  const T = S[L], el = document.getElementById("agegate");
  document.getElementById("ag_h").textContent = T.h; document.getElementById("ag_p").textContent = T.p;
  document.getElementById("ag_yes").textContent = T.yes; document.getElementById("ag_no").textContent = T.no;
  el.hidden = false; document.documentElement.style.overflow = "hidden";
  document.getElementById("ag_yes").onclick = () => { try { localStorage.setItem("age18","1"); } catch(e) {} el.hidden = true; document.documentElement.style.overflow = ""; };
  document.getElementById("ag_no").onclick = () => { const m = document.getElementById("ag_msg"); m.innerHTML = T.msg; m.hidden = false; };
})();
</script>
