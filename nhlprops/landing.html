<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NHL Props Lab</title>
<meta name="description" content="NHL player prop probabilities for every skater: goals, assists, points, shots, hits and blocks, tested on thousands of games.">
<meta name="theme-color" content="#0a0e13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Props Lab">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=Oxanium:wght@500;600;700;800&display=swap">
<style>
:root{
  --bg:#0a0e13; --bg2:#0d131a; --panel:#111821; --panel2:#17202b; --line:#22303f; --text:#e7eef6; --mute:#8796a8;
  --accent:#3ddc97; --accent-ink:#06210f; --glow:61,220,151; --radius:14px; color-scheme:dark;
  --f-ui:"Exo 2",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f-disp:"Oxanium","Exo 2",-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3f5f8; --bg2:#eaeef3; --panel:#ffffff; --panel2:#eef2f6; --line:#dbe2ea; --text:#111821; --mute:#5a697b;
    --accent:#0d9a60; --accent-ink:#ffffff; --glow:13,154,96; color-scheme:light;
  }
  :root:not([data-theme="dark"]) .lg-d{display:none} :root:not([data-theme="dark"]) .lg-l{display:inline-block}
}
:root[data-theme="light"]{
  --bg:#f3f5f8; --bg2:#eaeef3; --panel:#ffffff; --panel2:#eef2f6; --line:#dbe2ea; --text:#111821; --mute:#5a697b;
  --accent:#0d9a60; --accent-ink:#ffffff; --glow:13,154,96; color-scheme:light;
}
:root[data-theme="light"] .lg-d{display:none} :root[data-theme="light"] .lg-l{display:inline-block}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 var(--f-ui)}
main{overflow-x:clip}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
.tour{padding-top:24px}#tour{scroll-margin-top:64px}
.tourbox{position:relative;max-width:1040px;margin:0 auto;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#0a0e13;
  box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.02) inset,0 0 60px rgba(var(--glow),.08)}
.tourbox video{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#0a0e13}
.tourplay{position:absolute;inset:0;display:grid;place-items:center;border:0;padding:0;background:linear-gradient(180deg,rgba(10,14,19,0) 40%,rgba(10,14,19,.35));cursor:pointer}
.tourplay span{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;background:rgba(61,220,151,.95);box-shadow:0 12px 40px rgba(0,0,0,.45),0 0 0 10px rgba(61,220,151,.18);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.tourplay svg{width:34px;height:34px;margin-left:5px;fill:#04170d}
.tourplay:hover span,.tourplay:focus-visible span{transform:scale(1.07);box-shadow:0 14px 44px rgba(0,0,0,.5),0 0 0 14px rgba(61,220,151,.22)}
.tourplay[hidden]{display:none}
@media (max-width:640px){.tourplay span{width:62px;height:62px}.tourplay svg{width:26px;height:26px}}
.tourbtn{display:inline-flex;align-items:center;gap:8px}.tourbtn svg{width:15px;height:15px;fill:currentColor}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lg-l{display:none}
.show-m{display:none!important}
.fl{align-items:center}

/* header */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:border-color .2s}
header.scrolled{border-bottom-color:var(--line)}
.top{display:flex;align-items:center;gap:18px;height:64px;padding-top:env(safe-area-inset-top,0px)}
.brand{font-family:var(--f-disp);font-weight:800;font-size:19px;letter-spacing:.6px;text-transform:uppercase;white-space:nowrap}
.brand b{color:var(--accent)}
.links{display:flex;gap:4px;margin-left:12px}
.links a{color:var(--mute);font-weight:600;font-size:14px;padding:8px 12px;border-radius:8px}
.links a:hover{color:var(--text);background:var(--panel2)}
.hright{margin-left:auto;display:flex;align-items:center;gap:8px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:none;padding:5px 9px;font-size:12px;font-weight:700;border-radius:8px;color:var(--mute)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:10px;width:36px;height:34px;display:grid;place-items:center;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:15px;border-radius:11px;padding:12px 20px;border:1px solid transparent;white-space:nowrap;transition:transform .15s,box-shadow .15s,background .15s}
.btn.pri{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 24px -8px rgba(var(--glow),.7)}
.btn.pri:hover{transform:translateY(-1px);box-shadow:0 10px 30px -8px rgba(var(--glow),.8)}
.btn.ghost{border-color:var(--line);background:var(--panel)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:9px}

/* hero */
.hero{position:relative;overflow:hidden;padding:56px 0 40px}
.hero::before{content:"";position:absolute;inset:-20% -10% auto auto;width:760px;height:760px;background:radial-gradient(closest-side,rgba(var(--glow),.16),transparent 70%);pointer-events:none}
.hgrid{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:40px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-disp);font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);padding:6px 12px;border-radius:999px}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
h1{font-family:var(--f-disp);font-weight:800;font-size:clamp(36px,5.2vw,60px);line-height:1.04;letter-spacing:-.5px;margin:18px 0 16px}
h1 em{font-style:normal;color:var(--accent)}
.lead{font-size:18px;color:var(--mute);max-width:520px;margin:0 0 26px}
.ctas{display:flex;gap:10px;flex-wrap:wrap}
.proof{display:flex;gap:22px;flex-wrap:wrap;margin-top:28px;color:var(--mute);font-size:13px}
.proof b{display:block;font-family:var(--f-disp);font-size:22px;color:var(--text);line-height:1.1}

/* device frames */
.devices{position:relative;aspect-ratio:16/11.2}
.laptop{position:absolute;left:0;top:4%;width:88%}
.laptop .scr{border:10px solid #1c232c;border-bottom-width:14px;border-radius:14px 14px 4px 4px;overflow:hidden;background:#000;box-shadow:0 30px 70px -30px rgba(0,0,0,.7),0 0 0 1px #2c3642}
.laptop .scr img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top}
.laptop .base{height:12px;margin:0 -6%;background:linear-gradient(#2a333e,#151b22);border-radius:0 0 12px 12px;position:relative}
.laptop .base::after{content:"";position:absolute;left:42%;right:42%;top:0;height:5px;background:#0f141a;border-radius:0 0 6px 6px}
.phone{position:absolute;right:0;bottom:0;width:30%;border:7px solid #1a2028;border-radius:34px;overflow:hidden;background:#000;box-shadow:0 30px 60px -20px rgba(0,0,0,.75),0 0 0 1px #2c3642}
.phone::before{content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);width:30%;height:16px;background:#000;border-radius:10px;z-index:2}
.phone img{width:100%;aspect-ratio:390/844;object-fit:cover;object-position:top}
.tablet{border:9px solid #1a2028;border-radius:24px;overflow:hidden;background:#000;box-shadow:0 30px 60px -25px rgba(0,0,0,.7),0 0 0 1px #2c3642}
.tablet img{width:100%;aspect-ratio:820/1180;object-fit:cover;object-position:top}

/* sections */
section{padding:64px 0}
.sh{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
h2{font-family:var(--f-disp);font-weight:800;font-size:clamp(26px,3.4vw,38px);line-height:1.1;margin:0}
.sub{color:var(--mute);margin:8px 0 0;max-width:620px}
.more{color:var(--accent);font-weight:700;font-size:14px;white-space:nowrap}
.alt{background:var(--bg2);border-block:1px solid var(--line)}

/* tonight strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.chip{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;transition:border-color .15s,transform .15s}
.chip:hover{border-color:var(--accent);transform:translateY(-2px)}
.chip .t{font-size:12px;color:var(--mute);display:flex;flex-direction:column;line-height:1.35}
.chip .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .t span:first-child{color:var(--text);font-weight:600}
.chip .tm{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:10px 0 8px}
.chip .tm div{display:flex;align-items:center;gap:7px;font-family:var(--f-disp);font-weight:800;font-size:17px;min-width:0}
.chip .tm div:last-child{justify-content:flex-end}
.chip .tm span{font-family:var(--f-disp);font-weight:700;color:var(--mute);font-size:13px;white-space:nowrap}
.chip img.lg{width:30px;height:30px;object-fit:contain}
.wpb{display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--panel2)}
.wpb i:first-child{background:#5aa9ff}.wpb i:last-child{background:var(--accent)}
.chip .pc{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:6px}
.chip .pc b{color:var(--text)}

/* previews */
.pgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);grid-auto-rows:minmax(200px,auto);gap:16px}
.ed{position:relative;border-radius:16px;overflow:hidden;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--panel);min-width:0;transition:border-color .15s,transform .15s}
.ed:hover{border-color:var(--accent);transform:translateY(-2px)}
.ed .bg{position:relative;overflow:hidden;background:#0b0f14}
.ed .bg img.photo{width:100%;height:100%;object-fit:cover}
.ed .grad{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr}
.ed .grad div{display:grid;place-items:center}
.ed .grad img{width:42%;height:auto;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}
.ed .kick{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;font-family:var(--f-disp);font-size:11.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent)}
.ed .kick span{color:var(--mute);font-family:var(--f-ui);font-weight:600;letter-spacing:.2px;text-transform:none}
.ed h3{font-family:var(--f-disp);font-weight:800;line-height:1.15;margin:6px 0 6px;text-wrap:balance}
.ed p{margin:0;color:var(--mute);font-size:14px;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.ed .read{margin-top:10px;font-weight:700;font-size:13.5px;color:var(--accent)}
.ed.feat{grid-row:span 2;display:flex;flex-direction:column;justify-content:flex-end;min-height:460px}
.ed.feat .bg{position:absolute;inset:0}
.ed.feat::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,8,12,0) 30%,rgba(5,8,12,.92) 100%);pointer-events:none}
.ed.feat .txt{position:relative;z-index:1;padding:22px 24px;color:#f3f7fb}
.ed.feat .kick span{color:#c9d4df}
.ed.feat h3{font-size:clamp(22px,2.4vw,30px);color:#fff}
.ed.feat p{color:#d5dee8;-webkit-line-clamp:3;font-size:15px}
.ed.side{display:grid;grid-template-columns:40% 1fr}
.ed.side .bg{min-height:100%}
.ed.side .txt{padding:16px 18px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.ed.side h3{font-size:18px}
.ed.side p{-webkit-line-clamp:3}
.ed .cr{position:absolute;right:8px;top:6px;z-index:2;font-size:10px;color:#fff;opacity:.75;text-shadow:0 1px 2px #000}

/* features */
.lrec{margin-top:22px;border:1px solid var(--line);border-radius:18px;padding:20px 22px;background:radial-gradient(120% 140% at 0% 0%,rgba(var(--glow),.10),transparent 55%),linear-gradient(180deg,var(--panel2),var(--panel));display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) auto;gap:18px 26px;align-items:center}
.lrec h3{margin:0;font-family:var(--f-disp);font-size:19px;display:flex;align-items:center;gap:8px}.lrec .lrs{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);border:1.5px solid var(--accent);border-radius:999px;padding:2px 9px}.lrec .lrk em{display:block;font-style:normal;font-size:11px;color:var(--mute);margin-top:1px}.lrec p{margin:4px 0 0;color:var(--mute);font-size:13.5px}
.lrec .lrk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.lrec .lrk div{border-left:1px solid var(--line);padding-left:12px}.lrec .lrk small{display:block;font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.lrec .lrk b{display:block;font-family:var(--f-disp);font-size:24px;font-variant-numeric:tabular-nums}.lrec .up{color:var(--accent)}.lrec .dn{color:#ff6b6b}
.lrec a.btn2{white-space:nowrap;border:1.5px solid var(--accent);color:var(--accent);border-radius:999px;padding:9px 16px;font-weight:700;text-decoration:none;font-size:14px;transition:background .2s}
.lrec a.btn2:hover{background:rgba(var(--glow),.12)}.lrec .lrn{grid-column:1/-1;font-size:12px;color:var(--mute);margin:0}
@media (max-width:900px){.lrec{grid-template-columns:1fr}.lrec .lrk{grid-template-columns:repeat(2,minmax(0,1fr))}.lrec .lrk div:nth-child(n+3){margin-top:6px}}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.fcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.fshot{background:#0a0e13;border-bottom:1px solid var(--line);aspect-ratio:16/9.5;overflow:hidden}
.fshot img{width:100%;height:100%;object-fit:cover;object-position:left top}
.ftext{padding:18px 20px 20px}
.ftext h3{font-family:var(--f-disp);font-size:19px;margin:0 0 6px}
.ftext p{margin:0;color:var(--mute);font-size:14.5px}

/* every screen */
.screens{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,2.3fr) minmax(0,.62fr);gap:22px;align-items:end}
.screens .laptop{position:relative;left:auto;top:auto;width:calc(100% - 8%);margin:0 4%}
.screens .phone{position:relative;right:auto;bottom:auto;width:100%}
.scap{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;margin-top:26px;color:var(--mute);font-size:14px}
.scap span{display:flex;align-items:center;gap:8px}
.scap svg{width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:1.8}

/* plans */
.plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:900px;margin:0 auto}
.plan{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px 26px 28px;display:flex;flex-direction:column;gap:14px}
.plan.pro{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 20px 60px -30px rgba(var(--glow),.6)}
.plan h3{font-family:var(--f-disp);font-size:22px;margin:0;display:flex;align-items:center;gap:10px}
.plan .badge{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:3px 9px;border-radius:999px}
.price{font-family:var(--f-disp);font-size:34px;font-weight:800;line-height:1}
.price small{font-size:14px;color:var(--mute);font-weight:600}
.plan ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:14.5px;flex:1}
.plan li{display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:start}
.plan li svg{width:18px;height:18px;margin-top:3px;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.plan li.y svg{stroke:var(--accent)}
.plan li.s{color:var(--mute)} .plan li.s svg{stroke:var(--mute)}
.plan .soon{display:inline-block;font:800 10.5px/1.6 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent);border-radius:999px;padding:0 7px;margin-right:2px;vertical-align:1px}
.plan li.n{color:var(--mute)} .plan li.n svg{stroke:var(--mute)}

/* steps */
.about{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:40px;align-items:start}
.abeye{font:800 12px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
.abtxt h2{margin-bottom:18px}
.abtxt p{color:var(--mute);font-size:16.5px;line-height:1.65;margin:0 0 14px;max-width:62ch}
.abtxt p.abeye{color:var(--accent);font-size:12px;line-height:1.3}
.abtxt .absign{color:var(--ink);font-weight:600;margin-top:20px}
.abcard{padding:26px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.abcard h3{font-family:var(--f-disp);font-size:18px;margin:0 0 12px}
.abcard ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.abcard li{display:grid;grid-template-columns:20px 1fr;gap:10px;font-size:14.5px;line-height:1.5}
.abcard li::before{content:"✓";display:grid;place-items:center;width:18px;height:18px;margin-top:1px;border-radius:50%;font:800 11px/1 var(--f-ui);color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.abnot{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.abnot h3{font-size:16px;margin-bottom:6px}
.abnot p{margin:0;color:var(--mute);font-size:14.5px;line-height:1.55}
@media (max-width:860px){.about{grid-template-columns:1fr;gap:24px}}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;counter-reset:s}
.step{padding:22px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.step h3::before{counter-increment:s;content:"0" counter(s);font-family:var(--f-disp);font-weight:800;font-size:28px;color:var(--accent);display:block;margin-bottom:6px}
.step h3{font-family:var(--f-disp);margin:0 0 6px;font-size:18px}
.step p{margin:0;color:var(--mute);font-size:14.5px}
.final{text-align:center;padding-block:56px 72px}
.final h2{margin-bottom:10px}
.final .ctas{justify-content:center;margin-top:22px}

footer{border-top:1px solid var(--line);padding:28px 0 calc(28px + env(safe-area-inset-bottom,0px));color:var(--mute);font-size:13px}
.fgrid2{display:flex;gap:18px 30px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.fl{display:flex;gap:18px;flex-wrap:wrap}
.age{display:inline-grid;place-items:center;width:34px;height:34px;border:2px solid var(--mute);border-radius:50%;font-weight:800;font-size:12px;color:var(--text);margin-right:10px}
.rg{display:flex;align-items:center;max-width:620px;line-height:1.5}.rg a{color:inherit;text-decoration:underline;text-underline-offset:2px}.age{flex:none}

/* also inside + faq */
.also{margin-top:22px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.also-h{font-weight:700;font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:var(--mute)}
.also ul{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.also li{font-size:13.5px;font-weight:600;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.faqwrap{max-width:820px}
.faq details{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);margin-bottom:10px;transition:border-color .2s}
.faq details[open]{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}

/* scroll reveal: each section's content rises in as it comes into view (only when JS runs) */
.rvon .rv{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:var(--rvd,0ms);will-change:opacity,transform}

/* how-it-works illustrations: play once when the card rises into view (final state without JS / reduced motion) */
.stv{position:relative;height:104px;margin:-4px 0 14px;border-radius:12px;background:radial-gradient(120% 120% at 0% 0%,rgba(var(--glow),.10),transparent 60%),var(--panel2);border:1px solid var(--line);overflow:hidden}
.stv1 svg{position:absolute;inset:10px 10px 18px;width:calc(100% - 20px);height:calc(100% - 28px);overflow:visible}
.sv-axis{stroke:var(--line);stroke-dasharray:3 5}
.sv-jag{fill:none;stroke:var(--mute);stroke-width:2;stroke-linejoin:round;opacity:.45;stroke-dasharray:1px;stroke-dashoffset:0;transition:stroke-dashoffset 1.1s ease .15s,opacity .6s ease 1.5s}
.sv-true{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(var(--glow),.55));stroke-dasharray:1px;stroke-dashoffset:0;transition:stroke-dashoffset 1.1s cubic-bezier(.3,.7,.2,1) 1.25s}
.sv-hot{fill:#ff8a5c}.sv-cold{fill:#6aa8ff}.sv-hot,.sv-cold{transition:opacity .4s ease 1s,transform .4s ease 1s;transform-box:fill-box;transform-origin:center}
.sv-l{position:absolute;font:700 10.5px/1 var(--f-ui,inherit);letter-spacing:.05em;text-transform:uppercase;transition:opacity .4s ease}
.sv-lh{left:calc(10px + (100% - 20px) * .24);top:6px;color:#ff8a5c;transition-delay:1s}.sv-lc{left:calc(10px + (100% - 20px) * .47);bottom:5px;color:#6aa8ff;transition-delay:1s}
.sv-lt{right:12px;top:calc(10px + (100% - 28px) * .52 - 20px);color:var(--accent);transition-delay:2.1s}
.stv2{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
.sv-ck{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:13px;transition:opacity .35s ease,transform .35s ease,border-color .3s;transition-delay:calc(.25s + var(--i)*.28s)}
.sv-ck i{flex:none;width:18px;height:18px;border-radius:50%;background:var(--accent);position:relative;box-shadow:0 0 0 4px rgba(var(--glow),.15);transition:transform .4s cubic-bezier(.3,1.6,.5,1);transition-delay:calc(.45s + var(--i)*.28s)}
.sv-ck i::after{content:"";position:absolute;left:6px;top:3px;width:4px;height:8px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg)}
.sv-ck b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stv3{padding:14px 14px 10px;display:flex;flex-direction:column;gap:9px}
.sv-bar{display:grid;grid-template-columns:62px 1fr 38px;align-items:center;gap:10px;font-size:12.5px}.sv-bar span{color:var(--mute);font-weight:600}.sv-bar b{font-family:var(--f-disp);text-align:right;font-variant-numeric:tabular-nums}
.sv-bar div{height:10px;border-radius:99px;background:var(--line);overflow:hidden}.sv-bar i{display:block;height:100%;border-radius:99px;transition:width 1.1s cubic-bezier(.3,.7,.2,1)}
.sv-fm{width:58%;background:linear-gradient(90deg,rgba(var(--glow),.55),var(--accent));box-shadow:0 0 10px rgba(var(--glow),.5);transition-delay:.3s!important}.sv-fo{width:52%;background:var(--mute);opacity:.6;transition-delay:.55s!important}

  also_h:"Also inside", also:["Playoff & Cup odds","Compare players","7-day archive","Game recaps","Shot maps","Streaks & milestones","Linemates","Line & pair rankings","Goalie saves & shutouts","First goalscorer","Game previews","Odds alerts","Watchlist","Parlay check","Public betting","Closing-odds tracking","Track record","Players & teams explorer","Triage grades","Triage track record","Goalie watch","Power-play point chance"],
  faq_h:"Questions", faq_sub:"The short answers. Everything else is in How it works inside the app.",
  faq:[
   ["Is this a betting site?","<p>No. NHL Props Lab is an analysis tool. We don't take bets or hold money. You place bets with your own licensed sportsbook, if you want to.</p>"],
   ["Does a high percentage mean I should bet?","<p>Not on its own. What matters is the chance compared with the odds. A 60% chance at odds of 1.50 loses money over time; a 30% chance at 4.00 makes money. That's what <i>value</i> and <i>EV</i> show.</p>"],
   ["How accurate is it?","<p>The model was tested on thousands of past games using only what was known before each game, and its percentages match how often things really happen. Every prediction is also graded after the game on the Track record page. Even good probabilities lose often: a 35% chance misses two times out of three.</p>"],
   ["Why doesn't a player on a hot streak get a higher chance?","<p>Because streaks mostly don't continue. The model starts from a player's real level over a long stretch, then gives recent form a little weight. In testing, that beat following the streak.</p>"],
   ["When is it updated?","<p>Through the day, then about an hour before each puck drop with the official lineups. On game nights the starting goalies are checked every 10 minutes across several sources, and the numbers update as soon as one is confirmed or changes. Five minutes before puck drop everything about the game is locked, so nothing changes in the final minutes.</p>"],
   ["Which odds are shown?","<p>Prices from regular sportsbooks and a <i>sharp book</i>, the kind that sets the market, which also fills in players and lines the others don't offer. You can type the odds from your own sportsbook in any odds box, as decimal, American or fractional, and the value updates.</p>"],
   ["What does Pro add?","<p>Pro unlocks every player in every market, best picks and value against the market, Triage grades on every value bet, tonight's card on every player with his power-play point chance, first goalscorer, multi-point, power-play, faceoff and penalty props, full hit rates, matchups and shot maps, Compare with the Quick read, the 7-day archive, sharp-book prices, odds movement, public betting (where the tickets and the money are), alerts and an unlimited watchlist. Free keeps every game page, previews, team stats, the Players & teams explorer, the Triage track record, My picks and a watchlist of 3 players.</p>"],
   ["What do Solid, Lean and Fragile mean?","<p>They grade how solid a value bet is. Each one is re-checked with the player's season and his last 10 games, plus warning signs like an unconfirmed goalie. <b>Solid</b>: every view shows value. <b>Lean</b>: one view or warning disagrees. <b>Fragile</b>: only the model sees value. Solid also needs at least a 3% edge at the price. Fragile isn't wrong, just much less certain, so stake less on it. Blocked shots and power-play points are graded too; hits aren't, as they're too random. The Track record shows every value bet since day one and how each grade performs.</p>"],
   ["Can I follow a player for a later bet?","<p>Yes. Tap the bookmark next to any player. Your watchlist shows his next game with the chance and odds, his game gets a marker on the Games tab, and you can get a push alert on game day.</p>"],
   ["What is the closing-odds check?","<p>Save a pick with the odds you got and, after puck drop, it's compared with the last price before the game. Beating that price again and again is the clearest sign of good picks, even through losing runs. For markets the site has no price for, you type the closing odds in yourself.</p>"],
   ["Can I compare players before I pick one?","<p>Yes. Add up to 4 players from any game and open <i>Compare</i>: chance, odds and value, role, last 10 games on the same scale, hit rates and this season's numbers side by side, with a short <i>Quick read</i> that sums it up in plain words.</p>"],
   ["Can I see what the site said before a game that's already played?","<p>Yes, for the last 7 days. Open <i>Earlier</i> on the Games tab and any game appears exactly as it looked before puck drop, with ✓ / ✗ for what happened on every prop. It's the best way to learn to read the numbers.</p>"],
   ["What do you store about me?","<p>Your email, your saved picks, the players you follow and your settings. No advertising or tracking cookies. Read the <a href=\"legal.html#privacy\">privacy policy</a>.</p>"],

  faq:[
   ["Är det här en spelsajt?","<p>Nej. NHL Props Lab är ett analysverktyg. Vi tar inte emot spel och förvarar inga pengar. Du spelar hos ditt eget licensierade spelbolag, om du vill.</p>"],
   ["Betyder en hög procent att jag ska spela?","<p>Inte i sig. Det som räknas är chansen jämfört med oddset. En chans på 60 % till odds 1,50 förlorar pengar över tid; en chans på 30 % till 4,00 vinner. Det är det <i>värde</i> och <i>EV</i> visar.</p>"],
   ["Hur träffsäker är den?","<p>Modellen har testats på tusentals tidigare matcher med bara det som var känt före varje match, och procenten stämmer med hur ofta saker faktiskt händer. Varje prognos rättas också efter matchen på sidan Facit. Även bra sannolikheter förlorar ofta: en chans på 35 % missar två gånger av tre.</p>"],
   ["Varför får inte en spelare i het form högre chans?","<p>För att sviter oftast inte håller i sig. Modellen utgår från spelarens verkliga nivå över en längre period och ger den senaste formen lite vikt. I testerna slog det att följa sviten.</p>"],
   ["När uppdateras den?","<p>Under dagen, sedan ungefär en timme före varje nedsläpp med de officiella uppställningarna. På matchkvällar kollas startmålvakterna var 10:e minut i flera källor, och siffrorna uppdateras så fort en bekräftas eller byts. Fem minuter före nedsläpp låses allt om matchen, så inget ändras de sista minuterna.</p>"],
   ["Vilka odds visas?","<p>Odds från vanliga spelbolag och ett <i>skarpt spelbolag</i>, den sorten som sätter marknaden, som också fyller i spelare och linjer de andra inte erbjuder. Du kan skriva in oddsen från ditt eget spelbolag i varje oddsruta, som decimal, amerikanska eller bråk, så uppdateras värdet.</p>"],
   ["Vad ger Pro?","<p>Pro låser upp varje spelare i varje spel, bästa spelen och värde mot marknaden, triagebetyg på varje värdespel, kvällens kort på varje spelare med hans chans till powerplaypoäng, första målskytt, flera poäng, powerplay, tekningar och utvisningar, full träffprocent, matchups och skottkartor, Jämför med snabbläsningen, 7 dagars arkiv, skarpa spelbolagets odds, oddsrörelser, spelfördelning (var spelen och pengarna ligger), aviseringar och obegränsad bevakning. Gratis behåller alla matchsidor, förhandstittar, lagstatistik, Spelar- och lagutforskaren, triagefacit, Mina spel och bevakning av 3 spelare.</p>"],
   ["Vad betyder Stabil, Lutar och Skör?","<p>De betygsätter hur stabilt ett värdespel är. Varje spel kontrolleras mot spelarens säsong och hans senaste 10 matcher, plus varningstecken som en obekräftad målvakt. <b>Stabil</b>: alla vyer visar värde. <b>Lutar</b>: en vy eller varning håller inte med. <b>Skör</b>: bara modellen ser värde. Stabil kräver dessutom minst 3 % edge till oddset. Skör är inte fel, bara mycket osäkrare, så satsa mindre. Blockerade skott och powerplaypoäng betygsätts också; tacklingar inte, de är för slumpartade. Resultatsidan visar varje värdespel sedan första dagen och hur varje betyg går.</p>"],
   ["Kan jag följa en spelare inför ett senare spel?","<p>Ja. Tryck på bokmärket bredvid valfri spelare. Bevakningen visar hans nästa match med chans och odds, matchen markeras under Matcher, och du kan få en pushnotis på matchdagen.</p>"],
   ["Vad är kollen mot stängningsodds?","<p>Spara ett spel med oddset du fick så jämförs det efter nedsläpp med det sista priset före matchen. Att slå det priset gång på gång är det tydligaste tecknet på bra spel, även genom förlustperioder. För marknader sajten saknar pris för skriver du in stängningsoddset själv.</p>"],
   ["Kan jag jämföra spelare innan jag väljer?","<p>Ja. Lägg till upp till 4 spelare från valfri match och öppna <i>Jämför</i>: chans, odds och värde, roll, senaste 10 matcherna på samma skala, träffprocent och årets siffror sida vid sida, med en kort <i>snabbläsning</i> som sammanfattar i klartext.</p>"],
   ["Kan jag se vad sajten sa före en match som redan är spelad?","<p>Ja, för de senaste 7 dagarna. Öppna <i>Tidigare</i> under Matcher så visas varje match precis som den såg ut före nedsläpp, med ✓ / ✗ för vad som hände i varje spel. Det bästa sättet att lära sig läsa siffrorna.</p>"],
   ["Vad sparar ni om mig?","<p>Din e-post, dina sparade spel, spelarna du följer och dina inställningar. Inga reklam- eller spårningskakor. Läs <a href=\"legal.html#privacy\">integritetspolicyn</a>.</p>"],

const pct = p => Math.round(p*100) + "%";
const LOCALE = () => LANG==="sv" ? "sv-SE" : "en-GB";
// primary team colours for preview headers
const TC = {ANA:"#F47A38",BOS:"#FFB81C",BUF:"#003087",CGY:"#C8102E",CAR:"#CE1126",CHI:"#CF0A2C",COL:"#6F263D",CBJ:"#002654",DAL:"#006847",DET:"#CE1126",EDM:"#041E42",FLA:"#C8102E",LAK:"#111111",MIN:"#154734",MTL:"#AF1E2D",NSH:"#FFB81C",NJD:"#CE1126",NYI:"#00539B",NYR:"#0038A8",OTT:"#C52032",PHI:"#F74902",PIT:"#000000",SJS:"#006D75",SEA:"#001628",STL:"#002F87",TBL:"#002868",TOR:"#00205B",UTA:"#6CACE4",VAN:"#00205B",VGK:"#B4975A",WSH:"#C8102E",WPG:"#041E42"};
const logo = (tm, size) => { const L = LDATA?.logos?.[tm]; if (!L) return `<span style="font-family:var(--f-disp);font-weight:800">${tm}</span>`;
  return `<img class="lg lg-d" src="${L.dark||L.light}" alt="${tm}" style="width:${size}px;height:${size}px"><img class="lg lg-l" src="${L.light||L.dark}" alt="${tm}" style="width:${size}px;height:${size}px">`; };
const timeOf = iso => { try { return new Date(iso).toLocaleTimeString(LOCALE(),{hour:"2-digit",minute:"2-digit"}); } catch(e){ return ""; } };
const dayOf = iso => { try { return new Date(iso).toLocaleDateString(LOCALE(),{weekday:"short",day:"numeric",month:"short"}); } catch(e){ return ""; } };
const APP = "APP_URL";

function currentTheme(){ return document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"); }
function applyTheme(th){ if (th) document.documentElement.dataset.theme = th; else delete document.documentElement.dataset.theme; document.querySelectorAll(".themebtn").forEach(b => b.textContent = currentTheme()==="light" ? "☾" : "☀"); }
const $ = s => document.querySelector(s);

function strip(){
  const games = LDATA?.games || [];
  $("#tonight_sub").textContent = t("tonight_sub",{n:games.length});
  $("#strip").innerHTML = games.slice(0,4).map(g => `<a class="chip" href="${APP}#g${g.id}">
    <div class="t"><span>${dayOf(g.start)} · ${timeOf(g.start)}</span><span>${esc(g.venue||"")}</span></div>
    <div class="tm"><div>${logo(g.away,30)}${g.away}</div><span>${g.ma.toFixed(1)}–${g.mh.toFixed(1)}</span><div>${g.home}${logo(g.home,30)}</div></div>
    <div class="wpb"><i style="width:${g.pa*100}%"></i><i style="width:${g.ph*100}%"></i></div>
    <div class="pc"><b>${pct(g.pa)}</b><span>${t("prev_total",{x:g.exp.toFixed(1)})}</span><b>${pct(g.ph)}</b></div></a>`).join("");
}
function previews(){
  const P = LDATA?.previews || [];
  const games = LDATA?.games || [];
  const cards = (P.length ? P.slice(0,3) : games.slice(0,3).map(g => ({game:g, auto:true})));
  $("#pgrid").innerHTML = cards.map((c,i) => {
    const g = c.game || games.find(x=>String(x.id)===String(c.id)) || {};
    const L = c[LANG] || c.en || {};
    const ph = c.photo;
    const bg = ph
      ? `<img class="photo" src="${esc(ph.src)}" alt="${esc(ph.alt||"")}" style="object-position:${esc(ph.pos||"center")}" loading="lazy">`
      : `<div class="grad"><div style="background:linear-gradient(135deg,${TC[g.away]||"#334"},color-mix(in srgb,${TC[g.away]||"#334"} 50%,#000))">${logo(g.away,90)}</div><div style="background:linear-gradient(225deg,${TC[g.home]||"#334"},color-mix(in srgb,${TC[g.home]||"#334"} 50%,#000))">${logo(g.home,90)}</div></div>`;
    const title = c.auto ? `${g.away} @ ${g.home}` : L.title;
    const deck = c.auto ? `${t("prev_proj",{a:g.away,sa:g.ma.toFixed(1),sh:g.mh.toFixed(1),h:g.home})} · ${t("prev_win",{t:g.ph>=g.pa?g.home:g.away,p:pct(Math.max(g.ph,g.pa))})}. ${t("prev_soon")}.` : L.deck;
    const href = c.auto ? `${APP}#g${g.id}` : `previews.html#g${c.id}`;
    const kick = `${esc(L.kicker || (g.away+" @ "+g.home))}<span>${dayOf(g.start)} · ${timeOf(g.start)}</span>`;
    return `<a class="ed ${i===0?"feat":"side"}" href="${href}"><div class="bg">${bg}</div>${ph&&i>0?"":""}
      <div class="txt"><div class="kick">${kick}</div><h3>${esc(title)}</h3><p>${esc(deck)}</p><div class="read">${c.auto?t("open_match"):t("read_prev")}</div></div></a>`;
  }).join("");
}
function plans(){
  const ico = { y:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>', n:'<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
    s:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>' };
  const li = ([k,txt]) => `<li class="${k}">${ico[k]}<span>${k==="s"?`<b class="soon">${esc(t("soon"))}</b> `:""}${esc(txt)}</span></li>`;
  $("#free_list").innerHTML = t("free_items").map(li).join("");
  $("#pro_list").innerHTML = t("pro_items").map(li).join("");
  $("#ab_do").innerHTML = t("ab_do").map(x => `<li><span>${x}</span></li>`).join("");
  $("#also").innerHTML = t("also").map(x => `<li>${x}</li>`).join("");
  const R = LDATA && LDATA.solid, lr = $("#lrec");
  if (R && lr){ const sg = (x, d) => (x>0?"+":x<0?"−":"") + Math.abs(x).toFixed(d), cl = x => x>0.0001?"up":x<-0.0001?"dn":"";
    const since = new Date(R.since+"T12:00:00").toLocaleDateString(LANG==="sv"?"sv-SE":"en-GB",{day:"numeric",month:"short"});
    lr.innerHTML = `<div><h3><span class="lrs">${t("lr_solid")}</span> ${t("lr_h")}</h3><p>${t("lr_sub").replace("{d}", since)}</p></div>
      <div class="lrk"><div><small>${t("lr_picks")}</small><b>${R.n}</b></div><div><small>${t("lr_hit")}</small><b>${(R.hit*100).toFixed(1)}%</b><em>${t("lr_exp").replace("{e}", (R.exp*100).toFixed(1))}</em></div>
        <div><small>${t("lr_units")}</small><b class="${cl(R.u)}">${sg(R.u,1)}</b></div><div><small>${t("lr_roi")}</small><b class="${cl(R.roi)}">${sg(R.roi*100,1)}%</b></div></div>
      <a class="btn2" href="APP_URL#ledger">${t("lr_cta")} →</a><p class="lrn">${t("lr_note")}</p>`;
    lr.hidden = false; }
  const open = new Set([...document.querySelectorAll("#faqlist details[open]")].map(d => d.dataset.i));
  $("#faqlist").innerHTML = t("faq").map(([q,a],i) => `<details data-i="${i}"${open.has(String(i))?" open":""}><summary>${q}</summary><div class="a">${a}</div></details>`).join("");
}
function render(){
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-t]").forEach(el => { const v = t(el.dataset.t); if (el.hasAttribute("data-html")) el.innerHTML = v; else el.textContent = v; });
  document.querySelectorAll("#lang button").forEach(b => b.classList.toggle("on", b.dataset.l===LANG));
  strip(); previews(); plans();
  $("#yr").textContent = new Date().getFullYear();
}
$("#lang").addEventListener("click", e => { const b = e.target.closest("button[data-l]"); if (!b) return; LANG = b.dataset.l; store.set("set:lang", LANG); render(); });
document.querySelectorAll(".themebtn").forEach(btn => btn.addEventListener("click", () => { const nx = currentTheme()==="light" ? "dark" : "light"; store.set("set:theme", nx); applyTheme(nx); }));
addEventListener("scroll", () => $("#hdr").classList.toggle("scrolled", scrollY > 8), {passive:true});
applyTheme(store.get("set:theme"));
render();
</script>

<script>
/* colour themes: the accent (buttons, tabs, logo, highlights, heatmap) follows the visitor's choice;
   meaning colours (green = good/value, red = bad, amber = warning) never change */
(function(){
  const A = {
    rink:  {en:"Rink",  sv:"Rink",  c:"#3ddc97", bg:"#111821", d:null, l:null},
    ember: {en:"Ember", sv:"Glöd",  c:"#ff8a3d", bg:"#1a1410",
      d:{bg:"#110d0a",bg2:"#15100c",panel:"#1a1410",panel2:"#231a14",line:"#35281e",text:"#f5ede5",mute:"#a9988b",chip:"#271d16",
         accent:"#ff8a3d","accent-ink":"#2a1100",heat:"255,138,61",glow:"255,138,61",pc1:"#ff8a3d",pc3:"#2ee6c5",line2:"#ffc27a",hit:"#ff8a3d",accent2:"#f2c99a",pc2:"#f2c99a"},
      l:{bg:"#faf5ef",bg2:"#f3ebe2",panel:"#ffffff",panel2:"#f7efe6",line:"#eadccd",text:"#1e1611",mute:"#76655a",chip:"#f3e8dc",
         accent:"#c2560e","accent-ink":"#ffffff",heat:"194,86,14",glow:"194,86,14",pc1:"#c2560e",pc3:"#0b8f7b",line2:"#b8661a",hit:"#d9681c",accent2:"#8a5a32",pc2:"#8a5a32"}},
    neon:  {en:"Neon",  sv:"Neon",  c:"#ff4fa8", bg:"#1a111d",
      d:{bg:"#100a12",bg2:"#140c17",panel:"#1a111d",panel2:"#241827",line:"#37253b",text:"#f7ebf4",mute:"#aa93a5",chip:"#27192b",
         accent:"#ff4fa8","accent-ink":"#2b0016",heat:"255,79,168",glow:"255,79,168",pc1:"#ff4fa8",pc4:"#a78bfa",line2:"#ff9ad5",hit:"#ff4fa8",accent2:"#b794ff",pc2:"#b794ff"},
      l:{bg:"#fbf4f8",bg2:"#f5e9f0",panel:"#ffffff",panel2:"#f8edf3",line:"#ecd8e3",text:"#1d1219",mute:"#75616d",chip:"#f5e5ee",
         accent:"#c21d78","accent-ink":"#ffffff",heat:"194,29,120",glow:"194,29,120",pc1:"#c21d78",pc4:"#6a48d6",line2:"#b0337f",hit:"#d6328c",accent2:"#7a4fd6",pc2:"#7a4fd6"}}
  };
  const OLD = {green:"rink", blue:"rink", mint:"rink", violet:"neon", pink:"neon", gold:"ember"};
  const VARS = ["bg","bg2","panel","panel2","line","text","mute","chip","accent","accent-ink","heat","glow","pc1","pc2","pc3","pc4","line2","hit","accent2"];
  const get = () => { try { let v = localStorage.getItem("set:accent"); if (OLD[v]) { v = OLD[v]; localStorage.setItem("set:accent", v); } return A[v] ? v : "rink"; } catch(e){ return "rink"; } };
  const set = v => { try { localStorage.setItem("set:accent", v); } catch(e){} };
  const theme = () => { const a = document.documentElement.getAttribute("data-theme"); if (a==="light"||a==="dark") return a; return matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"; };
  function apply(){
    const k = get(), v = A[k][theme()==="light" ? "l" : "d"], st = document.documentElement.style;
    VARS.forEach(p => st.removeProperty("--" + p));
    document.querySelectorAll("img[data-shot]").forEach(im => { const src = "assets/" + im.dataset.shot + (k === "rink" ? "" : "-" + k) + ".webp"; if (im.getAttribute("src") !== src) im.setAttribute("src", src); });
    if (v) Object.entries(v).forEach(([p, x]) => st.setProperty("--" + p, x));
    const mc = document.querySelector('meta[name="theme-color"]'); if (mc){ if (!mc.dataset.c0) mc.dataset.c0 = mc.getAttribute("content") || ""; mc.setAttribute("content", v ? v.bg : mc.dataset.c0); }
    document.documentElement.dataset.accent = k;
  }
  apply();
  new MutationObserver(apply).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});
  try { matchMedia("(prefers-color-scheme: light)").addEventListener("change", apply); } catch(e){}
  const css = document.createElement("style");
  css.textContent = `.accbtn{display:inline-grid;place-items:center}.accbtn i{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
#accpop{position:absolute;z-index:200;background:var(--panel,#111821);border:1px solid var(--line,#22303f);border-radius:14px;padding:6px;box-shadow:0 18px 50px -12px rgba(0,0,0,.55);display:grid;gap:2px;min-width:170px;font:600 13.5px var(--f-ui,system-ui)}
#accpop .ah{font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--mute,#8796a8);padding:6px 10px 4px}
#accpop button{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--text,#e7eef6);padding:8px 10px;border-radius:9px;cursor:pointer;text-align:left;font:inherit}
#accpop button:hover{background:var(--panel2,#17202b)}
#accpop button i{width:16px;height:16px;border-radius:50%;flex:none}
#accpop button.on{background:var(--panel2,#17202b)}#accpop button.on::after{content:"✓";margin-left:auto;color:var(--text,#e7eef6)}`;
  document.head.appendChild(css);
  const close = () => { const p = document.getElementById("accpop"); if (p) p.remove(); };
  document.addEventListener("click", e => {
    const b = e.target.closest(".accbtn");
    if (b){
      e.stopPropagation();
      if (document.getElementById("accpop")){ close(); return; }
      const sv = (document.documentElement.lang||"").startsWith("sv");
      const r = b.getBoundingClientRect(), p = document.createElement("div");
      p.id = "accpop"; p.setAttribute("role", "menu");
      p.innerHTML = `<div class="ah">${sv ? "Tema" : "Theme"}</div>` + Object.entries(A).map(([k,x]) => `<button type="button" role="menuitemradio" aria-checked="${get()===k}" data-acc="${k}" class="${get()===k?"on":""}"><i style="background:linear-gradient(135deg,${x.bg} 0 50%,${x.c} 50% 100%);box-shadow:0 0 0 1.5px ${x.c}"></i><span>${sv ? x.sv : x.en}</span></button>`).join("");
      document.body.appendChild(p);
      const w = p.offsetWidth;
      p.style.top = (r.bottom + 8 + scrollY) + "px";
      p.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.right - w)) + scrollX + "px";
      return;
    }
    const o = e.target.closest("[data-acc]");
    if (o){ set(o.dataset.acc); apply(); close(); return; }
    if (!e.target.closest("#accpop")) close();
  }, true);
  addEventListener("keydown", e => { if (e.key === "Escape") close(); });
  addEventListener("resize", close);
})();

// tour video: stands still on its poster until the visitor presses play (big button, the video itself, or "Watch the tour")
(function(){
  const v = document.getElementById("tourvid"), btn = document.getElementById("tourplay"); if (!v) return;
  let loaded = false;
  const load = () => { if (loaded) return; loaded = true;
    v.src = (window.innerWidth * (window.devicePixelRatio || 1)) > 1500 ? v.dataset.src1080 : v.dataset.src720; };
  const start = (fromStart) => { load(); v.controls = true; btn.hidden = true; if (fromStart) { try { v.currentTime = 0; } catch(e){} } v.play().catch(() => {}); };
  btn.addEventListener("click", () => start(false));
  v.addEventListener("click", () => { if (!loaded) start(false); });
  v.addEventListener("contextmenu", e => e.preventDefault());
  v.addEventListener("ended", () => { v.controls = false; btn.hidden = false; try { v.currentTime = 0; } catch(e){} v.load(); loaded = true; });
  document.querySelectorAll('a[href="#tour"]').forEach(a => a.addEventListener("click", () => setTimeout(() => start(true), 450)));
})();
</script>
<script>
(() => {
  if (!("IntersectionObserver" in window) || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const root = document.documentElement; root.classList.add("rvon");
  const mark = (el, d, z) => { if (!el || el.classList.contains("rv")) return; el.classList.add("rv"); if (z) el.classList.add("rvz"); el.style.setProperty("--rvd", d + "ms"); };
  // headings first, then the cards / devices one after another
  document.querySelectorAll("main section, main .final").forEach(sec => {
    let d = 0;
    sec.querySelectorAll(":scope .sh, :scope .final > h2, :scope .final > .sub, :scope .final > .ctas").forEach(el => { mark(el, d); d += 90; });
    const groups = sec.querySelectorAll(".fgrid, .plans, .steps, .screens, .about");
    groups.forEach(g => [...g.children].forEach((c, i) => mark(c, d + i * 110, g.classList.contains("screens"))));
    sec.querySelectorAll(".tourbox, .strip, .pgrid, .lrec, .scap, .also, .faq").forEach((el, i) => mark(el, d + 120 + i * 80, el.classList.contains("tourbox")));
  });
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }), {rootMargin: "0px 0px -8% 0px", threshold: 0.08});
  document.querySelectorAll(".rv").forEach(el => io.observe(el));
  // safety: never leave anything hidden (e.g. printing, odd browsers)
  setTimeout(() => document.querySelectorAll(".rv:not(.in)").forEach(el => { const r = el.getBoundingClientRect(); if (r.top < innerHeight) el.classList.add("in"); }), 1500);
  addEventListener("beforeprint", () => document.querySelectorAll(".rv").forEach(el => el.classList.add("in")));
})();
</script>
