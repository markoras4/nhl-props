    <li><b>Team ranks:</b> both teams ranked 1–32 on attack, defence, shot share (CF%), expected-goals share (xGF%), high-danger chances (HDCF%), power play, penalty kill, goaltending (GSAx) and PDO. Green = top 8, red = bottom 8. PDO is shown as normal, running lucky or running unlucky, because it usually returns to normal.</li>
    <li><b>What each defence allows, by position:</b> shots and points each team gives up per game to centres, wingers and defencemen. #1 allows the most (the easiest matchup for that position), #32 the least. Hover a number for the details.</li>
    <li><b>Who's missing:</b> key absences for each team and their effect. When a regular is out, his ice time is shared among the players who step in, and the team's attack or defence is adjusted a little.</li>
    <li><b>Roster grid:</b> every player's chances, with the market odds below (green with an outline when the model sees +5% value or more) or the fair odds if there's no price yet. Switch between <i>Scoring &amp; shots</i> and <i>Hits &amp; blocks</i>.</li>
  </ul>

  <h3>The player breakdown</h3>
  <p>Click any player to open it.</p>
  <ul>
    <li><b>Prices &amp; value:</b> model probability, fair odds, market odds and EV for every market. Type the odds your sportsbook offers and the EV updates; save the pick to track it. Market odds come from two sportsbooks: a regular one, and a <i>sharp book</i> whose prices are shown beside it and fill in players and lines the first doesn't offer. Sharp books set the market, so a price there is a strong second opinion.</li>
    <li><b>Game by game:</b> his last 10 games as bars for shots, goals, assists, points, hits or blocks. The dotted line is his average, the blue line is the model's expectation tonight; pick a betting line to colour each game over or under it. After his last game, a dashed bar shows <i>tonight</i>: its height is the model's expectation, and hovering or tapping it opens a card with tonight's number (chance, odds, value, Triage grade, his season and last-10 views), his side (ice time, line, power-play unit, luck, shots since his last goal) and the opponent (goalie, defence, goaltending, what they allow his position, penalties and penalty kill), with ranks: green favours him, red is tough. Hover over or tap any game (also the small squares in Props and the bars in Compare) for that game's full line: ice time, goals, assists, points, shots, expected goals from his shot locations, power-play points, penalty minutes, hits and blocks.</li>
    <li><b>Hit rates:</b> how often he went over the line in his last 5, 10 and 20 games, this season and against tonight's opponent, next to the model and the market. A short record is a weak guide on its own; read it together with the model.</li>
    <li><b>Role tags:</b> <i>TOI ▲/▼</i> when his ice time over the last 5 games is 3+ minutes (and at least 18%) above or below his usual; <i>New on PP1</i>, <i>Promoted</i> and similar when his power-play unit or line changed. Role changes often show in the numbers before the scoring does.</li>
    <li><b>Odds movement:</b> the first price we saw for the prop that day and where it went since. Green means the market moved toward the model's fair odds, a good sign the model saw something real. In the game's player grid a small arrow next to the odds marks the bigger moves.</li>
    <li><b>Shot profile:</b> every shot attempt he has taken this season (or in his last 10 games) on a map of the offensive zone: goals, saved shots, misses and blocks. Next to it: attempts and shots on goal per game, how many of his attempts hit the net, how many come from close range, and the quality of his shots, compared with last season. Each number has a tier against every NHL player at his position this season: <i>Elite</i> (top 10%), <i>Good</i> (top 10–35%), <i>Average</i> (middle 30%) or <i>Below average</i> (bottom 35%), with his rank; very small samples are marked <i>Small sample</i>.</li>
    <li><b>Compare:</b> tap ⇄ next to any player (roster grid, Props or his breakdown) to add him to the compare tray at the bottom. Pick 2–4 players from any game and open <i>Compare</i> to see them side by side for any market: chance tonight, odds and EV, expected numbers, ice time and role, the last 10 games on the same scale, hit rates and this season's numbers. The best value in each row is highlighted, and a <i>Quick read</i> at the top sums it up in plain words: who has the highest chance, the best value, the biggest role, anything that makes a number less reliable, and which option looks strongest on the numbers.</li>
    <li><b>History:</b> his seasons as a table or chart. Choose goals, assists, points, shots, shooting % (with his real level and the league average) or goals vs expected. Compare this season, the previous 3 or 5, or his career, per game or at an 82-game pace. Faded bars are small samples.</li>
  </ul>

  <h3>Futures: season &amp; playoffs</h3>
  <p>The <i>Futures</i> tab simulates the rest of the season 10,000 times from today's standings and each team's strength (goals and expected goals this season, last season pulled toward average), then the playoffs in the real NHL format. For every team: the chance to make the playoffs, win a round (Round 2), reach the conference final, reach the Cup final, win the Cup and win the division, plus projected points, with fair odds and the sportsbook's odds where offered (outlined at 10%+ value). Each simulated season draws team strengths from a range, so early in the season the chances aren't overconfident. Tested on five past seasons: teams given about 60% made the playoffs about 66% of the time, 98% teams about 99%.</p>
  <p><b>Points vs expected:</b> each team's points so far next to the points its play deserved (from its chances in every game). Well above means running hot, which rarely lasts. The simulation rates teams on chances and goals, not points, so a lucky run isn't carried forward, and players' chances already use each player's real finishing level. Tested: players on hot or cold teams scored as the model expected, so no extra team adjustment is needed.</p>
  <p><b>What's at stake</b> on each game page: each team's playoff chance now, with a win and with a loss. The gap is the game's importance (Low, Medium, High, Critical); high-stakes games are marked on the games list. In tests on past seasons, importance didn't clearly change who won beyond the model, so it's context, but it can move the market.</p>

  <h3>Player projections</h3>
  <p><i>Futures → Players</i> plays out every skater's season 10,000 times, game by game: his goal and assist rates per game from the model (true-talent rates times projected ice time), the games his team has left, a chance of missing games (injuries, scratches, trades; regulars with big minutes miss fewer), and uncertainty in his true level, because the model's rate is an estimate. Stars get a slight top-end stretch, since the model's caution pulls them a bit too far toward average.</p>
  <p>Each player gets his likely final goals, assists and points with a range (8 seasons in 10 end inside it), milestone chances (20/30/40 goals, 80/100 points and more), and his chance to lead the league in points (Art Ross), goals (Rocket Richard) or assists. <b>Tested</b> on three past seasons from about 14 games in: the range held the real final total 79% of the time, with no lean for regulars, mid scorers or stars.</p>

  <h3>Season awards</h3>
  <p><i>Futures → Awards</i> sets the books' award prices (margin removed) next to the model. The <b>Rocket Richard</b> (most goals) and <b>Art Ross</b> (most points) are won on the numbers, so the model's chance comes straight from the same simulated seasons and value is marked where a price beats it. The <b>Hart, Norris, Calder and Vezina</b> are voted on, so the model shows a clearly named stand-in instead: most points (for the Hart), most points by a defenceman (Norris), most points by a rookie skater (Calder), most saved goals above expected among goalies with 40+ games (Vezina, from a season simulation of each goalie's starts and save level). Stand-ins are context and never marked as value. The <b>Jack Adams</b> (coach) shows the book only.</p>

  <h3>Lines</h3>
  <p>The <i>Lines</i> tab on every game page shows both teams' forward lines, defence pairs and power-play units side by side. For each line: tonight's projection (the chance at least one of its players scores, expected goals and shots, and the chance one of them takes a penalty), its record together at 5-on-5 this season (goals vs expected goals for and against, shots, xG%), and flags such as <i>Scoring below its chances</i>, <i>Conceding above its chances</i>, <i>Out-chancing opponents</i>, <i>New line</i>, <i>Promoted</i> or <i>Moved down</i>. All numbers are on-ice: what happened while those players were out together, not goals they scored themselves. The scoring and conceding flags appear only when the gap is too big to be normal luck (it would happen less than 1 time in 10 by chance) and at least 2 goals; such gaps usually come from finishing or goaltending and tend to even out. The chance flags (xG% 60%+ or 40% and below) are the steadier sign of how well a line plays. The line with the clearly higher projection is outlined. Lines don't always face their same-numbered opponent: coaches tend to put their top pair against the other team's top line and keep their third pair away from it. Tested over three seasons, though, which pair a line faces moves its shots or points by only 1–2%, so line form is context: each player's chance already uses his real level.</p>
  <p><i>Lines &amp; pairs</i> (in the Props tab) ranks every forward line and defence pair in the league with enough minutes together at 5-on-5 this season. Sort by share of the chances (xG%), chances per 60 minutes, minutes together, or by luck: scoring or conceding more or fewer goals than the chances suggest. The luck sorts rank by how unusual the gap is, not just its size, so a big gap over a few minutes doesn't crowd out a real outlier. Filter by team, minutes or teams playing today, and open a line's next game in one click.</p>

  <h3>Look back: archive &amp; game recaps</h3>
  <ul>
    <li><b>Archive:</b> on the Games tab, choose <i>Earlier</i> to open any game from the last 7 days exactly as it looked at its last update before puck drop: probabilities, odds, Best picks, lineups, goalies and every player breakdown. On top, ✓ / ✗ shows what happened for every prop, each player's real stat line, and whether the Best picks won. It's the best way to learn how to read the numbers: what did the site say, and what did you miss?</li>
    <li><b>Game recaps:</b> click any of a team's last 6 games or any past meeting to see the final score, every goal with assists and power-play tags, and every player's line (goals, assists, shots, hits, blocks, ice time). For games from the last 7 days there's a button to open them as they looked before puck drop.</li>
  </ul>

  <h3>Props</h3>
  <p>Every player on the slate in one list. Pick a market (points, multi-point, power play, shots, hits, blocks, faceoffs, penalties or first goal), then the line, and sort by <i>Most likely</i> or <i>Best value</i>. Filter by day, game or player, and type your own odds to see your EV.</p>

  <h3>Triage: how solid is a value bet?</h3>
  <p>Every value bet gets a grade: <b>Solid</b>, <b>Lean</b> or <b>Fragile</b>. The edge is re-checked with two other views of the player, both in tonight's matchup: his <i>season so far</i> and his <i>last 10 games</i> (for goals, the quality of his chances, so luck doesn't count twice). Then the warning signs: a depth forward on goals or points, the opposing goalie not confirmed, the market moving against it (price drifting out or the sharp book's fair price above the one on offer, counted as one warning), shooting clearly up or down this season, a short NHL history. For power-play points the two views are his season and last-10 power-play rate, with a warning on an over for a player off the first power-play unit, and on a "no" for a player just moved onto it. For blocked shots they are his season and last-10 blocks per game. Hits aren't graded: arena scorekeepers make them too random.</p>
  <ul><li><b>Solid:</b> all three views show value and no warning sign.</li><li><b>Lean:</b> value is there, but one view disagrees or there's one warning.</li><li><b>Fragile:</b> only the model sees value, or two or more warnings stack up.</li></ul>
  <p>Long shots (odds 8.00+), very short prices (under 1.30) and edges under 3% can be Lean at best: long shots lose for long stretches even when right, and short prices or thin edges disappear with a small error. Fragile doesn't mean wrong, it means much less certain: if you play those, play them smaller. The <i>Triage</i> view in Props lists every value bet of the day, grouped by grade, with filters for game, market and overs/unders and a warning when several bets would win or lose together. Every best pick stores its grade, and the Track record shows how each grade has done. The <i>Triage ledger</i> in Track record goes further: every value bet the model flagged since the first night, all three grades, frozen at the lock and graded at 1 unit, with the edge against the sharp book, so you can see whether Solid really beats Lean and Fragile.</p>

  <h3>Players explorer</h3>
  <p>The <i>Explorer</i> tab puts every player with an upcoming game on one chart: pick any two stats for the axes, or a preset that tells a story. <i>Luck</i> (expected goals vs goals: far below the diagonal is unlucky), <i>Volume vs finishing</i> (shots per game vs shooting %), <i>Role</i> (ice time vs points), <i>Power play</i>, <i>Shots trend</i> (season vs last 10 games: who's shooting more lately) and <i>Tonight</i> (market vs model for 1+ point). Filter by position, team, games played or players in action today, search a name, hover a dot for his numbers and click to open his profile. The ten players the view is about are listed under the chart.</p>

  <h3>Teams explorer</h3>
  <p>Switch the Explorer to <i>Teams</i> to see all 32 teams on one chart, logos as dots. Presets: <i>Strength</i> (expected goals for vs against at 5-on-5), <i>Luck</i> (expected goal difference vs actual goal difference: above the diagonal, results better than the play), <i>Goaltending</i> (chances allowed vs goals saved above expected), <i>Pace &amp; totals</i> (both teams' expected goals per game vs how often their games go over 5.5), <i>Special teams</i> (power play vs penalty kill) and <i>Dangerous chances</i> (high-danger shots for vs against). Where lower is better the Y axis is flipped, so the best teams always sit top right. Hover a logo for the numbers and league ranks, click to open the team's next game. Free for everyone.</p>

  <h3>Shots on goal &amp; goalie saves</h3>
  <p>On every matchup the model projects each team's shots on goal and the total, from both teams' shot rates for and against this season and home ice, with the chance of going over the usual lines. The starting goalie's expected saves are the shots he's expected to face times his expected save rate, allowing for the times a goalie gets pulled early. Switch the goalie and the saves update. Tested on thousands of past games: team shots and saves were more accurate than simple averages at every line; for total shots the model is about as good as a simple average, so treat that one as context.</p>

  <h3>More game markets &amp; first goalscorer</h3>
  <p>Every game page has <i>More markets</i>, all from the same projected score: 1X2 after 60 minutes, puck line ±1.5 (including empty-net goals), team totals, 1st-period goals and draw, and both teams to score, each with fair odds and a box for your own odds. The matchup tab shows the <i>First goalscorer</i> chances: the chance of a goal before a shootout, times his team scoring first, times his share of the team's expected goals. Tested: 1X2, puck line and team totals are well calibrated; 1st-period and both-teams-to-score numbers are right on average but separate games only slightly.</p>
  <h3>More player markets</h3>
  <ul>
    <li><b>Multi-point:</b> 2+ and 3+ points, 2+ goals, hat trick and 2+ assists, from the same expected goals and assists as everything else. Tested: well calibrated.</li>
    <li><b>Power-play point:</b> his power-play scoring rate × his PP time, updated with this season's PP points and adjusted for how often tonight's opponent takes penalties. Tested: clearly better than a player's simple PP-points average.</li>
    <li><b>Faceoffs won</b> (centres): draws per game × win %, adjusted for the opponent's faceoff strength. Tested: about as accurate as his simple average, so treat it as context.</li>
    <li><b>Penalties:</b> chance he takes a penalty (PIM over 0.5) and PIM over 2.5, from his penalty rate and ice time. Tested: better than the simple share of games with a penalty.</li>
    <li><b>Shutout:</b> on the goalie card and in More markets: no goal against in regulation and overtime.</li>
    <li><b>Role &amp; usage</b> and <b>Linemates tonight</b> in the player breakdown: PP minutes and unit, his power-play goals, assists and shots, and how much of his scoring comes on the PP (a high share means his chances depend on keeping his PP spot); faceoffs, penalties, and how he has scored with and without each linemate this season.</li>
  </ul>
  <h3>Odds format</h3>
  <p>Use the menu at the top to show odds as decimal (1.85), American (−118 / +185) or fractional (5/6). You can type odds in any of the three formats in every odds box.</p>

  <h3>Streaks &amp; milestones</h3>
  <p>In Props, choose <i>Streaks</i> for one list of every notable run on the slate: goal droughts (with the shots taken since his last goal), point droughts, point streaks, goal streaks, and career milestones within reach (for example 1 goal from 100, or a 1,000th game). Droughts are shown only when they're rare for a regular player, with how rare ("1 in 12"). Each row shows his chance tonight and an odds box, so you can compare prices across sportsbooks. Each game page also has a <i>Streaks to watch</i> row. A streak doesn't change his chance tonight; the number shown already uses his real level.</p>

  <h3>Hits &amp; blocks</h3>
  <p>Built from each player's hits and blocked shots per minute of ice time, times his projected ice time tonight, adjusted for the opponent (how often they get hit and how many of their shots get blocked) and the arena, since some buildings record far more hits than others. Tested on thousands of past games, it was clearly more accurate than a player's last-10 average at every line.</p>

  <h3>Your account</h3>
  <ul>
    <li><b>My picks:</b> save any prop with the odds you got. Picks are graded automatically after each game, with hit rate, profit, ROI and whether you beat the closing odds, the best long-run sign of a good bettor. Closing odds come from the sportsbook feed; for markets it doesn't carry (hits, blocks), or a different sportsbook, add your own closing price.</li>
    <li><b>Public betting:</b> on every game page, the share of tickets (number of bets) and of money on each side of the moneyline, the total and the puck line, with how many bets are behind it. When the money is clearly above the tickets on one side, fewer but bigger bets are there. It's context, not part of the model, and it locks with the odds 5 minutes before puck drop.</li>
    <li><b>Parlay check:</b> tap “＋ Parlay” on any prop (or add a game leg: a team to win, the game total, a team total) to build a parlay. It shows the combined chance, including the link between legs from the same game (a player's point and his shots, or his point and his team's goals), the fair odds, and your EV once you type your sportsbook's price. It also compares ways to bet the same legs with the same total stake: all singles, every pair, one parlay, or singles plus the parlay, with the chance of a profit and of losing it all. Save a parlay and it's graded automatically in My picks.</li>
    <li><b>Watchlist:</b> tap the bookmark next to a player to follow him. My picks lists his next game with tonight's chance and odds, his game is marked on the Games tab, and with alerts on you get a game-day notification.</li>
    <li><b>Alerts:</b> push notifications when a prop passes the edge level you choose, or when a starting goalie is confirmed.</li>
  </ul>

  <h3>Track record</h3>
  <p>The model's scorecard. Every prediction is saved before the game and checked afterwards: how often things happened compared with what the model said, how accurate the probabilities were (Brier and Skill), and calibration charts. <i>Value bets</i> there are not picks: they test whether every prop with 5%+ edge at the market price would have made money. Open <i>How to read this page</i> on that tab for the details.</p>

  <h3>Words used on the site</h3>
  <ul>
    <li><b>Fair odds</b> = 1 ÷ probability: the odds at which a bet breaks even in the long run.</li>
    <li><b>Market %</b> = the probability implied by the market odds, with the bookmaker's margin removed.</li>
    <li><b>Edge / EV</b> = model probability × odds − 1. +10% means the model expects 10% profit per bet in the long run, if the model is right.</li>
    <li><b>▲ Due / ▼ Hot</b> = scoring clearly below / above his real level this season. In testing, "due" players did <i>not</i> score more than the model already expected, so it's context, not a reason to bet on its own.</li>
    <li><b>Shots dry</b> = shots since his last goal, and how rare a drought that long is for a player of his level.</li>
    <li><b>Projected / Likely / Confirmed / Not decided</b> goalie = from the latest starting-goalie reports. Projected means no report yet: the goalie with the most recent starts, or the backup on a back-to-back.</li>
    <li><b>Out / Day-to-Day / Playing</b>: Out players are removed from the props; questionable players stay in with a yellow mark until the lineup shows them dressed.</li>
    <li><b>B2B</b> = the team played yesterday.</li>
  </ul>

  <h3>Questions</h3>
  <details><summary>Is this a betting site?</summary><p>No. NHL Props Lab is an analysis tool. We don't take bets or hold money; you place bets with your own licensed sportsbook, if you want to.</p></details>
  <details><summary>Does a high percentage mean I should bet?</summary><p>Not on its own. What matters is the chance compared with the odds: a 60% chance at 1.50 loses money over time, a 30% chance at 4.00 makes money. That's what value and EV show.</p></details>
  <details><summary>My sportsbook has different odds. What do I do?</summary><p>Type your odds in the odds box (decimal, American or fractional). The EV updates for your price.</p></details>
  <details><summary>Can I follow a player for a later bet?</summary><p>Yes. Tap the bookmark next to any player (free account needed). He's listed under My picks with his next game, tonight's chance and odds, and a note if you want one; his game gets a marker on the Games tab, and you can get a push alert on game day.</p></details>
  <details><summary>What is “beat closing odds”?</summary><p>Your odds compared with the last price before puck drop. If you took 2.20 and it closed at 2.00, you got a better price than the market settled on. Doing that often is the clearest sign of good picks, even through losing runs. If the site has no price for your market, add the closing odds from your sportsbook yourself.</p></details>
  <details><summary>How do I delete my account or my data?</summary><p>Contact us and we'll delete it within 30 days. See the <a href="/legal.html#privacy">privacy policy</a>.</p></details>
  <p>Read the <a href="/legal.html#terms">Terms of use</a>, <a href="/legal.html#disclaimer">Disclaimer</a> and <a href="/legal.html#privacy">Privacy policy</a>. Everything here is an estimate, not advice or a guarantee. 18+, gamble responsibly.</p>`,
sv: `<h3>Vad sajten gör</h3>
  <p>För varje spelare i varje kommande match räknar modellen ut hans chans att göra mål, få en assist, ta en poäng, nå ett visst antal skott på mål och göra ett visst antal tacklingar och blockerade skott, plus flera poäng i en match, PP-poäng, vunna tekningar och utvisningar. För varje match beräknas också resultatet, vinstchanserna, det totala antalet mål, puck line, mål i första perioden, varje lags skott på mål, startmålvakternas räddningar och chansen till nolla. Allt visas bredvid spelbolagens odds, så att du ser var modellen och marknaden är överens och var de skiljer sig åt. Det är ett verktyg som hjälper dig att bestämma, inte en tipstjänst.</p>

  <h3>Hur en sannolikhet räknas fram</h3>
  <p>Varje spelares chans utgår från hans verkliga nivå: hur mycket han spelar, hur många skott och chanser han skapar och hur bra han gör mål på dem över en längre period, inte bara de senaste matcherna. En het eller kall svit behandlas främst som brus tills det finns tillräckligt med bevis för att något verkligen förändrats.</p>
  <p>Nivån justeras sedan för kvällen: motståndarens försvar, motståndarmålvakten, hemma eller borta, back-to-back, hans kedja och powerplayroll just nu, och vilka som saknas i båda lagen. Byt startmålvakt på en matchsida så uppdateras alla sannolikheter direkt.</p>
  <p>Matchprognoserna bygger på båda lagens anfall och försvar, målvakterna och hur ofta matcher faktiskt går till förlängning, så att oavgjort och totalmål blir realistiska.</p>

  <h3>Har den testats?</h3>
  <p>Ja. Varje spelform spelades upp på nytt över tusentals tidigare matcher, med bara den information som fanns före varje match.</p>
  <ul>
    <li><b>Procentsatserna stämmer.</b> Mål: förutsagt 15,5 %, utfall 15,4 %. Poäng: 35,8 % mot 35,2 %.</li>
    <li><b>Den slår spelarens enkla snitt</b> i alla spel: mål, assist, poäng, skott, tacklingar och blockeringar.</li>
    <li><b>Den kontrolleras hela tiden.</b> Varje prognos sajten gör rättas efter matchen på sidan Facit.</li>
  </ul>
  <p>En bra sannolikhet är ingen garanti. En chans på 35 % missar två gånger av tre, och en enskild match är till stor del slump.</p>

  <h3>Alltid uppdaterat</h3>
  <ul>
    <li><b>Uppställningar och målvakter:</b> ungefär en timme före varje nedsläpp uppdateras sajten med de officiella uppställningarna för matchdagen, och igen ungefär 30 minuter före, när startmålvakterna brukar bekräftas. Petade och skadade spelare tas bort, osäkra spelare som är med markeras <i>Spelar</i>.</li>
    <li><b>Oenighet om målvakten:</b> om källorna är oense och ingen har bekräftat markeras han <i>Inte avgjort</i> och alternativet visas, så att du kan byta och se effekten.</li>
    <li><b>Liveresultat:</b> pågående matcher visar ställning och period ovanför prognosen.</li>
    <li><b>Startade matcher låses:</b> när en match börjar ligger sannolikheter, odds och bästa spel kvar som de var vid nedsläpp.</li>
  </ul>

  <h3>Matchsidan</h3>
  <ul>
    <li><b>Bästa spelen i matchen:</b> upp till två spel med störst edge mot marknadsoddsen: mål, assist och poäng, skott på mål samt tacklingar och blockeringar när det finns odds för dem (inskrivna av dig om spelbolagets flöde saknar dem). Filtrera på marknad med knapparna i rutan. När två alternativ för samma spelare har likvärdig edge väljs det troligare: poäng före mål eller assist, en lägre skottlinje före en högre. Spelare med kort NHL-historik (under ungefär 50 matcher) rankas lägre, eftersom deras siffror är osäkrast och stora skillnader mot marknaden oftast är modellens egen osäkerhet. Gröna rader är fakta bakom spelet, orange rader är varningar. När det mesta värdet ligger på ett lag sägs det: de spelen brukar vinna eller förlora tillsammans.</li>
    <li><b>Förhandstitt:</b> en kort text om matchen när en är skriven: nyheterna, sviterna och rekorden, och var modellen och marknaden är oense.</li>
    <li><b>Matchup:</b> beräknat resultat, vinst- och förlängningschanser, över/under för totalmål, varje lags senaste 6 matcher, skott på mål för varje lag och målvaktsräddningar, första målskytt samt inbördes möten.</li>
    <li><b>Lagrankning:</b> båda lagen rankade 1–32 i anfall, försvar, skottandel (CF%), andel förväntade mål (xGF%), farliga chanser (HDCF%), powerplay, boxplay, målvaktsspel (GSAx) och PDO. Grönt = topp 8, rött = botten 8. PDO visas som normal, tur eller otur, eftersom den brukar återgå till det normala.</li>
    <li><b>Vad varje försvar släpper till, per position:</b> skott och poäng varje lag släpper till per match mot centrar, yttrar och backar. #1 släpper till mest (lättast för den positionen), #32 minst. Håll muspekaren över en siffra för detaljer.</li>
    <li><b>Vilka saknas:</b> viktiga frånvaron i varje lag och vad de betyder. När en ordinarie spelare saknas fördelas hans istid på dem som kliver in, och lagets anfall eller försvar justeras något.</li>
    <li><b>Spelarlistan:</b> varje spelares chanser, med marknadsoddsen under (gröna med ram när modellen ser +5 % värde eller mer) eller rättvisa odds om priset saknas. Växla mellan <i>Poäng &amp; skott</i> och <i>Tacklingar &amp; blockeringar</i>.</li>
  </ul>

  <h3>Spelardetaljer</h3>
  <p>Klicka på en spelare för att öppna dem.</p>
  <ul>
    <li><b>Priser &amp; värde:</b> modellens sannolikhet, rättvisa odds, marknadsodds och EV för alla spel. Skriv in oddset ditt spelbolag ger så uppdateras EV; spara spelet för att följa det. Marknadsoddsen kommer från två spelbolag: ett vanligt och ett <i>skarpt spelbolag</i> vars priser visas bredvid och fyller i spelare och linjer det första inte erbjuder. Skarpa spelbolag sätter marknaden, så deras pris är ett starkt andra utlåtande.</li>
    <li><b>Match för match:</b> hans senaste 10 matcher som staplar för skott, mål, assist, poäng, tacklingar eller blockeringar. Den prickade linjen är hans snitt, den blå linjen modellens förväntan i kväll; välj en linje för att färga varje match över eller under. Efter hans senaste match visar en streckad stapel <i>i kväll</i>: höjden är modellens förväntan, och håller du över eller trycker på den öppnas ett kort med kvällens siffra (chans, odds, värde, triagebetyg, hans säsong och senaste 10), hans sida (istid, kedja, powerplay, tur, skott sedan senaste målet) och motståndet (målvakt, försvar, målvaktsspel, vad de släpper till hans position, utvisningar och boxplay), med rankning: grönt gynnar honom, rött är tufft. För muspekaren över eller tryck på en match (även de små rutorna under Spel och staplarna i Jämför) för matchens hela rad: istid, mål, assist, poäng, skott, förväntade mål utifrån var han sköt, PP-poäng, utvisningsminuter, tacklingar och blockeringar.</li>
    <li><b>Träffprocent:</b> hur ofta han gått över linjen de senaste 5, 10 och 20 matcherna, i år och mot kvällens motståndare, bredvid modellen och marknaden. Ett kort facit är en svag vägledning i sig; läs det tillsammans med modellen.</li>
    <li><b>Rolltaggar:</b> <i>Istid ▲/▼</i> när istiden de senaste 5 matcherna är 3+ minuter (och minst 18 %) över eller under det vanliga; <i>Ny i PP1</i>, <i>Uppflyttad</i> och liknande när powerplayfemman eller kedjan ändrats. Rolländringar syns ofta i siffrorna innan målen kommer.</li>
    <li><b>Oddsrörelse:</b> det första priset vi såg för spelet under dagen och vart det gått sedan. Grönt betyder att marknaden rört sig mot modellens rättvisa odds, ett gott tecken på att modellen såg något verkligt. I matchens spelarrutnät markerar en liten pil vid oddset de större rörelserna.</li>
    <li><b>Skottprofil:</b> alla skottförsök han gjort i år (eller de senaste 10 matcherna) på en karta över anfallszonen: mål, räddade skott, missar och blockeringar. Bredvid: skottförsök och skott på mål per match, hur många av försöken som träffar mål, hur många som kommer från nära håll och kvaliteten på skotten, jämfört med förra säsongen. Varje siffra har en nivå mot alla NHL-spelare på hans position i år: <i>Elit</i> (topp 10 %), <i>Bra</i> (topp 10–35 %), <i>Medel</i> (mittersta 30 %) eller <i>Under medel</i> (botten 35 %), med hans placering; väldigt små underlag markeras <i>Litet underlag</i>.</li>
    <li><b>Jämför:</b> tryck på ⇄ bredvid en spelare (spelarlistan, Props eller spelardetaljerna) för att lägga honom i jämförelsefältet längst ner. Välj 2–4 spelare från valfri match och öppna <i>Jämför</i> för att se dem sida vid sida i valfritt spel: chansen i kväll, odds och EV, förväntade siffror, istid och roll, de senaste 10 matcherna på samma skala, träffprocent och årets siffror. Bästa värdet på varje rad markeras, och en <i>Snabbläsning</i> högst upp sammanfattar med vanliga ord: vem som har högst chans, bäst värde, störst roll, vad som gör en siffra mindre säker och vilket alternativ som ser starkast ut utifrån siffrorna.</li>
    <li><b>Historik:</b> hans säsonger som tabell eller diagram. Välj mål, assist, poäng, skott, skottprocent (med hans verkliga nivå och ligasnittet) eller mål mot förväntat. Jämför i år, förra 3 eller 5 säsongerna eller karriären, per match eller i 82-matcherstakt. Bleka staplar bygger på litet underlag.</li>
  </ul>

  <h3>Säsong: slutspel &amp; långtidsspel</h3>
  <p>Fliken <i>Säsong</i> simulerar resten av säsongen 10 000 gånger utifrån dagens tabell och varje lags styrka (mål och förväntade mål i år, förra säsongen dragen mot snittet), sedan slutspelet i NHL:s riktiga format. För varje lag: chansen att gå till slutspel, vinna en omgång (omgång 2), nå konferensfinalen, nå Stanley Cup-finalen, vinna cupen och vinna divisionen, plus beräknade poäng, med rättvisa odds och spelbolagets odds där de finns (markerade vid 10 %+ värde). Varje simulerad säsong drar lagens styrka från ett spann, så tidigt på säsongen blir chanserna inte översäkra. Testat på fem tidigare säsonger: lag med ungefär 60 % gick till slutspel ungefär 66 % av gångerna, lag med 98 % ungefär 99 %.</p>
  <p><b>Poäng mot förväntat:</b> varje lags poäng hittills bredvid de poäng spelet förtjänat (utifrån chanserna i varje match). Klart över betyder att laget går över förväntan, vilket sällan håller. Simuleringen bedömer lagen på chanser och mål, inte poäng, så en tursam period förs inte vidare, och spelarnas chanser bygger redan på varje spelares verkliga avslutsnivå. Testat: spelare i lag som går över eller under förväntan gjorde mål som modellen väntade sig, så ingen extra lagjustering behövs.</p>
  <p><b>Vad som står på spel</b> på varje matchsida: varje lags chans till slutspel nu, med vinst och med förlust. Skillnaden är matchens vikt (Låg, Medel, Hög, Avgörande); viktiga matcher markeras i matchlistan. I tester på tidigare säsonger ändrade vikten inte tydligt vem som vann utöver modellen, så det är bakgrund, men den kan påverka marknaden.</p>

  <h3>Spelarprognoser</h3>
  <p><i>Säsong → Spelare</i> spelar ut varje utespelares säsong 10 000 gånger, match för match: hans mål- och assisttakt per match från modellen (verklig nivå gånger väntad istid), lagets återstående matcher, en chans att missa matcher (skador, petningar, byten; ordinarie med mycket istid missar färre) och osäkerhet om hans verkliga nivå, eftersom modellens takt är en uppskattning. Stjärnor får en liten extra spridning uppåt, eftersom modellens försiktighet drar dem lite för långt mot snittet.</p>
  <p>Varje spelare får sina troliga mål, assist och poäng vid säsongens slut med ett spann (8 säsonger av 10 slutar inom det), chanser till milstolpar (20/30/40 mål, 80/100 poäng med mera) och chansen att leda ligan i poäng (Art Ross), mål (Rocket Richard) eller assist. <b>Testat</b> på tre tidigare säsonger från ungefär 14 matcher in: spannet höll det verkliga slutresultatet 79 % av gångerna, utan slagsida för ordinarie, mellanskikt eller stjärnor.</p>

  <h3>Säsongens priser</h3>
  <p><i>Säsong → Priser</i> visar spelbolagens odds på NHL:s priser (utan marginal) bredvid modellen. <b>Rocket Richard</b> (flest mål) och <b>Art Ross</b> (flest poäng) avgörs av siffrorna, så modellens chans kommer direkt från samma simulerade säsonger och värde markeras där ett pris slår den. <b>Hart, Norris, Calder och Vezina</b> röstas fram, så där visar modellen en tydligt namngiven ersättare: flest poäng (för Hart), flest poäng bland backar (Norris), flest poäng bland rookies (Calder), flest räddade mål över förväntat bland målvakter med 40+ matcher (Vezina, från en säsongssimulering av varje målvakts starter och räddningsnivå). Ersättare är sammanhang och markeras aldrig som värde. <b>Jack Adams</b> (tränare) visar bara spelbolagets odds.</p>

  <h3>Kedjor</h3>
  <p>Fliken <i>Kedjor</i> på varje matchsida visar båda lagens kedjor, backpar och powerplayfemmor sida vid sida. För varje kedja: kvällens prognos (chansen att minst en av spelarna gör mål, förväntade mål och skott och chansen att någon av dem åker ut), hur den gått tillsammans i 5 mot 5 i år (mål mot förväntade mål för och emot, skott, xG%) och markeringar som <i>Gör färre mål än chanserna</i>, <i>Släpper in fler mål än chanserna</i>, <i>Vinner chanserna</i>, <i>Ny kedja</i>, <i>Uppflyttad</i> eller <i>Nedflyttad</i>. Alla siffror gäller på isen: vad som hände när spelarna var ute tillsammans, inte mål de gjort själva. Mål-markeringarna visas bara när skillnaden är för stor för vanlig tur (den skulle hända mindre än 1 gång av 10 av slump) och minst 2 mål; sådana skillnader kommer oftast från avslut eller målvaktsspel och brukar jämna ut sig. Chans-markeringarna (xG% 60 %+ eller 40 % och lägre) är det stabilare tecknet på hur bra en kedja spelar. Kedjan med klart högre prognos markeras. Kedjorna möter inte alltid sin nummer-motsvarighet: tränarna brukar sätta sitt bästa backpar mot motståndarens förstakedja och hålla tredjeparet borta från den. I tester över tre säsonger påverkade vilket backpar en kedja möter dess skott och poäng med bara 1–2 %, så kedjeformen är bakgrund: varje spelares chans bygger redan på hans verkliga nivå.</p>
  <p><i>Kedjor &amp; backpar</i> (under Spel) rankar varje kedja och backpar i ligan med tillräckligt många minuter tillsammans i 5 mot 5 i år. Sortera på andel av chanserna (xG%), chanser per 60 minuter, minuter tillsammans eller på tur: fler eller färre mål framåt eller bakåt än chanserna antyder. Tur-sorteringarna rangordnar efter hur ovanlig skillnaden är, inte bara storleken, så en stor skillnad på få minuter tränger inte undan en verklig avvikelse. Filtrera på lag, minuter eller lag som spelar i dag, och öppna kedjans nästa match med ett klick.</p>

  <h3>Titta tillbaka: arkiv &amp; matchsammanfattningar</h3>
  <ul>
    <li><b>Arkiv:</b> under Matcher, välj <i>Tidigare</i> för att öppna valfri match från de senaste 7 dagarna precis som den såg ut vid sista uppdateringen före nedsläpp: sannolikheter, odds, bästa spel, uppställningar, målvakter och alla spelardetaljer. Ovanpå visar ✓ / ✗ vad som hände för varje spel, varje spelares faktiska statistik och om bästa spelen vann. Det bästa sättet att lära sig läsa siffrorna: vad sa sajten, och vad missade du?</li>
    <li><b>Matchsammanfattningar:</b> klicka på någon av ett lags senaste 6 matcher eller ett tidigare möte för att se slutresultat, alla mål med assist och powerplay-markering, och varje spelares rad (mål, assist, skott, tacklingar, blockeringar, istid). För matcher från de senaste 7 dagarna finns en knapp för att öppna dem som de såg ut före nedsläpp.</li>
  </ul>

  <h3>Props</h3>
  <p>Alla spelare i kvällens matcher i en lista. Välj spel (poäng, flera poäng, powerplay, skott, tacklingar, blockeringar, tekningar, utvisningar eller första mål), sedan linjen, och sortera efter <i>Mest troliga</i> eller <i>Bäst värde</i>. Filtrera på dag, match eller spelare, och skriv in dina egna odds för att se din EV.</p>

  <h3>Triage: hur stabilt är ett värdespel?</h3>
  <p>Varje värdespel får ett betyg: <b>Stabil</b>, <b>Lutar</b> eller <b>Skör</b>. Värdet kontrolleras med två andra vyer av spelaren, båda i kvällens match: hans <i>säsong hittills</i> och hans <i>senaste 10 matcher</i> (för mål kvaliteten på hans chanser, så att tur inte räknas två gånger). Sedan varningstecknen: djupforward på mål eller poäng, motståndarmålvakten inte bekräftad, marknaden går emot (oddset stiger eller skarpa bookens rättvisa odds är högre än det erbjudna, räknas som en varning), skjuter klart mer eller mindre i år, kort NHL-historik. För powerplaypoäng är de två vyerna hans säsongs- och senaste-10-takt i powerplay, med en varning på över för en spelare utanför första powerplayfemman, och på "nej" för en spelare som nyss flyttats upp dit. För blockerade skott är de hans blockeringar per match i år och de senaste 10 matcherna. Tacklingar får inget betyg: arenornas statistiker gör dem för slumpmässiga.</p>
  <ul><li><b>Stabil:</b> alla tre vyerna visar värde och inga varningstecken.</li><li><b>Lutar:</b> värdet finns, men en vy håller inte med eller så finns en varning.</li><li><b>Skör:</b> bara modellen ser värde, eller så staplas två eller fler varningar.</li></ul>
  <p>Långskott (odds 8.00+), mycket låga odds (under 1.30) och värde under 3 % kan som bäst bli Lutar: långskott förlorar länge även när de är rätt, och låga odds eller tunt värde försvinner av ett litet fel. Skör betyder inte fel, utan mycket osäkrare: spelar du dem, satsa mindre. Vyn <i>Triage</i> under Props listar dagens alla värdespel grupperade efter betyg, med filter för match, spel och över/under och en varning när flera spel vinner eller förlorar tillsammans. Varje bästa spel sparar sitt betyg, och resultatsidan visar hur varje betyg har gått.</p>

  <h3>Spelarutforskaren</h3>
  <p>Fliken <i>Utforska</i> visar alla spelare med en kommande match i ett diagram: välj två valfria mått för axlarna, eller en förinställning som berättar något. <i>Tur</i> (förväntade mål mot mål: långt under diagonalen är otur), <i>Volym mot effektivitet</i> (skott per match mot skottprocent), <i>Roll</i> (istid mot poäng), <i>Powerplay</i>, <i>Skottrend</i> (säsong mot senaste 10: vem som skjuter mer nu) och <i>I kväll</i> (marknad mot modell för 1+ poäng). Filtrera på position, lag, antal matcher eller spelare i kväll, sök ett namn, håll över en prick för siffrorna och klicka för att öppna profilen. De tio spelare vyn handlar om listas under diagrammet.</p>

  <h3>Lagutforskaren</h3>
  <p>Växla Utforska till <i>Lag</i> för att se alla 32 lag i ett diagram, med logotyper som punkter. Förval: <i>Styrka</i> (förväntade mål för och emot 5 mot 5), <i>Tur</i> (förväntad målskillnad mot faktisk: över diagonalen är resultaten bättre än spelet), <i>Målvakter</i> (insläppta chanser mot mål räddade över förväntat), <i>Tempo &amp; totaler</i> (båda lagens förväntade mål per match mot hur ofta matcherna går över 5,5), <i>Special teams</i> (powerplay mot boxplay) och <i>Farliga chanser</i> (farliga skott för och emot). Där lägre är bättre är Y-axeln vänd, så de bästa lagen hamnar alltid uppe till höger. Håll över en logotyp för siffror och ligaplacering, klicka för att öppna lagets nästa match. Gratis för alla.</p>

  <h3>Skott på mål &amp; målvaktsräddningar</h3>
  <p>På varje matchsida beräknar modellen varje lags skott på mål och totalen, utifrån båda lagens skott för och emot i år och hemmaplan, med chansen att gå över de vanliga linjerna. Startmålvaktens väntade räddningar är skotten han väntas möta gånger hans väntade räddningsprocent, med hänsyn till att målvakter ibland byts ut tidigt. Byt målvakt så uppdateras räddningarna. Testat på tusentals tidigare matcher: lagskott och räddningar var träffsäkrare än enkla snitt på alla linjer; för totalt antal skott är modellen ungefär lika bra som ett enkelt snitt, så se den som bakgrund.</p>

  <h3>Fler spel &amp; första målskytt</h3>
  <p>Varje matchsida har <i>Fler spel</i>, allt från samma beräknade resultat: 1X2 efter 60 minuter, puck line ±1,5 (med mål i tom bur), lagets antal mål, mål och oavgjort i första perioden samt båda lagen gör mål, alla med rättvisa odds och en ruta för dina egna odds. Matchup-fliken visar chanserna för <i>Första målskytt</i>: chansen att det blir mål före straffar, gånger att hans lag gör första målet, gånger hans andel av lagets förväntade mål. Testat: 1X2, puck line och lagets mål stämmer väl; för första perioden och båda lagen gör mål stämmer nivån, men matcherna skiljs åt bara lite.</p>
  <h3>Fler spelarspel</h3>
  <ul>
    <li><b>Flera poäng:</b> 2+ och 3+ poäng, 2+ mål, hattrick och 2+ assist, från samma förväntade mål och assist som allt annat. Testat: stämmer väl.</li>
    <li><b>PP-poäng:</b> hans poängtakt i powerplay × hans PP-tid, uppdaterat med årets PP-poäng och justerat för hur ofta kvällens motståndare åker ut. Testat: klart bättre än spelarens enkla snitt av PP-poäng.</li>
    <li><b>Vunna tekningar</b> (centrar): tekningar per match × vinstprocent, justerat för motståndarens tekningsstyrka. Testat: ungefär lika träffsäkert som hans enkla snitt, så se det som bakgrund.</li>
    <li><b>Utvisningar:</b> chansen att han åker ut (över 0,5 utvisningsminuter) och över 2,5 minuter, från hans utvisningstakt och istid. Testat: bättre än den enkla andelen matcher med utvisning.</li>
    <li><b>Nolla:</b> på målvaktskortet och under Fler spel: inget insläppt mål under ordinarie tid och förlängning.</li>
    <li><b>Roll &amp; speltid</b> och <b>Kedjekamrater i kväll</b> i spelardetaljerna: PP-minuter och femma, hans mål, assist och skott i powerplay och hur stor del av hans poäng som kommer i PP (hög andel betyder att chanserna hänger på att han behåller PP-platsen); tekningar, utvisningar och hur han har gjort poäng med och utan varje kedjekamrat i år.</li>
  </ul>
  <h3>Oddsformat</h3>
  <p>Använd menyn högst upp för att visa odds som decimal (1,85), amerikanska (−118 / +185) eller bråk (5/6). Du kan skriva odds i alla tre formaten i varje oddsruta.</p>

  <h3>Sviter &amp; milstolpar</h3>
  <p>Under Props, välj <i>Sviter</i> för en lista över alla intressanta sviter i kvällens matcher: måltorka (med skotten sedan senaste målet), poängtorka, poängsviter, målsviter och milstolpar i karriären inom räckhåll (till exempel 1 mål från 100, eller match nummer 1 000). Torka visas bara när den är ovanlig för en ordinarie spelare, med hur ovanlig ("1 på 12"). Varje rad visar hans chans i kväll och en oddsruta, så att du kan jämföra priser mellan spelbolag. Varje matchsida har också raden <i>Sviter att hålla koll på</i>. En svit ändrar inte hans chans i kväll; siffran bygger redan på hans verkliga nivå.</p>

  <h3>Tacklingar &amp; blockeringar</h3>
  <p>Bygger på varje spelares tacklingar och blockerade skott per minut istid, gånger hans beräknade istid i kväll, justerat för motståndaren (hur ofta de tacklas och hur många av deras skott som blockeras) och arenan, eftersom vissa arenor registrerar betydligt fler tacklingar än andra. Testat på tusentals tidigare matcher var det klart träffsäkrare än spelarens snitt de senaste 10 matcherna på alla linjer.</p>

  <h3>Ditt konto</h3>
  <ul>
    <li><b>Mina spel:</b> spara vilket spel som helst med oddset du fick. Spelen rättas automatiskt efter varje match, med träffprocent, vinst, ROI och om du slog stängningsoddset, det bästa långsiktiga tecknet på en bra spelare. Stängningsoddset kommer från spelbolagets flöde; för marknader som saknas där (tacklingar, blockeringar), eller ett annat spelbolag, lägger du in ditt eget.</li>
    <li><b>Spelfördelning:</b> på varje matchsida andelen spel (antal) och andelen pengar på varje sida av vinnare, totalmål och puck line, med hur många spel som ligger bakom. När pengarna är klart över antalet spel på en sida ligger färre men större spel där. Det är bakgrund, inte en del av modellen, och låses med oddsen 5 minuter före nedsläpp.</li>
    <li><b>Kombokoll:</b> tryck på ”＋ Kombo” på valfritt spel (eller lägg till ett matchspel: ett lag vinner, totalmål, ett lags mål) för att bygga en kombination. Den visar den sammanlagda chansen, inklusive kopplingen mellan spel i samma match (en spelares poäng och skott, eller hans poäng och lagets mål), det rättvisa oddset och din EV när du skriver in spelbolagets pris. Den jämför också sätt att spela samma spel med samma totala insats: bara singlar, alla par, en kombination eller singlar plus kombinationen, med chansen till vinst och att förlora allt. Spara kombinationen så rättas den automatiskt i Mina spel.</li>
    <li><b>Bevakning:</b> tryck på bokmärket bredvid en spelare för att följa honom. Mina spel visar hans nästa match med kvällens chans och odds, matchen markeras under Matcher, och med aviseringar på får du en notis på matchdagen.</li>
    <li><b>Aviseringar:</b> pushnotiser när ett spel når den edge-nivå du väljer, eller när en startmålvakt bekräftas.</li>
  </ul>

  <h3>Facit</h3>
  <p>Modellens protokoll. Varje prognos sparas före matchen och kontrolleras efteråt: hur ofta saker hände jämfört med vad modellen sa, hur träffsäkra sannolikheterna var (Brier och Skicklighet) och kalibreringsdiagram. <i>Värdespel</i> där är inga tips: de testar om alla spel med 5 %+ edge till marknadspris hade gått med vinst. Öppna <i>Så läser du sidan</i> på den fliken för detaljer.</p>

  <h3>Ord som används på sajten</h3>
  <ul>
    <li><b>Rättvisa odds</b> = 1 ÷ sannolikheten: oddsen där ett spel går jämnt ut i längden.</li>
    <li><b>Marknad-%</b> = sannolikheten som marknadsoddsen motsvarar, med spelbolagets marginal borträknad.</li>
    <li><b>Edge / EV</b> = modellens sannolikhet × odds − 1. +10 % betyder att modellen räknar med 10 % vinst per spel i längden, om modellen har rätt.</li>
    <li><b>▲ Bör lyfta / ▼ Kan svalna</b> = gör tydligt färre / fler mål än sin verkliga nivå i år. I testerna gjorde spelare som "borde lyfta" <i>inte</i> fler mål än modellen redan räknade med, så det är bakgrund, inte ett skäl att spela i sig.</li>
    <li><b>Skott utan mål</b> = skott sedan senaste målet, och hur ovanlig en så lång torka är för en spelare på hans nivå.</li>
    <li><b>Prognos / Trolig / Bekräftad / Inte avgjort</b> målvakt = från de senaste rapporterna om startmålvakter. Prognos betyder att ingen rapport finns än: målvakten med flest starter på sistone, eller reserven vid back-to-back.</li>
    <li><b>Ute / Dag till dag / Spelar</b>: spelare som är Ute tas bort från spelen; osäkra spelare finns kvar med gul markering tills uppställningen visar att de spelar.</li>
    <li><b>B2B</b> = laget spelade i går.</li>

function slipPlans(R, comboOdds, total){
  const n = SLIP.length, N = R.N, ok = R.info.every(x => x && x.od);
  if (!ok || n < 2) return null;
  const sameGame = (i, j) => String(SLIP[i].g) === String(SLIP[j].g);
  const pairs = []; for (let i=0;i<n;i++) for (let j=i+1;j<n;j++) if (!sameGame(i,j)) pairs.push([i,j]);
  const plans = [];

    if (!bets.length) return;
    const st = total / bets.length; let sum = 0, prof = 0, zero = 0;
    for (let s=0; s<N; s++){ let pay = 0; for (const [legs, od] of bets) if (legs.every(i => R.vec[i][s])) pay += st * od; sum += pay; if (pay > total + 1e-9) prof++; if (pay === 0) zero++; }
    plans.push({key, n: bets.length, stake: st, ev: sum / N / total - 1, pProfit: prof / N, pZero: zero / N});
  };
  run("singles", SLIP.map((_, i) => [[i], R.info[i].od]));
  if (pairs.length) run("doubles", pairs.map(([i, j]) => [[i, j], R.info[i].od * R.info[j].od]));
  if (comboOdds) run("parlay", [[SLIP.map((_, i) => i), comboOdds]]);
  if (comboOdds) {   // the NBA-style mix: every single plus the full parlay, equal stakes
    const bets = [...SLIP.map((_, i) => [[i], R.info[i].od]), [SLIP.map((_, i) => i), comboOdds]];
    run("mix", bets);
  }

// closing price for a pick: graded value, else the last pre-game price on the site once the game has started
function closeOf(x){
  if (x.closing_odds) return {o:+x.closing_odds, man:!!x.closing_manual, prov:false};
  if (x.start_time && new Date(x.start_time).getTime() <= Date.now()){ const b = book(x.game_id, x.player_id, x.market); if (b?.o) return {o:b.o, man:false, prov:true}; }
  return null;
}
const started = x => x.start_time && new Date(x.start_time).getTime() <= Date.now();
function closeCell(x){
  const c = closeOf(x);
  if (!c){
    if (!started(x) || x.result === "void") return "–";
    return `<button class="mlink addcl" type="button" data-cl="${x.id}" title="${esc(t("cl_none"))}">＋ ${t("pk_addclose")}</button>`;
  }
  const v = x.odds / c.o - 1, cls = v > 0.0001 ? "ev-pos" : v < -0.0001 ? "ev-neg" : "";
  const src = c.man ? t("cl_man") : c.prov ? t("cl_prov") : t("cl_auto");
  const vt = (v>=0?"+":"") + (v*100).toFixed(1) + "%";
  return `<span title="${esc(src)}">${oddsTxt(c.o)}${c.man?` <button class="mlink" type="button" data-cl="${x.id}" aria-label="${esc(t("cl_h"))}">✎</button>`:""}</span><div class="clv ${cls}" title="${esc(t("clv_tip",{v:vt}))}">${vt}</div>`;
}
function openClose(id){
  const x = MYPICKS.find(p => String(p.id)===String(id)); if (!x) return;
  modal(`<h3>${t("cl_h")}</h3><p class="meta">${esc(x.player_name)} · ${mName(x.market)} · ${t("h_odds")} ${oddsTxt(+x.odds)}</p>
    <form id="clf"><label for="cl_o">${t("cl_lbl")}</label><input id="cl_o" type="text" inputmode="text" value="${x.closing_manual&&x.closing_odds?oddsTxt(+x.closing_odds):""}" required>
    <p class="meta" style="margin:10px 0 0">${t("cl_help")}</p>
    <div class="mrow"><button class="mbtn pri" type="submit">${t("save")}</button>${x.closing_manual?`<button class="mbtn" type="button" id="cl_clear">${t("cl_clear")}</button>`:""}<button class="mbtn" type="button" data-close>${t("cancel")}</button></div></form><div class="mmsg" id="cl_msg"></div>`);
  const fail = m => { const el = $("#cl_msg"); el.className = "mmsg err"; el.textContent = m; };
  const save = async v => { const {error} = await sb.rpc("set_closing", {p_id: x.id, p_odds: v}); if (error) return fail(error.message); await loadPicks(); closeModal(); render(); };
  $("#clf").onsubmit = e => { e.preventDefault(); const v = parseOdds($("#cl_o").value); if (!v) return fail(t("odds_bad")); save(Math.round(v*1000)/1000); };
  const clr = $("#cl_clear"); if (clr) clr.onclick = () => save(null);
}

let PRO_LOADED = !PAYWALLED, PRO_ARCH = null;
async function loadPlan(){
  let plan = "visitor";
  if (sb && USER){ try { const {data} = await sb.from("profiles").select("plan").eq("id", USER.id).maybeSingle(); plan = data?.plan || "free"; } catch(e){ plan = "free"; } }
  PLAN = plan;
  const want = PRO_PLANS.includes(PLAN);
  if (want && !PRO_LOADED && sb){
    PRO_STATE = "loading"; render();
    try {
      const ad = (typeof ARCH_PARAM !== "undefined" && ARCH_PARAM && (DATA.archive_dates || []).includes(ARCH_PARAM)) ? ARCH_PARAM : null;
      const d = ad ? "archive/" + ad : "latest";
      const {data, error} = await sb.functions.invoke("pro-data", {body: {d}});
      if (error || !data?.url) throw new Error(error?.message || data?.error || "no url");
      const X = await (await fetch(data.url, {cache: "no-store"})).json();
      if (ad){ PRO_ARCH = X; if (ARCH) applyArchive(X); }   // else the archive start-up applies it

// ------------------------------------------------------------ fresh sharp-book prices (Pro)
// The workflow stores Pinnacle's player prices in pin_odds about once an hour (supabase/functions/pin-sync); the page
// was built earlier, so Pro accounts merge the newer prices in: the sharp price beside the main book ('p' / 'pn'),
// or the market itself when only the sharp book has it (b = 'p'). Readable by Pro accounts only (RLS).
let SHARP_AT = null, SHARP_TIMER = null;
const nmKey = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z ]/g, " ").replace(/\s+/g, " ").trim();
async function loadSharp(){
  if (!sb || !PRO || ARCH) return;
  if (!SHARP_TIMER) SHARP_TIMER = setInterval(loadSharp, 15 * 60e3);
  let data;
  try { ({data} = await sb.from("pin_odds").select("start_time,home_name,away_name,player_name,market,over,under,fetched_at")
    .gte("start_time", new Date().toISOString()).limit(10000)); } catch(e){ return; }
  if (!data?.length) return;
  const last = s => nmKey(s).split(" ").pop();
  let n = 0, newest = SHARP_AT;
  for (const r of data){
    if (SHARP_AT && r.fetched_at <= SHARP_AT) continue;            // already merged
    const t = new Date(r.start_time).getTime();
    const g = DATA.games.find(x => x.start && Math.abs(new Date(x.start).getTime() - t) < 4 * 3600e3
      && (nmKey(x.home_name) === nmKey(r.home_name) || (last(x.home_name) === last(r.home_name) && last(x.away_name) === last(r.away_name))));
    if (!g || (g.state && !["FUT","PRE"].includes(g.state))) continue;
    const want = nmKey(r.player_name), w = want.split(" ");
    const pr = g.props.find(x => nmKey(P(x.id)?.name) === want)
      || g.props.find(x => { const a = nmKey(P(x.id)?.name).split(" "); return a.length && a[a.length-1] === w[w.length-1] && a[0][0] === w[0][0]; });
    if (!pr) continue;
    const o = DATA.odds[g.id] = DATA.odds[g.id] || {book:"Bookmaker", players:{}, totals:{}, winner:{}, fetched:null};
    const cur = (o.players = o.players || {})[pr.id] = o.players[pr.id] || {};
    const v = cur[r.market], ov = +r.over, un = r.under != null ? +r.under : null;
    if (v && v.b !== "p"){ v.p = ov; v.pn = un; } else cur[r.market] = {o: ov, n: un, b: "p"};
    n++; if (!newest || r.fetched_at > newest) newest = r.fetched_at;
  }
  SHARP_AT = newest;
  if (n) render();
}

  const per = p => typeof p === "number" ? t("rc_p",{n:p}) : p === "OT" ? t("r6_ot") : p === "SO" ? t("r6_so") : p;

function teamGoals(tm){

  const tag = (cls, key, tipKey, g, x, p) => `<span class="pill ${cls} tip" tabindex="0" data-tip="${esc(t(tipKey,{g, x:fmt(x,1), p:Math.max(1, Math.round(p*100))}))}">${t(key)}</span>`;
  const flags = [];
  if (L.xgf - L.gf >= 2 && lo(L.gf, L.xgf) < 0.10) flags.push(tag("s-dry", "tg_cold", "tg_cold_tip", L.gf, L.xgf, lo(L.gf, L.xgf)));
  else if (L.gf - L.xgf >= 2 && hi(L.gf, L.xgf) < 0.10) flags.push(tag("s-hot", "tg_hot", "tg_hot_tip", L.gf, L.xgf, hi(L.gf, L.xgf)));
  if (L.ga - L.xga >= 2 && hi(L.ga, L.xga) < 0.10) flags.push(tag("s-dry", "tg_gah", "tg_gah_tip", L.ga, L.xga, hi(L.ga, L.xga)));
  else if (L.xga - L.ga >= 2 && lo(L.ga, L.xga) < 0.10) flags.push(tag("s-hot", "tg_gal", "tg_gal_tip", L.ga, L.xga, lo(L.ga, L.xga)));
  const d = (a, b, good) => { const x = a - b; return `<span class="lld ${(good ? x >= 0 : x <= 0) ? "pos" : "neg"}">${x >= 0 ? "+" : ""}${fmt(x,1)}</span>`; };

const SCORES_URL = "https://evxnevqxykbfocqfqxid.supabase.co/functions/v1/scores";
async function pollScores(){
  const now = Date.now();
  // any game that should have started and isn't marked final yet (also games long over, if the page is older than the result)
  const active = DATA.games.filter(g => g.start && !["FINAL","OFF"].includes(g.state) && new Date(g.start).getTime() - now < 10*60e3 && now - new Date(g.start).getTime() < 48*3600e3);
  if (!active.length) return;
  try {
    const dates = [...new Set(active.map(g=>g.date))];
    let changed = false;
    for (const d of dates){
      const r = await fetch(`${SCORES_URL}?date=${d}`); if (!r.ok) continue;
      const js = await r.json();
      for (const x of js.games||[]){ const g = gameById[x.id] || gameById[String(x.id)]; if (!g) continue;
        for (const k of ["state","hs","as","period","clock","intermission","last_period"]) if (x[k]!==undefined && g[k]!==x[k]){ g[k]=x[k]; changed=true; } }
    }
    if (changed && state.tab==="games" && !document.activeElement?.matches?.("input,select")) render();
  } catch(e) {}
}

<style>

</style>
<script>
(function(){
  const S = {
    en:{h:"Are you 18 or older?", p:"NHL Props Lab is an analysis tool for sports betting and is only for adults. We don't take bets.", yes:"Yes, I'm 18+", no:"No",
        msg:'Sorry, this site is only for people aged 18 and over. Worried about gambling? <a href="https://www.stodlinjen.se" rel="noopener">Stödlinjen</a> 020-81 91 00.'},
    sv:{h:"Är du 18 år eller äldre?", p:"NHL Props Lab är ett analysverktyg för sportspel och är bara för vuxna. Vi tar inte emot spel.", yes:"Ja, jag är 18+", no:"Nej",
        msg:'Tyvärr, sajten är bara för personer som fyllt 18. Orolig för spel? <a href="https://www.stodlinjen.se" rel="noopener">Stödlinjen</a> 020-81 91 00.'}};
  let ok = null; try { ok = localStorage.getItem("age18"); } catch(e) {}
  if (ok === "1") return;
  let L = "en"; try { const s = localStorage.getItem("set:lang"); L = s==="sv"||s==="en" ? s : ((navigator.language||"").toLowerCase().startsWith("sv") ? "sv" : "en"); } catch(e) {}
  const T = S[L], el = document.getElementById("agegate");
  document.getElementById("ag_h").textContent = T.h; document.getElementById("ag_p").textContent = T.p;
  document.getElementById("ag_yes").textContent = T.yes; document.getElementById("ag_no").textContent = T.no;
  el.hidden = false; document.documentElement.style.overflow = "hidden";
  document.getElementById("ag_yes").onclick = () => { try { localStorage.setItem("age18","1"); } catch(e) {} el.hidden = true; document.documentElement.style.overflow = ""; };
  document.getElementById("ag_no").onclick = () => { const m = document.getElementById("ag_msg"); m.innerHTML = T.msg; m.hidden = false; };
})();
</script>
