<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NHL Props Lab</title>
<meta name="theme-color" content="#0b1118">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Props Lab">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=Oxanium:wght@500;600;700;800&display=swap">
<style>
/* Layout: sticky top bar · games list (home) · game page with side picker · props grid */
:root{
  --bg:#0a0e13; --panel:#111821; --panel2:#17202b; --line:#22303f; --text:#e7eef6; --mute:#8796a8;
  --accent:#3ddc97; --accent2:#5aa9ff; --warn:#ffb547; --bad:#ff6b6b; --good:#3ddc97; --chip:#1b2533;
  --pc1:#3ddc97; --pc2:#5aa9ff; --pc3:#ffb547; --pc4:#f07ac0;
  --heat:61,220,151; --line2:#7ff3ff; --hit:var(--good); --tipbg:var(--text); --tipfg:var(--bg); --tipbd:transparent; --tipsh:0 6px 18px rgba(0,0,0,.35); --radius:12px; color-scheme:dark;
  --f-ui:"Exo 2",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f-disp:"Oxanium","Exo 2",-apple-system,"Segoe UI",sans-serif;
  --f-num:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]) .lg-d,:root:not([data-theme="dark"]) .xl-d{display:none}
  :root:not([data-theme="dark"]) .lg-l{display:inline-block}
  :root:not([data-theme="dark"]) .xl-l{display:inline}
  :root:not([data-theme="dark"]){
    --bg:#f3f5f8; --panel:#ffffff; --panel2:#eef2f6; --line:#dbe2ea; --text:#111821; --mute:#5a697b;
    --accent:#0d9a60; --accent2:#1d6bd0; --warn:#a96400; --bad:#c42f2f; --good:#0d9a60; --chip:#e9eef4;
    --pc1:#0d9a60; --pc2:#1d6bd0; --pc3:#c27a00; --pc4:#c2347f;
    --heat:13,154,96; --line2:#0aa3c2; --hit:var(--good); --tipbg:var(--panel); --tipfg:var(--text); --tipbd:var(--line); --tipsh:0 10px 28px rgba(20,24,40,.16); color-scheme:light;
  }
}
:root[data-theme="light"] .lg-d,:root[data-theme="light"] .xl-d{display:none}
:root[data-theme="light"] .xl-l{display:inline}
:root[data-theme="light"] .lg-l{display:inline-block}
:root[data-theme="light"]{
    --bg:#f3f5f8; --panel:#ffffff; --panel2:#eef2f6; --line:#dbe2ea; --text:#111821; --mute:#5a697b;
    --accent:#0d9a60; --accent2:#1d6bd0; --warn:#a96400; --bad:#c42f2f; --good:#0d9a60; --chip:#e9eef4;
    --pc1:#0d9a60; --pc2:#1d6bd0; --pc3:#c27a00; --pc4:#c2347f;
    --heat:13,154,96; --line2:#0aa3c2; --hit:var(--good); --tipbg:var(--panel); --tipfg:var(--text); --tipbd:var(--line); --tipsh:0 10px 28px rgba(20,24,40,.16); color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--f-ui)}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}body>main{flex:1 0 auto;width:100%;box-sizing:border-box}body>header,body>#archbar,body>.appfoot{flex:none;width:100%;box-sizing:border-box}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:14px;padding-block:12px;flex-wrap:wrap}
.brand{font-family:var(--f-disp);font-weight:800;font-size:19px;letter-spacing:.6px;cursor:pointer;text-transform:uppercase}
.brand b{color:var(--accent)}.betap{font:700 10px/1 var(--f-ui);letter-spacing:.6px;text-transform:uppercase;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 55%,transparent);border-radius:999px;padding:3px 7px;margin-left:6px;vertical-align:3px}
.meta{color:var(--mute);font-size:12px}
.demo{background:var(--warn);color:#111;font-weight:700;border-radius:6px;padding:2px 8px;font-size:11px}
nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.tools{display:flex;gap:8px;align-items:center}
.tools .seg button{padding:5px 9px;font-size:12px}
/* desktop/tablet: settings and login top right, the navigation on its own row below (phones use the bottom bar) */
@media (min-width:641px){ .top{row-gap:10px} .tools{order:3;margin-left:auto} nav{order:4;flex-basis:100%;margin-left:-8px} }
@media (min-width:641px) and (max-width:1000px){ .brand{order:1} .tools{order:2} .top>.meta{order:3;flex-basis:100%;margin-top:-6px} nav{order:4} }
.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;width:34px;height:32px;display:grid;place-items:center;cursor:pointer;font-size:15px}
.iconbtn:hover{border-color:var(--accent)}
nav button{background:none;border:0;color:var(--mute);font-weight:600;padding:8px 12px;border-radius:8px;cursor:pointer}
nav button.on{color:var(--text);background:var(--panel2)}
main{padding-block:18px 64px}
h2{font-size:20px;margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--chip);color:var(--mute)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.s-confirmed{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.s-likely{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.s-live{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.s-live i{animation:blink 1.4s infinite}@keyframes blink{50%{opacity:.25}}
.s-final{background:var(--chip);color:var(--text)}
.gmid .sc.live{color:var(--text)}
.livebar{margin-top:10px;display:flex;gap:8px;align-items:center;justify-content:center;font-family:var(--f-disp);font-size:16px}
.frozen{margin-top:8px;font-size:12px;color:var(--mute);font-family:var(--f-ui);font-weight:500;letter-spacing:0;text-transform:none}
.s-out{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.s-q{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.s-up{background:color-mix(in srgb,var(--accent2) 16%,transparent);color:var(--accent2)}
.s-down{background:var(--chip);color:var(--mute)}
.s-due{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.s-hot{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.s-dry{background:color-mix(in srgb,var(--accent2) 16%,transparent);color:var(--accent2)}
.s-b2b{background:color-mix(in srgb,var(--accent2) 16%,transparent);color:var(--accent2)}
select,input[type=search],input.odds{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit}
input.odds{width:70px;padding:5px 7px;text-align:right;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;color:var(--mute);font-weight:650;padding:6px 12px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink,#03130c)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.toggle{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:13px;cursor:pointer}

/* ---------- games list */
.abar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:10px 14px;margin:6px 0 14px;border:1px solid color-mix(in srgb,var(--accent2) 45%,var(--line));background:color-mix(in srgb,var(--accent2) 8%,var(--panel));border-radius:12px;font-size:14px}
.day.past{position:relative;border-style:dashed;color:var(--mute)}
.day.past b{color:var(--text)}
.day.past select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;font-size:16px}
@media (max-width:640px){.abar .meta{font-size:12px}.abar .abtn{width:100%;margin-left:0}.abar .abtn select{flex:1}}
.abar b{font-family:var(--f-disp);letter-spacing:.3px}
.abar .meta{flex:1 1 320px;margin:0}
.abar .abtn{display:flex;gap:8px;margin-left:auto}
.abar select,.abar button{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:6px 10px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.abar.live select{margin-left:auto}
.abar button{background:var(--accent2);border-color:var(--accent2);color:#fff}
.rmk{font-style:normal;font-weight:800;font-size:11px;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;margin-right:3px;vertical-align:1px}
.rmk.y{background:var(--good);color:#06210f}.rmk.n{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
.cell{position:relative}.cell .rmk{position:absolute;top:2px;right:2px;width:14px;height:14px;font-size:9.5px;margin:0}
.cell.rmiss{opacity:.55}
.cell.rhit{box-shadow:inset 0 0 0 2px var(--good)}
.rline{display:block;font-size:11.5px;color:var(--mute);margin-top:2px}.rline.pts{color:var(--good);font-weight:600}.rline.dnp{font-style:italic}
.rprop{display:flex;align-items:center;gap:4px;margin-top:3px}.rprop .rline{margin:0}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.day{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;cursor:pointer;text-align:left}
.day b{display:block;font-size:14px;font-family:var(--f-disp);letter-spacing:.5px;text-transform:uppercase}
.day span{font-size:11px;color:var(--mute)}
.day.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.glist{display:grid;gap:10px}
.grow{display:grid;grid-template-columns:72px 1fr 150px 1fr 170px;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;transition:border-color .15s}
.grow:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.gtime{font-family:var(--f-disp);font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.gtime small{display:block;color:var(--mute);font-weight:500;font-size:11px}
.gteam{display:flex;flex-direction:column;gap:3px;min-width:0}
.gteam.r{align-items:flex-end;text-align:right}
.abbr{font-family:var(--f-disp);font-size:22px;font-weight:800;letter-spacing:1px}
.tm{display:flex;align-items:center;gap:10px}
.gteam.r .tm{flex-direction:row-reverse}
.lg{width:var(--lg,40px);height:var(--lg,40px);object-fit:contain;flex:0 0 auto;display:inline-block}
.lg-l,.xl-l{display:none}
.lgfb{width:var(--lg,40px);height:var(--lg,40px);border-radius:50%;background:var(--chip);display:inline-grid;place-items:center;font-family:var(--f-disp);font-size:11px;font-weight:700;color:var(--mute);flex:0 0 auto}
.gteam .sub{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.gmid{text-align:center}
.gmid .sc{font-family:var(--f-disp);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.gmid .wpb{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:6px;background:var(--chip)}
.wpb i:first-child{background:var(--accent2)}.wpb i:last-child{background:var(--accent)}
.gou{display:grid;grid-template-columns:auto auto auto;gap:2px 10px;font-size:12px;justify-content:end;align-items:baseline}
.gou .go{font-family:var(--f-disp);font-weight:600;color:var(--mute);font-variant-numeric:tabular-nums;min-width:30px;text-align:right}
.gou .go.val,.godds .val{color:var(--good);font-weight:700}
.godds{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;font-family:var(--f-disp);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.godds small{font-family:var(--f-ui);font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.h2h{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;font-size:12.5px}
.h2s{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-bottom:6px}
.h2s span{color:var(--mute);font-size:12px}
.h2r,.h2head{display:grid;grid-template-columns:96px 1fr 18px 1fr 40px;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.h2head{padding:0 0 2px;border-bottom:0;font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
.h2r:last-child{border-bottom:0}
.h2d{color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.h2t{display:flex;align-items:center;gap:6px;color:var(--mute)}
.h2t b{font-family:var(--f-disp);font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums;min-width:14px;text-align:center}
.h2t.l{justify-content:flex-end}
.h2t.r{flex-direction:row-reverse;justify-content:flex-end}
.h2head .l{text-align:right}
.h2t.w{color:var(--text);font-weight:700}.h2t.w b{color:var(--text)}
.h2at{text-align:center;color:var(--mute);font-size:11px}
.h2tot{text-align:right;font-family:var(--f-disp);font-weight:600;font-variant-numeric:tabular-nums}
@media (max-width:640px){.h2r,.h2head{grid-template-columns:72px 1fr 14px 1fr 30px}.h2t img,.h2t .lgfb{display:none!important}}
.sgbox{margin-bottom:12px}
.sgtop{display:flex;flex-wrap:wrap;gap:8px 16px;margin-bottom:10px;font-size:13px}
.sgt{display:inline-flex;align-items:center;gap:6px}
.sgt b{font-family:var(--f-disp)}
.sgt i,table.sg .sgb{font-style:normal;font-family:var(--f-disp);font-weight:800;font-size:10px;width:16px;height:16px;border-radius:50%;background:var(--accent);color:var(--accent-ink,#03130c);display:inline-grid;place-items:center}
.sgwrap{display:flex;flex-direction:column;gap:4px;align-items:center}
.sgaxis-h,.sgaxis-v{font-size:11px;color:var(--mute);font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
.sgrow{display:flex;align-items:center;gap:8px}
.sgaxis-v{writing-mode:vertical-rl;transform:rotate(180deg)}
.sgaxis-v img{transform:rotate(90deg)}
table.sg{border-collapse:separate;border-spacing:3px;width:auto}
table.sg th{font-family:var(--f-disp);font-size:12px;color:var(--mute);text-align:center;padding:4px;cursor:default;border:0}
table.sg td.tie{background:transparent;color:var(--mute);box-shadow:inset 0 0 0 1px var(--line)}
table.sg td{width:56px;height:38px;text-align:center;border-radius:6px;font-family:var(--f-disp);font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums;position:relative;border:0;padding:0}
table.sg td.top{box-shadow:inset 0 0 0 2px var(--accent);font-weight:800}
table.sg .sgv{display:flex;align-items:center;justify-content:center;gap:4px;height:100%}
table.sg .sgb{width:14px!important;height:14px!important;font-size:9px!important;flex:0 0 auto}
table.sg .sgm{background:none!important;color:var(--mute);font-size:11px;font-weight:600}
@media (max-width:640px){table.sg td{width:34px;height:32px;font-size:10.5px}table.sg{border-spacing:2px}.sgaxis-v{display:none}table.sg .sgb{display:none!important}}
.totop{position:fixed;right:calc(18px + env(safe-area-inset-right, 0px));bottom:calc(18px + env(safe-area-inset-bottom, 0px));z-index:40;width:44px;height:44px;border-radius:50%;
  border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(8px);color:var(--text);font-size:20px;cursor:pointer;
  display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .2s,transform .2s,border-color .15s}
.totop.show{opacity:1;transform:none;pointer-events:auto}
.totop:hover{border-color:var(--accent);color:var(--accent)}
.gou span:nth-child(odd){color:var(--mute)}
.gou b{font-variant-numeric:tabular-nums}
.tags{display:flex;gap:5px;flex-wrap:wrap}

/* ---------- game page */
.back{background:none;border:0;color:var(--mute);cursor:pointer;padding:0;margin-bottom:12px;font-weight:600}
.back:hover{color:var(--text)}
.ghero{padding:18px 20px;display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center}
.ghero .abbr{font-size:34px}
.ghero .tm{--lg:64px;gap:14px}
.ghero .tm.r{flex-direction:row-reverse;text-align:right}
.sides .lg{--lg:22px}
.sides button{display:inline-flex;align-items:center;gap:8px}
.pl .lg{--lg:18px;vertical-align:-4px;margin-right:2px}
.ghero .big{font-family:var(--f-disp);font-size:36px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;letter-spacing:.5px}
.ghero .big small{display:block;font-size:11px;color:var(--mute);font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.gsum{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 18px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;min-width:0}
.box h4{font-family:var(--f-disp);margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);display:flex;justify-content:space-between;align-items:center;gap:8px}
.ou{display:grid;grid-template-columns:auto repeat(4,1fr);gap:6px 10px;align-items:center;font-size:13px}
.ou .h{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.4px}
.sides{display:flex;justify-content:center;margin-bottom:16px}
.sides .seg button{padding:8px 18px;font-size:14px}
.sidegrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.3fr);gap:12px;margin-bottom:14px}
.sidegrid .newsbox{grid-column:1/-1}
.msl{display:flex;flex-direction:column;gap:8px;font-size:13px}
.msben{font-size:12.5px;margin:10px 0 0;color:var(--mute)}.msben b{color:var(--text);font-weight:600}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:12.5px}
.kv span:nth-child(odd){color:var(--mute)}
.kv span:nth-child(even){font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.gname{font-family:var(--f-disp);font-size:18px;font-weight:750;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.injl{display:flex;flex-direction:column;gap:8px;font-size:13px}
.inj{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:start}
.inj .d{grid-column:2;color:var(--mute);font-size:12px}
.newsl{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute)}
.newsl li::marker{color:var(--accent)}
.lines{display:grid;gap:6px;font-size:12.5px}
.line{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center}
.line .lab{font-size:10.5px;font-weight:700;color:var(--mute);text-transform:uppercase}
.lp{display:flex;gap:6px;flex-wrap:wrap}
.lp span{background:var(--chip);border-radius:6px;padding:3px 7px;white-space:nowrap}
.lp span b{font-variant-numeric:tabular-nums;color:var(--accent);margin-left:4px;font-size:11px}
.lp span.q{box-shadow:inset 0 0 0 1px var(--warn)}

/* ---------- props grid */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}

})();

    tr_how_h:"How to read this page",
    tr_how:`<p>Every update saves the model's probabilities before the games. After the games they are checked against what actually happened. This is a scorecard for the model, not a list of bets.</p><dl>
      <dt>Predictions</dt><dd>How many were graded. Every active player in every finished game gets a goal, assist, point and shots prediction, so one game with 36 players gives 36 in every row.</dd>
      <dt>Predicted vs Happened</dt><dd>The average probability against the real frequency. If the model gives 25% for an assist across 400 player-games, about 100 of them should get one.</dd>
      <dt>Brier</dt><dd>The average squared error of the probabilities. 0 is perfect, lower is better. Rare events always score low, so compare within a row over time, not between rows.</dd>
      <dt>Skill</dt><dd>Brier compared with a naive forecast that gives every player the league-wide rate. +15% means 15% less error than that. Above 0 means the model adds something.</dd>
      <dt>Calibration</dt><dd>Dots on the dashed diagonal mean that when the model says 30%, it happens about 30% of the time. That is what makes EV calculations trustworthy.</dd>
      <dt>History weight</dt><dd>The game total (over 5.5 / 6.5) can blend the model with teams' scoring history. The table shows which mix would have scored best so far.</dd>
      <dt>Value bets</dt><dd>Not our picks. Every prop where the model's EV was 5% or more at the sportsbook price we had, staked at 1 unit each, to test whether those edges pay off. It is a check on the model, not advice.</dd></dl>
      <p>With few games graded all of this is noise: one game can swing a row from +30% to −30%. Judge it after several hundred player-games.</p>`,

    tr_skill_tip:"Hur mycket bättre än en naiv gissning som bara använder hur ofta det här händer i allmänhet. Över 0 % = modellen tillför något. Brusigt tills det finns några hundra prognoser.",
    tr_calib_note:"Varje punkt samlar prognoser med liknande sannolikhet. På den streckade linjen = det modellen sa hände så ofta. Över = det hände oftare än förutsagt, under = mer sällan.",
    tr_blend_note:"Matchtotalen blandar modellen med lagens målhistorik. 0 % = bara modellen, 100 % = bara historiken. Visar vilken blandning som hittills hade träffat bäst.",
    tr_how_h:"Så läser du sidan",
    tr_how:`<p>Varje uppdatering sparar modellens sannolikheter före matcherna. Efteråt jämförs de med vad som faktiskt hände. Det här är modellens protokoll, inte en lista med spel.</p><dl>
      <dt>Prognoser</dt><dd>Hur många som rättats. Varje spelare i varje färdigspelad match får en prognos för mål, assist, poäng och skott, så en match med 36 spelare ger 36 på varje rad.</dd>
      <dt>Förutsagt mot utfall</dt><dd>Genomsnittlig sannolikhet mot verklig frekvens. Ger modellen 25 % för assist på 400 spelarmatcher ska ungefär 100 av dem få en.</dd>
      <dt>Brier</dt><dd>Genomsnittligt kvadratfel för sannolikheterna. 0 är perfekt, lägre är bättre. Ovanliga händelser får alltid lågt värde, så jämför inom en rad över tid, inte mellan rader.</dd>
      <dt>Skicklighet</dt><dd>Brier jämfört med en naiv prognos som ger alla spelare ligasnittet. +15 % betyder 15 % mindre fel än den. Över 0 betyder att modellen tillför något.</dd>
      <dt>Kalibrering</dt><dd>Punkter på den streckade diagonalen betyder att när modellen säger 30 % händer det ungefär 30 % av gångerna. Det är det som gör EV-beräkningarna pålitliga.</dd>
      <dt>Historikvikt</dt><dd>Matchtotalen (över 5,5 / 6,5) kan blanda modellen med lagens målhistorik. Tabellen visar vilken blandning som hittills hade träffat bäst.</dd>
      <dt>Värdespel</dt><dd>Inte våra tips. Alla spel där modellens EV var 5 % eller mer till spelbolagets pris, med 1 enhet per spel, för att testa om de övervärdena lönar sig. En kontroll av modellen, inte råd.</dd></dl>
      <p>Med få rättade matcher är allt detta brus: en match kan svänga en rad från +30 % till −30 %. Döm efter flera hundra spelarmatcher.</p>`,

  nxv_season_a:"Season assist rate", nxv_l10_a:"Last 10 assist rate", nxv_season_p:"Season points rate", nxv_l10_p:"Last 10 points rate",tri_how_h:"How Triage works", tri_how:`<p><b>Triage checks how solid each value bet is.</b> A value bet means the model's chance is higher than the price says. Triage asks: does that still hold if we look at the player another way?</p>
<p><b>Every value bet is checked three ways</b>, all in tonight's matchup (same opponent, same goalie):</p>
<ol><li><b>The model's number</b>: what the site normally shows.</li><li><b>His season so far</b>: what his actual production this season would say.</li><li><b>His last 10 games</b>: what his recent form would say.</li></ol>
<p><b>Then the warning signs:</b> depth forward on goals or points, opposing goalie not confirmed, the market moving against it (the price drifting out, or the sharp book's fair price above the one on offer; together these count as one warning), shooting clearly up or down this season, a short NHL history. For power-play points the two views are his season and last-10 power-play rate, with a warning on an over for a player off the first power-play unit, and on a "no" for a player just moved onto it. For blocked shots they are his season and last-10 blocks per game. Hits aren't graded: arena scorekeepers make them too random.</p>
<table class="trihow"><tr><td><span class="trib tr-S">Solid</span></td><td>All three views show value, and no warning signs. Long shots (odds 8.00+), very short prices (under 1.30) and edges under 3% can be Lean at best.</td></tr><tr><td><span class="trib tr-L">Lean</span></td><td>Value is there, but one view disagrees or there's one warning.</td></tr><tr><td><span class="trib tr-F">Fragile</span></td><td>Only the model sees value, or there are two or more warnings.</td></tr></table>
<p class="trinote"><b>Fragile doesn't mean wrong or skip it.</b> The model is patient with players in slumps, and historically that patience beats raw season numbers. Fragile means much more uncertain: you're betting purely on the model's view. If you play those, play them smaller, and give Solid bets your bigger stakes.</p>

function trData(s){
  if (LANG!=="sv" || !s) return s;
  const whole = SV_WORDS[s.toLowerCase().trim()]; if (whole) return whole;
  // longest phrases first ("upper body" before "upper"), then join the parts as a Swedish list
  let out = " " + s.toLowerCase().replace(/[-_]/g," ") + " ";
  const keys = Object.keys(SV_WORDS).sort((a,b)=>b.length-a.length);
  const parts = [];
  for (const k of keys){
    const re = new RegExp("\\s" + k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + "(?=\\s)", "g");
    out = out.replace(re, m => { parts.push(SV_WORDS[k]); return " \u0001" + (parts.length-1) + " "; });
  }
  out = out.trim().split(/\s+/).map(w => w.startsWith("\u0001") ? parts[+w.slice(1)] : w).join(" ");
  const words = out.split(" ").map(w=>w.toLowerCase()), items = [];
  for (let i=0;i<words.length;i++){   // "vänster" + "knä" -> "vänster knä"
    if (/^(vänster|höger|nedre|övre)$/.test(words[i]) && i+1<words.length){ items.push(words[i]+" "+words[i+1]); i++; }

}

  if (r.flag==="due") out.push(`<span class="pill s-due" title="${esc(t("tip_due"))}">${t("pill_due")}</span>`);
  if (r.flag==="hot") out.push(`<span class="pill s-hot" title="${esc(t("tip_hot"))}">${t("pill_hot")}</span>`);
  if (d.found && d.p!=null && d.p<0.15 && d.shots>=8) out.push(`<span class="pill s-dry" title="${esc(t("tip_dry",{n:d.shots,p:pct(d.p),x:Math.max(2,Math.round(1/d.p))}))}">${t("pill_dry",{n:d.shots})}</span>`);
  return out.concat(roleTags(p)).join(" ");
}
function roleTags(p){
  const out = [], r = p.role, tags = p.role_tags || [];
  const big = r && Math.abs(r.toi_delta) >= 3 && Math.abs(r.toi_delta) / (r.toi_base||99) >= 0.18;
  if (big && r.toi_delta > 0) out.push(`<span class="pill s-up" title="${esc(t("tip_toi_up",{a:fmt(r.toi5,1),b:fmt(r.toi_base,1)}))}">▲ ${t("pill_toi")} +${fmt(r.toi_delta,1)}</span>`);
  if (big && r.toi_delta < 0) out.push(`<span class="pill s-down" title="${esc(t("tip_toi_down",{a:fmt(r.toi5,1),b:fmt(r.toi_base,1)}))}">▼ ${t("pill_toi")} ${fmt(r.toi_delta,1)}</span>`);
  const T = {pp1_new:["s-up","pill_pp1_new","tip_pp1_new"], pp1_lost:["s-down","pill_pp1_lost","tip_pp1_lost"],
             line_up:["s-up","pill_line_up","tip_line_up"], line_down:["s-down","pill_line_down","tip_line_down"]};
  tags.forEach(k => { const x = T[k]; if (x) out.push(`<span class="pill ${x[0]}" title="${esc(t(x[2]))}">${t(x[1])}</span>`); });
  return out;
}
const isReg = p => p.regress.flag || (p.drought.found && p.drought.p<0.15 && p.drought.shots>=8);

function h2hBlock(g){

  const hw = games.filter(x=>x.hg>x.ag).length, aw = games.length - hw;

// ------------------------------------------------------------ lines: tonight's lines side by side, projection and form together
// P(X <= k) for a Poisson count with mean lam
function poisCdf(k, lam){ if (k < 0) return 0; let term = Math.exp(-lam), c = term; for (let i = 1; i <= k; i++){ term *= lam / i; c += term; } return Math.min(1, c); }
// luck flags only when a gap that big would happen by chance less than 1 time in 10, and it's 2+ goals;
// chance flags (xG% 60%+ / 40%-) once there are at least 4 expected goals combined
function lineFlags(L){
  const xgp = L.xgf + L.xga > 0 ? L.xgf / (L.xgf + L.xga) : null;
  const tag = (cls, key, tipKey, g, x, p) => `<span class="pill ${cls} tip" tabindex="0" data-tip="${esc(t(tipKey,{g, x:fmt(x,1), p:Math.max(1, Math.round(p*100))}))}">${t(key)}</span> `;
  const lo = (k, lam) => poisCdf(k, lam), hi = (k, lam) => 1 - poisCdf(k - 1, lam);
  let form = "";
  if (L.xgf - L.gf >= 2 && lo(L.gf, L.xgf) < 0.10) form += tag("s-dry", "ln_cold", "ln_cold_tip", L.gf, L.xgf, lo(L.gf, L.xgf));
  else if (L.gf - L.xgf >= 2 && hi(L.gf, L.xgf) < 0.10) form += tag("s-hot", "ln_hot", "ln_hot_tip", L.gf, L.xgf, hi(L.gf, L.xgf));
  if (L.ga - L.xga >= 2 && hi(L.ga, L.xga) < 0.10) form += tag("s-dry", "ln_gah", "ln_gah_tip", L.ga, L.xga, hi(L.ga, L.xga));
  else if (L.xga - L.ga >= 2 && lo(L.ga, L.xga) < 0.10) form += tag("s-hot", "ln_gal", "ln_gal_tip", L.ga, L.xga, lo(L.ga, L.xga));
  if (xgp != null && L.xgf + L.xga >= 4 && xgp >= 0.6) form += tag("s-up", "ln_up", "ln_up_tip", pct(xgp), 0, 0);
  else if (xgp != null && L.xgf + L.xga >= 4 && xgp <= 0.4) form += tag("s-down", "ln_down", "ln_down_tip", pct(xgp), 0, 0);
  return form;
}
function lineCard(g, team, key){
  const lu = DATA.teams[team]?.lineup || {}, ids = (lu.groups || {})[key] || [];
  if (!ids.length) return `<div class="lncard empty"><span class="meta">–</span></div>`;
  const props = ids.map(id => g.props.find(pr => String(pr.id) === String(id))).filter(Boolean);
  const pp = /^pp/.test(key);

const relLum = c => { const f = v => { v /= 255; return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); }; const [r,g,b] = c.map(f); return 0.2126*r + 0.7152*g + 0.0722*b; };

const rgbHsl = ([r,g,b]) => { r/=255; g/=255; b/=255; const mx = Math.max(r,g,b), mn = Math.min(r,g,b), l = (mx+mn)/2; let h = 0, s_ = 0;

// bring an opened player (his row and the breakdown under it) into view: just below the sticky header, smoothly,
// and only as far as needed; a short glow shows which row it is
function revealPlayer(id, opts={}){
  const run = () => {
    const row = document.querySelector(`tr.row[data-id="${id}"]`); if (!row) return;
    const det = row.nextElementSibling && row.nextElementSibling.querySelector(".detail") ? row.nextElementSibling : null;
    const hdr = document.querySelector("header"), hs = hdr && ["sticky","fixed"].includes(getComputedStyle(hdr).position) ? hdr.getBoundingClientRect().bottom : 0;
    const bnav = document.querySelector("nav"), bh = bnav && getComputedStyle(bnav).position === "fixed" ? bnav.offsetHeight : 0;
    const top = row.getBoundingClientRect().top, bottom = (det || row).getBoundingClientRect().bottom;
    const viewTop = hs + 10, viewBottom = innerHeight - bh - 10;
    const fits = top >= viewTop && bottom <= viewBottom;
    if (!fits || opts.force){
      // the breakdown is taller than the screen, or partly hidden: put the player's row at the top of the view
      const y = scrollY + top - viewTop;
      const smooth = !matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (smooth && Math.abs(y - scrollY) > innerHeight * 2.5) window.scrollTo({top: y - innerHeight * 0.6 * Math.sign(y - scrollY), behavior: "instant"});
      window.scrollTo({top: Math.max(0, y), behavior: smooth ? "smooth" : "auto"});
    }
    row.classList.remove("reveal"); void row.offsetWidth; row.classList.add("reveal");
    setTimeout(() => row.classList.remove("reveal"), 1600);
  };
  requestAnimationFrame(() => requestAnimationFrame(run));
}

// league tier for a shot-profile number: elite (top 10%), good (top 10-35%), average (middle 30%), below (bottom 35%)
function shotTier(metric, v, posg, enough){
  const Q = DATA.league?.shot_tiers?.[posg]?.[metric]; if (!Q || v==null || isNaN(v)) return null;
  if (!enough) return {cls:"t-small", lab:t("tier_small")};
  let pc = 0; for (let i=0;i<Q.length;i++){ if (v >= Q[i]) pc = (i+1)*5; }
  if (pc > 5 && pc < 95) { const i = pc/5 - 1, lo = Q[i], hi = Q[i+1]; if (hi > lo) pc += Math.min(4.9, 5*(v-lo)/(hi-lo)); }
  else if (pc === 0 && v < Q[0]) pc = 2; else if (pc >= 95) pc = 97;
  pc = Math.round(pc);
  const cls = pc>=90 ? "t-elite" : pc>=65 ? "t-good" : pc>=35 ? "t-avg" : "t-low";
  const posTxt = t(posg==="D" ? "tier_d" : "tier_f");
  const rank = pc>=50 ? t("tier_top",{p:Math.max(1,100-pc), pos:posTxt}) : t("tier_bottom",{p:Math.max(1,pc), pos:posTxt});
  return {cls, lab:t(cls.replace("t-","tier_")), rank};

const tierPill = tr => tr ? `<span class="tier ${tr.cls}">${tr.lab}${tr.rank?` <i>· ${tr.rank}</i>`:""}</span>` : "";

function scoreGrid(g){
  const mu = gameMu(g), N = 16, CAP = 6;
  const J = regJoint(mu.h, mu.a, N);
  const share = (mu.h+mu.a)>0 ? mu.h/(mu.h+mu.a) : 0.5;
  const F = Array.from({length:CAP+1}, ()=>new Array(CAP+1).fill(0));   // F[away][home], final score incl. OT/SO
  const add = (a,h,p) => { F[Math.min(a,CAP)][Math.min(h,CAP)] += p; };
  for (let a=0;a<N;a++) for (let h=0;h<N;h++){ const p = J[h][a];
    if (a===h){ add(a, h+1, p*share); add(a+1, h, p*(1-share)); } else add(a, h, p); }
  const cells = []; F.forEach((row,a)=>row.forEach((p,h)=>cells.push({a,h,p})));
  const top = cells.slice().sort((x,y)=>y.p-x.p).slice(0,3);
  const rank = new Map(top.map((c,i)=>[c.a+"-"+c.h, i+1]));
  const max = top[0].p;
  const lab = n => n===CAP ? CAP+"+" : String(n);
  const rowSum = F.map(r=>r.reduce((x,y)=>x+y,0)), colSum = F[0].map((_,h)=>F.reduce((x,r)=>x+r[h],0));
  const head = `<tr><th class="sgc"></th>${F[0].map((_,h)=>`<th>${lab(h)}</th>`).join("")}<th class="sgm">%</th></tr>`;
  const body = F.map((row,a)=>`<tr><th>${lab(a)}</th>${row.map((p,h)=>{ const r = rank.get(a+"-"+h); const al = Math.min(1,p/max);
      if (a===h && a<CAP) return `<td class="tie" title="${t("sc_tie")}">–</td>`;
      return `<td class="${r?"top":""}" ${r?`data-r="${r}"`:""} style="background:rgba(var(--heat),${(0.04+0.6*al*al).toFixed(3)})" title="${g.away} ${lab(a)} – ${lab(h)} ${g.home}: ${pct(p,1)}"><div class="sgv">${r?`<span class="sgb">${r}</span>`:""}${pct(p,p<0.1?1:0)}</div></td>`; }).join("")}<td class="sgm">${pct(rowSum[a])}</td></tr>`).join("");
  const foot = `<tr><th class="sgm">%</th>${colSum.map(p=>`<td class="sgm">${pct(p)}</td>`).join("")}<td></td></tr>`;
  const topTxt = top.map((c,i)=>`<span class="sgt"><i>${i+1}</i> ${g.away} ${lab(c.a)} – ${lab(c.h)} ${g.home} <b>${pct(c.p,1)}</b></span>`).join("");
  return `<div class="box sgbox"><h4>${t("sc_title")} <span class="meta">${t("sc_sub")}</span></h4>
    <div class="sgtop">${topTxt}</div>
    <div class="sgwrap"><div class="sgaxis-h">${logo(g.home,18)} ${t("sc_goals",{t:g.home})} →</div>
      <div class="sgrow"><div class="sgaxis-v">${logo(g.away,18)} ${t("sc_goals",{t:g.away})} ↓</div>
      <div class="tablewrap"><table class="sg"><thead>${head}</thead><tbody>${body}${foot}</tbody></table></div></div></div>
    <p class="note">${t("sc_note",{ta:g.away, th:g.home})}</p></div>`;
}

const cmpStat = m => m==="fg"||m==="g"||m==="g2"||m==="g3" ? "g" : m==="a"||m==="a2" ? "a" : m==="pt"||m==="pt2"||m==="pt3" ? "p"

const cmpLine = m => ({g:.5,a:.5,pt:.5,fg:.5,g2:1.5,a2:1.5,pt2:1.5,g3:2.5,pt3:2.5,ppp:.5,"pim0.5":.5,"pim2.5":2.5})[m] ?? parseFloat(m.replace(/^[a-z]+/,""));
const cmpVal = (x, st) => st==="p" ? (x.g||0)+(x.a||0) : (x[st]||0);
const cmpOver = (x, m) => m==="fg" ? x.g>=1 : hitGame(x, m);
function cmpExp(pr, g, m){

  return st==="g" ? l.g : st==="a" ? l.a : st==="p" ? l.g + l.a : st==="s" ? l.s : st==="hit" ? pr.base.hit : st==="blk" ? pr.base.blk : st==="pp" ? pr.base.ppp : st==="pm" ? pr.base.pen : null;

const cmpXLabel = m => t("cmp_x_" + (m.startsWith("fo") ? "fo" : cmpStat(m)));
function cmpHits(x, m){
  // [hits, games] for L5, L10, L20, this season and vs tonight's opponent; null where we have no record
  const p = x.p, pr = x.pr, mk = m==="fg" ? "g" : m, H = p.hr?.[mk];
  const out = {L5:null, L10:null, L20:null, S:null, V:null};
  if (noHistory(m) && m!=="fg") return out;

    out.L5 = n[0] ? [H[0], n[0]] : null; out.L10 = n[1] ? [H[1], n[1]] : null;

  else { const gs = lastGames(p, m).slice(0,10);
    const c = k => { const s = gs.slice(0,k); return s.length ? [s.filter(y=>cmpOver(y,m)).length, s.length] : null; };
    out.L5 = c(5); out.L10 = c(10); }
  if (pr.hv?.n && pr.hv[mk] != null) out.V = [pr.hv[mk], pr.hv.n];

}
function cmpMiniChart(x, m, ymax, i){

// plain-language read of the comparison, built from fixed rules on the same numbers (no AI, no invented facts)
function cmpQuick(items, m, pv, ev, od, hits){
  const nm = i => `<b style="color:${CMP_COL(i)}">${esc(shortName(items[i].p.name))}</b>`;
  const gpC = i => items[i].p.windows?.career?.gp || 0;
  const trust = i => Math.min(1, (gpC(i) + 10) / 60);
  const idx = items.map((_, i) => i).filter(i => pv[i] != null);
  if (idx.length < 2) return "";
  const L = [];
  // 1. chance
  const iP = idx.reduce((a, b) => pv[b] > pv[a] ? b : a);
  const second = idx.filter(i => i !== iP).reduce((a, b) => pv[b] > pv[a] ? b : a);
  const close = pv[iP] - pv[second] < 0.015;
  L.push(t(close ? "qr_close" : "qr_top", {a: nm(iP), p: pct(pv[iP], 1), b: nm(second), q: pct(pv[second], 1)})
    + (gpC(iP) < 50 ? " " + t("qr_short", {n: gpC(iP)}) : ""));
  // 2. value at the odds
  const withOdds = idx.filter(i => ev[i] != null);
  if (withOdds.length){
    const iE = withOdds.reduce((a, b) => ev[b] > ev[a] ? b : a);
    if (ev[iE] > 0.02) L.push(t("qr_value", {a: nm(iE), e: evTxt(ev[iE]), o: oddsTxt(od[iE])}));
    else L.push(t("qr_novalue"));
  }
  // 3. role
  const toi = i => items[i].p.toi_proj || 0;
  const iR = idx.reduce((a, b) => toi(b) > toi(a) ? b : a);
  if (idx.every(i => i === iR || toi(iR) - toi(i) >= 1)){
    const M = items[iR].p.mates || {}; const role = [M.line?.toUpperCase(), M.pp?.toUpperCase()].filter(Boolean).join(", ");
    L.push(t(items.every(x => isToday(x.g.ld)) ? "qr_role" : "qr_role_g", {a: nm(iR), m: fmt(toi(iR), 1), r: role ? ` (${role})` : ""}));
  }
  // 4. one flag per player that changes how to read his number
  const flags = [], gk = new Set();
  idx.forEach(i => { const x = items[i], rg = x.p.regress || {}, gvx = rg.g != null ? rg.g - rg.exp : 0, h = hits[i]?.L10;
    if (x.p.injury?.kind === "questionable") flags.push(t("qr_inj", {a: nm(i)}));
    else if (gvx >= 2.5) flags.push(t("qr_lucky", {a: nm(i), v: fmt(gvx, 1)}));
    else if (gvx <= -2.5) flags.push(t("qr_unlucky", {a: nm(i), v: fmt(-gvx, 1)}));
    else if (h && h[1] >= 8 && h[0] / h[1] >= 0.7) flags.push(t("qr_form", {a: nm(i), h: h[0], n: h[1]}));
    const st = (x.g.starter_status?.[x.pr.opp] || "").toLowerCase();
    if (/^(g|a|pt|fg|g2|g3|a2|pt2|pt3|ppp)$/.test(m) && st && (!st.includes("confirmed") || st.includes("unconfirmed"))) gk.add(x.pr.opp);
  });
  L.push(...flags.slice(0, 3));
  if (gk.size) L.push(t(gk.size > 1 ? "qr_gks" : "qr_gk", {t: [...gk].join(LANG === "sv" ? " och " : " and ")}));
  // 5. bottom line, on one scale: with prices, the trust-adjusted edge decides (a positive edge always beats a player
  // with no price yet); without prices, the trust-adjusted chance decides
  const se = i => ev[i] * trust(i), sp = i => pv[i] * (0.85 + 0.15 * trust(i));
  const priced = idx.filter(i => ev[i] != null).sort((a, b) => se(b) - se(a)), unpriced = idx.filter(i => ev[i] == null).sort((a, b) => sp(b) - sp(a));
  let a0, a1, tight = false;
  if (priced.length && se(priced[0]) > 0){
    a0 = priced[0]; a1 = priced[1] ?? unpriced[0];
    tight = priced.length > 1 && se(a0) - se(priced[1]) < 0.03;
    L.push(t(tight ? "qr_bl_tight" : "qr_bl", {a: nm(a0), b: nm(a1)}));
  } else if (priced.length === idx.length) { a0 = priced[0]; L.push(t("qr_bl_none")); }
  else {
    a0 = unpriced[0]; a1 = unpriced[1] ?? priced[0];
    tight = unpriced.length > 1 && sp(a0) - sp(unpriced[1]) < 0.012;
    L.push(t(tight ? "qr_bl_tight" : (priced.length ? "qr_bl_noodds" : "qr_bl"), {a: nm(a0), b: nm(a1)}));
  }
  const miss = pv[a0] > 0 && pv[a0] < 0.5 ? Math.round((1 - pv[a0]) / pv[a0]) : 0;
  return `<div class="cmquick"><h5>${t("qr_title")}</h5><ul>${L.map(x => `<li>${x}</li>`).join("")}</ul>
    <p class="meta">${miss >= 2 ? t("qr_reminder", {p: pct(pv[a0], 0), n: miss, k: miss + 1}) + " " : ""}${t("qr_note")}</p></div>`;
}

  // summary

  const sum = [iP>=0 ? `<span><small>${t("cmp_best_p")}</small><b style="color:${CMP_COL(iP)}">${esc(shortName(items[iP].p.name))}</b> ${pct(pv[iP],0)}</span>` : "",
    iE>=0 && ev[iE]>0 ? `<span><small>${t("cmp_best_ev")}</small><b style="color:${CMP_COL(iE)}">${esc(shortName(items[iE].p.name))}</b> ${evTxt(ev[iE])}</span>` : "",
    iH>=0 ? `<span><small>${t("cmp_best_hr")}</small><b style="color:${CMP_COL(iH)}">${esc(shortName(items[iH].p.name))}</b> ${hits[iH].L10[0]}/${hits[iH].L10[1]}</span>` : ""].filter(Boolean).join("");
  // header cards
  const head = `<div class="cr chead"><div class="cl"></div>${items.map((x,i)=>{ const g = x.g, opp = x.pr.opp;
    return `<div class="cv" style="--pc:${CMP_COL(i)}"><div class="chc"><button type="button" class="chx" data-cx="${g.id}|${x.pr.id}" aria-label="${t("cmp_remove")}">×</button>

    row(t("cmp_fair"), pv.map(v => v ? oddsTxt(1/v) : "–"), -1),
    row(t("cmp_mkt"), bk.map(b => b?.o ? `<b>${oddsTxt(b.o)}</b>${noVig(b)!=null?` <span class="meta">${pct(noVig(b),0)}</span>`:""}` : `<span class="meta">–</span>`), -1),
    row(t("h_yours"), items.map((x,i) => ok[i] ? `<input class="odds codds" data-g="${x.g.id}" data-pid="${x.pr.id}" placeholder="${bk[i]?.o?oddsTxt(bk[i].o):t("odds_ph")}" value="${uo[i]!=null?oddsTxt(uo[i]):""}" inputmode="decimal">` : ""), -1),
    row("EV", ev.map(e => e==null ? `<span class="meta">–</span>` : `<b class="${e>0?"ev-pos":"ev-neg"}">${evTxt(e)}</b>`), best(ev)),
    row(cmpXLabel(m), exps.map(v => v==null ? "–" : fmt(v, v < 1 ? 2 : 1)), best(exps.map(v => v==null ? null : Math.round(v*100)))),
    row(t("toi"), items.map(x => fmt(x.p.toi_proj,1)), best(items.map(x => x.p.toi_proj!=null ? Math.round(x.p.toi_proj*10) : null))),
    row(t("cmp_role"), items.map(role), -1),
    row(t("k_og"), items.map(ogName), -1),
    row(t("cmp_opp_"+opKey), ops.map(o => o ? `${fmt(o.v, o.k==="s"?1:2)} ${rkTxt(o.r)}` : "–"), best(ops.map(o => o ? -o.r : null))),
  ].join("");
  // last 10 charts (same scale for everyone)
  const st = cmpStat(m);
  const ymax = st ? Math.max(cmpLine(m) + 1, ...items.flatMap(x => lastGames(x.p, m).slice(0,10).map(g_ => cmpVal(g_, st)))) : 1;
  const charts = items.map((x,i) => { const h = hits[i].L10;
    return `<div class="cmc" style="--pc:${CMP_COL(i)}"><div class="cmh"><i></i><b>${esc(shortName(x.p.name))}</b>${h?`<span class="${h[0]/h[1]>=0.6?"hr-hi":h[0]/h[1]<=0.4?"hr-lo":""}">${t("cmp_over",{h:h[0], n:h[1]})}</span>`:""}</div>${cmpMiniChart(x, m, ymax, i)}</div>`; }).join("");
  // hit rates
  const hrows = [["L5","L5"],["L10","L10"],["L20","L20"],["S",t("hr_season")],["V",t(items.every(x => isToday(x.g.ld)) ? "cmp_vs" : "cmp_vs_g")]]
    .filter(([k]) => hits.some(h => h[k]))

  // season numbers
  const W_ = x => x.p.windows?.cur || {}, X_ = x => x.p.x || {};
  const hbAvg = (x, k) => { const gs = (x.p.hb_games||[]).slice(0,10); return gs.length ? gs.reduce((a,g_)=>a+(g_[k]||0),0)/gs.length : null; };
  const streak = x => { const s = x.p.streaks || {}, d = x.p.drought || {};
    if ((s.ps||0) >= 3) return `<span class="up">${t("cmp_ps",{n:s.ps})}</span>`;
    if ((s.gst||0) >= 2) return `<span class="up">${t("cmp_gs",{n:s.gst})}</span>`;
    if ((s.pd||0) >= 3) return `<span class="down">${t("cmp_pd",{n:s.pd})}</span>`;

    return `<span class="meta">–</span>`; };
  const num = (arr, d) => arr.map(v => v==null || isNaN(v) ? "–" : fmt(v, d));
  const S = [
    [t("cmp_gp"), items.map(x => W_(x).gp ?? null), 0, true],

    [t("cmp_apg"), items.map(x => W_(x).a_pg ?? null), 2],
    [t("cmp_ppg"), items.map(x => W_(x).p_pg ?? null), 2],
    [t("cmp_spg"), items.map(x => W_(x).s_pg ?? null), 2],
    [t("cmp_sh"), items.map(x => x.p.regress?.sh ?? null), "%"],
    [t("cmp_gvx"), items.map(x => x.p.regress ? x.p.regress.g - x.p.regress.exp : null), "+"],
    [t("cmp_toi"), items.map(x => x.p.toi_season ?? null), 1],
    [t("cmp_ppmin"), items.map(x => X_(x).pp?.min_pg ?? null), 1],
    [t("cmp_ppp"), items.map(x => X_(x).pp?.ppp ?? null), 0],
    [t("cmp_ppsh"), items.map(x => { const q = X_(x).pp; return q && q.pts > 0 ? Math.min(1, q.ppp / q.pts) : null; }), "%", true],
    [t("cmp_hpg"), items.map(x => hbAvg(x, "hit")), 1],
    [t("cmp_bpg"), items.map(x => hbAvg(x, "blk")), 1],
    [t("cmp_fo"), items.map(x => (X_(x).fo?.taken||0) >= 20 ? X_(x).fo.pct_cur : null), "%"],
    [t("cmp_pim"), items.map(x => X_(x).pim?.cur ?? null), 0, true],
  ].filter(([,v]) => v.some(a => a!=null)).map(([lbl, v, d, nob]) => row(lbl,
    d==="%" ? v.map(a => a==null ? "–" : pct(a,1)) : d==="+" ? v.map(a => a==null ? "–" : `<span class="${a>0.5?"up":a<-0.5?"down":""}">${a>0?"+":""}${fmt(a,1)}</span>`) : num(v, d),
    nob || d==="+" ? -1 : best(v.map(a => a==null ? null : d==="%" ? Math.round(a*1000) : Math.round(a*Math.pow(10,d)))))).join("") + row(t("cmp_streak"), items.map(streak), -1);

  const mg = mGroup(m);

  box.innerHTML = `<div class="cmtop"><h3>${t("cmp_title")}</h3><span class="meta">${mName(m)}</span><button type="button" class="cmclose" data-close aria-label="${t("cmp_close")}">×</button></div>
    ${picker}
    <div class="cmscroll">
      ${cmpQuick(items, m, pv, ev, od, hits)}
      ${sum ? `<div class="cmsum">${sum}</div>` : ""}

    const g_ = e.target.closest("[data-cmg]"); if (g_){ const G_ = MGROUPS[g_.dataset.cmg]; state.cmpM = GROUP_DEFAULT[g_.dataset.cmg] || G_[Math.min(1, G_.length-1)]; cmpRender(); return; }
    const k = e.target.closest("[data-cmk]"); if (k){ state.cmpM = k.dataset.cmk; cmpRender(); return; }
    const x = e.target.closest("[data-cx]"); if (x){ const [gg,p] = x.dataset.cx.split("|"); cmpToggle(gg,p); }
  };
  box.onchange = e => { const i = e.target.closest("input.codds"); if (!i) return; const v = parseOdds(i.value) ?? NaN;
    store.set(oddsKey(i.dataset.g, i.dataset.pid, state.cmpM), isNaN(v) ? "" : v); cmpRender(); };
}

const MKT_NAME = k => ({"Goal":t("m_g"),"Assist":t("m_a"),"Point":t("m_pt"),"2+ goals":t("m_g2"),"2+ assists":t("m_a2"),"2+ points":t("m_pt2")})[k] || k.replace(/^Over (\d)\.5 SOG$/, (_,n)=>t("m_sog",{n:+n+1})).replace(/^Over (\d)\.5 hits$/, (_,n)=>t("m_hit",{n:+n+1})).replace(/^Over (\d)\.5 blocks$/, (_,n)=>t("m_blk",{n:+n+1}));
const MKT_NAME2 = k => ({"Team shots":t("tr_sh_team"),"Total shots":t("tr_sh_total"),"Goalie saves":t("tr_sh_saves")})[k] || MKT_NAME(k);
function calibChart(s){
  if (!s || !s.bins?.length) return "";
  const W=260, Hh=180, pad=28, X=v=>pad+v*(W-pad-8), Y=v=>Hh-pad-v*(Hh-pad-8);
  const mx = Math.min(1, Math.max(0.5, ...s.bins.map(b=>Math.max(b.pred,b.actual)))+0.05), sc = v=>Math.min(v,mx)/mx;
  return `<svg viewBox="0 0 ${W} ${Hh}" width="100%" style="max-width:320px">
    <line x1="${X(0)}" y1="${Y(0)}" x2="${X(1)}" y2="${Y(1)}" stroke="var(--mute)" stroke-dasharray="4 4"/>
    <line x1="${X(0)}" y1="${Y(0)}" x2="${X(1)}" y2="${Y(0)}" stroke="var(--line)"/><line x1="${X(0)}" y1="${Y(0)}" x2="${X(0)}" y2="${Y(1)}" stroke="var(--line)"/>
    <text x="${X(1)}" y="${Hh-8}" fill="var(--mute)" font-size="10" text-anchor="end">${t("predicted")} → ${pct(mx)}</text>
    <text x="4" y="12" fill="var(--mute)" font-size="10">${t("actual")}</text>
    ${s.bins.map(b=>`<circle cx="${X(sc(b.pred))}" cy="${Y(sc(b.actual))}" r="${Math.min(9,3+Math.sqrt(b.n)/3)}" fill="var(--accent)" fill-opacity=".75"><title>${t("predicted")} ${pct(b.pred,1)} · ${t("actual")} ${pct(b.actual,1)} · n=${b.n}</title></circle>`).join("")}</svg>`;
}

      ${Object.entries(T.bets).filter(([,b])=>b).map(([k,b])=>`<tr><td>${esc(MKT_NAME(k))}</td><td class="n num">${b.n}</td><td class="n num">${b.won}</td><td class="n num ${b.profit>0?"ev-pos":"ev-neg"}">${b.profit>0?"+":""}${b.profit.toFixed(2)}</td><td class="n num ${b.roi>0?"ev-pos":"ev-neg"}">${(b.roi*100).toFixed(1)}%</td></tr>`).join("")}</tbody></table></div>` : ""}
    <div class="dgrid" style="margin-top:14px">${Object.entries(T.props).filter(([,s])=>s).map(([k,s])=>`<div class="box"><h4>${t("tr_calib",{k:MKT_NAME(k)})}</h4>${calibChart(s)}<p class="note">${t("tr_calib_note")}</p></div>`).join("")}${blends}</div>`;
}

    .catch(() => null).then(js => { BPREC = js; BPREC_LOADING = null; return js; });

}
const RK = () => (state.rk = state.rk || {k:"all", per:"all", at:null, mk:"all", tb:"best", pb:"best"});
const isoWeekStart = d => { const x = new Date(d+"T12:00:00"); const wd = (x.getDay()+6)%7; x.setDate(x.getDate()-wd); return x.toISOString().slice(0,10); };
const periodKey = (d, per) => per==="month" ? d.slice(0,7) : per==="week" ? isoWeekStart(d) : per==="day" ? d : "all";
function periodLabel(key, per){
  if (per==="month") return new Date(key+"-15T12:00:00").toLocaleDateString(LOCALE(),{month:"long",year:"numeric"});
  if (per==="week"){ const a = new Date(key+"T12:00:00"), b = new Date(a); b.setDate(b.getDate()+6);
    const f = x => x.toLocaleDateString(LOCALE(),{day:"numeric",month:"short"}); return `${f(a)} – ${f(b)}`; }
  if (per==="day") return new Date(key+"T12:00:00").toLocaleDateString(LOCALE(),{weekday:"short",day:"numeric",month:"short"});
  return "";
}
function rkStats(rows){
  const done = rows.filter(r => r.r==="w" || r.r==="l"), w = done.filter(r=>r.r==="w").length, v = rows.filter(r=>r.r==="v").length;
  const u = done.reduce((a,r)=>a+r.u,0), clvR = done.concat(rows.filter(r=>r.r==="p"));
  return {n: done.length, w, l: done.length-w, v, u, roi: done.length ? u/done.length : null,
    odds: done.length ? done.reduce((a,r)=>a+r.od,0)/done.length : null, ev: done.length ? done.reduce((a,r)=>a+r.ev,0)/done.length : null,
    exp: done.reduce((a,r)=>a+r.p,0), clv: clvR.length ? clvR.reduce((a,r)=>a+(r.clv||0),0)/clvR.length : null,
    clvUp: clvR.length ? clvR.filter(r=>(r.clv||0)>0.001).length/clvR.length : null};
}
const sgnU = (x, d=2) => x==null ? "–" : (x>0?"+":x<0?"−":"") + Math.abs(x).toFixed(d);
const sgnP = (x, d=1) => x==null ? "–" : (x>0?"+":x<0?"−":"") + Math.abs(x*100).toFixed(d) + "%";
const uCls = x => x>0.0001 ? "up" : x<-0.0001 ? "dn" : "";

function rkProfitChart(rows){
  const days = [...new Set(rows.map(r=>r.d))].sort();
  if (!days.length) return "";
  let cum = 0;
  const pts = days.map(d => { const rs = rows.filter(r=>r.d===d && (r.r==="w"||r.r==="l")); const u = rs.reduce((a,r)=>a+r.u,0);
    cum += u; return {d, u, cum, n: rs.length, w: rs.filter(r=>r.r==="w").length}; });
  const narrow = innerWidth < 640, W = narrow ? 440 : 920, H = narrow ? 250 : 280, L = narrow ? 36 : 44, R = narrow ? 52 : 64, T = 18, B = 34, iw = W-L-R, ih = H-T-B;
  const vals = pts.flatMap(p=>[p.u, p.cum, 0]); let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = Math.max(1, (hi-lo)*0.12); lo -= pad; hi += pad;
  const Y = v => T + ih*(hi-v)/(hi-lo), step = iw/pts.length, X = i => L + step*(i+0.5), bw = Math.min(22, step*0.42), y0 = Y(0);
  const tick = (() => { const r = hi-lo, s = r>40?10:r>16?5:r>8?2:1; const out=[]; for (let v=Math.ceil(lo/s)*s; v<=hi; v+=s) out.push(v); return out; })();
  const grid = tick.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" class="${v===0?"z":""}"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${v>0?"+":""}${v}</text>`).join("");
  const k = Math.min(1, 30/pts.length);
  // daily bars: a soft gradient from the zero line out to a rounded tip, quieter than the running total
  const bars = pts.map((p,i)=>{ const y1 = Y(p.u), h = Math.max(2, Math.abs(y1-y0)), x = X(i)-bw/2, r = Math.min(4, bw/3, h/2), pos = p.u >= 0;
    const d = pos ? `M${x},${y0} V${y0-h+r} Q${x},${y0-h} ${x+r},${y0-h} H${x+bw-r} Q${x+bw},${y0-h} ${x+bw},${y0-h+r} V${y0} Z`
                  : `M${x},${y0} V${y0+h-r} Q${x},${y0+h} ${x+r},${y0+h} H${x+bw-r} Q${x+bw},${y0+h} ${x+bw},${y0+h-r} V${y0} Z`;
    return `<path class="rkb ${pos?"pos":"neg"}" d="${d}" fill="url(#${pos?"rkBp":"rkBn"})" style="animation-delay:${(i*k*0.035).toFixed(3)}s"/>`; }).join("");
  // smooth running total (monotone cubic: never overshoots a day's value)
  const P = pts.map((p,i)=>[X(i), Y(p.cum)]), n = P.length;
  const sl = P.map((_, i) => { if (i === 0 || i === n-1) return 0; const a = (P[i][1]-P[i-1][1])/(P[i][0]-P[i-1][0]), b = (P[i+1][1]-P[i][1])/(P[i+1][0]-P[i][0]); return a*b <= 0 ? 0 : 2/(1/a+1/b); });
  let dpath = `M${P[0][0]},${P[0][1]}`;
  for (let i=1;i<n;i++){ const [xa,ya]=P[i-1],[xb,yb]=P[i], dx=(xb-xa)/3; dpath += ` C${xa+dx},${ya+sl[i-1]*dx} ${xb-dx},${yb-sl[i]*dx} ${xb},${yb}`; }
  if (n === 1) dpath += ` L${P[0][0]+0.01},${P[0][1]}`;
  const area = `${dpath} L${P[n-1][0]},${y0} L${P[0][0]},${y0} Z`;
  const last = pts[n-1], up = last.cum >= 0, fz = Math.max(0, Math.min(1, (y0-T)/ih));
  const xl = pts.map((p,i)=> (pts.length<=(narrow?6:12) || i%Math.ceil(pts.length/(narrow?5:10))===0 || i===pts.length-1)
    ? `<text x="${X(i)}" y="${H-12}" text-anchor="middle">${new Date(p.d+"T12:00:00").toLocaleDateString(LOCALE(),{day:"numeric",month:"short"})}</text>` : "").join("");
  const dots = n <= 40 ? P.slice(0, -1).map((q, i) => `<circle class="dot ${pts[i].cum >= 0 ? "pos" : "neg"}" cx="${q[0]}" cy="${q[1]}" r="2.6" style="animation-delay:${(0.4 + i/n*1.2).toFixed(2)}s"/>`).join("") : "";
  const ex = P[n-1][0], ey = P[n-1][1], lbl = `${sgnU(last.cum,1)}u`, lw = lbl.length*6.6 + 14, ly = Math.max(T+2, Math.min(T+ih-18, ey + (up ? -26 : 10))), lx = Math.min(W-4-lw, ex+10);
  const hits = pts.map((p,i)=>`<rect class="hit" x="${L+step*i}" y="${T}" width="${step}" height="${ih}" data-rkt="${esc(JSON.stringify({d:p.d,u:p.u,c:p.cum,n:p.n,w:p.w}))}"/>`).join("");
  return `<div class="rkchart"><svg class="${narrow?"nar":""}" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(t("rk_chart"))}">
    <defs>
      <linearGradient id="rkBp" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="var(--hit)" stop-opacity=".16"/><stop offset="1" stop-color="var(--hit)" stop-opacity=".85"/></linearGradient>
      <linearGradient id="rkBn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--bad)" stop-opacity=".14"/><stop offset="1" stop-color="var(--bad)" stop-opacity=".78"/></linearGradient>
      <linearGradient id="rkLine" gradientUnits="userSpaceOnUse" x1="0" y1="${T}" x2="0" y2="${T+ih}"><stop offset="${fz}" stop-color="var(--line2)"/><stop offset="${fz}" stop-color="var(--bad)"/></linearGradient>
      <linearGradient id="rkArea" gradientUnits="userSpaceOnUse" x1="0" y1="${T}" x2="0" y2="${T+ih}"><stop offset="0" stop-color="var(--line2)" stop-opacity=".28"/><stop offset="${fz}" stop-color="var(--line2)" stop-opacity=".02"/><stop offset="${fz}" stop-color="var(--bad)" stop-opacity=".02"/><stop offset="1" stop-color="var(--bad)" stop-opacity=".24"/></linearGradient>
      <filter id="rkShadow" x="-5%" y="-20%" width="110%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="var(--line2)" flood-opacity=".25"/></filter></defs>
    <g class="grid">${grid}</g>${bars}
    <path class="area" d="${area}" fill="url(#rkArea)"/>
    <path class="cum" d="${dpath}" pathLength="1" stroke="url(#rkLine)" filter="url(#rkShadow)"/>${dots}
    <circle class="halo ${up?"pos":"neg"}" cx="${ex}" cy="${ey}" r="9"/><circle class="end ${up?"pos":"neg"}" cx="${ex}" cy="${ey}" r="4.5"/>
    <g class="endl ${up?"pos":"neg"}"><rect x="${lx}" y="${ly}" width="${lw}" height="18" rx="9"/><text x="${lx+lw/2}" y="${ly+12.5}" text-anchor="middle">${lbl}</text></g>
    <g class="xl">${xl}</g>${hits}<line class="hov" x1="0" x2="0" y1="${T}" y2="${T+ih}" style="opacity:0"/></svg><div class="rktip" hidden></div></div>`;
}
function rkBarRows(groups, label, max){
  return groups.map((x,i)=>{ const w = max ? Math.abs(x.s.u)/max*50 : 0;
    return `<div class="rkrow"><span class="rkn">${label(x)}</span><span class="rkc num">${x.s.w}–${x.s.l}</span>
      <span class="rkbar"><i class="${x.s.u>=0?"pos":"neg"}" style="width:${w.toFixed(1)}%;animation-delay:${Math.min(i,14)*0.04}s"></i></span>
      <span class="rku num ${uCls(x.s.u)}">${sgnU(x.s.u)}</span><span class="rkr num ${uCls(x.s.u)}">${sgnP(x.s.roi,0)}</span></div>`; }).join("");
}
function rkGroup(rows, keyOf){
  const m = new Map(); rows.forEach(r => { const k = keyOf(r); if (!m.has(k)) m.set(k, []); m.get(k).push(r); });
  return [...m.entries()].map(([k, rs]) => ({k, rs, s: rkStats(rs)})).filter(x => x.s.n > 0);
}
const RES_CHIP = r => `<span class="rkres ${r.r}">${r.r==="w"?"✓ ":r.r==="l"?"✗ ":""}${t("rk_"+r.r)}</span>`;

    </div>${st.clv!=null ? `<p class="rkmove"><span class="tip" tabindex="0" data-tip="${esc(t("rk_clv_tip"))}">${t("rk_clv")}</span>: <b class="${uCls(st.clv)}">${sgnP(st.clv)}</b> ${t("rk_move_avg")} · ${t("rk_clv_share",{p:pct(st.clvUp,0)})}</p>` : ""}`;

    <p class="note">${t("rk_note")}</p>`;
  rkCountUp(box);

function rkCountUp(root){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  root.querySelectorAll("[data-cu]").forEach(el => { const to = parseFloat(el.dataset.cu), t0 = performance.now(), dur = 900;
    const tick = now => { const k = Math.min(1, (now-t0)/dur), e = 1-Math.pow(1-k,3), v = to*e; el.textContent = sgnU(v); if (k<1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick); });
}
document.addEventListener("click", e => {

});

function lgOnePer(rows){

const HOW = {
en: `<h3>What the site does</h3>
  <p>For every skater in every upcoming game, the model estimates his chance to score a goal, get an assist, get a point, reach a number of shots on goal, and make a number of hits and blocked shots, plus multi-point games, power-play points, faceoffs won and penalties. For each game it also projects the score, the win chances, the total goals, the puck line, 1st-period goals, each team's shots on goal, the starting goalies' saves and shutout chances. Every number is shown next to the sportsbook odds, so you can see where the model and the market agree and where they don't. It's a tool to help you decide, not a tipster.</p>

  <h3>How a probability is built</h3>
  <p>Each player's chance starts from his real level: how much he plays, how many shots and chances he creates, and how well he finishes them over a long stretch, not just his last few games. A hot or cold run is mostly treated as noise until there's enough evidence that something has really changed.</p>
  <p>That level is then adjusted for tonight: the opponent's defence, the opposing goalie, home or away, back-to-backs, his current line and power-play role, and who is missing on both teams. Change the starting goalie on a game page and every probability updates straight away.</p>
  <p>Game projections use both teams' attack and defence, the goalies, and how often games really go to overtime, so ties and totals come out realistic.</p>

  <h3>Has it been tested?</h3>
  <p>Yes. Every market was replayed over thousands of past games, using only information that was available before each game.</p>
  <ul>
    <li><b>The percentages are honest.</b> Goals: predicted 15.5%, happened 15.4%. Points: 35.8% vs 35.2%.</li>
    <li><b>It beats a player's simple average</b> in every market: goals, assists, points, shots, hits and blocks.</li>
    <li><b>It keeps being checked.</b> Every prediction the site makes is graded after the game on the Track record page.</li>
  </ul>
  <p>A good probability isn't a sure thing. A 35% chance misses two times out of three, and a single game is mostly chance.</p>

  <h3>Always up to date</h3>
  <ul>

    <li><b>Goalie disagreements:</b> if the sources disagree on the starter and nobody has confirmed, he is marked <i>Not decided</i> and the alternative is shown, so you can switch and see the effect.</li>
    <li><b>Live scores:</b> games in progress show the score and period above the projection.</li>
    <li><b>Started games are locked:</b> once a game starts, its probabilities, odds and best picks stay as they were at puck drop.</li>

    <li><b>Game preview:</b> a short read on the game when one is written: the news, the streaks and records, and where the model and the market disagree.</li>
