<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NHL Props Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=Oxanium:wght@500;600;700;800&display=swap">
<style>
/* Layout: sticky top bar · games list (home) · game page with side picker · props grid */
:root{
  --bg:#0a0e13; --panel:#111821; --panel2:#17202b; --line:#22303f; --text:#e7eef6; --mute:#8796a8;
  --accent:#3ddc97; --accent2:#5aa9ff; --warn:#ffb547; --bad:#ff6b6b; --good:#3ddc97; --chip:#1b2533;
  --heat:61,220,151; --line2:#7ff3ff; --radius:12px; color-scheme:dark;
  --f-ui:"Exo 2",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f-disp:"Oxanium","Exo 2",-apple-system,"Segoe UI",sans-serif;
  --f-num:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]) .lg-d{display:none}
  :root:not([data-theme="dark"]) .lg-l{display:inline-block}
  :root:not([data-theme="dark"]){
    --bg:#f3f5f8; --panel:#ffffff; --panel2:#eef2f6; --line:#dbe2ea; --text:#111821; --mute:#5a697b;
    --accent:#0d9a60; --accent2:#1d6bd0; --warn:#a96400; --bad:#c42f2f; --good:#0d9a60; --chip:#e9eef4;
    --heat:13,154,96; --line2:#0aa3c2; color-scheme:light;
  }
}
:root[data-theme="light"] .lg-d{display:none}
:root[data-theme="light"] .lg-l{display:inline-block}
:root[data-theme="light"]{
    --bg:#f3f5f8; --panel:#ffffff; --panel2:#eef2f6; --line:#dbe2ea; --text:#111821; --mute:#5a697b;
    --accent:#0d9a60; --accent2:#1d6bd0; --warn:#a96400; --bad:#c42f2f; --good:#0d9a60; --chip:#e9eef4;
    --heat:13,154,96; --line2:#0aa3c2; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--f-ui)}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:14px;padding-block:12px;flex-wrap:wrap}
.brand{font-family:var(--f-disp);font-weight:800;font-size:19px;letter-spacing:.6px;cursor:pointer;text-transform:uppercase}
.brand b{color:var(--accent)}
.meta{color:var(--mute);font-size:12px}
.demo{background:var(--warn);color:#111;font-weight:700;border-radius:6px;padding:2px 8px;font-size:11px}
nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--mute);font-weight:600;padding:8px 12px;border-radius:8px;cursor:pointer}
nav button.on{color:var(--text);background:var(--panel2)}
main{padding-block:18px 64px}
h2{font-size:20px;margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--chip);color:var(--mute)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.s-confirmed{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.s-likely{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.s-out{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.s-q{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.s-due{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.s-hot{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.s-dry{background:color-mix(in srgb,var(--accent2) 16%,transparent);color:var(--accent2)}
.s-b2b{background:color-mix(in srgb,var(--accent2) 16%,transparent);color:var(--accent2)}
select,input[type=search],input.odds{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit}
input.odds{width:70px;padding:5px 7px;text-align:right;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;color:var(--mute);font-weight:650;padding:6px 12px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--accent);color:#03130c}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.toggle{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:13px;cursor:pointer}

/* ---------- games list */
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.day{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;cursor:pointer;text-align:left}
.day b{display:block;font-size:14px;font-family:var(--f-disp);letter-spacing:.5px;text-transform:uppercase}
.day span{font-size:11px;color:var(--mute)}
.day.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.glist{display:grid;gap:10px}
.grow{display:grid;grid-template-columns:72px 1fr 150px 1fr 170px;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;transition:border-color .15s}
.grow:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.gtime{font-family:var(--f-disp);font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.gtime small{display:block;color:var(--mute);font-weight:500;font-size:11px}
.gteam{display:flex;flex-direction:column;gap:3px;min-width:0}
.gteam.r{align-items:flex-end;text-align:right}
.abbr{font-family:var(--f-disp);font-size:22px;font-weight:800;letter-spacing:1px}
.tm{display:flex;align-items:center;gap:10px}
.gteam.r .tm{flex-direction:row-reverse}
.lg{width:var(--lg,40px);height:var(--lg,40px);object-fit:contain;flex:0 0 auto;display:inline-block}
.lg-l{display:none}
.lgfb{width:var(--lg,40px);height:var(--lg,40px);border-radius:50%;background:var(--chip);display:inline-grid;place-items:center;font-family:var(--f-disp);font-size:11px;font-weight:700;color:var(--mute);flex:0 0 auto}
.gteam .sub{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.gmid{text-align:center}
.gmid .sc{font-family:var(--f-disp);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.gmid .wpb{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:6px;background:var(--chip)}
.wpb i:first-child{background:var(--accent2)}.wpb i:last-child{background:var(--accent)}
.gou{display:grid;grid-template-columns:auto auto;gap:2px 12px;font-size:12px;justify-content:end}
.gou span:nth-child(odd){color:var(--mute)}
.gou b{font-variant-numeric:tabular-nums}
.tags{display:flex;gap:5px;flex-wrap:wrap}

/* ---------- game page */
.back{background:none;border:0;color:var(--mute);cursor:pointer;padding:0;margin-bottom:12px;font-weight:600}
.back:hover{color:var(--text)}
.ghero{padding:18px 20px;display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center}
.ghero .abbr{font-size:34px}
.ghero .tm{--lg:64px;gap:14px}
.ghero .tm.r{flex-direction:row-reverse;text-align:right}
.sides .lg{--lg:22px}
.sides button{display:inline-flex;align-items:center;gap:8px}
.pl .lg{--lg:18px;vertical-align:-4px;margin-right:2px}
.ghero .big{font-family:var(--f-disp);font-size:36px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;letter-spacing:.5px}
.ghero .big small{display:block;font-size:11px;color:var(--mute);font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.gsum{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 18px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;min-width:0}
.box h4{font-family:var(--f-disp);margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);display:flex;justify-content:space-between;align-items:center;gap:8px}
.ou{display:grid;grid-template-columns:auto repeat(4,1fr);gap:6px 10px;align-items:center;font-size:13px}
.ou .h{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.4px}
.sides{display:flex;justify-content:center;margin-bottom:16px}
.sides .seg button{padding:8px 18px;font-size:14px}
.sidegrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.3fr);gap:12px;margin-bottom:14px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:12.5px}
.kv span:nth-child(odd){color:var(--mute)}
.kv span:nth-child(even){font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.gname{font-family:var(--f-disp);font-size:18px;font-weight:750;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.injl{display:flex;flex-direction:column;gap:8px;font-size:13px}
.inj{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:start}
.inj .d{grid-column:2;color:var(--mute);font-size:12px}
.lines{display:grid;gap:6px;font-size:12.5px}
.line{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center}
.line .lab{font-size:10.5px;font-weight:700;color:var(--mute);text-transform:uppercase}
.lp{display:flex;gap:6px;flex-wrap:wrap}
.lp span{background:var(--chip);border-radius:6px;padding:3px 7px;white-space:nowrap}
.lp span b{font-variant-numeric:tabular-nums;color:var(--accent);margin-left:4px;font-size:11px}
.lp span.q{box-shadow:inset 0 0 0 1px var(--warn)}

/* ---------- props grid */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-family:var(--f-disp);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute);font-weight:650;text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th.s{cursor:pointer;user-select:none}
th.s:hover{color:var(--text)}
th.on{color:var(--accent)}
th.n,td.n{text-align:right}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--panel2)}
tr.open>td{background:var(--panel2)}
tr.grp td{background:transparent;color:var(--mute);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding-top:14px}
tr.out td{opacity:.55}
.pl{display:flex;align-items:center;gap:9px;min-width:180px}
.jersey{width:28px;height:28px;border-radius:7px;background:var(--chip);display:grid;place-items:center;font-weight:700;font-size:11.5px;color:var(--mute);flex:0 0 auto}
.pl .nm{font-weight:650}
.pl .sub{font-size:11.5px;color:var(--mute)}
td.h{text-align:center;padding:4px}
.cell{border-radius:7px;padding:5px 6px;min-width:62px;font-variant-numeric:tabular-nums;line-height:1.2}
.cell b{display:block;font-size:14px;font-family:var(--f-disp);font-weight:700}
.cell small{font-size:10.5px;color:var(--mute)}
.cell .bk{font-weight:700;color:var(--text)}
.cell .bk.pos{color:var(--good)}
.cell .bk.neg{color:var(--mute);font-weight:500}
.cell.val{box-shadow:inset 0 0 0 1.5px var(--good)}
.seg.sm{padding:2px}
.seg.sm button{padding:4px 10px;font-size:12px}
.box h4 .seg{text-transform:none;letter-spacing:0}
.chartwrap{overflow-x:auto}
.chartwrap svg{min-width:460px;display:block}
.chartwrap .cg{stroke:var(--line);stroke-width:1}
.chartwrap .ct{fill:var(--mute);font-size:11px;font-family:var(--f-ui)}
.chartwrap .cx{fill:var(--text);font-size:12.5px;font-weight:600;font-family:var(--f-disp)}
.chartwrap .cv{fill:var(--text);font-size:13px;font-weight:700;font-family:var(--f-disp);paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
.chartwrap .crt,.chartwrap .cs{paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
.chartwrap .cb{fill:rgba(var(--heat),.55)}
.chartwrap .cb.partial{fill:rgba(var(--heat),.25);stroke:rgba(var(--heat),.8);stroke-dasharray:4 3}
.chartwrap .cl{fill:none;stroke:url(#cgrad);stroke-width:2.6;stroke-linecap:round}
.chartwrap .clh{fill:none;stroke:var(--accent2);stroke-width:10;stroke-opacity:.12;stroke-linecap:round}
.chartwrap .cd{fill:var(--panel);stroke:var(--accent2);stroke-width:2.4}
.chartwrap .cdh{fill:var(--accent2);fill-opacity:.16}
.chartwrap .cdc{fill:var(--accent2)}
.chartwrap .cb.small{fill:rgba(var(--heat),.22)}
.chartwrap .cs{fill:var(--mute);font-size:10.5px;font-style:italic}
.chartwrap .cl.x{stroke-dasharray:7 5}
.chartwrap .cr{stroke-width:1.5;stroke-dasharray:6 5;stroke:var(--mute)}
.chartwrap .cr.t{stroke:var(--good)}
.chartwrap .crt{font-size:11px;fill:var(--mute);font-family:var(--f-ui);font-weight:600}
.chartwrap .crt.t{fill:var(--good)}
.chartwrap .crt.x{fill:var(--accent2)}
.picks{margin-bottom:16px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.pick{border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:var(--panel2);transition:border-color .15s}
.pick:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.ph{display:flex;align-items:center;gap:10px}
.pn{font-family:var(--f-disp);font-weight:700;font-size:16px}
.pm{margin-left:auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.po{font-family:var(--f-disp);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.pw{margin:10px 0 0;padding-left:18px;font-size:12.5px;display:grid;gap:3px}
.pw li::marker{color:var(--good)}
.pw li.wn{color:var(--warn)}
.pw li.wn::marker{content:"! ";color:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:12px;color:var(--mute);margin:8px 2px 0}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-3px;margin-right:5px}
.bar{position:relative;height:22px;min-width:110px;background:var(--chip);border-radius:6px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,rgba(var(--heat),.35),rgba(var(--heat),.9));border-radius:6px}
.bar span{position:relative;display:block;text-align:right;padding:0 7px;line-height:22px;font-weight:700;font-variant-numeric:tabular-nums}
.ev-pos{color:var(--good);font-weight:700}.ev-neg{color:var(--bad)}
.hits{display:flex;gap:3px}
.hits i{width:8px;height:16px;border-radius:2px;background:var(--chip)}
.hits i.y{background:var(--accent)}
.detail{padding:12px 4px 16px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
@media (max-width:700px){.dgrid>.box{grid-column:auto!important}}
.mini{font-size:12px}
.mini th,.mini td{padding:5px 6px}
.hit{color:var(--accent);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border-radius:7px;padding:4px 8px;font-size:12px}
.chip b{font-variant-numeric:tabular-nums}
.up{color:var(--good)}.down{color:var(--bad)}
.oddsgrid{display:grid;grid-template-columns:auto auto auto auto auto;gap:6px 12px;align-items:center;font-size:12.5px}
.oddsgrid .h{font-size:10.5px;color:var(--mute);text-transform:uppercase}
.cmp{width:100%;font-size:12.5px}
.cmp td{padding:6px 4px}
.cmp td:nth-child(2){text-align:center;color:var(--mute);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px}
.cmp td:first-child{text-align:left;font-variant-numeric:tabular-nums}
.cmp td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.better{color:var(--good);font-weight:700}
.empty{padding:40px;text-align:center;color:var(--mute)}
.prose{max-width:760px}
.prose h3{margin:26px 0 6px}
.prose p,.prose li{color:color-mix(in srgb,var(--text) 86%,var(--mute))}
.prose .exp{margin:12px 0;padding:14px}
.prose label{display:flex;align-items:center;gap:10px;font-weight:600}
.prose input[type=range]{width:200px;accent-color:var(--accent)}
code{background:var(--chip);padding:1px 5px;border-radius:4px;font-size:12px}
.foot{color:var(--mute);font-size:12px;margin-top:22px}
.note{font-size:12px;color:var(--mute);margin:6px 0 0}
@media (max-width:980px){.sidegrid{grid-template-columns:1fr 1fr}.sidegrid .lineupbox{grid-column:1/-1}.grow{grid-template-columns:60px 1fr 120px 1fr}.gou{grid-column:1/-1;justify-content:start;grid-template-columns:repeat(4,auto)}}
@media (max-width:640px){
  header{position:static} nav{margin-left:0}
  .sidegrid,.gsum{grid-template-columns:1fr}
  .grow{grid-template-columns:1fr auto 1fr;gap:8px}.gtime{grid-column:1/-1}
  .ghero{padding:14px;grid-template-columns:1fr 1fr}.ghero .big{grid-column:1/-1;grid-row:1}.ghero .abbr,.ghero .big{font-size:26px}.ghero .tm{--lg:40px}
  .grow .lg,.grow .lgfb{--lg:30px}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <div class="brand" id="home">NHL Props <b>Lab</b></div>
    <div class="meta" id="meta"></div>
    <nav id="nav">
      <button data-tab="games" class="on">Games</button>
      <button data-tab="props">Top props</button>
      <button data-tab="track">Track record</button>
      <button data-tab="how">How it works</button>
    </nav>
  </div>
</header>
<main class="wrap" id="main"></main>

<script>
const DATA=/*__DATA__*/null;
const C = DATA.config;
const $ = (s, el=document) => el.querySelector(s);
const fmt = (x, d=1) => x==null || isNaN(x) ? "–" : Number(x).toFixed(d);
const pct = (x, d=0) => x==null || isNaN(x) ? "–" : (100*x).toFixed(d)+"%";
const sv3 = x => x==null ? "–" : x.toFixed(3).replace(/^0/,"");
const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ v==null||v==="" ? localStorage.removeItem(k) : localStorage.setItem(k,v) }catch(e){} }
};
const P = id => DATA.players[String(id)];
const G = id => DATA.goalies[String(id)];
const gameById = Object.fromEntries(DATA.games.map(g => [String(g.id), g]));
const dates = [...new Set(DATA.games.map(g=>g.date))].sort();

const state = {
  tab: "games", game: null, side: null, day: dates[0], open: null, sort: null,
  market: "g", pfilter: "all", pday: dates[0] || "all", q: "", onlyReg: false, psort: "p",
  streakW: +(store.get("set:streakW") ?? (C.streak_weight_default||0)*100),
  histW: +(store.get("set:histW") ?? (C.history_weight_default||0)*100),
  goalie: {},
  chart: (()=>{ try { return Object.assign({view:"table", stat:"g", mode:"windows", unit:"pg"}, JSON.parse(store.get("set:chart")||"{}")); } catch(e){ return {view:"table", stat:"g", mode:"windows", unit:"pg"}; } })(),
};
DATA.games.forEach(g => { state.goalie[g.id] = {};
  for (const t of [g.home, g.away]) state.goalie[g.id][t] = store.get(`goalie:${g.id}:${t}`) || g.starters[t]; });

// ------------------------------------------------------------ model math (mirrors model.py)
function goalieRatio(game, team){ const id = state.goalie[game.id]?.[team]; const g = id && G(id); return g ? g.ratio : 1; }
function streakMult(team, opp){
  const w = state.streakW/100; if (!w) return 1;
  let m = 1; const own = DATA.teams[team], o = DATA.teams[opp];
  if (own && own.streak_excess>0){ const ex=Math.min(own.streak_excess,3); m *= own.streak_kind==="W" ? 1-w*ex : 1+w*ex; }
  if (o && o.streak_excess>0){ const ex=Math.min(o.streak_excess,3); m *= o.streak_kind==="W" ? 1+w*ex : 1-w*ex; }
  return m;
}
const atLeastOne = lam => 1 - Math.exp(-Math.max(lam,0));
function poisOver(lam, line){ const k=Math.floor(line); let term=Math.exp(-lam), cdf=0; for(let i=0;i<=k;i++){ if(i>0) term*=lam/i; cdf+=term; } return Math.max(0,1-cdf); }
function pmf(lam,n=16){ const o=[Math.exp(-lam)]; for(let i=1;i<n;i++) o.push(o[i-1]*lam/i); return o; }
function gameDist(mh, ma){
  const ph=pmf(mh*0.985), pa=pmf(ma*0.985), tot=new Array(34).fill(0); let tie=0, hw=0;
  for(let i=0;i<ph.length;i++) for(let j=0;j<pa.length;j++){ const p=ph[i]*pa[j]; let t=i+j; if(i===j){tie+=p;t+=1;} else if(i>j) hw+=p; tot[t]+=p; }
  const ph_ = hw + tie*((mh+ma)>0 ? mh/(mh+ma) : 0.5);
  return {ph:ph_, pa:1-ph_, tie, over: L => tot.slice(Math.floor(L)+1).reduce((a,b)=>a+b,0)};
}
function gameMu(g){
  return { h: g.mu.home.g*goalieRatio(g,g.away)*streakMult(g.home,g.away) + g.mu.home.o,
           a: g.mu.away.g*goalieRatio(g,g.home)*streakMult(g.away,g.home) + g.mu.away.o };
}
function lambdas(pr, game){
  const gr = goalieRatio(game, pr.opp), sm = streakMult(pr.team, pr.opp);
  return { g: pr.base.g*gr*sm, a: pr.base.a*gr*sm, s: pr.base.s*sm, gr, sm };
}
function prob(pr, game, m){
  const l = lambdas(pr, game);
  if (m==="g") return atLeastOne(l.g);
  if (m==="a") return atLeastOne(l.a);
  if (m==="pt") return atLeastOne(l.g + l.a);
  return poisOver(l.s, parseFloat(m.slice(1)));
}
const MARKETS = [["g","Goal"],["a","Assist"],["pt","Point"],...C.sog_lines.map(L=>["s"+L,`SOG ${Math.ceil(L)}+`])];
const mName = m => (MARKETS.find(x=>x[0]===m)||[0,m])[1];
function hitGame(gm, m){
  if (m==="g") return gm.g>=1; if (m==="a") return gm.a>=1; if (m==="pt") return gm.g+gm.a>=1;
  return gm.s > parseFloat(m.slice(1));
}
const oddsKey = (gid, pid, m) => `odds:${gid}:${pid}:${m}`;
const book = (gid,pid,m) => DATA.odds?.[gid]?.players?.[pid]?.[m] || null;
const userOdds = (gid,pid,m) => { const v = parseFloat(store.get(oddsKey(gid,pid,m))); return isNaN(v)?null:v; };
const getOdds = (gid,pid,m) => userOdds(gid,pid,m) ?? book(gid,pid,m)?.o ?? null;
const noVig = b => b && b.o && b.n ? (1/b.o)/((1/b.o)+(1/b.n)) : null;
const bookName = gid => "Market";
const VALUE = 0.05;

function regPills(p){

// ------------------------------------------------------------ best picks (helper, not a verdict)
function bestPicks(g){
  const hasOdds = !!DATA.odds?.[g.id];
  const cands = [];
  for (const pr of g.props){
    const p = P(pr.id); if (!p?.active) continue;
    const opts = ["g","pt"].map(m=>{ const v = prob(pr,g,m), od = getOdds(g.id,pr.id,m); return {m, v, od, ev: od ? v*od-1 : null}; });
    if (hasOdds){
      const ok = opts.filter(o=>o.ev!=null && o.ev>0); if (!ok.length) continue;
      ok.sort((a,b)=>b.ev-a.ev);
      let pick = ok[0];
      const pt = ok.find(o=>o.m==="pt");
      if (pick.m==="g" && pt && pt.ev >= pick.ev - 0.03) pick = pt;   // similar edge: take the safer point
      cands.push({pr, p, ...pick});
    } else {
      const pt = opts.find(o=>o.m==="pt"); cands.push({pr, p, ...pt});
    }
  }
  cands.sort((a,b)=> hasOdds ? b.ev-a.ev : b.v-a.v);
  const teamCount = {[g.home]:0, [g.away]:0}; cands.forEach(c=>{ if (c.ev!=null && c.ev>=VALUE) teamCount[c.pr.team]++; });
  return {picks: cands.slice(0,2), hasOdds, teamCount};
}
function pickReasons(c, g){
  const p = c.p, pr = c.pr, opp = pr.opp, why = [], warn = [];
  const b = book(g.id, pr.id, c.m), nv = noVig(b), imp = c.od ? 1/c.od : null;
  if (c.od) why.push(`Model ${pct(c.v)} vs market ${pct(nv ?? imp)}`);
  const lu = DATA.teams[pr.team]?.lineup?.groups || {};
  const line = Object.entries(lu).find(([k,ids])=>/^[fd]\d$/.test(k) && ids.includes(pr.id))?.[0];
  const pp1 = (lu.pp1||[]).includes(pr.id);
  why.push(`Plays ${fmt(p.toi_proj,1)} min${line?` on ${line.toUpperCase()}`:""}${pp1?", first power play":""}`);
  if (p.regress.flag==="due") why.push("Scoring below his true talent this season (due)");
  if (p.drought.found && p.drought.p<0.15 && p.drought.shots>=8) why.push(`${p.drought.shots} shots since his last goal`);
  const og = G(state.goalie[g.id][opp]);
  if (og && og.ratio>1.02) why.push(`Opposing goalie below average (${fmt(og.ratio,2)})`);
  if (og && og.ratio<0.98) warn.push(`Opposing goalie above average (${fmt(og.ratio,2)})`);
  const f = p.form; if (f.gp>=3) why.push(`Last ${f.gp} games: ${f.g} G, ${f.a} A, ${f.s} shots`);
  if (p.regress.flag==="hot") warn.push("Scoring above his true talent, may cool off");
  if (p.injury?.kind==="questionable") warn.push(`Listed ${p.injury.status}`);
  const st = (g.starter_status[opp]||"").toLowerCase();
  if (!st.includes("confirmed") || st.includes("unconfirmed")) warn.push(`${opp} goalie not confirmed`);
  if (DATA.teams[pr.team]?.lineup?.source!=="projected") warn.push("Lineup estimated");
  if ((p.windows?.career?.gp||0) < 40) warn.push("Short NHL history");
  return {why, warn};
}
function bestPicksBox(g){
  const {picks, hasOdds, teamCount} = bestPicks(g);
  if (!picks.length) return `<div class="box picks"><h4>Best picks in this game</h4><p class="meta">${hasOdds?"No goal or point bet has positive value at the current odds.":"No players available."}</p></div>`;
  const cards = picks.map(c=>{ const {why, warn} = pickReasons(c, g);
    return `<div class="pick" data-open="${c.pr.id}" data-team="${c.pr.team}" role="button" tabindex="0">
      <div class="ph">${logo(c.pr.team,26)}<div><div class="pn">${esc(c.p.name)}</div><div class="meta">${c.pr.team} ${c.pr.home?"vs":"@"} ${c.pr.opp}</div></div>
        <div class="pm"><span class="pill ${c.m==="pt"?"s-confirmed":"s-dry"}">${c.m==="pt"?"1+ point":"Goal"}</span>
          <div class="po">${c.od?c.od.toFixed(2):"–"}</div><div class="meta">${c.ev!=null?`edge ${(c.ev>0?"+":"")+(c.ev*100).toFixed(1)}%`:`${pct(c.v)} likely`}</div></div></div>
      <ul class="pw">${why.map(x=>`<li>${esc(x)}</li>`).join("")}${warn.map(x=>`<li class="wn">${esc(x)}</li>`).join("")}</ul></div>`; }).join("");
  const [[t1,n1],[t2,n2]] = Object.entries(teamCount).sort((a,b)=>b[1]-a[1]);
  const lopsided = hasOdds && n1>=4 && n2<=1 ? `<p class="note">${n1} of the ${n1+n2} value bets in this game are on ${t1} players. That usually means the model and the market disagree about ${t1}'s scoring as a whole, so these bets tend to win or lose together. Treat them as one opinion.</p>` : "";
  return `<div class="box picks"><h4>Best picks in this game <span class="meta">${hasOdds?"highest edge · one per player · point preferred when the edge is similar":"no odds yet · most likely points"}</span></h4>
    <div class="pgrid">${cards}</div>${lopsided}
    <p class="note">A helper, not a tip: it lists the facts behind each option. The model hasn't been tested for profit yet, so check the warnings and decide for yourself.</p></div>`;
}

function facingBar(g, team, opp){

function injuryOfName(team, name){ return (DATA.teams[team]?.injuries||[]).find(i=>i.name===name); }
function injuriesCard(team){
  const inj = DATA.teams[team]?.injuries || [];
  const out = inj.filter(i=>i.kind==="out"), q = inj.filter(i=>i.kind!=="out");
  const row = i => `<div class="inj">${injPill(i)}<b>${esc(i.name)}</b><span class="d">${esc(i.detail||"")}${i.return?` · expected back ${esc(i.return.slice(0,10))}`:""}</span></div>`;
  return `<div class="box"><h4>Injuries <span class="meta">${out.length} out · ${q.length} questionable</span></h4>
    ${inj.length ? `<div class="injl">${q.map(row).join("")}${out.map(row).join("")}</div>` : `<p class="meta">No reported injuries.</p>`}</div>`;
}
function lineupCard(g, team){
  const lu = DATA.teams[team]?.lineup; if(!lu) return "";
  const props = Object.fromEntries(g.props.filter(p=>p.team===team).map(p=>[p.id,p]));
  const lastOf = n => n.split(" ").slice(1).join(" ")||n;
  const counts = {}; Object.values(lu.groups).flat().forEach(id=>{ const p=P(id); if(p) counts[lastOf(p.name)] = (counts[lastOf(p.name)]||new Set()).add(id); });
  const name = id => { const p=P(id); if(!p) return ""; const pr=props[id]; const pg = pr?prob(pr,g,"g"):null;
    const ln = lastOf(p.name); const last = counts[ln]?.size>1 ? p.name[0]+". "+ln : ln;
    return `<span class="${p.injury?.kind==="questionable"?"q":""}" title="${esc(p.name)}${p.injury?" – "+p.injury.status:""}">${esc(last)}${pg!=null?`<b>${pct(pg)}</b>`:""}</span>`; };
  const order = Object.keys(lu.groups).sort((a,b)=>{ const r=k=>k.startsWith("pp")?2:k[0]==="f"?0:k[0]==="d"?1:3; return r(a)-r(b) || a.localeCompare(b); });
  const rows = order.filter(k=>/^(f|d|pp)\d$/.test(k)).map(k=>`<div class="line"><span class="lab">${k.toUpperCase()}</span><div class="lp">${lu.groups[k].map(name).join("")}</div></div>`).join("");
  return `<div class="box lineupbox"><h4>${lu.source==="projected"?"Projected lineup":"Lineup estimated from recent ice time"} <span class="meta">goal %</span></h4>
    <div class="lines">${rows||`<p class="meta">No lineup available.</p>`}</div>
    ${lu.source!=="projected"?`<p class="note">Projected lines weren't available, so players are ranked by recent ice time.</p>`:""}</div>`;
}

const GRID = [["g","Goal"],["a","Assist"],["pt","Point"],...C.sog_lines.slice(0,3).map(L=>["s"+L,`SOG ${Math.ceil(L)}+`])];
function heat(p, colMax){ const a = Math.min(1, p/Math.max(colMax,0.05)); return `background:rgba(var(--heat),${(0.06+0.42*a*a).toFixed(3)})`; }

function sidePanel(g, team){
  const opp = team===g.home ? g.away : g.home;
  const lu = DATA.teams[team]?.lineup || {groups:{}};
  const pos = {}; Object.entries(lu.groups).forEach(([k,ids])=>{ if(/^[fd]\d$/.test(k)) ids.forEach(id=>{ pos[id]=k; }); });
  const rows = g.props.filter(pr=>pr.team===team).map(pr=>{
    const p = P(pr.id); const probs = Object.fromEntries(GRID.map(([m])=>[m, prob(pr,g,m)]));
    const k = p.active ? (pos[pr.id]||(p.posg==="D"?"d9":"f9")) : "zz";
    return {pr, p, probs, grp: k==="zz" ? "9" : (k[0]==="f"?"0":"1")+k};
  });
  const colMax = Object.fromEntries(GRID.map(([m])=>[m, Math.max(...rows.filter(r=>r.p.active).map(r=>r.probs[m]), 0.01)]));
  if (state.sort) rows.sort((a,b)=> (b.p.active-a.p.active) || (b.probs[state.sort]-a.probs[state.sort]));
  else rows.sort((a,b)=> a.grp.localeCompare(b.grp) || b.p.toi_proj-a.p.toi_proj);
  const gl = k => k==="9" ? "Not expected to play" : k[1]==="f" ? (k==="0f9"?"Other forwards":"Forwards") : (k==="1d9"?"Other defense":"Defense");
  let lastG = null, body = "";
  for (const r of rows){
    const label = state.sort ? (r.p.active ? "Expected to play" : "Not expected to play") : gl(r.grp);
    if (label!==lastG){ body += `<tr class="grp"><td colspan="${GRID.length+3}">${label}</td></tr>`; lastG = label; }
    const open = String(state.open)===String(r.pr.id);
    body += `<tr class="row ${open?"open":""} ${r.p.active?"":"out"}" data-id="${r.pr.id}">
      <td><div class="pl"><div class="jersey">${r.p.num??""}</div><div><div class="nm">${esc(r.p.name)} ${injPill(r.p.injury)}</div>
        <div class="sub">${r.p.pos}${pos[r.pr.id]?" · "+pos[r.pr.id].toUpperCase():""}${r.p.why && !r.p.injury?" · "+esc(r.p.why):""}</div></div></div></td>
      <td class="n hide-sm num">${fmt(r.p.toi_proj,1)}</td>
      ${GRID.map(([m])=>{ const v=r.probs[m]; const od=getOdds(g.id,r.pr.id,m); const ev=od?v*od-1:null;
        const val = r.p.active && ev!=null && ev>=VALUE;
        const tip = `Model ${pct(v,1)} · fair ${(1/v).toFixed(2)}${od?` · odds ${od.toFixed(2)} · EV ${(ev>0?"+":"")+(ev*100).toFixed(1)}%`:""}`;
        return `<td class="h"><div class="cell ${val?"val":""}" title="${tip}" style="${r.p.active?heat(v,colMax[m]):""}"><b>${pct(v,0)}</b><small>${od?`<span class="bk ${ev>=VALUE?"pos":ev<0?"neg":""}">${od.toFixed(2)}</span>`:(1/v).toFixed(2)}</small></div></td>`; }).join("")}
      <td>${regPills(r.p)}</td></tr>
      ${open?`<tr><td colspan="${GRID.length+3}">${detail(r.pr, g)}</td></tr>`:""}`;
  }
  $("#sidebody").innerHTML = `
    <div class="sidegrid">${goalieCard(g, team).replace("<h4>Starting goalie", `<h4>${team} starting goalie`)}${injuriesCard(team)}${lineupCard(g, team)}</div>
    ${facingBar(g, team, opp)}
    <div class="card tablewrap"><table><thead><tr>
      <th>${team} player</th><th class="n hide-sm">TOI</th>
      ${GRID.map(([m,n])=>`<th class="s ${state.sort===m?"on":""}" data-m="${m}" style="text-align:center">${n}</th>`).join("")}<th>Signals</th></tr></thead>
      <tbody>${body}</tbody></table></div>
    <div class="legend"><span><b>38%</b> = model probability</span>
      <span>${DATA.odds?.[g.id] ? `small number = market odds (green when the model sees +5% value or more)` : "small number = fair odds (no market odds for this game yet)"}</span>
      <span><i style="box-shadow:inset 0 0 0 1.5px var(--good)"></i>value bet</span></div>
    <p class="foot">Click a column to sort, click it again for lineup order. Click a player for his breakdown, charts, and to enter your own odds.${DATA.odds?.[g.id]?.fetched && DATA.odds[g.id].fetched!=="demo" ? ` Odds updated ${new Date(DATA.odds[g.id].fetched).toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"})}.`:""}</p>`;
  $("#sidebody").onclick = e => {
    if (e.target.closest("input,select")) return;
    const cb = e.target.closest("[data-cv],[data-cs],[data-cm],[data-cu]");
    if (cb){ const d = cb.dataset;
      if (d.cv) state.chart.view = d.cv; if (d.cs) state.chart.stat = d.cs; if (d.cm) state.chart.mode = d.cm; if (d.cu) state.chart.unit = d.cu;
      store.set("set:chart", JSON.stringify(state.chart)); sidePanel(g, team); return; }
    const th = e.target.closest("th.s"); if (th){ state.sort = state.sort===th.dataset.m ? null : th.dataset.m; sidePanel(g, team); return; }
    const tr = e.target.closest("tr.row"); if (tr){ state.open = String(state.open)===tr.dataset.id ? null : tr.dataset.id; sidePanel(g, team); }
  };
}

function windowsTable(p){
  const W = p.windows, cols = [["cur","This season"],["prev3","Prev 3 seasons"],["prev5","Prev 5 seasons"],["career","Career"]];
  const r = (lab, f) => `<tr><td>${lab}</td>${cols.map(([k])=>`<td class="n">${W[k]?f(W[k]):"–"}</td>`).join("")}</tr>`;
  return `<table class="mini"><thead><tr><th></th>${cols.map(c=>`<th class="n">${c[1]}</th>`).join("")}</tr></thead><tbody>
    ${r("Games", w=>w.gp)}${r("G / A / P", w=>`${w.g} / ${w.a} / ${w.p}`)}${r("Shots", w=>w.s)}
    ${r("Goals per game", w=>fmt(w.g_pg,2))}${r("Assists per game", w=>fmt(w.a_pg,2))}${r("Points per game", w=>fmt(w.p_pg,2))}
    ${r("Shots per game", w=>fmt(w.s_pg,2))}${r("Goals per season", w=>fmt(w.g_ps,1))}${r("Assists per season", w=>fmt(w.a_ps,1))}
    ${r("Points per season", w=>fmt(w.p_ps,1))}${r("Shooting %", w=>pct(w.sh,1))}</tbody></table>`;
}

// ------------------------------------------------------------ history chart
const STATS = [["g","Goals"],["a","Assists"],["p","Points"],["s","Shots"],["sh","Shooting %"],["gx","Goals vs expected"]];
const UNITS = [["pg","Per game"],["pace","82-game pace"],["ps","Per season"]];
const SMALL_SHOTS = 40;
// one row per bar: {lab, sub, v (bar), v2 (expected, optional), small, partial}
function chartRows(p){
  const c = state.chart, k = c.stat, cur = DATA.season;
  const scale = (tot, gp, seasons, isCur) => {
    if (tot==null || !gp) return null;
    if (c.unit==="pg") return tot/gp;
    if (c.unit==="pace") return tot/gp*82;
    return isCur ? tot : tot/(seasons||1);
  };
  let base;
  if (c.mode==="windows"){
    const W = p.windows, X = p.xg_windows||{};
    base = [["cur","This season"],["prev3","Prev 3 seasons"],["prev5","Prev 5 seasons"],["career","Career"]].map(([key,lab])=>{
      const w = W[key]; if(!w) return {lab, v:null};
      const x = X[key];
      return {lab, key, w, isCur: key==="cur", gp:w.gp, seasons:w.seasons, g:w.g, a:w.a, p:w.p, s:w.s,
              xg: x ? x.xg : null, xgp: x ? x.gp : null, sub: key==="cur" ? `${w.gp} GP` : `${w.seasons} seas · ${w.gp} GP`};
    });
  } else {
    base = (p.by_season||[]).slice().sort((a,b)=>a.y-b.y).map(r=>({
      lab: `${String(r.y).slice(2)}–${String(r.y+1).slice(2)}`, isCur: r.y===cur, gp:r.gp, seasons:1,
      g:r.g, a:r.a, p:r.p, s:r.s, xg: r.xg ?? null, xgp: r.xg_gp ?? null, sub: `${r.gp} GP`}));
  }
  return base.map(r=>{
    if (r.gp==null) return r;
    if (k==="sh") return {...r, v: r.s ? r.g/r.s : null, small: (r.s||0) < SMALL_SHOTS, sub: `${r.g} G / ${r.s} S`};
    if (k==="gx"){
      const v = scale(r.g, r.gp, r.seasons, r.isCur);
      const v2 = r.xg!=null && r.xgp ? scale(r.xg, r.xgp, r.seasons, r.isCur) : null;
      return {...r, v, v2, small: (r.s||0) < SMALL_SHOTS, partial: r.isCur && c.unit==="ps"};
    }
    return {...r, v: scale(r[k], r.gp, r.seasons, r.isCur), small: r.gp < 15 && c.unit!=="ps", partial: r.isCur && c.unit==="ps"};
  });
}
function barChart(rows, o){
  const W = 960, H = 300, padL = 52, padR = 140, padT = 30, padB = 50;
  const vals = rows.flatMap(r=>[r.v, r.v2]).concat((o.refs||[]).map(x=>x.v)).filter(v=>v!=null && isFinite(v));
  if (!rows.some(r=>r.v!=null)) return `<p class="meta">No history to chart.</p>`;
  const top = Math.max(...vals) || 1;
  const step = (()=>{ const raw = top/4, m = Math.pow(10, Math.floor(Math.log10(raw))); return [1,2,2.5,5,10].map(x=>x*m).find(x=>x>=raw); })();
  const ymax = Math.ceil(top/step)*step;
  const x0 = padL, w = W-padL-padR, slot = w/rows.length, bw = Math.min(70, slot*0.5);
  const Y = v => padT + (H-padT-padB)*(1 - v/ymax);
  const f = o.fmt;
  let g = "";
  for (let v=0; v<=ymax+1e-9; v+=step) g += `<line x1="${x0}" x2="${W-padR}" y1="${Y(v)}" y2="${Y(v)}" class="cg"/><text x="${x0-8}" y="${Y(v)+4}" text-anchor="end" class="ct">${o.axis(v)}</text>`;
  const pts = [], pts2 = [], labels = [];
  const bars = rows.map((r,i)=>{ const cx = x0 + slot*i + slot/2;
    let out = `<text x="${cx}" y="${H-padB+18}" text-anchor="middle" class="cx">${esc(r.lab)}</text><text x="${cx}" y="${H-padB+33}" text-anchor="middle" class="ct">${esc(r.sub||"")}</text>`;
    if (r.v2!=null) pts2.push([cx, Y(r.v2), r.v2]);
    if (r.v==null) return out;
    const y = Y(r.v); pts.push([cx,y]);
    const cls = r.partial ? "partial" : r.small ? "small" : "";
    out += `<rect x="${cx-bw/2}" y="${y}" width="${bw}" height="${Math.max(0,Y(0)-y)}" rx="5" class="cb ${cls}"><title>${esc(r.lab)}: ${f(r.v)}${r.v2!=null?` · expected ${f(r.v2)}`:""}${r.small?" · small sample":""}</title></rect>`;
    labels.push(`<text x="${cx}" y="${y-10}" text-anchor="middle" class="cv">${f(r.v)}</text>`);
    if (r.small) out += (Y(0)-y > 34) ? `<text x="${cx}" y="${Y(0)-8}" text-anchor="middle" class="cs">small sample</text>`
                                      : `<text x="${cx}" y="${y-26}" text-anchor="middle" class="cs">small sample</text>`;
    return out; }).join("");
  const rl = (o.refs||[]).filter(x=>x.v!=null).map(x=>({...x, y:Y(x.v), ly:Y(x.v)})).sort((a,b)=>a.y-b.y);
  for (let i=1;i<rl.length;i++){ if (rl[i].ly - rl[i-1].ly < 18){ const mid=(rl[i].ly+rl[i-1].ly)/2; rl[i-1].ly = mid-9; rl[i].ly = mid+9; } }
  const refs = rl.map(x=>`<line x1="${x0}" x2="${W-padR}" y1="${x.y}" y2="${x.y}" class="cr ${x.cls||""}"/>
    ${Math.abs(x.ly-x.y)>1?`<path d="M${W-padR} ${x.y} L${W-padR+6} ${x.ly}" class="cr ${x.cls||""}" style="stroke-dasharray:none"/>`:""}
    <text x="${W-padR+9}" y="${x.ly+4}" class="crt ${x.cls||""}">${esc(x.label)} ${f(x.v)}</text>`).join("");
  const smooth = P => { if (P.length<2) return ""; let d=`M${P[0][0]},${P[0][1]}`;
    for (let i=1;i<P.length;i++){ const [x1,y1]=P[i-1],[x2,y2]=P[i], cx=(x1+x2)/2; d+=` C${cx},${y1} ${cx},${y2} ${x2},${y2}`; } return d; };
  const glowLine = (P, cls) => P.length>1 ? `<path d="${smooth(P)}" class="clh ${cls}"/><path d="${smooth(P)}" class="cl ${cls}" filter="url(#cglow)"/>` : "";
  const glowDot = (x,y,cls,t="") => `<circle cx="${x}" cy="${y}" r="9" class="cdh ${cls}"/><circle cx="${x}" cy="${y}" r="4.5" class="cd ${cls}">${t}</circle><circle cx="${x}" cy="${y}" r="1.8" class="cdc"/>`;
  const defs = `<defs><filter id="cglow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="cgrad" x1="0" x2="1" y1="0" y2="0"><stop offset="0" style="stop-color:var(--accent2)"/><stop offset="1" style="stop-color:var(--line2)"/></linearGradient></defs>`;
  let line = "", dots = "";
  if (o.line2){
    line = glowLine(pts2.map(p=>[p[0],p[1]]), "x");
    dots = pts2.map(([x,y,v])=>glowDot(x,y,"x",`<title>expected ${f(v)}</title>`)).join("")
      + (pts2.length ? `<text x="${pts2[pts2.length-1][0]+12}" y="${pts2[pts2.length-1][1]-10}" class="crt x">expected</text>` : "");
  } else {
    line = glowLine(pts, "");
    dots = pts.map(([x,y])=>glowDot(x,y,"")).join("");
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.title)}">${defs}${g}${refs}${bars}${line}${dots}${labels.join("")}</svg>`;
}
function statsBox(p){
  const c = state.chart;
  const seg = (attr, opts, cur) => `<div class="seg sm">${opts.map(([v,l])=>`<button data-${attr}="${v}" class="${cur===v?"on":""}">${l}</button>`).join("")}</div>`;
  const head = `<h4>Averages: season, previous 3 & 5 seasons, career ${seg("cv",[["table","Table"],["chart","Chart"]],c.view)}</h4>`;
  if (c.view!=="chart") return `<div class="box" style="grid-column:1/-1">${head}<div class="tablewrap">${windowsTable(p)}</div></div>`;
  const rows = chartRows(p), k = c.stat, isPct = k==="sh";
  const dec = c.unit==="pg" ? 2 : 1;
  const opts = isPct
    ? {fmt: v=>(v*100).toFixed(1)+"%", axis: v=>(v*100).toFixed(0)+"%", title:"Shooting percentage",
       refs:[{v:p.rates.recent_sh, label:"true talent", cls:"t"}, {v:p.rates.lg_sh, label:`league ${p.posg}`, cls:"l"}]}
    : {fmt: v=>v.toFixed(dec), axis: v=>c.unit==="pg"?v.toFixed(v<1?2:1):Math.round(v), title:"Stat history", line2: k==="gx"};
  const cur = rows.find(r=>r.isCur);
  let note;
  if (k==="sh"){
    const n = cur?.s||0, gap = cur && cur.v!=null ? cur.v - p.rates.recent_sh : null;
    note = `Goals ÷ shots on goal. The dashed green line is his true-talent shooting % (what the model uses); grey is the league average for his position. `
      + (n < SMALL_SHOTS ? `This season is only ${n} shots, so it's mostly noise. Shooting % needs a few hundred shots to mean much.`
         : gap!=null ? `This season he's ${gap>=0?"above":"below"} his talent by ${(Math.abs(gap)*100).toFixed(1)} points: expect ${gap>=0?"fewer goals per shot (negative":"more goals per shot (positive"} regression).` : "");
  } else if (k==="gx"){
    const d = cur && cur.v2!=null ? cur.g - cur.xg : null;
    note = `Bars = actual goals, blue line = expected goals from the quality of his shots (location, type, rebounds). Bars above the line = finishing better than expected (often luck, sometimes skill); below = finishing worse. `
      + (d!=null ? `This season: ${cur.g} goals vs ${cur.xg.toFixed(1)} expected (${d>=0?"+":""}${d.toFixed(1)}).` : "")
      + (c.mode==="windows" ? " Expected goals aren't available for a full career." : "");
  } else {
    note = `${STATS.find(x=>x[0]===k)[1]} ${c.unit==="pg"?"per game":c.unit==="pace"?"per 82 games at this rate":"per season"}. `
      + (c.unit==="ps" ? "The dashed bar is the current season, which isn't finished. Use 82-game pace to compare it fairly. " : "")
      + (c.unit==="pace" ? "Pace shows the current rate stretched to 82 games. It isn't a forecast. The model's expectation for tonight is in the props grid. " : "")
      + (rows.some(r=>r.small) ? "Faded bars have fewer than 15 games, so treat them with care. " : "")
      + (k==="g" ? "For the reason behind a change, look at Shots (volume: reliable quickly) and Shooting % (finishing: mostly luck)." : "The line connects the top of each bar.");
  }
  return `<div class="box" style="grid-column:1/-1">${head}
    <div class="controls" style="margin-bottom:6px">${seg("cs",STATS,k)}${seg("cm",[["windows","Season, prev 3, prev 5, career"],["seasons","Season by season"]],c.mode)}${isPct?"":seg("cu",UNITS,c.unit)}</div>
    <div class="chartwrap">${barChart(rows, opts)}</div>
    <p class="note">${note}</p></div>`;
}

function detail(pr, g){
  const p = P(pr.id), l = lambdas(pr, g), r = p.rates, f = pr.factors, rg = p.regress, d = p.drought, xgw = p.xg_windows;
  const og = G(state.goalie[g.id][pr.opp]);
  const x = v => { const c = v>1.005?"up":v<0.995?"down":""; return `<b class="${c}">×${v.toFixed(3)}</b>`; };
  const oddsRows = MARKETS.map(([m,n])=>{ const pv = prob(pr,g,m), b = book(g.id,pr.id,m), uo = userOdds(g.id,pr.id,m), od = uo ?? b?.o ?? null, ev = od==null?null:pv*od-1, nv = noVig(b);
    return `<span>${n}</span><span class="num"><b>${pct(pv,1)}</b> <span class="meta">${(1/pv).toFixed(2)}</span></span>
      <span class="num">${b?`<b>${b.o.toFixed(2)}</b>${nv!=null?` <span class="meta">${pct(nv,0)}</span>`:""}`:`<span class="meta">–</span>`}</span>
      <input class="odds podds" id="po-${g.id}-${pr.id}-${m}" data-pid="${pr.id}" data-m="${m}" placeholder="${b?b.o.toFixed(2):"odds"}" value="${uo??""}">
      <span class="${ev==null?"":ev>0?"ev-pos":"ev-neg"}">${ev==null?"":(ev>0?"+":"")+(ev*100).toFixed(1)+"%"}</span>`; }).join("");
  return `<div class="detail"><div class="dgrid">
    <div class="box" style="grid-column:span 2"><h4>Prices & value</h4><div class="oddsgrid"><span class="h">Market</span><span class="h">Model · fair</span><span class="h">Odds · market %</span><span class="h">Your odds</span><span class="h">EV</span>${oddsRows}</div>
      <p class="note">"Market %" is the probability implied by the odds, with the margin removed. EV uses your odds if you type them, otherwise the market odds. EV = model probability × odds − 1.</p></div>
    <div class="box"><h4>How the number is built</h4>
      <div class="chips">
        <span class="chip">Goals/60 <b>${fmt(r.g60,2)}</b></span><span class="chip">Assists/60 <b>${fmt(r.a60,2)}</b></span>
        <span class="chip">Shots/60 <b>${fmt(r.s60,2)}</b></span><span class="chip">TOI <b>${fmt(p.toi_proj,1)}</b></span>
        <span class="chip">Opp defence ${x(f.opp_def)}</span><span class="chip">Opp goalie ${x(l.gr)}</span>
        <span class="chip">${pr.home?"Home":"Away"} ${x(f.venue)}</span><span class="chip">Back-to-back ${x(f.b2b)}</span>

function matchup(g){
  const A = DATA.teams[g.away]||{}, H = DATA.teams[g.home]||{};
  const row = (label, a, h, f, hb=true) => { let ca="", ch="";
    if (typeof a==="number" && typeof h==="number" && a!==h && hb!==null){ const aw = hb ? a>h : a<h; ca = aw?"better":""; ch = aw?"":"better"; }
    return `<tr><td class="${ca}">${f(a)}</td><td>${label}</td><td class="${ch}">${f(h)}</td></tr>`; };
  const raw = (label, a, h) => `<tr><td>${a}</td><td>${label}</td><td>${h}</td></tr>`;
  const streak = t => !t.streak_kind ? "–" : `${t.streak_kind}${t.streak}${t.streak_excess>0?` <span class="pill s-q" title="${t.tier} team, rule threshold ${t.streak_threshold}">6-game rule</span>`:` <span class="meta">/${t.streak_threshold}</span>`}`;
  $("#sidebody").innerHTML = `<div class="gsum">${goalieCard(g,g.away).replace("<h4>Starting goalie",`<h4>${g.away} goalie`)}${goalieCard(g,g.home).replace("<h4>Starting goalie",`<h4>${g.home} goalie`)}</div>
  <div class="card" style="padding:6px 14px"><table class="cmp"><tbody>
    <tr><td><b>${g.away}</b></td><td>Team comparison</td><td><b>${g.home}</b></td></tr>
    ${row("Points %", A.pts_pct, H.pts_pct, v=>pct(v,1))}
    ${raw("Strength tier", A.tier||"–", H.tier||"–")}
    ${raw("Streak", streak(A), streak(H))}
    ${raw("Last 5", A.last5||"–", H.last5||"–")}
    ${raw("Last 5 GF / GA", `${fmt(A.l5_gf,1)} / ${fmt(A.l5_ga,1)}`, `${fmt(H.l5_gf,1)} / ${fmt(H.l5_ga,1)}`)}
    ${raw("GF / GA per game", `${fmt(A.gf_pg,2)} / ${fmt(A.ga_pg,2)}`, `${fmt(H.gf_pg,2)} / ${fmt(H.ga_pg,2)}`)}
    ${raw("Road / Home GF – GA", `${fmt(A.gf_away,2)} – ${fmt(A.ga_away,2)}`, `${fmt(H.gf_home,2)} – ${fmt(H.ga_home,2)}`)}
    ${row("5v5 expected goals share", A.xgf_pct5, H.xgf_pct5, v=>pct(v,1))}
    ${row("PDO (luck, 1000 = normal)", A.pdo, H.pdo, v=>v==null?"–":fmt(v*1000,0), null)}
    ${row("High-danger shots for /60", A.hdsf60, H.hdsf60, v=>fmt(v,1))}
    ${row("High-danger shots against /60", A.hdsa60, H.hdsa60, v=>fmt(v,1), false)}
    ${row("Power play goals /60", A.pp_gf60, H.pp_gf60, v=>fmt(v,1))}
    ${row("Penalty kill goals against /60", A.pk_ga60, H.pk_ga60, v=>fmt(v,1), false)}
    ${row("Power play minutes / game", A.pp_min, H.pp_min, v=>fmt(v,1))}
    ${row("Over 5.5 this season", A["over_5.5_reg"], H["over_5.5_reg"], v=>pct(v), null)}
    ${row("Over 5.5 road / home", A["over_5.5_away"], H["over_5.5_home"], v=>pct(v), null)}
    ${row("Over 5.5 last 3 seasons", A["over_5.5_3y"], H["over_5.5_3y"], v=>pct(v), null)}
    ${row("Over 6.5 this season", A["over_6.5_reg"], H["over_6.5_reg"], v=>pct(v), null)}
    ${raw("Back-to-back", g.b2b[g.away]?"Yes":"No", g.b2b[g.home]?"Yes":"No")}
  </tbody></table></div>`;
}

// ------------------------------------------------------------ top props
function propsTab(){
  const gameOpts = DATA.games.filter(g=>state.pday==="all"||g.date===state.pday).map(g=>`<option value="${g.id}" ${state.pfilter==g.id?"selected":""}>${dayLabel(g.date)} · ${g.away} @ ${g.home}</option>`).join("");
  $("#main").innerHTML = `<div class="controls">
    <div class="seg" id="mkt">${MARKETS.map(([k,n])=>`<button data-m="${k}" class="${state.market===k?"on":""}">${n}</button>`).join("")}</div>
    <select id="fday" aria-label="Day"><option value="all">All days</option>${dates.map(d=>`<option value="${d}" ${state.pday===d?"selected":""}>${dayLabel(d)}</option>`).join("")}</select>
    <select id="fgame" aria-label="Game"><option value="all">All games</option>${gameOpts}</select>
    <input type="search" id="fq" placeholder="Search player" value="${esc(state.q)}">
    <label class="toggle"><input type="checkbox" id="freg" ${state.onlyReg?"checked":""}> regression signals only</label>
    <div class="seg" id="psort"><button data-s="p" class="${state.psort==="p"?"on":""}">Most likely</button><button data-s="ev" class="${state.psort==="ev"?"on":""}">Best value</button></div></div>
  <div class="card tablewrap"><table><thead><tr><th>Player</th><th class="n">TOI</th><th>Probability</th><th class="n">Fair</th><th class="n">Odds</th><th class="n">EV</th><th class="hide-sm">Last 10</th><th>Signals</th></tr></thead><tbody id="ptb"></tbody></table></div>
  <p class="foot">Only players expected to play. The odds box shows the market price in grey. Type your own to override it. Click a player to open his game.</p>`;
  $("#mkt").onclick = e => { const b=e.target.closest("button"); if(b){ state.market=b.dataset.m; propsTab(); } };
  $("#fday").onchange = e => { state.pday=e.target.value; state.pfilter="all"; propsTab(); };
  $("#fgame").onchange = e => { state.pfilter=e.target.value; rowsTop(); };
  $("#fq").oninput = e => { state.q=e.target.value.toLowerCase(); rowsTop(); };
  $("#freg").onchange = e => { state.onlyReg=e.target.checked; rowsTop(); };
  $("#psort").onclick = e => { const b=e.target.closest("button"); if(b){ state.psort=b.dataset.s; propsTab(); } };
  rowsTop();
}
function rowsTop(){
  const m = state.market; const rows = [];
  for (const g of DATA.games){
    if (state.pday!=="all" && g.date!==state.pday) continue;
    if (state.pfilter!=="all" && String(g.id)!==String(state.pfilter)) continue;
    for (const pr of g.props){ const p = P(pr.id); if(!p.active) continue;
      if (state.q && !p.name.toLowerCase().includes(state.q)) continue;
      if (state.onlyReg && !isReg(p)) continue;
      const v = prob(pr,g,m), od = getOdds(g.id,pr.id,m); rows.push({g,pr,p,v,od,ev:od==null?null:v*od-1}); }
  }
  if (state.psort==="ev") rows.sort((a,b)=>(b.ev??-9)-(a.ev??-9)); else rows.sort((a,b)=>b.v-a.v);
  $("#ptb").innerHTML = rows.slice(0,300).map(({g,pr,p,v,od,ev})=>{
    const last = p.form.games.slice(0,10);
    return `<tr class="row" data-g="${g.id}" data-id="${pr.id}">
      <td><div class="pl"><div class="jersey">${p.num??""}</div><div><div class="nm">${esc(p.name)} ${injPill(p.injury)}</div><div class="sub">${logo(pr.team,18)} ${p.pos} · ${pr.team} ${pr.home?"vs":"@"} ${pr.opp} · ${dayLabel(g.date)}</div></div></div></td>
      <td class="n num">${fmt(p.toi_proj,1)}</td>
      <td><div class="bar"><i style="width:${Math.min(100,v*100)}%"></i><span>${pct(v,1)}</span></div></td>
      <td class="n num">${(1/v).toFixed(2)}</td>
      <td class="n"><input class="odds" id="to-${g.id}-${pr.id}" data-g="${g.id}" data-pid="${pr.id}" value="${userOdds(g.id,pr.id,m)??""}" placeholder="${book(g.id,pr.id,m)?.o?.toFixed(2)??"—"}"></td>
      <td class="n ${ev==null?"":ev>0?"ev-pos":"ev-neg"}">${ev==null?"–":(ev>0?"+":"")+(ev*100).toFixed(1)+"%"}</td>
      <td class="hide-sm"><div class="hits">${last.map(x=>`<i class="${hitGame(x,m)?"y":""}" title="${x.d} ${x.o}: ${x.g}G ${x.a}A ${x.s}S"></i>`).reverse().join("")}</div></td>
      <td>${regPills(p)}</td></tr>`; }).join("") || `<tr><td colspan="8" class="empty">No players match.</td></tr>`;
  $("#ptb").onclick = e => { if (e.target.closest("input")) return; const tr=e.target.closest("tr.row"); if(tr){ const pr = P(tr.dataset.id); state.tab="games"; go({tab:"games", game:tr.dataset.g, side: pr.team}); state.open = tr.dataset.id; render(); } };
  $("#ptb").onchange = e => { const i=e.target.closest("input.odds"); if(!i) return; const v=parseFloat(i.value.replace(",",".")); store.set(oddsKey(i.dataset.g,i.dataset.pid,state.market), isNaN(v)?"":v); rowsTop(); };
}

// ------------------------------------------------------------ track record
function calibChart(s){
  if (!s || !s.bins?.length) return "";
  const W=260, Hh=180, pad=28, X=v=>pad+v*(W-pad-8), Y=v=>Hh-pad-v*(Hh-pad-8);
  const mx = Math.min(1, Math.max(0.5, ...s.bins.map(b=>Math.max(b.pred,b.actual)))+0.05), sc = v=>Math.min(v,mx)/mx;
  return `<svg viewBox="0 0 ${W} ${Hh}" width="100%" style="max-width:320px">
    <line x1="${X(0)}" y1="${Y(0)}" x2="${X(1)}" y2="${Y(1)}" stroke="var(--mute)" stroke-dasharray="4 4"/>
    <line x1="${X(0)}" y1="${Y(0)}" x2="${X(1)}" y2="${Y(0)}" stroke="var(--line)"/><line x1="${X(0)}" y1="${Y(0)}" x2="${X(0)}" y2="${Y(1)}" stroke="var(--line)"/>
    <text x="${X(1)}" y="${Hh-8}" fill="var(--mute)" font-size="10" text-anchor="end">predicted → ${pct(mx)}</text>
    <text x="4" y="12" fill="var(--mute)" font-size="10">actual</text>
    ${s.bins.map(b=>`<circle cx="${X(sc(b.pred))}" cy="${Y(sc(b.actual))}" r="${Math.min(9,3+Math.sqrt(b.n)/3)}" fill="var(--accent)" fill-opacity=".75"><title>predicted ${pct(b.pred,1)} · actual ${pct(b.actual,1)} · n=${b.n}</title></circle>`).join("")}</svg>`;
}
function trackTab(){
  const T = DATA.graded;
  if (!T || !T.days?.length){
    $("#main").innerHTML = `<div class="card empty prose" style="margin:auto"><h3>No graded predictions yet</h3><p>Every update saves the model's probabilities. The day after games are played they are graded automatically, and this page shows whether the percentages came true.</p></div>`; return; }
  const rows = obj => Object.entries(obj).filter(([,s])=>s).map(([k,s])=>`<tr><td>${k}</td><td class="n num">${s.n}</td><td class="n num">${pct(s.mean_pred,1)}</td><td class="n num">${pct(s.hit_rate,1)}</td><td class="n num">${s.brier.toFixed(4)}</td><td class="n num ${s.skill>0?"ev-pos":"ev-neg"}">${(s.skill*100).toFixed(1)}%</td></tr>`).join("");
  const blends = Object.entries(T.ou_blends||{}).map(([L,arr])=>{ const best = arr.reduce((a,b)=>b.brier<a.brier?b:a);
    return `<div class="box"><h4>Over ${L}: best history weight</h4><table class="mini"><thead><tr><th>Weight</th><th class="n">Brier</th></tr></thead><tbody>${arr.map(r=>`<tr><td>${(r.w*100).toFixed(0)}%</td><td class="n ${r===best?"ev-pos":""}">${r.brier.toFixed(4)}</td></tr>`).join("")}</tbody></table><p class="note">Lowest Brier so far: ${(best.w*100).toFixed(0)}%.</p></div>`; }).join("");
  $("#main").innerHTML = `<p class="meta">${T.days.length} days graded · ${T.days.reduce((a,d)=>a+d.games_final,0)} games · ${T.days.reduce((a,d)=>a+d.props,0)} player-games. Skill above 0% means better than guessing the base rate.</p>
    <div class="card tablewrap"><table><thead><tr><th>Market</th><th class="n">Bets</th><th class="n">Predicted</th><th class="n">Happened</th><th class="n">Brier</th><th class="n">Skill</th></tr></thead>
    <tbody>${rows(T.props)}${rows(T.sog)}${rows(Object.fromEntries(Object.entries(T.ou_model).map(([k,v])=>["Game "+k+" (model)",v])))}${rows(Object.fromEntries(Object.entries(T.ou_hist).map(([k,v])=>["Game "+k+" (history only)",v])))}</tbody></table></div>
    ${T.bets && Object.values(T.bets).some(Boolean) ? `<div class="card tablewrap" style="margin-top:14px"><table><thead><tr><th>Value bets (model EV ≥ 5% at the market price)</th><th class="n">Bets</th><th class="n">Won</th><th class="n">Profit (1 unit each)</th><th class="n">ROI</th></tr></thead><tbody>
      ${Object.entries(T.bets).filter(([,b])=>b).map(([k,b])=>`<tr><td>${k}</td><td class="n num">${b.n}</td><td class="n num">${b.won}</td><td class="n num ${b.profit>0?"ev-pos":"ev-neg"}">${b.profit>0?"+":""}${b.profit.toFixed(2)}</td><td class="n num ${b.roi>0?"ev-pos":"ev-neg"}">${(b.roi*100).toFixed(1)}%</td></tr>`).join("")}</tbody></table></div>` : ""}
    <div class="dgrid" style="margin-top:14px">${Object.entries(T.props).filter(([,s])=>s).map(([k,s])=>`<div class="box"><h4>Calibration: ${k}</h4>${calibChart(s)}</div>`).join("")}${blends}</div>`;
}

// ------------------------------------------------------------ how it works + experiments
function howTab(){
  const t = C.streak_thresholds;
  $("#main").innerHTML = `<div class="prose">
  <h3>What the site does</h3>
  <p>For every player in every upcoming game, the model estimates his chance to score a goal, get an assist, get a point and reach a number of shots on goal. It shows those chances next to the market odds, so you can see where the two agree and where they don't. It's a tool to help you decide, not a tipster.</p>

  <h3>How a probability is built</h3>
  <p><b>Expected goals tonight = ice time × his true scoring rate × opponent defence × opposing goalie × home/away × back-to-back × league scoring level.</b> That expectation becomes "chance of at least one" with a standard formula for rare events (Poisson).</p>
  <ul>
    <li><b>True scoring rate:</b> built from the last ${C.lookback_seasons} seasons, recent seasons counting most (${C.season_weights.join("-")}), then pulled toward the league average. The less a player has played, the stronger the pull. This is regression to the mean in practice: a hot or cold start is mostly treated as luck until there's enough evidence.</li>
    <li><b>Shooting %:</b> regressed twice, career toward the league average and recent seasons toward his career level. Goals per 60 minutes blends <i>shots × true shooting %</i> with <i>expected goals from shot quality × finishing skill</i>.</li>
    <li><b>Ice time:</b> last ${C.toi_recent_games} games blended with the season average.</li>
    <li><b>Goalies:</b> goals allowed vs expected goals allowed over ${C.goalie_seasons} seasons, compared with an average goalie. Change the starter on a game page and every prop updates.</li>
  </ul>

  <h3>Has it been tested?</h3>
  <p>Yes. The model was replayed over five full seasons (2021-22 to 2025-26), about 214,000 player-games, using only information available before each game.</p>
  <ul>
    <li><b>The percentages are honest.</b> Goals: predicted 15.5%, happened 15.4%. Points: 35.8% vs 35.2%. When it says about 34% for a goal, it happens about 36% of the time.</li>
    <li><b>It beats a simple season average</b> in every market (goals, assists, points, shots).</li>
    <li><b>Shots on goal ran about 6% high</b>, and this is now corrected.</li>
    <li>3 or 5 seasons of history made practically no difference.</li>
  </ul>
  <p>A good probability isn't a sure thing. A 35% chance misses two times out of three, and a single game is mostly chance. Profit against the market hasn't been tested; that needs months of results.</p>

  <h3>Reading a game page</h3>
  <ul>
    <li><b>Best picks in this game:</b> up to two bets, a goal or a point, with the highest edge against the market odds. When the edge is similar it prefers the point, which wins more often. Green lines are the facts behind the pick; orange lines are warnings. When most value sits on one team, it says so: those bets tend to win or lose together.</li>
    <li><b>Roster grid:</b> the model's probability in large print, and below it the market odds (green with an outline when the model sees +5% value or more) or the fair odds if the market has no price yet.</li>
    <li><b>Player breakdown</b> (click a player): model vs market for every market, how the number is built, regression to the mean, last 10 games, and his history as a table or chart.</li>
  </ul>

  <h3>Words used on the site</h3>
  <ul>
    <li><b>Fair odds</b> = 1 ÷ probability: the odds at which a bet would break even in the long run.</li>
    <li><b>Market %</b> = the probability implied by the market odds, with the margin removed.</li>
    <li><b>Edge / EV</b> = model probability × odds − 1. +10% means the model expects 10% profit per bet in the long run, if the model is right.</li>
    <li><b>▲ Due / ▼ Hot</b> = scoring clearly below / above his true talent this season. In testing, "due" players did <i>not</i> score more than the model already expected, so it's context, not a reason to bet on its own.</li>
    <li><b>Shots dry</b> = shots since his last goal, and how rare a drought that long is for his talent.</li>
    <li><b>Projected / Likely / Confirmed</b> goalie = from the latest starting-goalie reports. "Projected" means no report yet: the goalie with the most recent starts, the backup on back-to-backs.</li>
    <li><b>Out / Day-to-Day</b>: injured players marked Out are removed from the props; questionable players stay in with a yellow mark.</li>
  </ul>

  <h3>Charts</h3>
  <p>In a player breakdown, switch Table to Chart. Choose goals, assists, points, shots, <b>shooting %</b> (with his true-talent line and the league average) or <b>goals vs expected</b> (bars = actual goals, line = goals his chances deserved). Compare season, previous 3, previous 5 and career, or season by season. Use <b>per game</b> or <b>82-game pace</b> to compare an unfinished season fairly; pace is the current rate stretched to 82 games, not a forecast. Faded bars are small samples.</p>

  <h3>Experiments: the two sliders</h3>
  <p>Two ideas that can be switched on to test them. Both are off (0%) by default.</p>
  <div class="card exp">
    <label for="sw">6-game rule <input type="range" id="sw" min="0" max="5" step="0.5" value="${state.streakW}"> <output id="swo">${(+state.streakW).toFixed(1)}%</output></label>
    <p class="note">When a team reaches its streak threshold (strong teams ${t.strong.win} wins / ${t.strong.loss} losses, average ${t.average.win}/${t.average.loss}, weak ${t.weak.win}/${t.weak.loss}), the model expects the streak to end: at 2%, a team one game past its threshold scores 2% fewer goals and allows 2% more. In testing, long <i>winning</i> streaks showed no effect; long <i>losing</i> streaks ended more often than the team's record suggested (161 cases, suggestive but not proven).</p>
  </div>
  <div class="card exp">
    <label for="hw">History weight for totals <input type="range" id="hw" min="0" max="60" step="5" value="${state.histW}"> <output id="hwo">${state.histW}%</output></label>
    <p class="note">Game totals come from the model (expected goals, goalies, power play). "History" is how often these teams and their head-to-head games actually went over. At 30%, the over % you see is 70% model and 30% history.</p>
  </div>

  <p class="foot">Data: NHL.com and MoneyPuck.com. Updated four times a day. Personal, non-commercial use. Gamble responsibly. Stödlinjen: 020-81 91 00.</p>
  </div>`;
  const sw=$("#sw"), hw=$("#hw");
  sw.oninput = () => { state.streakW=+sw.value; $("#swo").textContent=(+sw.value).toFixed(1)+"%"; store.set("set:streakW", sw.value); };
  hw.oninput = () => { state.histW=+hw.value; $("#hwo").textContent=hw.value+"%"; store.set("set:histW", hw.value); };
}

function render(){
  [...$("#nav").children].forEach(x=>x.classList.toggle("on", x.dataset.tab===state.tab));
  if (state.tab==="games") (state.game ? gamePage : gamesList)();
  else if (state.tab==="props") propsTab();
  else if (state.tab==="track") trackTab();
  else howTab();
}
header();
{ const m = location.hash.match(/^#g(\d+)$/); if (m && gameById[m[1]]) state.game = m[1]; }
render();
