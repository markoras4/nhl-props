<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NHL Props Lab</title>
<meta name="theme-color" content="#0b1118">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Props Lab">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=Oxanium:wght@500;600;700;800&display=swap">
<style>
/* Layout: sticky top bar · games list (home) · game page with side picker · props grid */
:root{
  --bg:#0a0e13; --panel:#111821; --panel2:#17202b; --line:#22303f; --text:#e7eef6; --mute:#8796a8;
  --accent:#3ddc97; --accent2:#5aa9ff; --warn:#ffb547; --bad:#ff6b6b; --good:#3ddc97; --chip:#1b2533;
  --pc1:#3ddc97; --pc2:#5aa9ff; --pc3:#ffb547; --pc4:#f07ac0;
  --heat:61,220,151; --line2:#7ff3ff; --radius:12px; color-scheme:dark;
  --f-ui:"Exo 2",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f-disp:"Oxanium","Exo 2",-apple-system,"Segoe UI",sans-serif;
  --f-num:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]) .lg-d{display:none}
  :root:not([data-theme="dark"]) .lg-l{display:inline-block}
  :root:not([data-theme="dark"]){
    --bg:#f3f5f8; --panel:#ffffff; --panel2:#eef2f6; --line:#dbe2ea; --text:#111821; --mute:#5a697b;
    --accent:#0d9a60; --accent2:#1d6bd0; --warn:#a96400; --bad:#c42f2f; --good:#0d9a60; --chip:#e9eef4;
    --pc1:#0d9a60; --pc2:#1d6bd0; --pc3:#c27a00; --pc4:#c2347f;
    --heat:13,154,96; --line2:#0aa3c2; color-scheme:light;
  }
}
:root[data-theme="light"] .lg-d{display:none}
:root[data-theme="light"] .lg-l{display:inline-block}
:root[data-theme="light"]{
    --bg:#f3f5f8; --panel:#ffffff; --panel2:#eef2f6; --line:#dbe2ea; --text:#111821; --mute:#5a697b;
    --accent:#0d9a60; --accent2:#1d6bd0; --warn:#a96400; --bad:#c42f2f; --good:#0d9a60; --chip:#e9eef4;
    --pc1:#0d9a60; --pc2:#1d6bd0; --pc3:#c27a00; --pc4:#c2347f;
    --heat:13,154,96; --line2:#0aa3c2; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--f-ui)}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:14px;padding-block:12px;flex-wrap:wrap}
.brand{font-family:var(--f-disp);font-weight:800;font-size:19px;letter-spacing:.6px;cursor:pointer;text-transform:uppercase}
.brand b{color:var(--accent)}
.meta{color:var(--mute);font-size:12px}
.demo{background:var(--warn);color:#111;font-weight:700;border-radius:6px;padding:2px 8px;font-size:11px}
nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.tools{display:flex;gap:8px;align-items:center}
.tools .seg button{padding:5px 9px;font-size:12px}
/* desktop/tablet: settings and login top right, the navigation on its own row below (phones use the bottom bar) */
@media (min-width:641px){ .top{row-gap:10px} .tools{order:3;margin-left:auto} nav{order:4;flex-basis:100%;margin-left:-8px} }
@media (min-width:641px) and (max-width:1000px){ .brand{order:1} .tools{order:2} .top>.meta{order:3;flex-basis:100%;margin-top:-6px} nav{order:4} }
.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;width:34px;height:32px;display:grid;place-items:center;cursor:pointer;font-size:15px}
.iconbtn:hover{border-color:var(--accent)}
nav button{background:none;border:0;color:var(--mute);font-weight:600;padding:8px 12px;border-radius:8px;cursor:pointer}
nav button.on{color:var(--text);background:var(--panel2)}
main{padding-block:18px 64px}
h2{font-size:20px;margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--chip);color:var(--mute)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.s-confirmed{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.s-likely{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.s-live{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.s-live i{animation:blink 1.4s infinite}@keyframes blink{50%{opacity:.25}}
.s-final{background:var(--chip);color:var(--text)}
.gmid .sc.live{color:var(--text)}
.livebar{margin-top:10px;display:flex;gap:8px;align-items:center;justify-content:center;font-family:var(--f-disp);font-size:16px}
.frozen{margin-top:8px;font-size:12px;color:var(--mute);font-family:var(--f-ui);font-weight:500;letter-spacing:0;text-transform:none}
.s-out{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.s-q{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.s-up{background:color-mix(in srgb,var(--accent2) 16%,transparent);color:var(--accent2)}
.s-down{background:var(--chip);color:var(--mute)}
.s-due{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.s-hot{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.s-dry{background:color-mix(in srgb,var(--accent2) 16%,transparent);color:var(--accent2)}
.s-b2b{background:color-mix(in srgb,var(--accent2) 16%,transparent);color:var(--accent2)}
select,input[type=search],input.odds{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit}
input.odds{width:70px;padding:5px 7px;text-align:right;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;color:var(--mute);font-weight:650;padding:6px 12px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--accent);color:#03130c}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.toggle{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:13px;cursor:pointer}

/* ---------- games list */
.abar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:10px 14px;margin:6px 0 14px;border:1px solid color-mix(in srgb,var(--accent2) 45%,var(--line));background:color-mix(in srgb,var(--accent2) 8%,var(--panel));border-radius:12px;font-size:14px}
.abar.live{border-color:var(--line);background:var(--panel);font-size:13px;color:var(--mute)}
.abar b{font-family:var(--f-disp);letter-spacing:.3px}
.abar .meta{flex:1 1 320px;margin:0}
.abar .abtn{display:flex;gap:8px;margin-left:auto}
.abar select,.abar button{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:6px 10px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.abar.live select{margin-left:auto}
.abar button{background:var(--accent2);border-color:var(--accent2);color:#fff}
.rmk{font-style:normal;font-weight:800;font-size:11px;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;margin-right:3px;vertical-align:1px}
.rmk.y{background:var(--good);color:var(--accent-ink,#06210f)}.rmk.n{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
.cell{position:relative}.cell .rmk{position:absolute;top:2px;right:2px;width:14px;height:14px;font-size:9.5px;margin:0}
.cell.rmiss{opacity:.55}
.cell.rhit{box-shadow:inset 0 0 0 2px var(--good)}
.rline{display:block;font-size:11.5px;color:var(--mute);margin-top:2px}.rline.pts{color:var(--good);font-weight:600}.rline.dnp{font-style:italic}
.rprop{display:flex;align-items:center;gap:4px;margin-top:3px}.rprop .rline{margin:0}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.day{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;cursor:pointer;text-align:left}
.day b{display:block;font-size:14px;font-family:var(--f-disp);letter-spacing:.5px;text-transform:uppercase}
.day span{font-size:11px;color:var(--mute)}
.day.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.glist{display:grid;gap:10px}
.grow{display:grid;grid-template-columns:72px 1fr 150px 1fr 170px;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;transition:border-color .15s}
.grow:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.gtime{font-family:var(--f-disp);font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.gtime small{display:block;color:var(--mute);font-weight:500;font-size:11px}
.gteam{display:flex;flex-direction:column;gap:3px;min-width:0}
.gteam.r{align-items:flex-end;text-align:right}
.abbr{font-family:var(--f-disp);font-size:22px;font-weight:800;letter-spacing:1px}
.tm{display:flex;align-items:center;gap:10px}
.gteam.r .tm{flex-direction:row-reverse}
.lg{width:var(--lg,40px);height:var(--lg,40px);object-fit:contain;flex:0 0 auto;display:inline-block}
.lg-l{display:none}
.lgfb{width:var(--lg,40px);height:var(--lg,40px);border-radius:50%;background:var(--chip);display:inline-grid;place-items:center;font-family:var(--f-disp);font-size:11px;font-weight:700;color:var(--mute);flex:0 0 auto}
.gteam .sub{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.gmid{text-align:center}
.gmid .sc{font-family:var(--f-disp);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.gmid .wpb{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:6px;background:var(--chip)}
.wpb i:first-child{background:var(--accent2)}.wpb i:last-child{background:var(--accent)}
.gou{display:grid;grid-template-columns:auto auto auto;gap:2px 10px;font-size:12px;justify-content:end;align-items:baseline}
.gou .go{font-family:var(--f-disp);font-weight:600;color:var(--mute);font-variant-numeric:tabular-nums;min-width:30px;text-align:right}
.gou .go.val,.godds .val{color:var(--good);font-weight:700}
.godds{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;font-family:var(--f-disp);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.godds small{font-family:var(--f-ui);font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.h2h{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;font-size:12.5px}
.h2s{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-bottom:6px}
.h2s span{color:var(--mute);font-size:12px}
.h2r,.h2head{display:grid;grid-template-columns:96px 1fr 18px 1fr 40px;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.h2head{padding:0 0 2px;border-bottom:0;font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
.h2r:last-child{border-bottom:0}
.h2d{color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.h2t{display:flex;align-items:center;gap:6px;color:var(--mute)}
.h2t b{font-family:var(--f-disp);font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums;min-width:14px;text-align:center}
.h2t.l{justify-content:flex-end}
.h2t.r{flex-direction:row-reverse;justify-content:flex-end}
.h2head .l{text-align:right}
.h2t.w{color:var(--text);font-weight:700}.h2t.w b{color:var(--text)}
.h2at{text-align:center;color:var(--mute);font-size:11px}
.h2tot{text-align:right;font-family:var(--f-disp);font-weight:600;font-variant-numeric:tabular-nums}
@media (max-width:640px){.h2r,.h2head{grid-template-columns:72px 1fr 14px 1fr 30px}.h2t img,.h2t .lgfb{display:none!important}}
.sgbox{margin-bottom:12px}
.sgtop{display:flex;flex-wrap:wrap;gap:8px 16px;margin-bottom:10px;font-size:13px}
.sgt{display:inline-flex;align-items:center;gap:6px}
.sgt b{font-family:var(--f-disp)}
.sgt i,table.sg .sgb{font-style:normal;font-family:var(--f-disp);font-weight:800;font-size:10px;width:16px;height:16px;border-radius:50%;background:var(--accent);color:#03130c;display:inline-grid;place-items:center}
.sgwrap{display:flex;flex-direction:column;gap:4px;align-items:center}
.sgaxis-h,.sgaxis-v{font-size:11px;color:var(--mute);font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
.sgrow{display:flex;align-items:center;gap:8px}
.sgaxis-v{writing-mode:vertical-rl;transform:rotate(180deg)}
.sgaxis-v img{transform:rotate(90deg)}
table.sg{border-collapse:separate;border-spacing:3px;width:auto}
table.sg th{font-family:var(--f-disp);font-size:12px;color:var(--mute);text-align:center;padding:4px;cursor:default;border:0}
table.sg td.tie{background:transparent;color:var(--mute);box-shadow:inset 0 0 0 1px var(--line)}
table.sg td{width:56px;height:38px;text-align:center;border-radius:6px;font-family:var(--f-disp);font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums;position:relative;border:0;padding:0}
table.sg td.top{box-shadow:inset 0 0 0 2px var(--accent);font-weight:800}
table.sg .sgv{display:flex;align-items:center;justify-content:center;gap:4px;height:100%}
table.sg .sgb{width:14px!important;height:14px!important;font-size:9px!important;flex:0 0 auto}
table.sg .sgm{background:none!important;color:var(--mute);font-size:11px;font-weight:600}
@media (max-width:640px){table.sg td{width:34px;height:32px;font-size:10.5px}table.sg{border-spacing:2px}.sgaxis-v{display:none}table.sg .sgb{display:none!important}}
.totop{position:fixed;right:calc(18px + env(safe-area-inset-right, 0px));bottom:calc(18px + env(safe-area-inset-bottom, 0px));z-index:40;width:44px;height:44px;border-radius:50%;
  border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(8px);color:var(--text);font-size:20px;cursor:pointer;
  display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .2s,transform .2s,border-color .15s}
.totop.show{opacity:1;transform:none;pointer-events:auto}
.totop:hover{border-color:var(--accent);color:var(--accent)}
.gou span:nth-child(odd){color:var(--mute)}
.gou b{font-variant-numeric:tabular-nums}
.tags{display:flex;gap:5px;flex-wrap:wrap}

/* ---------- game page */
.back{background:none;border:0;color:var(--mute);cursor:pointer;padding:0;margin-bottom:12px;font-weight:600}
.back:hover{color:var(--text)}
.ghero{padding:18px 20px;display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center}
.ghero .abbr{font-size:34px}
.ghero .tm{--lg:64px;gap:14px}
.ghero .tm.r{flex-direction:row-reverse;text-align:right}
.sides .lg{--lg:22px}
.sides button{display:inline-flex;align-items:center;gap:8px}
.pl .lg{--lg:18px;vertical-align:-4px;margin-right:2px}
.ghero .big{font-family:var(--f-disp);font-size:36px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;letter-spacing:.5px}
.ghero .big small{display:block;font-size:11px;color:var(--mute);font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.gsum{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 18px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;min-width:0}
.box h4{font-family:var(--f-disp);margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);display:flex;justify-content:space-between;align-items:center;gap:8px}
.ou{display:grid;grid-template-columns:auto repeat(4,1fr);gap:6px 10px;align-items:center;font-size:13px}
.ou .h{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.4px}
.sides{display:flex;justify-content:center;margin-bottom:16px}
.sides .seg button{padding:8px 18px;font-size:14px}
.sidegrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.3fr);gap:12px;margin-bottom:14px}
.sidegrid .newsbox{grid-column:1/-1}
.msl{display:flex;flex-direction:column;gap:8px;font-size:13px}
.msben{font-size:12.5px;margin:10px 0 0;color:var(--mute)}.msben b{color:var(--text);font-weight:600}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:12.5px}
.kv span:nth-child(odd){color:var(--mute)}
.kv span:nth-child(even){font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.gname{font-family:var(--f-disp);font-size:18px;font-weight:750;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.injl{display:flex;flex-direction:column;gap:8px;font-size:13px}
.inj{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:start}
.inj .d{grid-column:2;color:var(--mute);font-size:12px}
.newsl{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute)}
.newsl li::marker{color:var(--accent)}
.lines{display:grid;gap:6px;font-size:12.5px}
.line{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center}
.line .lab{font-size:10.5px;font-weight:700;color:var(--mute);text-transform:uppercase}
.lp{display:flex;gap:6px;flex-wrap:wrap}
.lp span{background:var(--chip);border-radius:6px;padding:3px 7px;white-space:nowrap}
.lp span b{font-variant-numeric:tabular-nums;color:var(--accent);margin-left:4px;font-size:11px}
.lp span.q{box-shadow:inset 0 0 0 1px var(--warn)}

/* ---------- props grid */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-family:var(--f-disp);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute);font-weight:650;text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th.s{cursor:pointer;user-select:none}
th.s:hover{color:var(--text)}
th.on{color:var(--accent)}
th.n,td.n{text-align:right}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--panel2)}
tr.open>td{background:var(--panel2)}
tr.grp td{background:transparent;color:var(--mute);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding-top:14px}
tr.out td{opacity:.55}
.pl{display:flex;align-items:center;gap:9px;min-width:180px}
.jersey{width:28px;height:28px;border-radius:7px;background:var(--chip);display:grid;place-items:center;font-weight:700;font-size:11.5px;color:var(--mute);flex:0 0 auto}
.pl .nm{font-weight:650}
.pl .sub{font-size:11.5px;color:var(--mute)}
td.h{text-align:center;padding:4px}
.cell{border-radius:7px;padding:5px 6px;min-width:62px;font-variant-numeric:tabular-nums;line-height:1.2}
.cell b{display:block;font-size:14px;font-family:var(--f-disp);font-weight:700}
.cell small{font-size:10.5px;color:var(--mute)}

    tr_brier_tip:"Genomsnittligt kvadratfel för sannolikheterna (0 = perfekt). Jämför bara inom samma rad: en ovanlig händelse har alltid låg Brier.",
    tr_skill_tip:"Hur mycket bättre än en naiv gissning som bara använder hur ofta det här händer i allmänhet. Över 0 % = modellen tillför något. Brusigt tills det finns några hundra prognoser.",
    tr_calib_note:"Varje punkt samlar prognoser med liknande sannolikhet. På den streckade linjen = det modellen sa hände så ofta. Över = det hände oftare än förutsagt, under = mer sällan.",
    tr_blend_note:"Matchtotalen blandar modellen med lagens målhistorik. 0 % = bara modellen, 100 % = bara historiken. Visar vilken blandning som hittills hade träffat bäst.",
    tr_how_h:"Så läser du sidan",
    tr_how:`<p>Varje uppdatering sparar modellens sannolikheter före matcherna. Efteråt jämförs de med vad som faktiskt hände. Det här är modellens protokoll, inte en lista med spel.</p><dl>
      <dt>Prognoser</dt><dd>Hur många som rättats. Varje spelare i varje färdigspelad match får en prognos för mål, assist, poäng och skott, så en match med 36 spelare ger 36 på varje rad.</dd>
      <dt>Förutsagt mot utfall</dt><dd>Genomsnittlig sannolikhet mot verklig frekvens. Ger modellen 25 % för assist på 400 spelarmatcher ska ungefär 100 av dem få en.</dd>
      <dt>Brier</dt><dd>Genomsnittligt kvadratfel för sannolikheterna. 0 är perfekt, lägre är bättre. Ovanliga händelser får alltid lågt värde, så jämför inom en rad över tid, inte mellan rader.</dd>
      <dt>Skicklighet</dt><dd>Brier jämfört med en naiv prognos som ger alla spelare ligasnittet. +15 % betyder 15 % mindre fel än den. Över 0 betyder att modellen tillför något.</dd>
      <dt>Kalibrering</dt><dd>Punkter på den streckade diagonalen betyder att när modellen säger 30 % händer det ungefär 30 % av gångerna. Det är det som gör EV-beräkningarna pålitliga.</dd>
      <dt>Historikvikt</dt><dd>Matchtotalen (över 5,5 / 6,5) kan blanda modellen med lagens målhistorik. Tabellen visar vilken blandning som hittills hade träffat bäst.</dd>
      <dt>Värdespel</dt><dd>Inte våra tips. Alla spel där modellens EV var 5 % eller mer till spelbolagets pris, med 1 enhet per spel, för att testa om de övervärdena lönar sig. En kontroll av modellen, inte råd.</dd></dl>
      <p>Med få rättade matcher är allt detta brus: en match kan svänga en rad från +30 % till −30 %. Döm efter flera hundra spelarmatcher.</p>`,

  state.side = c.dataset.stt; state.open = c.dataset.stp; render();
  setTimeout(()=>{ const r = document.querySelector(`tr.row[data-id="${c.dataset.stp}"]`); if (r) r.scrollIntoView({behavior:"smooth", block:"start"}); }, 50);

function streaksTable(){
  const f = state.stf || "all", rows = [];
  for (const g of DATA.games){
    if (state.pday!=="all" && g.date!==state.pday) continue;
    if (state.pfilter!=="all" && String(g.id)!==String(state.pfilter)) continue;
    for (const x of streaksForGame(g)){
      if (state.q && !x.p.name.toLowerCase().includes(state.q)) continue;
      if (f==="gd" && x.k!=="gd") continue; if (f==="pd" && x.k!=="pd") continue;
      if (f==="ps" && !(x.k==="ps"||x.k==="gs")) continue; if (f==="ms" && x.k!=="ms") continue;
      rows.push(x); } }
  rows.sort((a,b)=>ST_ORDER[a.k]-ST_ORDER[b.k] || a.rank-b.rank);
  const mlabel = x => x.k==="ms" ? (x.need ? t("st_reach") : "") : mName(x.m);
  return rows.map(x=>{ const od = x.m ? getOdds(x.g.id, x.pr.id, x.m) : null, ev = od && x.v!=null ? x.v*od-1 : null;
    return `<tr class="row" data-g="${x.g.id}" data-id="${x.pr.id}">
      <td><div class="pl"><div class="jersey">${x.p.num??""}</div><div><div class="nm">${esc(x.p.name)} ${injPill(x.p.injury)}</div><div class="sub">${logo(x.pr.team,18)} ${x.p.pos} · ${x.pr.team} ${x.pr.home?"vs":"@"} ${x.pr.opp} · ${dayLabel(x.g.date)}</div></div></div></td>
      <td><span class="stlab st-${x.k}">${x.label}</span></td>
      <td class="n hide-xs">${x.rare!=null?`<span class="tip" tabindex="0" data-tip="${esc(t("st_rare_tip",{x:Math.max(2,Math.round(1/x.rare))}))}">${t("st_rare",{x:Math.max(2,Math.round(1/x.rare))})}</span>`:"–"}</td>
      <td>${x.v!=null?`<span class="meta">${mlabel(x)}</span> <b>${pct(x.v,1)}</b>`:"–"}</td>
      <td class="n hide-xs">${x.v?oddsTxt(1/x.v):"–"}</td>
      <td class="n">${x.m?`<input class="odds" data-g="${x.g.id}" data-pid="${x.pr.id}" data-m="${x.m}" value="${userOdds(x.g.id,x.pr.id,x.m)!=null?oddsTxt(userOdds(x.g.id,x.pr.id,x.m)):""}" placeholder="${book(x.g.id,x.pr.id,x.m)?.o!=null?oddsTxt(book(x.g.id,x.pr.id,x.m).o):"—"}">`:""}</td>
      <td class="n ${ev==null?"":ev>0?"ev-pos":"ev-neg"}">${ev==null?"–":evTxt(ev)}</td></tr>`; }).join("") || `<tr><td colspan="7" class="empty">${t("st_none")}</td></tr>`;
}
function regPills(p){
  const r = p.regress, d = p.drought, out = [];
  if (r.flag==="due") out.push(`<span class="pill s-due" title="${esc(t("tip_due"))}">${t("pill_due")}</span>`);
  if (r.flag==="hot") out.push(`<span class="pill s-hot" title="${esc(t("tip_hot"))}">${t("pill_hot")}</span>`);
  if (d.found && d.p!=null && d.p<0.15 && d.shots>=8) out.push(`<span class="pill s-dry" title="${esc(t("tip_dry",{n:d.shots,p:pct(d.p),x:Math.max(2,Math.round(1/d.p))}))}">${t("pill_dry",{n:d.shots})}</span>`);
  return out.concat(roleTags(p)).join(" ");
}
function roleTags(p){
  const out = [], r = p.role, tags = p.role_tags || [];
  const big = r && Math.abs(r.toi_delta) >= 3 && Math.abs(r.toi_delta) / (r.toi_base||99) >= 0.18;
  if (big && r.toi_delta > 0) out.push(`<span class="pill s-up" title="${esc(t("tip_toi_up",{a:fmt(r.toi5,1),b:fmt(r.toi_base,1)}))}">▲ ${t("pill_toi")} +${fmt(r.toi_delta,1)}</span>`);
  if (big && r.toi_delta < 0) out.push(`<span class="pill s-down" title="${esc(t("tip_toi_down",{a:fmt(r.toi5,1),b:fmt(r.toi_base,1)}))}">▼ ${t("pill_toi")} ${fmt(r.toi_delta,1)}</span>`);
  const T = {pp1_new:["s-up","pill_pp1_new","tip_pp1_new"], pp1_lost:["s-down","pill_pp1_lost","tip_pp1_lost"],
             line_up:["s-up","pill_line_up","tip_line_up"], line_down:["s-down","pill_line_down","tip_line_down"]};
  tags.forEach(k => { const x = T[k]; if (x) out.push(`<span class="pill ${x[0]}" title="${esc(t(x[2]))}">${t(x[1])}</span>`); });
  return out;
}
const isReg = p => p.regress.flag || (p.drought.found && p.drought.p<0.15 && p.drought.shots>=8);

function wireHeader(){
  $("#nav").onclick = e => { const b=e.target.closest("button"); if(!b) return; go({tab:b.dataset.tab, game:null}); };
  $("#home").onclick = () => go({tab:"games", game:null});

  $("#ofmt").onchange = e => { OFMT = e.target.value; store.set("set:ofmt", OFMT); header(); render(); };

  tt.onclick = () => window.scrollTo({top:0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});

function go(patch){
  Object.assign(state, patch, {open:null});
  if (patch.game===null && location.hash) history.replaceState(null,"",location.pathname);
  if (patch.game) { history.replaceState(null,"","#g"+patch.game); }
  render(); window.scrollTo(0,0);
}

function h2hBlock(g){
  const h = g.h2h;
  if (!h?.n) return `<p class="note">${t("no_meetings")}</p>`;
  const H = g.home, A = g.away, line = C.ou_lines[0];
  // scores are stored from the home team's point of view (H goals - A goals)
  const games = h.games.map(x=>{ const [hg, ag] = x.score.split("-").map(Number); return {date:x.date, hg, ag, hHome:x.home}; });
  const hw = games.filter(x=>x.hg>x.ag).length, aw = games.length - hw;
  const over = games.filter(x=>x.hg+x.ag>line).length;
  const team = (tm, goals, win, side) => `<span class="h2t ${side} ${win?"w":""}">${logo(tm,18)}<span>${tm}</span><b>${goals}</b></span>`;
  const rows = games.map(x=>{
    const left = x.hHome ? team(A, x.ag, x.ag>x.hg, "l") : team(H, x.hg, x.hg>x.ag, "l");    // away side of that meeting
    const right = x.hHome ? team(H, x.hg, x.hg>x.ag, "r") : team(A, x.ag, x.ag>x.hg, "r");   // home side of that meeting
    const d = new Date(x.date+"T12:00:00").toLocaleDateString(LOCALE(),{day:"numeric",month:"short",year:"numeric"});
    return `<div class="h2r"><span class="h2d">${d}</span>${left}<span class="h2at">–</span>${right}<span class="h2tot">${x.hg+x.ag}</span></div>`;
  }).join("");
  return `<div class="h2h"><div class="h2s"><b>${t("h2h_title")}</b><span>${t("h2h_sum",{a:A, aw, hw, h:H, avg:fmt(h.avg_total,1), l:line, o:over, n:games.length})}</span></div>
    <div class="h2head"><span></span><span class="l">${t("h2h_away")}</span><span></span><span>${t("h2h_home")}</span><span class="h2tot">${t("h2h_total")}</span></div>${rows}</div>`;
}
function winOdds(g, d){

  return `<div class="godds">${cell(w.away, d.pa)}<small>${t("odds_word")}</small>${cell(w.home, d.ph)}</div>`;
}

// ------------------------------------------------------------ best picks (helper, not a verdict)
function bestPicks(g){
  const hasOdds = !!DATA.odds?.[g.id];
  const cands = [];
  for (const pr of g.props){
    const p = P(pr.id); if (!p?.active) continue;
    const opts = ["g","pt"].map(m=>{ const v = prob(pr,g,m), od = getOdds(g.id,pr.id,m); return {m, v, od, ev: od ? v*od-1 : null}; });
    if (hasOdds){
      const ok = opts.filter(o=>o.ev!=null && o.ev>0); if (!ok.length) continue;
      ok.sort((a,b)=>b.ev-a.ev);
      let pick = ok[0];
      const pt = ok.find(o=>o.m==="pt");
      if (pick.m==="g" && pt && pt.ev >= pick.ev - 0.03) pick = pt;   // similar edge: take the safer point
      // ranking trusts the edge less when he has a short NHL history (the biggest gaps vs the market show up
      // exactly where the model knows least); the EV shown stays the real one
      const trust = Math.min(1, ((p.windows?.career?.gp || 0) + 10) / 60);
      cands.push({pr, p, ...pick, rank: pick.ev * trust});
    } else {
      const pt = opts.find(o=>o.m==="pt"); cands.push({pr, p, ...pt});
    }
  }
  cands.sort((a,b)=> hasOdds ? (b.rank??b.ev)-(a.rank??a.ev) : b.v-a.v);

const SMALL_SHOTS = 40;
function chartRows(p){
  const c = state.chart, k = c.stat, cur = DATA.season;
  const scale = (tot, gp, seasons, isCur) => {
    if (tot==null || !gp) return null;
    if (c.unit==="pg") return tot/gp;
    if (c.unit==="pace") return tot/gp*82;
    return isCur ? tot : tot/(seasons||1);
  };
  let base;
  if (c.mode==="windows"){
    const W = p.windows, X = p.xg_windows||{};
    base = WINDOWS().map(([key,lab])=>{
      const w = W[key]; if(!w) return {lab, v:null};
      const x = X[key];
      return {lab, key, w, isCur: key==="cur", gp:w.gp, seasons:w.seasons, g:w.g, a:w.a, p:w.p, s:w.s,
              xg: x ? x.xg : null, xgp: x ? x.gp : null, sub: key==="cur" ? t("gp_n",{g:w.gp}) : t("seas_gp",{s:w.seasons, g:w.gp})};
    });
  } else {
    base = (p.by_season||[]).slice().sort((a,b)=>a.y-b.y).map(r=>({
      lab: `${String(r.y).slice(2)}–${String(r.y+1).slice(2)}`, isCur: r.y===cur, gp:r.gp, seasons:1,
      g:r.g, a:r.a, p:r.p, s:r.s, xg: r.xg ?? null, xgp: r.xg_gp ?? null, sub: t("gp_n",{g:r.gp})}));
  }
  return base.map(r=>{
    if (r.gp==null) return r;
    if (k==="sh") return {...r, v: r.s ? r.g/r.s : null, small: (r.s||0) < SMALL_SHOTS, sub: t("g_s",{g:r.g, s:r.s})};
    if (k==="gx"){
      const v = scale(r.g, r.gp, r.seasons, r.isCur);
      const v2 = r.xg!=null && r.xgp ? scale(r.xg, r.xgp, r.seasons, r.isCur) : null;
      return {...r, v, v2, small: (r.s||0) < SMALL_SHOTS, partial: r.isCur && c.unit==="ps"};
    }
    return {...r, v: scale(r[k], r.gp, r.seasons, r.isCur), small: r.gp < 15 && c.unit!=="ps", partial: r.isCur && c.unit==="ps"};
  });
}
function barChart(rows, o){
  const W = 960, H = 300, padL = 52, padR = 140, padT = 30, padB = 50;
  const vals = rows.flatMap(r=>[r.v, r.v2]).concat((o.refs||[]).map(x=>x.v)).filter(v=>v!=null && isFinite(v));
  if (!rows.some(r=>r.v!=null)) return `<p class="meta">${t("no_hist")}</p>`;
  const top = Math.max(...vals) || 1;
  const step = (()=>{ const raw = top/4, m = Math.pow(10, Math.floor(Math.log10(raw))); return [1,2,2.5,5,10].map(x=>x*m).find(x=>x>=raw); })();
  const ymax = Math.ceil(top/step)*step;
  const x0 = padL, w = W-padL-padR, slot = w/rows.length, bw = Math.min(70, slot*0.5);
  const Y = v => padT + (H-padT-padB)*(1 - v/ymax);
  const f = o.fmt;
  let g = "";
  for (let v=0; v<=ymax+1e-9; v+=step) g += `<line x1="${x0}" x2="${W-padR}" y1="${Y(v)}" y2="${Y(v)}" class="cg"/><text x="${x0-8}" y="${Y(v)+4}" text-anchor="end" class="ct">${o.axis(v)}</text>`;
  const pts = [], pts2 = [], labels = [];
  const bars = rows.map((r,i)=>{ const cx = x0 + slot*i + slot/2;
    let out = `<text x="${cx}" y="${H-padB+18}" text-anchor="middle" class="cx">${esc(r.lab)}</text><text x="${cx}" y="${H-padB+33}" text-anchor="middle" class="ct">${esc(r.sub||"")}</text>`;
    if (r.v2!=null) pts2.push([cx, Y(r.v2), r.v2]);
    if (r.v==null) return out;
    const y = Y(r.v); pts.push([cx,y]);
    const cls = r.partial ? "partial" : r.small ? "small" : "";
    out += `<rect x="${cx-bw/2}" y="${y}" width="${bw}" height="${Math.max(0,Y(0)-y)}" rx="5" class="cb ${cls}"><title>${esc(r.lab)}: ${f(r.v)}${r.v2!=null?t("exp_tip",{v:f(r.v2)}):""}${r.small?t("small_tip"):""}</title></rect>`;
    labels.push(`<text x="${cx}" y="${y-10}" text-anchor="middle" class="cv">${f(r.v)}</text>`);
    if (r.small) out += (Y(0)-y > 34) ? `<text x="${cx}" y="${Y(0)-8}" text-anchor="middle" class="cs">${t("small")}</text>`
                                      : `<text x="${cx}" y="${y-26}" text-anchor="middle" class="cs">${t("small")}</text>`;
    return out; }).join("");
  const rl = (o.refs||[]).filter(x=>x.v!=null).map(x=>({...x, y:Y(x.v), ly:Y(x.v)})).sort((a,b)=>a.y-b.y);
  for (let i=1;i<rl.length;i++){ if (rl[i].ly - rl[i-1].ly < 18){ const mid=(rl[i].ly+rl[i-1].ly)/2; rl[i-1].ly = mid-9; rl[i].ly = mid+9; } }
  const refs = rl.map(x=>`<line x1="${x0}" x2="${W-padR}" y1="${x.y}" y2="${x.y}" class="cr ${x.cls||""}"/>
    ${Math.abs(x.ly-x.y)>1?`<path d="M${W-padR} ${x.y} L${W-padR+6} ${x.ly}" class="cr ${x.cls||""}" style="stroke-dasharray:none"/>`:""}
    <text x="${W-padR+9}" y="${x.ly+4}" class="crt ${x.cls||""}">${esc(x.label)} ${f(x.v)}</text>`).join("");
  const smooth = Pt => { if (Pt.length<2) return ""; let d=`M${Pt[0][0]},${Pt[0][1]}`;
    for (let i=1;i<Pt.length;i++){ const [x1,y1]=Pt[i-1],[x2,y2]=Pt[i], cx=(x1+x2)/2; d+=` C${cx},${y1} ${cx},${y2} ${x2},${y2}`; } return d; };
  const glowLine = (Pt, cls) => Pt.length>1 ? `<path d="${smooth(Pt)}" class="clh ${cls}"/><path d="${smooth(Pt)}" class="cl ${cls}" filter="url(#cglow)"/>` : "";
  const glowDot = (x,y,cls,tt="") => `<circle cx="${x}" cy="${y}" r="9" class="cdh ${cls}"/><circle cx="${x}" cy="${y}" r="4.5" class="cd ${cls}">${tt}</circle><circle cx="${x}" cy="${y}" r="1.8" class="cdc"/>`;
  const defs = `<defs><filter id="cglow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="cgrad" x1="0" x2="1" y1="0" y2="0"><stop offset="0" style="stop-color:var(--accent2)"/><stop offset="1" style="stop-color:var(--line2)"/></linearGradient></defs>`;
  let line = "", dots = "";
  if (o.line2){
    line = glowLine(pts2.map(p=>[p[0],p[1]]), "x");
    dots = pts2.map(([x,y,v])=>glowDot(x,y,"x",`<title>${t("expected")} ${f(v)}</title>`)).join("")
      + (pts2.length ? `<text x="${pts2[pts2.length-1][0]+12}" y="${pts2[pts2.length-1][1]-10}" class="crt x">${t("expected")}</text>` : "");
  } else {
    line = glowLine(pts, "");
    dots = pts.map(([x,y])=>glowDot(x,y,"")).join("");
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.title)}">${defs}${g}${refs}${bars}${line}${dots}${labels.join("")}</svg>`;
}

  let m = state.l10m || "s"; if ((m==="h"||m==="b") && !hbOk) m = "s";

  const games = (hb ? p.hb_games : p.form.games).slice(0,10).reverse();
  const val = x => m==="g" ? x.g : m==="a" ? x.a : m==="p" ? x.g + x.a : m==="h" ? x.hit : m==="b" ? x.blk : x.s;
  const w = p.windows || {}, base = (w.cur && w.cur.gp >= 5) ? w.cur : (w.prev3 || w.cur || {});

  const exp = m==="g" ? l.g : m==="a" ? l.a : m==="p" ? l.g + l.a : m==="h" ? pr.base.hit : m==="b" ? pr.base.blk : l.s;
  const avgLbl = hb ? t("l10_avg_last",{n:games.length}) : (w.cur && w.cur.gp >= 5) ? t("l10_avg_season") : t("l10_avg_3y");
  const vals = games.map(val), top = Math.max(1, ...vals, avg||0, exp||0, line||0);

// league tier for a shot-profile number: elite (top 10%), good (top 10-35%), average (middle 30%), below (bottom 35%)
function shotTier(metric, v, posg, enough){

  if (pc > 5 && pc < 95) { const i = pc/5 - 1, lo = Q[i], hi = Q[i+1]; if (hi > lo) pc += Math.min(4.9, 5*(v-lo)/(hi-lo)); }

  const posTxt = t(posg==="D" ? "tier_d" : "tier_f");
  const rank = pc>=50 ? t("tier_top",{p:Math.max(1,100-pc), pos:posTxt}) : t("tier_bottom",{p:Math.max(1,pc), pos:posTxt});

function scoreGrid(g){
  const mu = gameMu(g), N = 16, CAP = 6;

  const share = (mu.h+mu.a)>0 ? mu.h/(mu.h+mu.a) : 0.5;

  const add = (a,h,p) => { F[Math.min(a,CAP)][Math.min(h,CAP)] += p; };
  for (let a=0;a<N;a++) for (let h=0;h<N;h++){ const p = J[h][a];

  const cells = []; F.forEach((row,a)=>row.forEach((p,h)=>cells.push({a,h,p})));
  const top = cells.slice().sort((x,y)=>y.p-x.p).slice(0,3);
  const rank = new Map(top.map((c,i)=>[c.a+"-"+c.h, i+1]));
  const max = top[0].p;
  const lab = n => n===CAP ? CAP+"+" : String(n);
  const rowSum = F.map(r=>r.reduce((x,y)=>x+y,0)), colSum = F[0].map((_,h)=>F.reduce((x,r)=>x+r[h],0));
  const head = `<tr><th class="sgc"></th>${F[0].map((_,h)=>`<th>${lab(h)}</th>`).join("")}<th class="sgm">%</th></tr>`;

const CMP_MAX = 4;

let CMP_MSG = "";
function cmpFind(x){ const g = x && gameById[String(x.g)]; const pr = g && g.props.find(p => String(p.id)===String(x.p)); return pr && P(pr.id) ? {g, pr, p:P(pr.id)} : null; }

}
function cmpToggle(gid, pid){
  if (cmpHas(gid, pid)) CMP = CMP.filter(x => !(String(x.g)===String(gid) && String(x.p)===String(pid)));
  else if (CMP.length >= CMP_MAX){ CMP_MSG = t("cmp_max",{n:CMP_MAX}); cmpTray(); setTimeout(()=>{ CMP_MSG = ""; cmpTray(); }, 2600); return; }

const CMP_COL = i => `var(--pc${i+1})`;

      ${items.length < CMP_MAX ? `<span class="cthint ${CMP_MSG?"warn":items.length<2?"need":""}">${CMP_MSG || (items.length < 2 ? t("cmp_need") : t("cmp_more"))}</span>` : CMP_MSG ? `<span class="cthint warn">${CMP_MSG}</span>` : ""}</div>

// market helpers for the compare window
const cmpStat = m => m==="fg"||m==="g"||m==="g2"||m==="g3" ? "g" : m==="a"||m==="a2" ? "a" : m==="pt"||m==="pt2"||m==="pt3" ? "p"
  : m==="ppp" ? "pp" : m.startsWith("pim") ? "pm" : m.startsWith("fo") ? null : m[0]==="h" ? "hit" : m[0]==="b" ? "blk" : "s";
const cmpLine = m => ({g:.5,a:.5,pt:.5,fg:.5,g2:1.5,a2:1.5,pt2:1.5,g3:2.5,pt3:2.5,ppp:.5,"pim0.5":.5,"pim2.5":2.5})[m] ?? parseFloat(m.replace(/^[a-z]+/,""));
const cmpVal = (x, st) => st==="p" ? (x.g||0)+(x.a||0) : (x[st]||0);
const cmpOver = (x, m) => m==="fg" ? x.g>=1 : hitGame(x, m);
function cmpExp(pr, g, m){
  const l = lambdas(pr, g), st = cmpStat(m);
  if (m.startsWith("fo")) return pr.base.fow;
  return st==="g" ? l.g : st==="a" ? l.a : st==="p" ? l.g + l.a : st==="s" ? l.s : st==="hit" ? pr.base.hit : st==="blk" ? pr.base.blk : st==="pp" ? pr.base.ppp : st==="pm" ? pr.base.pen : null;
}
const cmpXLabel = m => t("cmp_x_" + (m.startsWith("fo") ? "fo" : cmpStat(m)));
function cmpHits(x, m){
  // [hits, games] for L5, L10, L20, this season and vs tonight's opponent; null where we have no record
  const p = x.p, pr = x.pr, mk = m==="fg" ? "g" : m, H = p.hr?.[mk];
  const out = {L5:null, L10:null, L20:null, S:null, V:null};
  if (noHistory(m) && m!=="fg") return out;
  if (H){ const n = isHB(m) ? p.hr.hbn : p.hr.n;
    out.L5 = n[0] ? [H[0], n[0]] : null; out.L10 = n[1] ? [H[1], n[1]] : null;
    if (!isHB(m)){ out.L20 = n[2] ? [H[2], n[2]] : null; out.S = n[3] ? [H[3], n[3]] : null; } }
  else { const gs = lastGames(p, m).slice(0,10);
    const c = k => { const s = gs.slice(0,k); return s.length ? [s.filter(y=>cmpOver(y,m)).length, s.length] : null; };
    out.L5 = c(5); out.L10 = c(10); }
  if (pr.hv?.n && pr.hv[mk] != null) out.V = [pr.hv[mk], pr.hv.n];
  return out;
}
function cmpMiniChart(x, m, ymax, i){

  if (!st || !gs.length) return `<div class="cmc-empty">${t("cmp_nohist")}</div>`;
  const W = 260, H = 118, T = 14, B = 22, pad = 4, RM = 22, cw = (W - pad - RM) / 10, bw = Math.min(18, cw*0.62);
  const y = v => T + (H - T - B) * (1 - v / ymax);

  return `<svg viewBox="0 0 ${W} ${H}" class="cmsvg" style="--pc:${CMP_COL(i)}" role="img" aria-label="${esc(x.p.name)}">
    <line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" class="cmax"/>${bars}
    <line x1="0" x2="${W-RM+2}" y1="${y(L)}" y2="${y(L)}" class="cml"/><text x="${W-1}" y="${y(L)+3.5}" text-anchor="end" class="cmlt">${L}</text></svg>`;
}

// plain-language read of the comparison, built from fixed rules on the same numbers (no AI, no invented facts)
function cmpQuick(items, m, pv, ev, od, hits){
  const nm = i => `<b style="color:${CMP_COL(i)}">${esc(shortName(items[i].p.name))}</b>`;
  const gpC = i => items[i].p.windows?.career?.gp || 0;
  const trust = i => Math.min(1, (gpC(i) + 10) / 60);
  const idx = items.map((_, i) => i).filter(i => pv[i] != null);
  if (idx.length < 2) return "";
  const L = [];
  // 1. chance
  const iP = idx.reduce((a, b) => pv[b] > pv[a] ? b : a);
  const second = idx.filter(i => i !== iP).reduce((a, b) => pv[b] > pv[a] ? b : a);
  const close = pv[iP] - pv[second] < 0.015;
  L.push(t(close ? "qr_close" : "qr_top", {a: nm(iP), p: pct(pv[iP], 1), b: nm(second), q: pct(pv[second], 1)})
    + (gpC(iP) < 50 ? " " + t("qr_short", {n: gpC(iP)}) : ""));
  // 2. value at the odds
  const withOdds = idx.filter(i => ev[i] != null);
  if (withOdds.length){
    const iE = withOdds.reduce((a, b) => ev[b] > ev[a] ? b : a);
    if (ev[iE] > 0.02) L.push(t("qr_value", {a: nm(iE), e: evTxt(ev[iE]), o: oddsTxt(od[iE])}));
    else L.push(t("qr_novalue"));
  }
  // 3. role
  const toi = i => items[i].p.toi_proj || 0;
  const iR = idx.reduce((a, b) => toi(b) > toi(a) ? b : a);
  if (idx.every(i => i === iR || toi(iR) - toi(i) >= 1)){
    const M = items[iR].p.mates || {}; const role = [M.line?.toUpperCase(), M.pp?.toUpperCase()].filter(Boolean).join(", ");
    L.push(t("qr_role", {a: nm(iR), m: fmt(toi(iR), 1), r: role ? ` (${role})` : ""}));
  }
  // 4. one flag per player that changes how to read his number
  const flags = [], gk = new Set();
  idx.forEach(i => { const x = items[i], rg = x.p.regress || {}, gvx = rg.g != null ? rg.g - rg.exp : 0, h = hits[i]?.L10;
    if (x.p.injury?.kind === "questionable") flags.push(t("qr_inj", {a: nm(i)}));
    else if (gvx >= 2.5) flags.push(t("qr_lucky", {a: nm(i), v: fmt(gvx, 1)}));
    else if (gvx <= -2.5) flags.push(t("qr_unlucky", {a: nm(i), v: fmt(-gvx, 1)}));
    else if (h && h[1] >= 8 && h[0] / h[1] >= 0.7) flags.push(t("qr_form", {a: nm(i), h: h[0], n: h[1]}));
    const st = (x.g.starter_status?.[x.pr.opp] || "").toLowerCase();
    if (/^(g|a|pt|fg|g2|g3|a2|pt2|pt3|ppp)$/.test(m) && st && (!st.includes("confirmed") || st.includes("unconfirmed"))) gk.add(x.pr.opp);
  });
  L.push(...flags.slice(0, 3));
  if (gk.size) L.push(t(gk.size > 1 ? "qr_gks" : "qr_gk", {t: [...gk].join(LANG === "sv" ? " och " : " and ")}));
  // 5. bottom line: trust-adjusted edge with odds, trust-adjusted chance without
  const sc = i => ev[i] != null ? ev[i] * trust(i) : pv[i] * (0.85 + 0.15 * trust(i));
  const order = idx.slice().sort((a, b) => sc(b) - sc(a));
  const a0 = order[0], a1 = order[1];
  const tight = ev[a0] != null ? (sc(a0) - sc(a1) < 0.03) : (sc(a0) - sc(a1) < 0.012);
  if (ev[a0] != null && ev[a0] * trust(a0) <= 0) L.push(t("qr_bl_none"));
  else L.push(t(tight ? "qr_bl_tight" : "qr_bl", {a: nm(a0), b: nm(a1)}));
  const miss = pv[a0] > 0 && pv[a0] < 0.5 ? Math.round((1 - pv[a0]) / pv[a0]) : 0;
  return `<div class="cmquick"><h5>${t("qr_title")}</h5><ul>${L.map(x => `<li>${x}</li>`).join("")}</ul>
    <p class="meta">${miss >= 2 ? t("qr_reminder", {p: pct(pv[a0], 0), n: miss, k: miss + 1}) + " " : ""}${t("qr_note")}</p></div>`;
}

    <li><b>Skottprofil:</b> alla skottförsök han gjort i år (eller de senaste 10 matcherna) på en karta över anfallszonen: mål, räddade skott, missar och blockeringar. Bredvid: skottförsök och skott på mål per match, hur många av försöken som träffar mål, hur många som kommer från nära håll och kvaliteten på skotten, jämfört med förra säsongen. Varje siffra har en nivå mot alla NHL-spelare på hans position i år: <i>Elit</i> (topp 10 %), <i>Bra</i> (topp 10–35 %), <i>Medel</i> (mittersta 30 %) eller <i>Under medel</i> (botten 35 %), med hans placering; väldigt små underlag markeras <i>Litet underlag</i>.</li>
    <li><b>Jämför:</b> tryck på ⇄ bredvid en spelare (spelarlistan, Props eller spelardetaljerna) för att lägga honom i jämförelsefältet längst ner. Välj 2–4 spelare från valfri match och öppna <i>Jämför</i> för att se dem sida vid sida i valfritt spel: chansen i kväll, odds och EV, förväntade siffror, istid och roll, de senaste 10 matcherna på samma skala, träffprocent och årets siffror. Bästa värdet på varje rad markeras, och en <i>Snabbläsning</i> högst upp sammanfattar med vanliga ord: vem som har högst chans, bäst värde, störst roll, vad som gör en siffra mindre säker och vilket alternativ som ser starkast ut utifrån siffrorna.</li>
    <li><b>Historik:</b> hans säsonger som tabell eller diagram. Välj mål, assist, poäng, skott, skottprocent (med hans verkliga nivå och ligasnittet) eller mål mot förväntat. Jämför i år, förra 3 eller 5 säsongerna eller karriären, per match eller i 82-matcherstakt. Bleka staplar bygger på litet underlag.</li>
  </ul>

  <h3>Props</h3>
  <p>Alla spelare i kvällens matcher i en lista. Välj spel (poäng, flera poäng, powerplay, skott, tacklingar, blockeringar, tekningar, utvisningar eller första mål), sedan linjen, och sortera efter <i>Mest troliga</i> eller <i>Bäst värde</i>. Filtrera på dag, match eller spelare, och skriv in dina egna odds för att se din EV.</p>

  <h3>Skott på mål &amp; målvaktsräddningar</h3>
  <p>På varje matchsida beräknar modellen varje lags skott på mål och totalen, utifrån båda lagens skott för och emot i år och hemmaplan, med chansen att gå över de vanliga linjerna. Startmålvaktens väntade räddningar är skotten han väntas möta gånger hans väntade räddningsprocent, med hänsyn till att målvakter ibland byts ut tidigt. Byt målvakt så uppdateras räddningarna. Testat på tusentals tidigare matcher: lagskott och räddningar var träffsäkrare än enkla snitt på alla linjer; för totalt antal skott är modellen ungefär lika bra som ett enkelt snitt, så se den som bakgrund.</p>

  <h3>Fler spel &amp; första målskytt</h3>
  <p>Varje matchsida har <i>Fler spel</i>, allt från samma beräknade resultat: 1X2 efter 60 minuter, puck line ±1,5 (med mål i tom bur), lagets antal mål, mål och oavgjort i första perioden samt båda lagen gör mål, alla med rättvisa odds och en ruta för dina egna odds. Matchup-fliken visar chanserna för <i>Första målskytt</i>: chansen att det blir mål före straffar, gånger att hans lag gör första målet, gånger hans andel av lagets förväntade mål. Testat: 1X2, puck line och lagets mål stämmer väl; för första perioden och båda lagen gör mål stämmer nivån, men matcherna skiljs åt bara lite.</p>
  <h3>Fler spelarspel</h3>
  <ul>
    <li><b>Flera poäng:</b> 2+ och 3+ poäng, 2+ mål, hattrick och 2+ assist, från samma förväntade mål och assist som allt annat. Testat: stämmer väl.</li>
    <li><b>PP-poäng:</b> hans poängtakt i powerplay × hans PP-tid, uppdaterat med årets PP-poäng och justerat för hur ofta kvällens motståndare åker ut. Testat: klart bättre än spelarens enkla snitt av PP-poäng.</li>
    <li><b>Vunna tekningar</b> (centrar): tekningar per match × vinstprocent, justerat för motståndarens tekningsstyrka. Testat: ungefär lika träffsäkert som hans enkla snitt, så se det som bakgrund.</li>
    <li><b>Utvisningar:</b> chansen att han åker ut (över 0,5 utvisningsminuter) och över 2,5 minuter, från hans utvisningstakt och istid. Testat: bättre än den enkla andelen matcher med utvisning.</li>
    <li><b>Nolla:</b> på målvaktskortet och under Fler spel: inget insläppt mål under ordinarie tid och förlängning.</li>
    <li><b>Roll &amp; speltid</b> och <b>Kedjekamrater i kväll</b> i spelardetaljerna: PP-minuter och femma, tekningar, utvisningar och hur han har gjort poäng med och utan varje kedjekamrat i år.</li>
  </ul>
  <h3>Oddsformat</h3>
  <p>Använd menyn högst upp för att visa odds som decimal (1,85), amerikanska (−118 / +185) eller bråk (5/6). Du kan skriva odds i alla tre formaten i varje oddsruta.</p>

  <h3>Sviter &amp; milstolpar</h3>
  <p>Under Props, välj <i>Sviter</i> för en lista över alla intressanta sviter i kvällens matcher: måltorka (med skotten sedan senaste målet), poängtorka, poängsviter, målsviter och milstolpar i karriären inom räckhåll (till exempel 1 mål från 100, eller match nummer 1 000). Torka visas bara när den är ovanlig för en ordinarie spelare, med hur ovanlig ("1 på 12"). Varje rad visar hans chans i kväll och en oddsruta, så att du kan jämföra priser mellan spelbolag. Varje matchsida har också raden <i>Sviter att hålla koll på</i>. En svit ändrar inte hans chans i kväll; siffran bygger redan på hans verkliga nivå.</p>

  <h3>Tacklingar &amp; blockeringar</h3>
  <p>Bygger på varje spelares tacklingar och blockerade skott per minut istid, gånger hans beräknade istid i kväll, justerat för motståndaren (hur ofta de tacklas och hur många av deras skott som blockeras) och arenan, eftersom vissa arenor registrerar betydligt fler tacklingar än andra. Testat på tusentals tidigare matcher var det klart träffsäkrare än spelarens snitt de senaste 10 matcherna på alla linjer.</p>

  <h3>Ditt konto</h3>
  <ul>
    <li><b>Mina spel:</b> spara vilket spel som helst med oddset du fick. Spelen rättas automatiskt efter varje match, med träffprocent, vinst, ROI och om du slog stängningsoddset, det bästa långsiktiga tecknet på en bra spelare.</li>
    <li><b>Aviseringar:</b> pushnotiser när ett spel når den edge-nivå du väljer, eller när en startmålvakt bekräftas.</li>
  </ul>

  <h3>Facit</h3>
  <p>Modellens protokoll. Varje prognos sparas före matchen och kontrolleras efteråt: hur ofta saker hände jämfört med vad modellen sa, hur träffsäkra sannolikheterna var (Brier och Skicklighet) och kalibreringsdiagram. <i>Värdespel</i> där är inga tips: de testar om alla spel med 5 %+ edge till marknadspris hade gått med vinst. Öppna <i>Så läser du sidan</i> på den fliken för detaljer.</p>

  <h3>Ord som används på sajten</h3>
  <ul>
    <li><b>Rättvisa odds</b> = 1 ÷ sannolikheten: oddsen där ett spel går jämnt ut i längden.</li>
    <li><b>Marknad-%</b> = sannolikheten som marknadsoddsen motsvarar, med spelbolagets marginal borträknad.</li>
    <li><b>Edge / EV</b> = modellens sannolikhet × odds − 1. +10 % betyder att modellen räknar med 10 % vinst per spel i längden, om modellen har rätt.</li>
    <li><b>▲ Bör lyfta / ▼ Kan svalna</b> = gör tydligt färre / fler mål än sin verkliga nivå i år. I testerna gjorde spelare som "borde lyfta" <i>inte</i> fler mål än modellen redan räknade med, så det är bakgrund, inte ett skäl att spela i sig.</li>
    <li><b>Skott utan mål</b> = skott sedan senaste målet, och hur ovanlig en så lång torka är för en spelare på hans nivå.</li>
    <li><b>Prognos / Trolig / Bekräftad / Inte avgjort</b> målvakt = från de senaste rapporterna om startmålvakter. Prognos betyder att ingen rapport finns än: målvakten med flest starter på sistone, eller reserven vid back-to-back.</li>
    <li><b>Ute / Dag till dag / Spelar</b>: spelare som är Ute tas bort från spelen; osäkra spelare finns kvar med gul markering tills uppställningen visar att de spelar.</li>
    <li><b>B2B</b> = laget spelade i går.</li>
  </ul>

  <h3>Frågor</h3>
  <details><summary>Är det här en spelsajt?</summary><p>Nej. NHL Props Lab är ett analysverktyg. Vi tar inte emot spel och förvarar inga pengar; du spelar hos ditt eget licensierade spelbolag, om du vill.</p></details>
  <details><summary>Betyder en hög procent att jag ska spela?</summary><p>Inte i sig. Det som räknas är chansen jämfört med oddset: en chans på 60 % till 1,50 förlorar pengar över tid, en chans på 30 % till 4,00 vinner. Det är det värde och EV visar.</p></details>
  <details><summary>Varför får inte en spelare i het form högre chans?</summary><p>För att sviter oftast inte håller i sig. Modellen utgår från hans verkliga nivå över en längre period och ger den senaste formen lite vikt; i testerna slog det att följa sviten.</p></details>
  <details><summary>Varför ändrades siffrorna under dagen?</summary><p>Nya uppställningar, en bekräftad målvakt, en skada eller nya odds. När matchen startar låses allt.</p></details>
  <details><summary>Mitt spelbolag har andra odds. Vad gör jag?</summary><p>Skriv in ditt odds i oddsrutan (decimal, amerikanska eller bråk). EV uppdateras för ditt pris.</p></details>
  <details><summary>Hur raderar jag mitt konto eller mina uppgifter?</summary><p>Kontakta oss så raderar vi dem inom 30 dagar. Se <a href="/legal.html#privacy">integritetspolicyn</a>.</p></details>

};

      <div class="mrow" style="max-width:360px"><button class="mbtn pri" id="pk_in" type="button">${t("au_in_btn")}</button><button class="mbtn" id="pk_up" type="button">${t("au_up_btn")}</button></div></div>`;
    $("#pk_in").onclick = () => openAuth("in"); $("#pk_up").onclick = () => openAuth("up"); return; }
  const done = MYPICKS.filter(x => x.result && x.result !== "void"), wins = done.filter(x => x.result === "win");
  const staked = done.reduce((a,x)=>a+ +x.stake,0), ret = wins.reduce((a,x)=>a+ x.stake*x.odds,0), profit = ret - staked;
  const withClose = done.filter(x => x.closing_odds), clv = withClose.length ? withClose.reduce((a,x)=>a + (x.odds/x.closing_odds - 1),0)/withClose.length : null;
  const expHit = done.length ? done.reduce((a,x)=>a + (+x.model_p||0),0)/done.length : null;
  const kpi = (lbl, v, cls="") => `<div class="kpi"><small>${lbl}</small><b class="${cls}">${v}</b></div>`;
  const rows = MYPICKS.map(x => { const r = x.result || "open";
    return `<tr><td>${x.game_date.slice(5)}</td><td><b>${esc(x.player_name)}</b><div class="meta">${x.team} ${t("vs_short")} ${x.opp}</div></td><td>${mName(x.market)}</td>
      <td class="n num">${oddsTxt(+x.odds)}</td><td class="n num hide-xs">${x.closing_odds?oddsTxt(+x.closing_odds):"–"}</td><td class="n num hide-xs">${x.model_p!=null?pct(+x.model_p,0):"–"}</td>
      <td class="n num hide-xs">${+x.stake}</td><td><span class="res ${r}">${t("res_"+r)}${x.stat_value!=null?` · ${x.stat_value}`:""}</span></td>
      <td>${x.result?"":`<button class="delbtn" data-del="${x.id}" title="${t("pk_del")}" aria-label="${t("pk_del")}">✕</button>`}</td></tr>`; }).join("");
  $("#main").innerHTML = `<div class="ptab"><h2 style="margin:4px 0 14px">${t("pk_h")}</h2>
    <div class="box" id="alertsbox" style="margin-bottom:14px"><h4>${t("al_title")}</h4><p class="meta">…</p></div>
    <div class="sum">${kpi(t("pk_n"), MYPICKS.length)}${kpi(t("pk_settled"), done.length)}${kpi(t("pk_hit"), done.length?pct(wins.length/done.length,0):"–")}
      ${kpi(t("pk_exp"), expHit!=null?pct(expHit,0):"–")}${kpi(t("pk_profit"), (profit>=0?"+":"")+profit.toFixed(2), profit>0?"ev-pos":profit<0?"ev-neg":"")}
      ${kpi(t("pk_roi"), staked?((profit/staked*100>=0?"+":"")+(profit/staked*100).toFixed(1)+"%"):"–", profit>0?"ev-pos":profit<0?"ev-neg":"")}
      ${kpi(t("pk_clv"), clv!=null?((clv>=0?"+":"")+(clv*100).toFixed(1)+"%"):"–", clv>0?"ev-pos":clv<0?"ev-neg":"")}</div>
    ${MYPICKS.length ? `<div class="card tablewrap"><table><thead><tr><th>${t("h_date")}</th><th>${t("h_player")}</th><th>${t("pk_market")}</th><th class="n">${t("h_odds")}</th><th class="n hide-xs">${t("pk_close")}</th><th class="n hide-xs">${t("pk_model")}</th><th class="n hide-xs">${t("pk_stake")}</th><th>${t("pk_result")}</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
      : `<div class="card empty prose"><p>${t("pk_none")}</p></div>`}
    <p class="note">${t("pk_note")}</p></div>`;
  $("#main").querySelectorAll("[data-del]").forEach(b => b.onclick = async () => { await sb.from("picks").delete().eq("id", b.dataset.del); await loadPicks(); render(); });
  alertsCard();
}

// ------------------------------------------------------------ live scores (official NHL feed via our scores function)
// ------------------------------------------------------------ archive: the last 7 days as they looked before puck drop
let ARCH = null;
const ARCH_PARAM = (() => { try { return new URLSearchParams(location.search).get("d"); } catch(e){ return null; } })();
const archDates = () => (DATA.archive_dates || []).slice().sort().reverse();
function applyArchive(A){
  Object.assign(DATA.players, A.players || {}); Object.assign(DATA.goalies, A.goalies || {}); Object.assign(DATA.teams, A.teams || {});
  DATA.odds = A.odds || {};
  DATA.games.length = 0; DATA.games.push(...(A.games || []));
  for (const k of Object.keys(gameById)) delete gameById[k];
  for (const g of DATA.games) gameById[String(g.id)] = g;
  dates.length = 0; dates.push(A.date);
  state.day = state.pday = A.date; state.pfilter = "all";
  for (const k of Object.keys(state.goalie)) delete state.goalie[k];
  DATA.games.forEach(g => { state.goalie[g.id] = {}; for (const tm of [g.home, g.away]) state.goalie[g.id][tm] = g.starters?.[tm]; });
  FG_MEMO.clear();
  ARCH = A;
}
const archGo = d => { const u = new URL(location.href); if (d) u.searchParams.set("d", d); else u.searchParams.delete("d"); u.hash = ""; location.href = u.toString(); };
// what happened for one player and market: true / false, or null if he didn't play or the market has no record
function archRes(gid, pid){ return ARCH?.results?.[String(gid)]?.players?.[String(pid)] || null; }
function archHit(gid, pid, m){
  if (!ARCH) return null;
  const R = ARCH.results?.[String(gid)]; if (!R) return null;
  if (m === "fg") return R.fg ? String(R.fg) === String(pid) : null;
  const r = R.players?.[String(pid)]; if (!r || r.gk) return null;
  if (m.startsWith("fo")) return R.has_pbp ? (r.fow || 0) > parseFloat(m.slice(2)) : null;
  if (m === "ppp" && !R.has_pbp) return null;
  return hitGame({g:r.g, a:r.a, s:r.s, hit:r.h, blk:r.b, pp:r.pp||0, pm:r.pim}, m);
}
const resMark = h => h == null ? "" : `<i class="rmk ${h?"y":"n"}" aria-label="${t(h?"ar_hit":"ar_miss")}">${h?"✓":"✗"}</i>`;
function resLine(gid, pid){
  const r = archRes(gid, pid); if (!ARCH) return "";
  if (!r) return `<span class="rline dnp">${t("ar_dnp")}</span>`;
  if (r.gk) return `<span class="rline">${r.sv ?? "–"} ${t("ar_sv")} · ${r.ga ?? "–"} ${t("ar_ga")}</span>`;
  const bits = [`${r.g} ${t("h_g")}`, `${r.a} ${t("h_a")}`, `${r.s} ${t("h_s")}`];
  if (r.h) bits.push(`${r.h} ${t("l10_h")}`); if (r.b) bits.push(`${r.b} ${t("l10_b")}`);
  return `<span class="rline ${r.g+r.a>0?"pts":""}">${bits.join(" · ")}</span>`;
}
function archBar(){
  const el = $("#archbar"); if (!el) return;
  const ds = archDates();
  if (!ARCH){
    el.hidden = !ds.length || state.tab !== "games" || !!state.game;
    if (!el.hidden) el.innerHTML = `<div class="abar live"><span>${t("ar_cta")}</span><select id="archsel" aria-label="${t("ar_pick")}"><option value="">${t("ar_pick")} ▾</option>${ds.map(d=>`<option value="${d}">${dayLabel(d)}</option>`).join("")}</select></div>`;
  } else {
    el.hidden = false;
    const part = (ARCH.partial || []).length;
    el.innerHTML = `<div class="abar"><b>${t("ar_title",{d:dayLabel(ARCH.date)})}</b><span class="meta">${t("ar_sub")}${part ? " " + t("ar_partial") : ""}</span>
      <span class="abtn"><select id="archsel" aria-label="${t("ar_pick")}">${ds.map(d=>`<option value="${d}" ${d===ARCH.date?"selected":""}>${dayLabel(d)}</option>`).join("")}</select><button type="button" id="archback">${t("ar_back")}</button></span></div>`;
  }
  const s = $("#archsel"); if (s) s.onchange = () => { if (s.value) archGo(s.value); };
  const b = $("#archback"); if (b) b.onclick = () => archGo(null);
}

const SCORES_URL = "https://evxnevqxykbfocqfqxid.supabase.co/functions/v1/scores";
async function pollScores(){
  const now = Date.now();
  // any game that should have started and isn't marked final yet (also games long over, if the page is older than the result)
  const active = DATA.games.filter(g => g.start && !["FINAL","OFF"].includes(g.state) && new Date(g.start).getTime() - now < 10*60e3 && now - new Date(g.start).getTime() < 48*3600e3);
  if (!active.length) return;
  try {
    const dates = [...new Set(active.map(g=>g.date))];
    let changed = false;
    for (const d of dates){
      const r = await fetch(`${SCORES_URL}?date=${d}`); if (!r.ok) continue;
      const js = await r.json();
      for (const x of js.games||[]){ const g = gameById[x.id] || gameById[String(x.id)]; if (!g) continue;
        for (const k of ["state","hs","as","period","clock","intermission","last_period"]) if (x[k]!==undefined && g[k]!==x[k]){ g[k]=x[k]; changed=true; } }
    }
    if (changed && state.tab==="games" && !document.activeElement?.matches?.("input,select")) render();
  } catch(e) {}
}
wireHeader();
function startApp(){
  if (!ARCH){ pollScores(); setInterval(pollScores, 60e3); }
  { const m = location.hash.match(/^#g(\d+)$/); if (m && gameById[m[1]]) state.game = m[1]; }
  render();
}
if (ARCH_PARAM && (DATA.archive_dates || []).includes(ARCH_PARAM)){
  $("#main").innerHTML = `<p class="meta">${t("sp_loading")}</p>`;
  fetch(new URL(`../data/archive/${ARCH_PARAM}.json`, location.href)).then(r => r.ok ? r.json() : null)
    .then(A => { if (A) applyArchive(A); startApp(); }).catch(startApp);
} else startApp();
