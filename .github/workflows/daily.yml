name: Daily build

on:
  schedule:
    - cron: "15 13 * * *"   # 14:15 Stockholm (winter) - morning in North America
    - cron: "15 16 * * *"   # 17:15 - odds and lineups refresh
    - cron: "15 19 * * *"   # 20:15
    - cron: "15 22 * * *"   # 23:15 - just before most puck drops
    - cron: "15 8 * * *"    # 09:15 Stockholm - morning results, after the late West Coast games
  workflow_dispatch:         # "Run workflow" button in the Actions tab
  # pre-game checks + goalie watch come from Supabase pg_cron (every 30 min at :10 and :40, 14:00-08:30 Stockholm), because
  # GitHub's own schedule delays or skips runs on busy days
  repository_dispatch:       # external ticker (Supabase pg_cron): pre-game check + goalie watch
    types: [pregame, stx]   # stx: new Stoiximan prices pushed from the browser script -> full build

permissions:
  contents: write
  id-token: write   # GitHub's sign-in token for the Pro data upload (no stored Supabase key)

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Sharp-book (Pinnacle) prices, at most once an hour, on whatever run comes first: the pre-game ticks run every
      # 10-15 min on game days, so this needs no extra workflow runs. Pinnacle blocks Supabase's servers but not
      # GitHub's, so the runner fetches and pin-sync stores (signed with GitHub's OIDC token, no stored key).
      # Pro accounts read the table in the app; the site build keeps fetching Pinnacle itself too.
      - name: Sharp-book prices (Pinnacle, hourly)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          FN=https://evxnevqxykbfocqfqxid.supabase.co/functions/v1/pin-sync
          AGE=$(curl -sS -m 20 "$FN" | python -c "import sys,json;a=json.load(sys.stdin).get('age_min');print(999 if a is None else a)" || echo 999)
          if [ "$AGE" -lt 50 ]; then echo "Sharp prices are $AGE min old: skipped"; exit 0; fi
          python -m nhlprops sharp --out /tmp/sharp.json
          OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=nhl-props-pin-sync" | python -c "import sys,json;print(json.load(sys.stdin)['value'])")
          curl -sS -m 60 -X POST "$FN" -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" --data-binary @/tmp/sharp.json; echo

      - name: Pre-game check
        id: gate
        env:
          SCHED: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event.action }}" = "stx" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then python -m nhlprops pregame; exit 0; fi
          case "$SCHED" in
            "25,55 "*|"15,45 "*) python -m nhlprops pregame ;;
            *) echo "run=true" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Restore downloaded data
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: data/cache
          key: nhl-cache-${{ github.run_id }}
          restore-keys: nhl-cache-

      - name: Restore the archive (last 7 days before puck drop)
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p data/archive
          if git fetch -q origin archive 2>/dev/null; then git archive origin/archive | tar -x -C data/archive; fi
          ls data/archive | tail -3 || true

      - name: Grade yesterday's predictions
        if: steps.gate.outputs.run == 'true'
        run: python -m nhlprops grade || true

      - name: Build today's slate
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m nhlprops build --no-open 2>&1 | tee build.log || echo "No games today"
          mkdir -p data && cp build.log data/last-build.log
          mkdir -p site
          mkdir -p site/app site/assets
          if [ -f output/index.html ]; then cp output/index.html site/app/index.html; fi
          if [ -f output/landing.html ]; then cp output/landing.html site/index.html; cp output/landing.html site/landing.html; fi
          cp site-assets/*.webp site/assets/
          cp site-assets/*.mp4 site-assets/*.jpg site/assets/ 2>/dev/null || true
          mkdir -p site/assets/previews && cp site-assets/previews/*.webp site/assets/previews/ 2>/dev/null || true
          if [ -f output/previews.html ]; then cp output/previews.html site/previews.html; fi
          python -m nhlprops.blog || echo "blog build failed"
          if [ -d output/blog ]; then mkdir -p site/blog && cp -r output/blog/. site/blog/; fi
          cp nhlprops/legal.html site/legal.html
          mkdir -p site/data && if [ -f output/closing.json ]; then cp output/closing.json site/data/closing.json; fi
          if [ -f output/alerts.json ]; then cp output/alerts.json site/data/alerts.json; fi
          if [ -f output/shots.json ]; then cp output/shots.json site/data/shots.json; fi
          if [ -f output/bestpicks.json ]; then cp output/bestpicks.json site/data/bestpicks.json; fi
          if [ -f output/ledger.json ]; then cp output/ledger.json site/data/ledger.json; fi
          if [ -d output/gl ]; then mkdir -p site/data/gl && cp output/gl/*.json site/data/gl/ 2>/dev/null || true; fi
          if [ -d output/archive ]; then mkdir -p site/data/archive && cp output/archive/*.json site/data/archive/ 2>/dev/null || true; fi
          cp site-assets/sw.js site/sw.js 2>/dev/null || true
          cp site-assets/manifest.webmanifest site/manifest.webmanifest 2>/dev/null || true
          mkdir -p site/icons && cp site-assets/icons/*.png site/icons/ 2>/dev/null || true
          mkdir -p site/brand && cp site-assets/brand/*.svg site/brand/
          cp vercel.json site/vercel.json
          cp site-headers.txt site/_headers
          if [ ! -f site/index.html ]; then echo "<h1>No NHL games today</h1>" > site/index.html; fi
          if [ ! -f site/app/index.html ]; then cp site/index.html site/app/index.html; fi

      - name: Check the page scripts before publishing (a syntax error would show a blank site)
        if: steps.gate.outputs.run == 'true'
        run: |
          for f in site/app/index.html site/index.html; do
            [ -f "$f" ] || continue
            node -e "const s=require('fs').readFileSync('$f','utf8');const re=/<script>([\s\S]*?)<\/script>/g;let m,bad=0;while((m=re.exec(s))){try{new Function(m[1])}catch(e){console.error('$f:',e.message);bad=1}}process.exit(bad)"
          done

      - name: Upload the Pro data to private storage (never to the public site; see PAYWALL.md)
        if: steps.gate.outputs.run == 'true' && github.ref == 'refs/heads/main'
        run: |
          if [ ! -d output/pro ]; then echo "No Pro data: skipped"; exit 0; fi
          # GitHub's short-lived OIDC token; the pro-upload function only accepts it for this repo's main branch
          OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=nhl-props-pro-upload" | python -c "import sys,json;print(json.load(sys.stdin)['value'])")
          cd output/pro
          fail=0
          for f in $(find . -name '*.json' | sed 's|^\./||'); do
            code=$(curl -sS -o /tmp/up.txt -w "%{http_code}" -X POST "https://evxnevqxykbfocqfqxid.supabase.co/functions/v1/pro-upload?path=$f"               -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" --data-binary "@$f")
            echo "$f $code"; [ "$code" = "200" ] || { cat /tmp/up.txt; fail=1; }
          done
          # the public site must not carry Pro files
          test ! -e ../../site/data/alerts.json
          if [ "$fail" = 1 ]; then echo "::warning::Some Pro files did not upload; Pro users keep the previous data"; fi

      - name: Save prediction history to the repository
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "nhl-props-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history data/frozen data/lineups data/odds_open data/logos data/shots data/public data/bestpicks data/ledger data/manual_odds data/awards data/last-build.log || true
          [ -f data/pregame.json ] && git add data/pregame.json || true
          [ -f data/goalie_watch.json ] && git add data/goalie_watch.json || true
          git diff --cached --quiet || git commit -m "Predictions $(date -u +%F)" && git push || true

      - name: Save the archive on the "archive" branch (no history kept)
        if: steps.gate.outputs.run == 'true'
        env:
          TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(ls data/archive 2>/dev/null)" ]; then exit 0; fi
          rm -rf /tmp/ab && mkdir /tmp/ab && cp data/archive/*.json /tmp/ab/ && cd /tmp/ab
          git init -q && git checkout -q -b archive
          git config user.name "nhl-props-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "Archive $(date -u +%F-%H%M)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" archive

      - name: Keep a copy of the site on the "site" branch
        if: steps.gate.outputs.run == 'true'
        env:
          TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/sb && mkdir /tmp/sb && cp -r site/. /tmp/sb/ && cd /tmp/sb
          git init -q && git checkout -q -b site
          git config user.name "nhl-props-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "Site $(date -u +%F-%H%M)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" site

      - name: Publish to Cloudflare Pages
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "No Cloudflare secrets yet - skipping"; exit 0; fi
          rm -f site/vercel.json
          npx --yes wrangler@3 pages project create nhl-props-lab --production-branch=main 2>&1 | tail -2 || true
          npx --yes wrangler@3 pages deploy site --project-name=nhl-props-lab --branch=main --commit-dirty=true 2>&1 | tail -6

      - name: Publish to Vercel
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "No VERCEL_TOKEN secret yet - skipping"; exit 0; fi
          rm -rf /tmp/nhl-props-lab && cp -r site /tmp/nhl-props-lab
          cd /tmp/nhl-props-lab
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" > /tmp/vercel.log 2>&1 || true
          tail -15 /tmp/vercel.log
          echo "::notice title=Vercel::$(tail -8 /tmp/vercel.log | tr '\n' ' ' | sed 's/\x1b\[[0-9;]*m//g' | cut -c1-900)"
