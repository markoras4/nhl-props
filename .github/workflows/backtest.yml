name: Backtest (separate from the website)
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Season start years, comma separated (empty = two previous seasons)"
        required: false
        default: ""
      totals:
        description: "Test game totals instead of player props"
        type: boolean
        default: false
      hb:
        description: "Test hits and blocked-shots props"
        type: boolean
        default: false
      shots:
        description: "Test team shots and goalie saves"
        type: boolean
        default: false
      other:
        description: "Other test by name: attempts, oppos, hot (empty = none)"
        required: false
        default: ""
      markets:
        description: "Test game markets (1X2, puck line, team totals, BTTS, 1st period)"
        type: boolean
        default: false
      context:
        description: "Test referees and rest/travel"
        type: boolean
        default: false
      extra:
        description: "Test multi-point, PIM, PP points and faceoff props"
        type: boolean
        default: false
      form:
        description: "Test a recent-form term for player props"
        type: boolean
        default: false
      goalies:
        description: "Test goalie rating weights and regression"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore downloaded history
        uses: actions/cache@v4
        with:
          path: data/cache
          key: backtest-cache-${{ github.run_id }}
          restore-keys: backtest-cache-
      - name: Run backtest
        run: |
          mkdir -p backtest
          python -m nhlprops backtest --seasons "${{ inputs.seasons }}" ${{ inputs.totals && '--totals' || '' }} ${{ inputs.hb && '--hb' || '' }} ${{ inputs.shots && '--shots' || '' }} ${{ inputs.other != '' && format('--{0}', inputs.other) || '' }} ${{ inputs.markets && '--markets' || '' }} ${{ inputs.context && '--context' || '' }} ${{ inputs.extra && '--extra' || '' }} ${{ inputs.form && '--form' || '' }} ${{ inputs.goalies && '--goalies' || '' }} > backtest/log.txt 2>&1 || echo "FAILED" >> backtest/log.txt
          tail -60 backtest/log.txt
      - name: Save results to the "backtest" branch
        run: |
          git config user.name "nhl-props-bot"; git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/bt && cp -r backtest/. /tmp/bt/
          git checkout --orphan backtest-out && git rm -rfq . && cp -r /tmp/bt/. . && git add -A
          git commit -qm "Backtest $(date -u +%F-%H%M)" && git push -f origin HEAD:backtest
