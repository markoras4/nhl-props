name: Probe data sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free odds sources (NHL player props)
        run: |
          exec >> probe-out.txt 2>&1
          python3 - <<'PY'
          import json, re, urllib.request, collections
          H={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36","Accept":"application/json"}
          def get(u, h=None):
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u, headers={**H, **(h or {})}), timeout=40)
                  return r.status, r.read()
              except Exception as e:
                  return getattr(e,"code",None) or str(e)[:120], b""
          # Bovada: every market group/description on one game
          st,b=get("https://www.bovada.lv/services/sports/event/v2/events/A/description/hockey/nhl?lang=en&preMatchOnly=true")
          evs=[e for grp in json.loads(b) for e in grp.get("events",[])]
          st,b=get("https://www.bovada.lv/services/sports/event/coupon/events/A/description"+evs[0]["link"]+"?lang=en")
          js=json.loads(b); ev=[e for grp in js for e in grp.get("events",[])][0]
          print("BOVADA", ev.get("description"))
          for dg in ev.get("displayGroups",[]):
              ms=dg.get("markets",[])
              print(" group:", dg.get("description"), len(ms))
              seen=collections.Counter(re.sub(r" - .*","",m.get("description","")) for m in ms)
              print("   ", list(seen.items())[:25])
          # sample anytime goal + a shots market with outcomes
          for dg in ev.get("displayGroups",[]):
              for m in dg.get("markets",[]):
                  d=m.get("description","")
                  if re.search(r"goal ?scorer|anytime|hits|blocked", d, re.I):
                      print(" SAMPLE", d, [(o.get("description"), o.get("price",{}).get("decimal"), o.get("price",{}).get("handicap")) for o in m.get("outcomes",[])[:4]])
                      break
          # Pinnacle: matchups (special props) + prices
          st,b=get("https://guest.api.arcadia.pinnacle.com/0.1/leagues/1456/matchups")
          mus=json.loads(b); sp=[m for m in mus if m.get("type")=="special"]
          print("\nPINNACLE matchups", len(mus), "specials", len(sp))
          cats=collections.Counter((m.get("special") or {}).get("category") for m in sp); print(" categories", cats.most_common(10))
          ex=[m for m in sp if "Total" in (m.get("special") or {}).get("description","")][:2]
          print(" example", json.dumps(ex[:1])[:900])
          for u,h in [("https://guest.api.arcadia.pinnacle.com/0.1/leagues/1456/markets/straight",None),
                      ("https://guest.api.arcadia.pinnacle.com/0.1/leagues/1456/markets/straight",{"X-API-Key":"CmX2KcMrXuFmNg6YFbmTxE0y9CIrOi0R","Referer":"https://www.pinnacle.com/"})]:
              st,b=get(u,h); print(" straight", st, len(b), (b[:400].decode("utf-8","ignore") if b else ""))
              if b and ex:
                  mk=json.loads(b); ids={m["id"] for m in ex}
                  print("  prices for example ids:", [x for x in mk if x.get("matchupId") in ids][:2])
          # Kambi ubse: does our own feed carry PP points / 2+ points?
          st,b=get("https://eu-offering-api.kambicdn.com/offering/v2018/ubse/listView/ice_hockey/nhl/all/all/matches.json?lang=en_GB&market=SE&useCombined=true")
          eid=json.loads(b)["events"][0]["event"]["id"]
          st,b=get(f"https://eu-offering-api.kambicdn.com/offering/v2018/ubse/betoffer/event/{eid}.json?lang=en_GB&market=SE&includeParticipants=true")
          labs=collections.Counter((x.get("criterion") or {}).get("englishLabel") for x in json.loads(b).get("betOffers",[]))
          print("\nKAMBI ubse labels", labs.most_common(60))
          PY
      - name: Save
        run: |
          git config user.name "nhl-props-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout --orphan probe2 && git rm -rfq --cached . && git add probe-out.txt && git commit -qm probe && git push -f origin HEAD:probe2
