name: Probe data sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: MoneyPuck pages
        run: |
          exec >> probe-out.txt 2>&1
          UA="Mozilla/5.0 (personal NHL props model; non-commercial)"
          for u in https://moneypuck.com/ https://moneypuck.com/index.html https://moneypuck.com/goalies.htm; do
            echo "=== $u"; curl -sL -A "$UA" "$u" -o page.html -w "%{http_code} %{size_download}\n"
            grep -oiE '(src|href)="[^"]+\.(js|json|csv)[^"]*"' page.html | head -40
            grep -oiE '[^"'"'"' ]*(start|goalie|predict)[^"'"'"' ]*' page.html | sort -u | head -40
          done
          for js in $(grep -oiE 'src="[^"]+\.js[^"]*"' page.html | sed -E 's/src="//;s/"$//' | head -10); do
            case "$js" in http*) url="$js";; /*) url="https://moneypuck.com$js";; *) url="https://moneypuck.com/$js";; esac
            echo "=== JS $url"; curl -sL -A "$UA" "$url" | grep -oiE '[^"'"'"' ]*(start|goalie|predict|games)[^"'"'"' ]*\.(csv|json|htm|txt)[^"'"'"' ]*' | sort -u | head -30
          done
      - name: MoneyPuck home page scripts
        run: |
          exec >> probe-out.txt 2>&1
          UA="Mozilla/5.0 (personal NHL props model; non-commercial)"
          curl -sL -A "$UA" https://moneypuck.com/index.html -o idx.html
          for js in $(grep -oiE 'src="[^"]+\.js[^"]*"' idx.html | sed -E 's/src="//;s/"$//' | head -15); do
            case "$js" in http*) url="$js";; /*) url="https://moneypuck.com$js";; *) url="https://moneypuck.com/$js";; esac
            echo "=== JS $url"; curl -sL -A "$UA" "$url" | grep -oiE '.{0,80}(startingGoalie|starter|goalie).{0,80}' | head -15
          done
      - name: Other feeds
        run: |
          exec >> probe-out.txt 2>&1
          curl -s https://api-web.nhle.com/v1/schedule/now | head -c 600; echo
          curl -s https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/injuries | head -c 800; echo
          curl -sL -A "Mozilla/5.0" "https://www.dailyfaceoff.com/starting-goalies/$(date -u +%F)" | grep -o '__NEXT_DATA__' | head -1
          curl -sI https://assets.nhle.com/logos/nhl/svg/TOR_dark.svg | head -3
      - name: Save output to the probe branch
        run: |
          git config user.name "nhl-props-bot"; git config user.email "actions@users.noreply.github.com"
          cp probe-out.txt /tmp/out.txt; cp page.html /tmp/goalies.htm 2>/dev/null || true; cp idx.html /tmp/idx.html 2>/dev/null || true
          git checkout --orphan probe; git rm -rfq . ; cp /tmp/out.txt /tmp/goalies.htm /tmp/idx.html . 2>/dev/null || true
          git add -A; git commit -qm "probe output"; git push -f origin probe
