name: Probe data sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kambi operators with hits/blocks
        run: |
          exec >> probe-out.txt 2>&1
          python3 - <<'PY'
          import json, urllib.request, collections
          def get(u):
              return json.load(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent":"Mozilla/5.0"}), timeout=25))
          for op in ["rsiuspa","rsiusnj","rsiusil","rsiusin","rsiusny","ubusnj","ubuspa","ub","ubdk","paf","888","leo","bbuk","nzbmww"]:
              for host in ["eu-offering-api.kambicdn.com","us1-offering-api.kambicdn.com"]:
                  B=f"https://{host}/offering/v2018/{op}"
                  try:
                      lst=get(B+"/listView/ice_hockey/nhl/all/all/matches.json?lang=en_US&market=US&useCombined=true")
                  except Exception as e:
                      print(op, host, "ERR", str(e)[:60]); continue
                  evs=[e["event"] for e in lst.get("events",[])]
                  labs=collections.Counter()
                  for e in evs[:4]:
                      try:
                          b=get(B+f"/betoffer/event/{e['id']}.json?lang=en_US&market=US&includeParticipants=true")
                      except Exception as ex:
                          continue
                      for o in b.get("betOffers",[]):
                          labs[(o.get("criterion",{}).get("englishLabel") or "")]+=1
                  hb={k:v for k,v in labs.items() if any(w in k.lower() for w in ("hit","block"))}
                  print(op, host, "events", len(evs), "markets", len(labs), "HITS/BLOCKS:", hb)
                  break
          PY
      - name: Superbet
        run: |
          exec >> probe-out.txt 2>&1
          for u in "https://production-superbet-offer-ro.freetls.fastly.net/sb-ro/api/v2/en-BR/sport/5/tournaments" "https://production-superbet-offer-pl.freetls.fastly.net/v2/pl-PL/events/by-date?offerState=prematch&startDate=2026-10-26+00:00:00&endDate=2026-10-27+00:00:00" "https://production-superbet-offer-ro.freetls.fastly.net/v2/ro-RO/events/by-date?offerState=prematch&startDate=2026-10-26+00:00:00&endDate=2026-10-27+00:00:00"; do
            echo "== $u"; curl -s -m 20 -A "Mozilla/5.0" "$u" | head -c 600; echo
          done
      - name: Save output to the probe branch
        run: |
          git config user.name "nhl-props-bot"; git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/o; cp probe-out.txt /tmp/o/ 2>/dev/null || true
          git checkout --orphan probe2; git rm -rfq . ; cp /tmp/o/* . ; git add -A; git commit -qm "probe"; git push -f origin probe2
