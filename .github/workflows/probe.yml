name: Probe data sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Live scores function
        run: |
          exec >> probe-out.txt 2>&1
          curl -s -m 20 -i "https://evxnevqxykbfocqfqxid.supabase.co/functions/v1/scores" | head -c 1500; echo
          echo ----
          curl -s -m 20 "https://evxnevqxykbfocqfqxid.supabase.co/functions/v1/scores?date=2026-10-25" | head -c 1500; echo
      - name: Save output to the probe branch
        run: |
          git config user.name "nhl-props-bot"; git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/o; cp probe-out.txt /tmp/o/ 2>/dev/null || true
          git checkout --orphan probe2; git rm -rfq . ; cp /tmp/o/* . ; git add -A; git commit -qm "probe"; git push -f origin probe2
