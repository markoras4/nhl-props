name: Probe data sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: US books - hits/blocks categories
        run: |
          exec >> probe-out.txt 2>&1
          python3 - <<'PY'
          import json, urllib.request, re
          H={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36","Accept":"application/json"}
          def get(u):
              r=urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=25); return r.read().decode("utf-8","replace")
          for st in ["dkusnj","dkusny","dkuspa"]:
              u=f"https://sportsbook-nash.draftkings.com/api/sportscontent/{st}/v1/leagues/42133"
              try:
                  t=get(u); js=json.loads(t)
                  cats=sorted({(c.get("name"),c.get("id")) for c in js.get("categories",[])}, key=str)
                  subs=sorted({(s.get("name"),s.get("id")) for s in js.get("subcategories",[])}, key=str)
                  print("DK",st,"events",len(js.get("events",[])),"cats",cats[:40]); print("  subcats",[s for s in subs if re.search("hit|block|shot|point|goal",str(s[0]),re.I)][:40]); break
              except Exception as e: print("DK",st,"ERR",str(e)[:100])
          for u in ["https://sbapi.nj.sportsbook.fanduel.com/api/content-managed-page?page=CUSTOM&customPageId=nhl&_ak=FhMFpcPWXMeyZxOx&timezone=America%2FNew_York",
                    "https://sbapi.ny.sportsbook.fanduel.com/api/content-managed-page?page=CUSTOM&customPageId=nhl&_ak=FhMFpcPWXMeyZxOx&timezone=America%2FNew_York"]:
              try:
                  t=get(u); print("FD", len(t), sorted(set(re.findall(r'"marketType":"([A-Z_]*(?:HIT|BLOCK)[A-Z_]*)"', t)))[:20], t[:200].replace("\n"," "))
              except Exception as e: print("FD ERR", str(e)[:100])
          PY
      - name: Save output to the probe branch
        run: |
          git config user.name "nhl-props-bot"; git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/o; cp probe-out.txt /tmp/o/ 2>/dev/null || true
          git checkout --orphan probe2; git rm -rfq . ; cp /tmp/o/* . ; git add -A; git commit -qm "probe"; git push -f origin probe2
