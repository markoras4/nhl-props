name: Probe data sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: SHL stats pages (browser)
        run: |
          python3 tools/probe/shl4.py || echo "probe failed"
      - name: Save
        run: |
          git config user.name "nhl-props-bot"; git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/pr && cp -r probe-shl4 /tmp/pr/
          git checkout --orphan probe2 && git rm -rfq --cached . && rm -rf ./* && cp -r /tmp/pr/probe-shl4 . && git add probe-shl4 && git commit -qm probe && git push -f origin HEAD:probe2
