name: Probe data sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hits and blocks markets in the odds feed
        run: |
          exec >> probe-out.txt 2>&1
          python3 - <<'PY'
          import json, urllib.request, collections
          B="https://eu-offering-api.kambicdn.com/offering/v2018/ubse"
          get=lambda u: json.load(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent":"Mozilla/5.0"}), timeout=30))
          lst=get(B+"/listView/ice_hockey/nhl/all/all/matches.json?lang=en_GB&market=SE&useCombined=true")
          evs=[e["event"] for e in lst.get("events",[])]
          print("events", len(evs))
          labels=collections.Counter()
          sample=None
          for e in evs[:12]:
              b=get(B+f"/betoffer/event/{e['id']}.json?lang=en_GB&market=SE&includeParticipants=true")
              for o in b.get("betOffers",[]):
                  lab=(o.get("criterion",{}).get("englishLabel") or "")
                  labels[lab]+=1
                  if sample is None and any(k in lab.lower() for k in ("hit","block","tackl")):
                      sample=json.dumps(o)[:1500]
          for k,v in sorted(labels.items()):
              if any(w in k.lower() for w in ("hit","block","player","+/-","plus")): print(v, k)
          print("SAMPLE", sample)
          PY
      - name: Save output to the probe branch
        run: |
          git config user.name "nhl-props-bot"; git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/o; cp probe-out.txt /tmp/o/ 2>/dev/null || true
          git checkout --orphan probe2; git rm -rfq . ; cp /tmp/o/* . ; git add -A; git commit -qm "probe"; git push -f origin probe2
