name: Probe data sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kambi NHL outrights
        run: |
          exec >> probe-out.txt 2>&1
          python3 - <<'PY'
          import json, urllib.request
          B="https://eu-offering-api.kambicdn.com/offering/v2018/ubse"
          H={"User-Agent":"Mozilla/5.0"}
          def get(u):
              return json.loads(urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=30).read())
          for i in [1027873729, 1027873730]:
              bo=get(f"{B}/betoffer/event/{i}.json?lang=en_GB&market=SE")
              for b in bo.get("betOffers") or []:
                  oc=b.get("outcomes") or []
                  print(i, (b.get("criterion") or {}).get("label"), "|", [(o.get("label"), o.get("line"), o.get("odds")) for o in oc[:4]])
          PY
      - name: Save
        run: |
          git config user.name "nhl-props-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout --orphan probe2 && git rm -rfq --cached . && git add probe-out.txt && git commit -qm probe && git push -f origin HEAD:probe2
