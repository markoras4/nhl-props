name: Probe data sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: MoneyPuck line combinations
        run: |
          exec >> probe-out.txt 2>&1
          python3 - <<'PY'
          import urllib.request, csv, io, collections
          u="https://moneypuck.com/moneypuck/playerData/seasonSummary/2026/regular/lines.csv"
          raw=urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent":"Mozilla/5.0"}), timeout=60).read().decode()
          rows=list(csv.DictReader(io.StringIO(raw)))
          print("rows", len(rows)); print("columns", list(rows[0].keys()))
          print(collections.Counter((r.get("position"), r.get("situation")) for r in rows).most_common(10))
          for r in [x for x in rows if x.get("team") in ("PHI","CBJ") and x.get("situation")=="5on5"][:6]:
              print({k: r[k] for k in list(r.keys())[:14]})
          PY
      - name: Save
        run: |
          git config user.name "nhl-props-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout --orphan probe2 && git rm -rfq --cached . && git add probe-out.txt && git commit -qm probe && git push -f origin HEAD:probe2
