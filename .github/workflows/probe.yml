name: Probe data sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free odds sources (NHL player props)
        run: |
          exec >> probe-out.txt 2>&1
          python3 - <<'PY'
          import urllib.request, io
          H={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"}
          def get(u):
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=60); return r.status, r.read()
              except Exception as e:
                  return getattr(e,"code",None) or str(e)[:120], b""
          for u in ["https://moneypuck.com/moneypuck/playerData/careers/gameByGame/regular/skaters/8471214.csv",
                    "https://moneypuck.com/moneypuck/playerData/careers/gameByGame/skaters/8471214.csv",
                    "https://moneypuck.com/moneypuck/playerData/seasonSummary/2025/regular/skaters.csv"]:
              st,b=get(u); print("==", st, len(b), u)
              if b:
                  lines=b.decode("utf-8","ignore").splitlines(); print(" header:", lines[0][:900]); print(" rows:", len(lines)); print(" last:", lines[-1][:300])
          PY
      - name: Save
        run: |
          git config user.name "nhl-props-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout --orphan probe2 && git rm -rfq --cached . && git add probe-out.txt && git commit -qm probe && git push -f origin HEAD:probe2
