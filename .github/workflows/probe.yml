name: Probe data sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: FanDuel event props
        run: |
          exec >> probe-out.txt 2>&1
          python3 - <<'PY'
          import json, urllib.request, re, collections
          H={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36","Accept":"application/json"}
          get=lambda u: json.loads(urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=25).read())
          AK="FhMFpcPWXMeyZxOx"
          page=get(f"https://sbapi.nj.sportsbook.fanduel.com/api/content-managed-page?page=CUSTOM&customPageId=nhl&_ak={AK}&timezone=America%2FNew_York")
          evs=page.get("attachments",{}).get("events",{})
          print("events", len(evs), [ (k,v.get("name"),v.get("openDate")) for k,v in list(evs.items())[:6]])
          for eid,ev in list(evs.items())[:3]:
              for tab in ["player-props","popular","player-points","goal-scorer","player-shots",""]:
                  u=f"https://sbapi.nj.sportsbook.fanduel.com/api/event-page?_ak={AK}&eventId={eid}" + (f"&tab={tab}" if tab else "")
                  try: js=get(u)
                  except Exception as e: print(eid, tab, "ERR", str(e)[:80]); continue
                  mk=js.get("attachments",{}).get("markets",{})
                  types=collections.Counter(m.get("marketType") for m in mk.values())
                  names=sorted({m.get("marketName") for m in mk.values() if re.search("hit|block",str(m.get("marketName")),re.I)})
                  tabs=[t.get("title") for t in (js.get("layout",{}).get("tabs",{}) or {}).values()] if isinstance(js.get("layout",{}).get("tabs"),dict) else js.get("layout",{}).get("tabs")
                  print(eid, ev.get("name"), "tab", tab or "-", "markets", len(mk), "HB names", names[:12])
                  if tab=="": print("  tabs:", str(tabs)[:400]); print("  types:", [t for t in types if t and re.search("HIT|BLOCK",t)])
              break
          PY
      - name: Save output to the probe branch
        run: |
          git config user.name "nhl-props-bot"; git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/o; cp probe-out.txt /tmp/o/ 2>/dev/null || true
          git checkout --orphan probe2; git rm -rfq . ; cp /tmp/o/* . ; git add -A; git commit -qm "probe"; git push -f origin probe2
