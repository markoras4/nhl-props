name: Probe data sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free odds sources (NHL player props)
        run: |
          exec >> probe-out.txt 2>&1
          python3 - <<'PY'
          import json, urllib.request, os
          H={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36","Accept":"application/json"}
          os.makedirs("raw", exist_ok=True)
          def save(u, f):
              b=urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=60).read(); open("raw/"+f,"wb").write(b); print(f, len(b))
          save("https://guest.api.arcadia.pinnacle.com/0.1/leagues/1456/matchups", "pin_matchups.json")
          save("https://guest.api.arcadia.pinnacle.com/0.1/leagues/1456/markets/straight", "pin_straight.json")
          B="https://eu-offering-api.kambicdn.com/offering/v2018/ubse"
          save(B+"/listView/ice_hockey/nhl/all/all/matches.json?lang=en_GB&market=SE&useCombined=true", "kambi_list.json")
          eid=json.load(open("raw/kambi_list.json"))["events"][0]["event"]["id"]
          save(B+f"/betoffer/event/{eid}.json?lang=en_GB&market=SE&includeParticipants=true", f"kambi_{eid}.json")
          PY
      - name: Save
        run: |
          git config user.name "nhl-props-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout --orphan probe2 && git rm -rfq --cached . && git add probe-out.txt raw && git commit -qm probe && git push -f origin HEAD:probe2
