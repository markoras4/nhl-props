name: Daily videos

on:
  # GitHub's clock is UTC, Sweden switches between UTC+1 (winter) and UTC+2 (summer). Each slot has one line per
  # season; the "Pick the date" step checks the Swedish clock, so videos go out at the same Swedish time all year.
  schedule:
    - cron: "0 9 * * *"     # 10:00 Sweden (winter) - morning slot: videos about games already played (last night, weekly report)
    - cron: "0 8 * * *"     # 10:00 Sweden (summer)
    - cron: "30 14 * * *"   # 15:30 Sweden (winter) - upcoming slot: tonight's games (Board, Hot or lucky)
    - cron: "30 13 * * *"   # 15:30 Sweden (summer)
  workflow_dispatch:         # "Run workflow" button in the Actions tab
    inputs:
      date:
        description: "Slate date YYYY-MM-DD (empty = today in New York)"
        required: false
        default: ""
      slot:
        description: "Which videos (slate = only the long-form slate breakdown)"
        type: choice
        options: [all, morning, upcoming, slate]
        default: all
      slate:
        description: "Also render the long-form 'Tonight's slate' breakdown (YouTube, ~8 min)"
        type: boolean
        default: false
      dry_run:
        description: "Render only, do not upload (shows what would be posted)"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write   # GitHub's OIDC token: reads the Pro data from private storage (pro-upload accepts only this repo's main)

concurrency:
  group: daily-videos
  cancel-in-progress: false

jobs:
  videos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Pick the date and the slot
        id: d
        env:
          IN_DATE: ${{ inputs.date }}
          IN_SLOT: ${{ inputs.slot }}
          CRON: ${{ github.event.schedule }}
        run: |
          DATE="$IN_DATE"
          if [ -z "$DATE" ]; then DATE=$(TZ=America/New_York date +%F); fi
          SLOT="${IN_SLOT:-all}"; RUN=yes
          if [ -n "$CRON" ]; then
            # Decide by the Swedish clock, not by which cron line fired: GitHub can start scheduled runs an hour late
            # (and then reports the other season's line). Morning window 09:50-11:14, upcoming window 15:20-16:44.
            # A second run in the same window is harmless: the upload ledger never posts a video twice.
            L=$((10#$(TZ=Europe/Stockholm date +%H%M)))
            if [ "$L" -ge 950 ] && [ "$L" -lt 1115 ]; then SLOT=morning
            elif [ "$L" -ge 1520 ] && [ "$L" -lt 1645 ]; then SLOT=upcoming
            else RUN=no; echo "Outside both posting windows (Sweden $(TZ=Europe/Stockholm date +%H:%M))"; fi
          fi
          if [ "$SLOT" = "slate" ]; then RUN=no; fi                  # slot "slate": only the slate job below runs
          echo "date=$DATE" >> "$GITHUB_OUTPUT"; echo "slot=$SLOT" >> "$GITHUB_OUTPUT"; echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "Slate date: $DATE, slot: $SLOT, run: $RUN (Sweden is UTC$(TZ=Europe/Stockholm date +%z))"

      - uses: actions/setup-python@v5
        if: steps.d.outputs.run == 'yes'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages, Chromium and ffmpeg
        if: steps.d.outputs.run == 'yes'
        run: |
          pip install -r requirements.txt
          pip install numpy scipy pillow playwright requests
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Fetch the built site (waits for this slot's data build if it is still running)
        if: steps.d.outputs.run == 'yes'
        env:
          SLOT: ${{ steps.d.outputs.slot }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          git fetch -q --depth=1 origin site
          # morning slot needs the 08:15 UTC results build, upcoming slot the 13:15 UTC build (Daily build workflow)
          if [ "$SCHEDULED" = "true" ]; then
            case "$SLOT" in morning) NEED="08:10";; upcoming) NEED="13:10";; *) NEED="";; esac
            if [ -n "$NEED" ]; then
              need=$(date -u -d "today $NEED" +%s)
              for i in $(seq 1 30); do
                have=$(git log -1 --format=%ct origin/site)
                if [ "$have" -ge "$need" ]; then echo "Site build from $(date -u -d @$have +%H:%M) UTC is fresh"; break; fi
                echo "Waiting for today's $NEED UTC data build (latest site is from $(date -u -d @$have '+%F %H:%M') UTC)"; sleep 120
                git fetch -q --depth=1 origin site
              done
            fi
          fi

      - name: Fetch today's Pro data (private storage, never public; graded picks need every player's numbers)
        if: steps.d.outputs.run == 'yes'
        run: |
          mkdir -p output/pro
          OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=nhl-props-pro-upload" | python -c "import sys,json;print(json.load(sys.stdin)['value'])")
          code=$(curl -sS -o output/pro/latest.json -w "%{http_code}" -H "Authorization: Bearer $OIDC" "https://evxnevqxykbfocqfqxid.supabase.co/functions/v1/pro-upload?path=latest.json")
          if [ "$code" != "200" ]; then echo "::warning::Pro data not available ($code): videos use the public numbers only"; rm -f output/pro/latest.json; else echo "Pro data: $(wc -c < output/pro/latest.json) bytes"; fi

      - name: Fetch the licensed music (Snap Crackle, private storage; every video uses it)
        if: steps.d.outputs.run == 'yes' && vars.LONGFORM_MUSIC != ''
        env:
          MUSIC: ${{ vars.LONGFORM_MUSIC }}
        run: |
          mkdir -p "$RUNNER_TEMP/video-music"
          OUT="$RUNNER_TEMP/video-music/$(basename "$MUSIC")"
          OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=nhl-props-pro-upload" | python -c "import sys,json;print(json.load(sys.stdin)['value'])")
          code=$(curl -sS -G -o "$OUT" -w "%{http_code}" -H "Authorization: Bearer $OIDC" --data-urlencode "path=music/$MUSIC" "https://evxnevqxykbfocqfqxid.supabase.co/functions/v1/pro-upload")
          if [ "$code" = "200" ] && [ -s "$OUT" ]; then echo "VIDEO_MUSIC_PATH=$OUT" >> "$GITHUB_ENV"; echo "Music: $(wc -c < "$OUT") bytes"
          else echo "::warning::Licensed music not available ($code): using the generated music"; rm -f "$OUT"; fi

      - name: Render the videos
        id: r
        if: steps.d.outputs.run == 'yes'
        env:
          DATE: ${{ steps.d.outputs.date }}
          SLOT: ${{ steps.d.outputs.slot }}
        run: |
          SLOTARG=""; if [ "$SLOT" != "all" ]; then SLOTARG="--slot $SLOT"; fi
          python video/series.py --date "$DATE" --all $SLOTARG --out video/out
          # tonight's games: a Game preview Short for each of the 3 featured games (stats only, real app footage)
          if [ "$SLOT" != "morning" ]; then python video/previews.py --date "$DATE" --n 3 --out video/out || echo "::warning::Game previews failed"; fi
          if [ ! -f "video/out/$DATE/manifest.json" ]; then echo "Nothing to post in this slot today"; echo "any=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "any=yes" >> "$GITHUB_OUTPUT"
          ls -la "video/out/$DATE"

      - name: Keep the videos as a download (Actions run page, 7 days)
        if: steps.r.outputs.any == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ steps.d.outputs.date }}
          path: video/out/${{ steps.d.outputs.date }}
          retention-days: 7
          if-no-files-found: warn

      - name: Upload to YouTube and TikTok
        if: github.ref == 'refs/heads/main' && steps.r.outputs.any == 'yes'
        env:
          DATE: ${{ steps.d.outputs.date }}
          DRY_RUN: ${{ inputs.dry_run }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
          REPO: ${{ github.repository }}
        run: |
          M="video/out/$DATE/manifest.json"
          if [ "$DRY_RUN" = "true" ]; then
            if [ -n "$YT_REFRESH_TOKEN" ]; then python video/upload.py --manifest "$M" --check || echo "::warning title=YouTube::YouTube sign-in check failed"; fi
            python video/upload.py --manifest "$M" --dry-run; exit 0
          fi
          ARGS=""
          YT=0; TT=0
          if [ -n "$YT_CLIENT_ID" ] && [ -n "$YT_CLIENT_SECRET" ] && [ -n "$YT_REFRESH_TOKEN" ]; then YT=1; else echo "No YouTube secrets yet - skipping YouTube"; fi
          # PAUSED 2026-11-28: the channel has 2 of 3 copyright strikes (freetouse takedowns over Snap Crackle); a third deletes it.
          # Delete the next line only once freetouse has whitelisted the channel and the strikes are resolved.
          YT=0; echo "::notice title=YouTube::YouTube uploads are paused (copyright strikes) - see videos.yml"
          if [ -n "$TIKTOK_CLIENT_KEY" ] && [ -n "$TIKTOK_CLIENT_SECRET" ] && [ -n "$TIKTOK_REFRESH_TOKEN" ]; then TT=1; else echo "No TikTok secrets yet - skipping TikTok"; fi
          if [ "$YT" = 0 ] && [ "$TT" = 0 ]; then exit 0; fi
          if [ "$YT" = 1 ] && [ "$TT" = 0 ]; then ARGS="--only youtube"; fi
          if [ "$YT" = 0 ] && [ "$TT" = 1 ]; then ARGS="--only tiktok"; fi
          # TikTok replaces its refresh token on every sign-in; upload.py writes the new one here (never to the log)
          export TIKTOK_REFRESH_TOKEN_OUT="$RUNNER_TEMP/tiktok_refresh_token"
          python video/upload.py --manifest "$M" $ARGS
          if [ -s "$TIKTOK_REFRESH_TOKEN_OUT" ]; then
            # TikTok's old refresh token stops working once a new one is issued: store the new one as the secret
            if [ -n "$GH_SECRETS_PAT" ]; then
              GH_TOKEN="$GH_SECRETS_PAT" gh secret set TIKTOK_REFRESH_TOKEN --repo "$REPO" < "$TIKTOK_REFRESH_TOKEN_OUT" && echo "TikTok refresh token renewed in the repository secrets"
            else
              echo "::warning title=TikTok::TikTok issued a new refresh token but GH_SECRETS_PAT is not set - the next TikTok upload will fail (see video/UPLOAD.md)"
            fi
          fi
          rm -f "$TIKTOK_REFRESH_TOKEN_OUT"

      - name: Save the upload ledger to the repository
        if: always() && github.ref == 'refs/heads/main' && inputs.dry_run != true
        run: |
          [ -f data/video_uploads.json ] || [ -f data/video_picks.json ] || exit 0
          git config user.name "nhl-props-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in data/video_uploads.json data/video_picks.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then echo "Ledger unchanged"; exit 0; fi
          git commit -qm "Video uploads $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && { echo "Ledger saved"; exit 0; }
            echo "Push failed (attempt $i), retrying"; sleep $((i * 5))
          done
          echo "::error::Could not save data/video_uploads.json - the next run may post these videos again"
          exit 1

  # Long-form "Tonight's slate" breakdown (16:9, ~8 min, YouTube only; video/longform.py). Runs after the short videos
  # in the upcoming slot (15:30 Sweden), but on the schedule ONLY when the repository variable SLATE_DAILY is 'true'
  # (Settings > Secrets and variables > Actions > Variables). On demand: "Run workflow" with slate ticked, or slot = slate.
  slate:
    # after the short videos: both jobs commit data/video_uploads.json, and the videos job rebases its push
    needs: videos
    # don't even start a runner unless asked for: on demand, or the 15:30 slot with SLATE_DAILY switched on
    if: always() && ((github.event_name == 'workflow_dispatch' && (inputs.slate || inputs.slot == 'slate')) || (github.event_name == 'schedule' && vars.SLATE_DAILY == 'true' && (github.event.schedule == '30 14 * * *' || github.event.schedule == '30 13 * * *')))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether the slate video runs
        id: d
        env:
          IN_DATE: ${{ inputs.date }}
          IN_SLOT: ${{ inputs.slot }}
          IN_SLATE: ${{ inputs.slate }}
          CRON: ${{ github.event.schedule }}
          DAILY: ${{ vars.SLATE_DAILY }}
        run: |
          DATE="$IN_DATE"
          if [ -z "$DATE" ]; then DATE=$(TZ=America/New_York date +%F); fi
          RUN=no
          if [ -n "$CRON" ]; then
            L=$((10#$(TZ=Europe/Stockholm date +%H%M)))      # same 15:20-16:44 Swedish window as the upcoming slot
            if [ "$L" -ge 1520 ] && [ "$L" -lt 1645 ]; then RUN=yes; fi
            if [ "$RUN" = yes ] && [ "$DAILY" != "true" ]; then RUN=no; echo "Scheduled slate video is off (repository variable SLATE_DAILY is not 'true')"; fi
          elif [ "$IN_SLATE" = "true" ] || [ "$IN_SLOT" = "slate" ]; then
            RUN=yes
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"; echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "Slate date: $DATE, run: $RUN"

      - uses: actions/setup-python@v5
        if: steps.d.outputs.run == 'yes'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages, Chromium and ffmpeg
        if: steps.d.outputs.run == 'yes'
        run: |
          pip install -r requirements.txt
          pip install numpy scipy pillow playwright requests
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Fetch the built site (waits for the 13:15 UTC data build on scheduled runs)
        if: steps.d.outputs.run == 'yes'
        env:
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          git fetch -q --depth=1 origin site
          if [ "$SCHEDULED" = "true" ]; then
            need=$(date -u -d "today 13:10" +%s)
            for i in $(seq 1 30); do
              have=$(git log -1 --format=%ct origin/site)
              if [ "$have" -ge "$need" ]; then echo "Site build from $(date -u -d @$have +%H:%M) UTC is fresh"; break; fi
              echo "Waiting for today's 13:10 UTC data build (latest site is from $(date -u -d @$have '+%F %H:%M') UTC)"; sleep 120
              git fetch -q --depth=1 origin site
            done
          fi

      - name: Fetch today's Pro data (private storage; point chances need it, the video works without)
        if: steps.d.outputs.run == 'yes'
        run: |
          mkdir -p output/pro
          OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=nhl-props-pro-upload" | python -c "import sys,json;print(json.load(sys.stdin)['value'])")
          code=$(curl -sS -o output/pro/latest.json -w "%{http_code}" -H "Authorization: Bearer $OIDC" "https://evxnevqxykbfocqfqxid.supabase.co/functions/v1/pro-upload?path=latest.json")
          if [ "$code" != "200" ]; then echo "::warning::Pro data not available ($code): the slate video uses the public numbers only"; rm -f output/pro/latest.json; else echo "Pro data: $(wc -c < output/pro/latest.json) bytes"; fi

      # TODO(music): upload the licensed track to private storage first (music/<file>, served by pro-upload like
      # latest.json), then set the repository variable LONGFORM_MUSIC to that file name. Never commit music files:
      # the repository is public. Without the variable (or when the download fails) the generated music is used.
      - name: Fetch the licensed music for the slate video (skipped while vars.LONGFORM_MUSIC is empty)
        if: steps.d.outputs.run == 'yes' && vars.LONGFORM_MUSIC != ''
        env:
          MUSIC: ${{ vars.LONGFORM_MUSIC }}
        run: |
          mkdir -p "$RUNNER_TEMP/longform-music"
          OUT="$RUNNER_TEMP/longform-music/$(basename "$MUSIC")"
          OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=nhl-props-pro-upload" | python -c "import sys,json;print(json.load(sys.stdin)['value'])")
          code=$(curl -sS -G -o "$OUT" -w "%{http_code}" -H "Authorization: Bearer $OIDC" --data-urlencode "path=music/$MUSIC" "https://evxnevqxykbfocqfqxid.supabase.co/functions/v1/pro-upload")
          if [ "$code" = "200" ] && [ -s "$OUT" ]; then echo "LONGFORM_MUSIC_PATH=$OUT" >> "$GITHUB_ENV"; echo "Music: $(wc -c < "$OUT") bytes"
          else echo "::warning::Licensed music not available ($code): using the generated music"; rm -f "$OUT"; fi

      - name: Render the slate video
        id: r
        if: steps.d.outputs.run == 'yes'
        env:
          DATE: ${{ steps.d.outputs.date }}
          VAR_MUSIC_PATH: ${{ vars.LONGFORM_MUSIC_PATH }}
        run: |
          MP="${LONGFORM_MUSIC_PATH:-$VAR_MUSIC_PATH}"
          MUSICARG=()
          if [ -n "$MP" ] && [ -f "$MP" ]; then MUSICARG=(--music "$MP"); echo "Music file: $(basename "$MP")"; else echo "Music: generated"; fi
          python video/longform.py --date "$DATE" --out video/out "${MUSICARG[@]}"
          if [ ! -f "video/out/$DATE/slate-$DATE.mp4" ]; then echo "No slate video today"; echo "any=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "any=yes" >> "$GITHUB_OUTPUT"
          ls -la "video/out/$DATE"

      - name: Keep the video as a download (Actions run page, 7 days)
        if: steps.r.outputs.any == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: slate-${{ steps.d.outputs.date }}
          path: |
            video/out/${{ steps.d.outputs.date }}/slate-*
            video/out/${{ steps.d.outputs.date }}/manifest.json
          retention-days: 7
          if-no-files-found: warn

      - name: Upload to YouTube and TikTok
        if: github.ref == 'refs/heads/main' && steps.r.outputs.any == 'yes'
        env:
          DATE: ${{ steps.d.outputs.date }}
          DRY_RUN: ${{ inputs.dry_run }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
          REPO: ${{ github.repository }}
        run: |
          M="video/out/$DATE/manifest.json"
          if [ "$DRY_RUN" = "true" ]; then python video/upload.py --manifest "$M" --dry-run; exit 0; fi
          ARGS=""
          YT=0; TT=0
          if [ -n "$YT_CLIENT_ID" ] && [ -n "$YT_CLIENT_SECRET" ] && [ -n "$YT_REFRESH_TOKEN" ]; then YT=1; else echo "No YouTube secrets yet - skipping YouTube"; fi
          # PAUSED 2026-11-28: the channel has 2 of 3 copyright strikes (freetouse takedowns over Snap Crackle); a third deletes it.
          # Delete the next line only once freetouse has whitelisted the channel and the strikes are resolved.
          YT=0; echo "::notice title=YouTube::YouTube uploads are paused (copyright strikes) - see videos.yml"
          if [ -n "$TIKTOK_CLIENT_KEY" ] && [ -n "$TIKTOK_CLIENT_SECRET" ] && [ -n "$TIKTOK_REFRESH_TOKEN" ]; then TT=1; else echo "No TikTok secrets yet - skipping TikTok"; fi
          if [ "$YT" = 0 ] && [ "$TT" = 0 ]; then exit 0; fi
          if [ "$YT" = 1 ] && [ "$TT" = 0 ]; then ARGS="--only youtube"; fi
          if [ "$YT" = 0 ] && [ "$TT" = 1 ]; then ARGS="--only tiktok"; fi
          export TIKTOK_REFRESH_TOKEN_OUT="$RUNNER_TEMP/tiktok_refresh_token"
          python video/upload.py --manifest "$M" $ARGS
          if [ -s "$TIKTOK_REFRESH_TOKEN_OUT" ]; then
            # TikTok's old refresh token stops working once a new one is issued: store the new one as the secret
            if [ -n "$GH_SECRETS_PAT" ]; then
              GH_TOKEN="$GH_SECRETS_PAT" gh secret set TIKTOK_REFRESH_TOKEN --repo "$REPO" < "$TIKTOK_REFRESH_TOKEN_OUT" && echo "TikTok refresh token renewed in the repository secrets"
            else
              echo "::warning title=TikTok::TikTok issued a new refresh token but GH_SECRETS_PAT is not set - the next TikTok upload will fail (see video/UPLOAD.md)"
            fi
          fi
          rm -f "$TIKTOK_REFRESH_TOKEN_OUT"

      - name: Save the upload ledger to the repository
        # Re-apply our entries onto the newest main (a JSON merge) instead of rebasing: never a merge conflict.
        if: always() && github.ref == 'refs/heads/main' && inputs.dry_run != true && steps.r.outputs.any == 'yes'
        run: |
          [ -f data/video_uploads.json ] || exit 0
          cp data/video_uploads.json "$RUNNER_TEMP/mine.json"
          git config user.name "nhl-props-bot"
          git config user.email "actions@users.noreply.github.com"
          MERGE='import json,sys,pathlib; p=pathlib.Path("data/video_uploads.json"); t=json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}; m=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")); t.update(m); p.write_text(json.dumps(t, indent=2, sort_keys=True, ensure_ascii=False) + "\n", encoding="utf-8")'
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python -c "$MERGE" "$RUNNER_TEMP/mine.json"
            git add data/video_uploads.json
            if git diff --cached --quiet; then echo "Ledger unchanged"; exit 0; fi
            git commit -qm "Video uploads $(date -u +%F) (slate)"
            git push -q origin HEAD:main && { echo "Ledger saved"; exit 0; }
            echo "Push failed (attempt $i), retrying"; sleep $((i * 5))
          done
          echo "::error::Could not save data/video_uploads.json - the next run may post the slate video again"
          exit 1
