<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(fonts/anton.woff2) format("woff2")}
@font-face{font-family:"Exo 2";font-weight:500;src:url(fonts/exo2-500.woff2) format("woff2")}
@font-face{font-family:"Exo 2";font-weight:700;src:url(fonts/exo2-700.woff2) format("woff2")}
@font-face{font-family:"Exo 2";font-weight:800;src:url(fonts/exo2-800.woff2) format("woff2")}
@font-face{font-family:Oxanium;font-weight:600;src:url(fonts/oxanium-600.woff2) format("woff2")}
@font-face{font-family:Oxanium;font-weight:800;src:url(fonts/oxanium-800.woff2) format("woff2")}
:root{--bg:#07090d;--mint:#3ddc97;--blue:#5aa9ff;--text:#f2f6fb;--mute:#93a3b6;--warn:#ffb547;--pink:#f07ac0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:var(--bg);overflow:hidden}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Exo 2",sans-serif}
.scene{position:absolute;inset:0;display:none}
.abs{position:absolute}
.bgimg{position:absolute;inset:-80px;background-size:cover;background-position:center}
.shade{position:absolute;inset:0}
.anton{font-family:Anton,sans-serif;text-transform:uppercase;letter-spacing:.5px;line-height:.92}
.chip{display:inline-flex;align-items:center;gap:14px;padding:12px 24px;border-radius:999px;background:rgba(10,14,19,.78);
  border:2px solid rgba(255,255,255,.14);font:600 30px Oxanium;letter-spacing:3px;text-transform:uppercase}
.dot{width:14px;height:14px;border-radius:50%;background:var(--mint);box-shadow:0 0 18px var(--mint)}
.pcard{position:absolute;border-radius:34px;overflow:hidden;background:#111;box-shadow:0 40px 90px rgba(0,0,0,.65),0 0 0 2px rgba(255,255,255,.14) inset}
.pcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%}
.pcard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.55))}
.matchup{position:absolute;left:0;right:0;top:860px;text-align:center;font-size:250px;white-space:nowrap;text-shadow:0 18px 50px rgba(0,0,0,.7)}
.matchup .at{font-size:110px;color:var(--mint);margin:0 26px;vertical-align:58px;display:inline-block}
.matchup span{display:inline-block}
.bars{position:absolute;left:150px;right:150px;top:1112px;height:12px;display:flex;gap:14px}
.bars i{flex:1;border-radius:6px}
.kick{position:absolute;left:0;right:0;top:1140px;text-align:center;font:700 34px Oxanium;letter-spacing:4px;text-transform:uppercase;color:var(--mute)}
.headline{position:absolute;left:60px;right:60px;top:1200px;text-align:center;font:800 62px/1.13 "Exo 2";text-wrap:balance}
.headline span{display:inline-block;margin:0 .13em}
.headline .hl{color:var(--mint)}
.credit{position:absolute;left:40px;right:40px;top:1462px;font:500 22px "Exo 2";color:rgba(242,246,251,.62)}
.card{position:absolute;left:40px;width:1000px;border-radius:32px;background:linear-gradient(160deg,rgba(23,32,43,.94),rgba(10,14,19,.94));
  border:2px solid rgba(255,255,255,.10);box-shadow:0 30px 80px rgba(0,0,0,.55);padding:30px 36px}
.lab{font:600 28px Oxanium;letter-spacing:5px;text-transform:uppercase;color:var(--mute)}
.tag{display:inline-block;padding:8px 18px;border-radius:999px;font:800 24px Oxanium;letter-spacing:3px;text-transform:uppercase;background:var(--mint);color:#06210f}
/* player table */
.tbl{width:100%;border-collapse:separate;border-spacing:0 10px;margin-top:8px}
.tbl th{font:700 24px Oxanium;letter-spacing:3px;color:var(--mute);text-align:right;padding:0 14px 4px}
.tbl th:first-child{text-align:left}
.tbl td{background:rgba(255,255,255,.045);height:96px;padding:0 14px;text-align:right;font:800 40px "Exo 2"}
.tbl td:first-child{text-align:left;border-radius:18px 0 0 18px;font:800 36px "Exo 2"}
.tbl td:last-child{border-radius:0 18px 18px 0}
.tbl td .tm{display:inline-block;width:10px;height:44px;border-radius:5px;vertical-align:-8px;margin-right:16px}
.tbl td small{display:block;font:600 22px Oxanium;color:var(--mute);letter-spacing:1px;margin-top:2px}
.tbl tr.best td{background:rgba(61,220,151,.13);box-shadow:inset 0 2px 0 rgba(61,220,151,.5),inset 0 -2px 0 rgba(61,220,151,.5)}
.tbl tr.best td:first-child{box-shadow:inset 2px 2px 0 rgba(61,220,151,.5),inset 0 -2px 0 rgba(61,220,151,.5)}
.tbl tr.best td:last-child{box-shadow:inset -2px 2px 0 rgba(61,220,151,.5),inset 0 -2px 0 rgba(61,220,151,.5)}
.tbl td.on{color:var(--mint)}
.tbl td.on b{display:inline-block;padding:4px 14px;border-radius:14px;background:rgba(61,220,151,.18);border:2px solid var(--mint)}
/* profile */
.av{position:absolute;left:36px;top:30px;width:160px;height:160px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font:400 88px Anton;color:#fff;box-shadow:0 0 0 6px rgba(255,255,255,.12),0 20px 50px rgba(0,0,0,.5)}
.pname{position:absolute;left:226px;right:30px;top:40px;font:800 64px/1.02 "Exo 2"}
.pmeta{position:absolute;left:226px;right:30px;top:122px;font:700 28px Oxanium;letter-spacing:2px;color:var(--mute);text-transform:uppercase}
.tiles{position:absolute;left:36px;right:36px;top:214px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tiles div{background:rgba(255,255,255,.05);border-radius:20px;padding:14px 0;text-align:center}
.tiles b{display:block;font:400 68px/1 Anton}
.tiles span{font:700 22px Oxanium;letter-spacing:3px;color:var(--mute)}
.chart{position:absolute;left:36px;right:36px;top:400px;height:140px;display:flex;align-items:flex-end;gap:14px}
.chart .c{flex:1;position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.chart .c i{width:100%;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,#5aa9ff,#2b5f9a);transform-origin:bottom}
.chart .c em{position:absolute;top:-6px;font-style:normal;font:800 22px "Exo 2"}
.chart .c u{font:600 18px Oxanium;color:var(--mute);text-decoration:none;margin-top:6px}
.bet .big{font:400 128px/0.9 Anton;letter-spacing:1px}
.odds{display:inline-block;padding:10px 24px;border-radius:18px;background:#fff;color:#07090d;font:400 70px/1 Anton;letter-spacing:1px}
.vrow{display:flex;align-items:center;gap:20px;margin-top:18px}
.vrow .who{width:170px;font:700 26px Oxanium;letter-spacing:3px;color:var(--mute)}
.vtrack{flex:1;height:58px;border-radius:16px;background:rgba(255,255,255,.07);overflow:hidden;position:relative}
.vtrack i{position:absolute;left:0;top:0;bottom:0;border-radius:16px}
.vtrack b{position:absolute;right:18px;top:0;line-height:58px;font:800 32px "Exo 2"}
.edge{position:absolute;right:36px;top:30px;text-align:right}
.edge b{display:block;font:400 92px/0.95 Anton;color:var(--mint)}
.edge span{font:700 24px Oxanium;letter-spacing:3px;color:var(--mute)}
.why{margin-top:22px;font:600 30px/1.35 "Exo 2";color:#d6e0ea}
.why div{display:flex;gap:14px}
.why div::before{content:"";flex:0 0 12px;height:12px;border-radius:50%;background:var(--mint);margin-top:14px}
/* game numbers */
.row{display:flex;align-items:center;gap:20px;margin-top:20px}
.row .who{width:200px;font:700 26px Oxanium;letter-spacing:3px;color:var(--mute)}
.track{flex:1;height:70px;border-radius:18px;overflow:hidden;background:rgba(255,255,255,.06);display:flex}
.track b{display:flex;align-items:center;height:100%;font:800 32px "Exo 2";padding:0 18px;white-space:nowrap;overflow:hidden}
.track b.r{justify-content:flex-end}
.stake{margin-top:24px;font:700 32px "Exo 2";color:#d6e0ea}
.stake em{font-style:normal;color:var(--mint)}
/* outro */
.feat{position:absolute;left:40px;right:40px;top:520px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
.feat div{border-radius:26px;padding:26px 26px;background:linear-gradient(160deg,rgba(23,32,43,.95),rgba(10,14,19,.95));border:2px solid rgba(255,255,255,.1);
  font:800 40px/1.1 "Exo 2";display:flex;align-items:center;gap:18px}
.feat div i{flex:0 0 18px;height:18px;border-radius:6px;transform:rotate(45deg)}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
.leak{position:absolute;width:1400px;height:1400px;border-radius:50%;pointer-events:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#wipe{position:absolute;left:-400px;top:-300px;width:900px;height:2600px;background:linear-gradient(90deg,var(--mint),var(--blue));pointer-events:none;display:none;box-shadow:0 0 120px rgba(61,220,151,.8)}
#prog{position:absolute;left:40px;right:40px;top:150px;height:8px;display:flex;gap:10px}
#prog i{flex:1;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden;position:relative}
#prog i u{position:absolute;left:0;top:0;bottom:0;background:#fff;width:0}
#brand{position:absolute;left:40px;top:182px;display:flex;align-items:center;gap:14px;font:800 30px Oxanium;letter-spacing:3px}
#brand img{width:46px;height:46px;border-radius:12px}
#bdate{position:absolute;right:40px;top:188px;font:600 28px Oxanium;letter-spacing:3px;color:var(--mute)}
.glitch{text-shadow:-7px 0 rgba(255,45,85,.85),7px 0 rgba(0,229,255,.85)}
</style></head>
<body><div id="stage"></div>
<script>
const SPEC = /*SPEC*/null;
const T = SPEC.timing, G = SPEC.games, NG = G.length;
const stage = document.getElementById('stage');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=x=>1-Math.pow(1-x,3), eExpo=x=>x>=1?1:1-Math.pow(2,-10*x), eInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
const pct=x=>Math.round(x*100)+'%';
const odd=x=>x==null?'–':Number(x).toFixed(2);
function el(tag,cls,html,parent){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;(parent||stage).appendChild(e);return e}
function hash(n){const x=Math.sin(n*127.1)*43758.5453;return x-Math.floor(x)}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function css(e,o){Object.assign(e.style,o);return e}
const MCOL = {g:'g', pt:'pt', s2_5:'s'};
const colOf = m => m==='g'?'g':m==='pt'?'pt':m==='s2.5'?'s':null;

const S0=T.intro, gStart=i=>S0+i*T.game, outroStart=S0+NG*T.game, TOTAL=outroStart+T.outro;
// phases inside a game
const PA=0, PB=3.0, PC=6.0, PD=9.5;
const scenes=[];

// ---------------- intro ----------------
const intro=el('div','scene'); scenes.push({el:intro,a:0,b:S0});
const ibg=el('div','bgimg',null,intro); if(G[0]) ibg.style.backgroundImage=`url(${G[0].bsrc})`;
css(el('div','shade',null,intro),{background:'linear-gradient(180deg,rgba(7,9,13,.75),rgba(7,9,13,.55) 45%,rgba(7,9,13,.92))'});
const i1=css(el('div','abs anton',"TONIGHT'S",intro),{left:0,right:0,top:'250px',textAlign:'center',fontSize:'190px'});
const i2=css(el('div','abs anton','BEST BETS',intro),{left:0,right:0,top:'430px',textAlign:'center',fontSize:'230px',color:'var(--mint)'});
const icards=G.map((g,i)=>{const c=el('div','pcard',`<img src="${g.src}">`,intro); css(c,{left:'90px',top:'720px',width:'900px',height:'580px'}); return c});
const ichip=css(el('div','abs',`<span class="chip"><span class="dot"></span>${SPEC.n} GAMES · ${esc(SPEC.day)}</span>`,intro),{left:0,right:0,top:'1345px',textAlign:'center'});
const ivs=css(el('div','abs',`<span style="color:var(--mint)">MODEL</span> &nbsp;VS&nbsp; <span style="color:var(--blue)">MARKET</span>`,intro),{left:0,right:0,top:'1440px',textAlign:'center',font:'800 40px Oxanium',letterSpacing:'8px'});

// ---------------- games ----------------
const GS=G.map((g,i)=>{
  const root=el('div','scene'); scenes.push({el:root,a:gStart(i),b:gStart(i)+T.game});
  const bg=el('div','bgimg',null,root); bg.style.backgroundImage=`url(${g.bsrc})`;
  const dim=css(el('div','shade',null,root),{background:'#07090d'});
  css(el('div','shade',null,root),{background:`radial-gradient(1200px 900px at 50% 30%, ${g.hc}44, transparent 70%), linear-gradient(180deg,rgba(7,9,13,.55),rgba(7,9,13,.4) 35%,rgba(7,9,13,.92) 72%)`});
  const chip=css(el('div','abs',`<span class="chip"><span class="dot"></span>GAME ${i+1}/${NG} · ${esc(g.time)}</span>`,root),{left:'40px',top:'245px'});
  const card=el('div','pcard',`<img src="${g.src}">`,root); css(card,{left:'40px',top:'330px',width:'1000px',height:'640px'});
  const cimg=card.querySelector('img');
  const mu=el('div','matchup anton',`<span>${g.away}</span><span class="at">@</span><span>${g.home}</span>`,root);
  const mparts=[...mu.children];
  const bars=el('div','bars',`<i style="background:${g.ac}"></i><i style="background:${g.hc}"></i>`,root);
  const kick=el('div','kick',esc(g.away_short+'  at  '+g.home_short),root);
  const names=new Set(g.names);
  const hl=el('div','headline',g.title.split(/\s+/).map(w=>{const core=w.replace(/[^A-Za-zÀ-ÿ'’.-]/g,'').replace(/['’]s$/,'');return `<span class="${names.has(core)?'hl':''}">${esc(w)}</span>`}).join(' '),root);
  const hws=[...hl.children];
  const credit=el('div','credit',esc(g.credit),root);
  const pk=g.pick, col=colOf(pk.m);

  // B: player table
  const tb=el('div','card',`<div style="display:flex;justify-content:space-between;align-items:center"><div class="lab">Player chances · model</div><span class="tag">Best bet ↓</span></div>
    <table class="tbl"><tr><th>PLAYER</th><th>GOAL</th><th>POINT</th><th>SOG 3+</th></tr>
    ${g.table.map(r=>{const best=r.id===pk.id; const c=k=>{const on=best&&col===k; return `<td class="${on?'on':''}">${on?'<b>':''}${pct(r[k].v)}${on?'</b>':''}</td>`};
      return `<tr class="${best?'best':''}"><td><span class="tm" style="background:${r.team===g.home?g.hc:g.ac}"></span>${esc(r.name.split(' ').slice(-1)[0])}<small style="display:inline;margin-left:12px">${r.team}</small></td>${c('g')}${c('pt')}${c('s')}</tr>`}).join('')}
    </table>`,root);
  css(tb,{top:'420px'});
  const trows=[...tb.querySelectorAll('tr')].slice(1);
  if(!col){ /* best bet is another market (assist, hits ...): mark it in the tag */ tb.querySelector('.tag').textContent='Best bet: '+pk.market; }

  // C: profile + bet
  const tc=g.home===pk.team?g.hc:g.ac;
  const sea=pk.season||{}, form=pk.form||[];
  const smax=Math.max(4,...form.map(x=>x.s||0));
  const metaBits=[pk.team+(pk.home?' vs ':' @ ')+pk.opp, pk.pos, pk.toi?pk.toi.toFixed(1)+' MIN':null, pk.line?pk.line.toUpperCase():null, pk.pp1?'PP1':null].filter(Boolean);
  const prof=el('div','card',`<div class="av" style="background:radial-gradient(circle at 30% 25%,${tc},${tc}88 60%,#0a0e13)">${pk.num??''}</div>
    <div class="pname">${esc(pk.name)}</div><div class="pmeta">${esc(metaBits.join(' · '))}</div>
    <div class="tiles"><div><b>${sea.gp??'–'}</b><span>GP</span></div><div><b>${sea.g??'–'}</b><span>G</span></div><div><b>${sea.a??'–'}</b><span>A</span></div><div><b>${sea.p??'–'}</b><span>PTS</span></div></div>
    <div class="lab" style="position:absolute;left:36px;top:360px;font-size:22px">LAST ${form.length} GAMES · SHOTS <span style="color:var(--mint)">● GOAL</span> <span style="color:var(--warn)">● ASSIST</span></div>
    <div class="chart">${form.map(x=>`<div class="c"><em style="color:${x.g?'var(--mint)':x.a?'var(--warn)':'transparent'}">${x.g?'G'.repeat(Math.min(x.g,3)):x.a?'A':'·'}</em><i style="height:${Math.max(6,(x.s||0)/smax*110)}px"></i><u>${x.s??0}</u></div>`).join('')}</div>`,root);
  css(prof,{top:'395px',height:'580px'});
  const pbars=[...prof.querySelectorAll('.chart i')], ptiles=[...prof.querySelectorAll('.tiles div')];
  const mkp = pk.nv ?? (pk.od?1/pk.od:null);
  const reasons=(pk.why||[]).filter(x=>!/^Model \d/.test(x)).slice(0,2);
  const bet=el('div','card bet',`<div class="lab">Best bet · ${esc(pk.team)} ${pk.home?'vs':'@'} ${esc(pk.opp)}</div>
    <div style="display:flex;align-items:center;gap:26px;margin-top:12px"><div class="big">${esc(pk.market)}</div>${pk.od?`<div class="odds">${odd(pk.od)}</div>`:''}</div>
    ${pk.ev!=null?`<div class="edge"><b>+${(pk.ev*100).toFixed(1)}%</b><span>MODEL EDGE</span></div>`:''}
    <div class="vrow"><div class="who">MODEL</div><div class="vtrack"><i class="m" style="background:linear-gradient(90deg,#1f9e68,var(--mint))"></i><b class="mv">0%</b></div></div>
    ${mkp!=null?`<div class="vrow"><div class="who">${pk.nv!=null?'MARKET':'ODDS SAY'}</div><div class="vtrack"><i class="k" style="background:linear-gradient(90deg,#2b5f9a,var(--blue))"></i><b class="kv">0%</b></div></div>`:''}
    <div class="why">${reasons.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`,root);
  css(bet,{top:'995px',height:'455px'});
  const bm=bet.querySelector('i.m'), bmv=bet.querySelector('.mv'), bk=bet.querySelector('i.k'), bkv=bet.querySelector('.kv');

  // D: game numbers
  const pub=g.public&&g.public.ml?g.public.ml:null;
  let stake='';
  if(g.stakes){ const tms=[g.home,g.away].filter(t=>g.stakes[t]); tms.sort((a,b)=>(g.stakes[b].swing||0)-(g.stakes[a].swing||0)); const t=tms[0];
    if(t){const s=g.stakes[t]; stake=`${t} playoff chance <em>${pct(s.now)}</em> · ${pct(s.win)} with a win · ${pct(s.lose)} with a loss`;} }
  const tr=(lbl)=>`<div class="row"><div class="who">${lbl}</div><div class="track"><b style="background:${g.ac}"></b><b class="r" style="background:${g.hc}"></b></div></div>`;
  const gn=el('div','card',`<div class="lab">Who wins?</div>${tr('MODEL')}${g.mk_home!=null?tr('MARKET'):''}${pub?tr('PUBLIC BETS'):''}
    <div style="display:flex;align-items:flex-end;gap:30px;margin-top:30px"><div style="font:400 120px/0.9 Anton;color:var(--mint)" class="gt">0.0</div>
    <div style="padding-bottom:12px"><div class="lab" style="font-size:24px">PROJECTED GOALS</div><div style="font:800 38px 'Exo 2';margin-top:4px">Over 5.5: model ${pct(g.over)}${g.mk_over!=null?` · market ${pct(g.mk_over)}`:''}</div></div></div>
    ${stake?`<div class="stake">${stake}</div>`:''}`,root);
  css(gn,{top:'470px'});
  const gtracks=[...gn.querySelectorAll('.track')], gt=gn.querySelector('.gt');
  const gvals=[g.p_home, g.mk_home, pub?pub.home[0]/100:null].filter(x=>x!=null);
  const glabs=[null,null,pub?'tickets':null];
  return {g,root,bg,dim,chip,card,cimg,mu,mparts,bars,kick,hl,hws,credit,tb,trows,prof,pbars,ptiles,bet,bm,bmv,bk,bkv,mkp,gn,gtracks,gt,gvals};
});

// ---------------- outro ----------------
const outro=el('div','scene'); scenes.push({el:outro,a:outroStart,b:TOTAL+1});
const obg=el('div','bgimg',null,outro); if(G[NG-1]) obg.style.backgroundImage=`url(${G[NG-1].bsrc})`;
css(el('div','shade',null,outro),{background:'linear-gradient(180deg,rgba(7,9,13,.85),rgba(7,9,13,.94))'});
const oh1=css(el('div','abs anton','THERE’S WAY MORE',outro),{left:0,right:0,top:'260px',textAlign:'center',fontSize:'128px'});
const oh2=css(el('div','abs anton','ON THE SITE',outro),{left:0,right:0,top:'390px',textAlign:'center',fontSize:'110px',color:'var(--mint)'});
const FEATS=[['Shots on goal','#5aa9ff'],['Hits & blocks','#ffb547'],['Lines & PP units','#3ddc97'],['Goalie matchups','#f07ac0'],['Public betting %','#5aa9ff'],['Playoff & Cup odds','#ffb547'],['Hot & cold streaks','#f07ac0'],['Build your slip','#3ddc97']];
const feat=el('div','feat',FEATS.map(([f,c])=>`<div><i style="background:${c}"></i>${f}</div>`).join(''),outro);
const fcells=[...feat.children];
let cupc=null;
if(SPEC.cup){ const c=SPEC.cup; cupc=css(el('div','card',`<div class="lab">Stanley Cup · model favourite</div><div style="display:flex;align-items:flex-end;gap:26px;margin-top:10px"><div style="font:400 120px/0.9 Anton">${c.team}</div><div style="font:400 120px/0.9 Anton;color:var(--mint)">${pct(c.p)}</div>${c.implied?`<div style="font:700 32px 'Exo 2';color:var(--mute);padding-bottom:10px">market ${pct(c.implied)}</div>`:''}</div>`,outro),{top:'1080px'}); }
const oicon=el('img','abs',null,outro); oicon.src='img/icon.png'; css(oicon,{left:'442px',top:'330px',width:'196px',height:'196px',borderRadius:'44px',boxShadow:'0 0 120px rgba(61,220,151,.45)'});
const oname=css(el('div','abs','NHL PROPS LAB',outro),{left:0,right:0,top:'570px',textAlign:'center',font:'800 100px Oxanium',letterSpacing:'4px'});
const ourl=css(el('div','abs',`<span class="chip" style="font-size:38px;letter-spacing:1px;text-transform:none;border-color:rgba(61,220,151,.6)"><span class="dot"></span>${esc(SPEC.site)}</span>`,outro),{left:0,right:0,top:'720px',textAlign:'center'});
const ofol=css(el('div','abs anton','FOLLOW FOR<br>TOMORROW’S BETS',outro),{left:0,right:0,top:'880px',textAlign:'center',fontSize:'128px'});
const odis=css(el('div','abs','Model numbers, not betting advice · 18+ · Play responsibly',outro),{left:'40px',right:'40px',top:'1400px',textAlign:'center',font:'500 28px "Exo 2"',color:'var(--mute)'});

// ---------------- overlays ----------------
const leak1=el('div','leak'); leak1.style.background='radial-gradient(circle,rgba(61,220,151,.5),transparent 60%)';
const leak2=el('div','leak'); leak2.style.background='radial-gradient(circle,rgba(90,169,255,.45),transparent 60%)';
el('div',null).id='vig';
const prog=el('div',null,G.map(()=>'<i><u></u></i>').join('')); prog.id='prog'; const progU=[...prog.querySelectorAll('u')];
const brand=el('div',null,`<img src="img/icon.png">NHL PROPS LAB`); brand.id='brand';
const bdate=el('div',null,esc(SPEC.day)); bdate.id='bdate';
const wipe=el('div',null); wipe.id='wipe';
const flash=el('div',null); flash.id='flash';

// ---------------- render ----------------
function slam(e,t,at,from=1.5){const p=seg(t,at,at+.32),q=eExpo(p); e.style.opacity=p<=0?0:clamp(p*3); e.style.transform=`scale(${lerp(from,1,q)})`; e.style.filter=q<1?`blur(${(1-q)*14}px)`:'none'; e.classList.toggle('glitch',t>=at&&t<at+.12);}
function words(spans,t,at,step,dy=50){spans.forEach((s,i)=>{const p=eOut(seg(t,at+i*step,at+i*step+.35)); s.style.opacity=p; s.style.transform=`translateY(${(1-p)*dy}px)`;});}
function popIn(e,t,at,dy=120){const p=eBack(seg(t,at,at+.5)); e.style.opacity=clamp(seg(t,at,at+.2)); e.style.transform=`translateY(${(1-p)*dy}px) scale(${lerp(.94,1,p)})`;}
function popOut(e,t,at){const q=eInOut(seg(t,at,at+.35)); if(q>0){e.style.opacity=(+e.style.opacity||1)*(1-q); e.style.transform+=` translateY(${-q*80}px) scale(${1-q*.04})`;}}
const beatPulse=t=>Math.exp(-((t%T.beat)/T.beat)*6);

window.render=function(t){
  for(const s of scenes) s.el.style.display=(t>=s.a&&t<s.b)?'block':'none';
  const cutsAt=[...G.map((_,i)=>gStart(i)), outroStart];
  const subCuts=G.flatMap((_,i)=>[gStart(i)+PB,gStart(i)+PC,gStart(i)+PD]);
  let sx=0,sy=0;
  for(const c of cutsAt){const d=t-c; if(d>=0&&d<.25){const k=(1-d/.25)*14; sx+=(hash(t*90)-.5)*k; sy+=(hash(t*77+3)-.5)*k;}}
  stage.style.transform=`translate(${sx}px,${sy}px)`;

  if(t<S0){
    ibg.style.transform=`scale(${1.2+t*.02})`;
    slam(i1,t,0,1.8); slam(i2,t,T.beat,1.8);
    icards.forEach((c,i)=>{const at=2*T.beat+i*T.beat*.75, p=eBack(seg(t,at,at+.45)); const rot=[-6,5,-3,4,-2][i%5];
      c.style.opacity=clamp(seg(t,at,at+.15)); c.style.transform=`translate(${(1-p)*(i%2?900:-900)}px,${(1-p)*-100+i*-10}px) rotate(${lerp(rot*3,rot,p)}deg) scale(${lerp(1.1,1-.0*i,p)})`; c.style.zIndex=i;
      c.querySelector('img').style.transform=`scale(${1.08+seg(t,at,S0)*.06})`;});
    popIn(ichip,t,5*T.beat,60); const vp=eOut(seg(t,6*T.beat,6*T.beat+.4)); ivs.style.opacity=vp; ivs.style.letterSpacing=`${lerp(30,8,vp)}px`;
    intro.style.opacity=1-seg(t,S0-.15,S0);
  }

  GS.forEach((s,i)=>{
    const a=gStart(i); if(t<a||t>=a+T.game) return;
    const u=t-a, g=s.g, pulse=beatPulse(u)*.012;
    const toB=eInOut(seg(u,PB,PB+.5));
    s.bg.style.transform=`scale(${1.15+u*.01+pulse})`;
    s.dim.style.opacity=lerp(.25,.55,toB);
    // A: story
    const cin=eExpo(seg(u,0,.55));
    s.chip.style.opacity=eOut(seg(u,.1,.4))*(1-toB);
    s.card.style.opacity=clamp(cin*1.4)*(1-toB);
    s.card.style.transform=`translateY(${(1-cin)*140-toB*160}px) scale(${lerp(.92,1,cin)*lerp(1,.9,toB)}) rotate(${(1-cin)*-3}deg)`;
    s.cimg.style.transform=`scale(${1.06+u/PB*.12+pulse}) translate(${(i%2?-1:1)*u/PB*18}px,${-u/PB*10}px)`;
    s.mparts.forEach((e,k)=>{const at=.25+k*.1,p=eExpo(seg(u,at,at+.32)); e.style.opacity=clamp(p*2); e.style.transform=`translateY(${(1-p)*(k==1?0:-120)}px) scale(${lerp(k==1?.2:1.6,1,p)})`; e.classList.toggle('glitch',u>=at&&u<at+.1)});
    s.mu.style.transform=`translateY(${toB*-660}px) scale(${lerp(1,.6,toB)})`;
    const bp=eOut(seg(u,.6,1)); s.bars.style.opacity=1-toB; [...s.bars.children].forEach(b=>b.style.transform=`scaleX(${bp})`);
    s.kick.style.opacity=eOut(seg(u,.75,1.05))*(1-toB);
    words(s.hws,u,.85,.055); s.hl.style.opacity=1-toB;
    s.credit.style.opacity=.9*eOut(seg(u,.5,.9))*(1-seg(u,PB,PB+.3));
    // B: player table
    if(u>=PB-.1&&u<PC+.4){ s.tb.style.display='block'; popIn(s.tb,u,PB+.15); popOut(s.tb,u,PC-.05);
      s.trows.forEach((r,k)=>{const p=eOut(seg(u,PB+.35+k*.09,PB+.75+k*.09)); r.style.opacity=p; r.style.transform=`translateX(${(1-p)*-80}px)`;});
      const best=s.tb.querySelector('tr.best td.on b'); if(best){const q=seg(u,PB+1.3,PB+1.7); best.style.transform=`scale(${1+Math.sin(q*Math.PI)*.25})`;}
    } else s.tb.style.display='none';
    // C: profile + bet
    if(u>=PC-.1&&u<PD+.4){ s.prof.style.display=s.bet.style.display='block';
      popIn(s.prof,u,PC+.1); popIn(s.bet,u,PC+.45,160); popOut(s.prof,u,PD-.05); popOut(s.bet,u,PD-.05);
      s.ptiles.forEach((e,k)=>{const p=eBack(seg(u,PC+.35+k*.07,PC+.75+k*.07)); e.style.transform=`scale(${lerp(.6,1,p)})`; e.style.opacity=clamp(p)});
      s.pbars.forEach((e,k)=>{e.style.transform=`scaleY(${eOut(seg(u,PC+.5+k*.05,PC+.9+k*.05))})`});
      const pv=eOut(seg(u,PC+.8,PC+1.6)), pk=g.pick;
      s.bm.style.width=pct(pk.v*pv); s.bmv.textContent=pct(pk.v*pv);
      if(s.bk){s.bk.style.width=pct(s.mkp*pv); s.bkv.textContent=pct(s.mkp*pv);}
    } else { s.prof.style.display=s.bet.style.display='none'; }
    // D: game numbers
    if(u>=PD-.1){ s.gn.style.display='block'; popIn(s.gn,u,PD+.1);
      const p=eOut(seg(u,PD+.35,PD+1.2));
      s.gtracks.forEach((tr,k)=>{const ph=lerp(.5,s.gvals[k],p),[ba,bh]=tr.children; const vw=clamp(ph,.17,.83); ba.style.width=(1-vw)*100+'%'; bh.style.width=vw*100+'%'; ba.textContent=g.away+' '+pct(1-ph); bh.textContent=pct(ph)+' '+g.home;});
      s.gt.textContent=(g.exp_total*p).toFixed(1);
    } else s.gn.style.display='none';
    s.root.style.opacity=1-seg(u,T.game-.18,T.game)*.6;
  });

  if(t>=outroStart){
    const u=t-outroStart, B2=4.5, out1=eInOut(seg(u,B2-.3,B2));
    obg.style.transform=`scale(${1.2+u*.02})`;
    slam(oh1,u,.05,1.6); slam(oh2,u,.4,1.6);
    fcells.forEach((c,k)=>{const at=.7+k*.16,p=eBack(seg(u,at,at+.4)); c.style.opacity=clamp(seg(u,at,at+.15)); c.style.transform=`scale(${lerp(.5,1,p)}) rotate(${(1-p)*(k%2?4:-4)}deg)`;});
    if(cupc) popIn(cupc,u,2.2);
    [oh1,oh2,feat,cupc].forEach(e=>{if(e){e.style.display=u<B2?'':'none'; if(out1>0) e.style.opacity=(+e.style.opacity||1)*(1-out1);}});
    const v=u-B2; [oicon,oname,ourl,ofol,odis].forEach(e=>e.style.display=v>=0?'':'none');
    if(v>=0){ const ip=eBack(seg(v,0,.5)); oicon.style.opacity=clamp(ip); oicon.style.transform=`scale(${lerp(.3,1,ip)}) rotate(${(1-ip)*-25}deg)`;
      slam(oname,v,.25,1.4); popIn(ourl,v,.55,40); slam(ofol,v,.9,1.6); odis.style.opacity=eOut(seg(v,1.3,1.7)); }
    stage.style.opacity=1-seg(u,T.outro-.45,T.outro);
  } else stage.style.opacity=1;

  const inGames=t>=S0&&t<outroStart;
  prog.style.opacity=inGames?1:0; brand.style.opacity=inGames?.95:0; bdate.style.opacity=inGames?.9:0;
  progU.forEach((e,i)=>{e.style.width=clamp((t-gStart(i))/T.game)*100+'%'});
  leak1.style.transform=`translate(${-500+Math.sin(t*.45)*380}px,${-300+Math.cos(t*.3)*300}px)`; leak1.style.opacity=.2+beatPulse(t)*.08;
  leak2.style.transform=`translate(${300+Math.cos(t*.38)*360}px,${900+Math.sin(t*.27)*420}px)`; leak2.style.opacity=.16;
  let fl=0,wp=-1;
  for(const c of cutsAt){const d=t-c; if(d>=0&&d<.3) fl=Math.max(fl,(1-d/.3)*.55); if(d>-.32&&d<.08) wp=(d+.32)/.4;}
  for(const c of subCuts){const d=t-c; if(d>=0&&d<.18) fl=Math.max(fl,(1-d/.18)*.12);}
  if(t<.25) fl=Math.max(fl,(1-t/.25)*.6);
  flash.style.opacity=fl;
  if(wp>=0){wipe.style.display='block'; wipe.style.transform=`translateX(${lerp(-1000,2400,eInOut(wp))}px) rotate(14deg)`;} else wipe.style.display='none';
};
Promise.all([document.fonts.ready, ...['400 20px Anton','500 20px "Exo 2"','700 20px "Exo 2"','800 20px "Exo 2"','600 20px Oxanium','800 20px Oxanium'].map(f=>document.fonts.load(f)),
  ...G.flatMap(g=>[g.src,g.bsrc]).map(u=>new Promise(r=>{const im=new Image();im.onload=im.onerror=r;im.src=u}))
]).then(()=>{render(0); window.READY=true;});
</script></body></html>
