		function teamCodesReversed(teamCode)

		function roundToThree(num) {    
				return +(Math.round(num + "e+3")  + "e-3");
			}
	
		function roundToThreeWithZeros(num) {    
				return Number.parseFloat(num).toFixed(3);
			}
			
		function roundToFourWithZeros(num) {    
				return Number.parseFloat(num).toFixed(4);
			}
	
		function roundToTwo(num) {    
				return +(Math.round(num + "e+2")  + "e-2");
			}

		function roundToOne(num) {    
				return +(Math.round(num + "e+1")  + "e-1");
			}

			
		function loadFile(file) {
			var request;
			if (window.XMLHttpRequest) {
				// IE7+, Firefox, Chrome, Opera, Safari
				request = new XMLHttpRequest();
			} else {
				// code for IE6, IE5
				request = new ActiveXObject('Microsoft.XMLHTTP');
			}
			// load
			request.open('GET', file, false);
			request.send();
			updateTime = request.responseText
			
			updateTimeAsTime = moment(updateTime.substring(0,16) , 'YYYY-MM-DD hh:mm');
			updateTimeString = moment(updateTimeAsTime).format('dddd MMMM D[,] YYYY [at] h:mm A')
			
			
			document.getElementById("updateTime").innerHTML = "Stats updated: " +  updateTimeString  + " Eastern Time"
			}
		
		var downloadedData = ''
		
		function loadCSV(file) {
		
			try
			{
				var request;
				if (window.XMLHttpRequest) {
					request = new XMLHttpRequest();
				} else {
					request = new ActiveXObject('Microsoft.XMLHTTP');
				}
				request.open('GET', file, false);
				request.send();
				
				downloadedData = request.responseText
			}
			catch
			{
				downloadedData = ""
				console.log("Data not found")
			}
			updateChart('');
		}
		

		
		function fancyTimeFormat(duration)
		{   
			var hrs = ~~(duration / 3600);
			var mins = ~~((duration % 3600) / 60);
			var secs = ~~duration % 60;
			var ret = "";
			if (hrs > 0) 
			{
				ret += "" + parseInt(parseInt(hrs * 60) + parseInt(mins)) + ":" + (secs < 10 ? "0" : "");	
			}
			else
			{
				ret += "" + mins + ":" + (secs < 10 ? "0" : "");
			
			}
			ret += "" + secs;
			return ret;
		}
		
		function getBackgroundColorFor(value,lowEnd,highEnd, switcher)
		{
			if(switcher==-1)
			{
				femtile = (highEnd-lowEnd) / 5 
						
				if(value>highEnd - femtile)
					return '#f5fbfd'
				else if(value>highEnd - femtile*2)
					return '#c9e9f6'
				else if(value>highEnd - femtile*3)
					return '#9dd7ef'
				else if(value>highEnd - femtile*4)
					return '#71c5e7'
				else return '#45b3e0'
			}
			
			else
			{
				femtile = (highEnd-lowEnd) / 5 
						
				if(value>highEnd - femtile)
					return '#45b3e0'
				else if(value>highEnd - femtile*2)
					return '#71c5e7'
				else if(value>highEnd - femtile*3)
					return '#9dd7ef'
				else if(value>highEnd - femtile*4)
					return '#c9e9f6'
				else return '#f5fbfd'
			}

			
		}

							var unblockedShotAttempts = parseInt(c[10]);	
							var gamesPlayed = parseInt(c[6]);	
							
							
							
							if(situation == situationChoice && gamesPlayed  >= gamesPlayedChoice  && (teamChoice == 'all' || teamChoice == teamCode) && position == 'G' && unblockedShotAttempts > 0 )

			function get_country_code() {
		return new Promise((resolve, reject) => {
			var trace = []; 
			jQuery.ajax('/cdn-cgi/trace', {
				success: function(response) {
					var lines = response.split('\n');
					var keyValue;
					for (var index = 0; index < lines.length; index++) {
						const line = lines[index];
						keyValue = line.split('=');
						trace[keyValue[0]] = decodeURIComponent(keyValue[1] || '');
						if (keyValue[0] === 'loc' && trace['loc'] !== 'XX') {
							return resolve(trace['loc']);
						}
					}
				},
				error: function() {
					return reject(trace);
				}
			});

		});
	}
