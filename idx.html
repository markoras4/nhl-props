		function changeContentBasedOnDate(dateForGames)
		{
		
			counter = dateForGames
		
		
			if(counter == '') //if blank, set to today
			{
			
				var now = new Date();
				
				//if before 9 am, set to yesterday.....
				var hourOfDay = now.getHours(); 
				
				if(hourOfDay<12)
				{
					now.setDate(now.getDate()-1); //change it by one
				}
				
				var day = ("0" + now.getDate()).slice(-2);
				var month = ("0" + (now.getMonth()+1 )).slice(-2);
				var year = now.getFullYear();
				counter = year + "-" + (month) + "-" + (day)
				
			}

			
			counterYear = parseInt(counter.substring(0,4))
			counterMonth = parseInt(counter.substring(5,7))
			counterDay = parseInt(counter.substring(8,10))
					
			var now = new Date(counterYear, counterMonth-1, counterDay);
			
			var day = ("0" + now.getDate()).slice(-2);
			var month = ("0" + (now.getMonth() +1 )).slice(-2);
			var year = now.getFullYear();
			
			var dayOfWeek = now.getDay();
			
			var todayString = year + "" + (month) + "" + (day);
			
			var monthNames = [

			  "April", "May", "June", "July",

			];

		function changeDay(direction)
		{
			var newDate = new Date(counterYear, counterMonth-1, counterDay); 	
			newDate.setDate(newDate.getDate() +direction); 

			var day = ("0" + newDate.getDate()).slice(-2);

function get_country_code() {

		myCountry = localStorage.getItem('country');
		
		if (!(!myCountry || myCountry === "null")) {
			return myCountry;
		}

		return new Promise((resolve, reject) => {
			var trace = []; 
			jQuery.ajax('/cdn-cgi/trace', {
				success: function(response) {
					var lines = response.split('\n');
					var keyValue;
					for (var index = 0; index < lines.length; index++) {
						const line = lines[index];
						keyValue = line.split('=');
						trace[keyValue[0]] = decodeURIComponent(keyValue[1] || '');
						if (keyValue[0] === 'loc' && trace['loc'] !== 'XX') {
							return resolve(trace['loc']);
						}
					}
				},
				error: function() {
					return reject(trace);
				}
			});

		});
	}

function formatDateToISO(dateStr) {
    let [month, day, year] = dateStr.split("/");
    return `${year}-${month.padStart(2, '0')}-${day.padStart(2, '0')}`;
}

{

	changeContentBasedOnDate(dateValue)
}


document.addEventListener("DOMContentLoaded", function() {
    let touchstartX = 0;
    let touchendX = 0;
    let touchstartY = 0;
    let touchendY = 0;
    const swipeThreshold = 50; 
    const verticalThresholdRatio = 0.9; 

    function handleGesture() {
        let deltaX = touchendX - touchstartX;
        let deltaY = Math.abs(touchendY - touchstartY);
        let dynamicVerticalThreshold = Math.abs(deltaX) * verticalThresholdRatio; // Dynamic vertical threshold

        if (Math.abs(deltaX) > swipeThreshold && deltaY < dynamicVerticalThreshold) {
            if (deltaX > 0) {
                onSwipeRight(); // Call the right swipe function
            } else {
                onSwipeLeft(); // Call the left swipe function
            }
        }
    }

    document.addEventListener("touchstart", function(event) {
        touchstartX = event.touches[0].clientX;
        touchstartY = event.touches[0].clientY;
    }, false);

    document.addEventListener("touchend", function(event) {
        touchendX = event.changedTouches[0].clientX;
        touchendY = event.changedTouches[0].clientY;
        handleGesture();
    }, false);
	
	
	
	function onSwipeRight() {
		let container = document.getElementById("includedContent");
		
		container.style.position = "relative"; 
		container.style.width = "100%";
		container.style.minHeight = "500px"; 
		container.style.transition = "transform 0.3s ease-in-out, opacity 0.3s ease-in-out";
		container.style.opacity = "1"; 
		container.style.transition = "";
		container.style.transform = ""

		if (container.classList.contains("swipe-left-old")) {
		container.classList.remove("swipe-left-old");
		}
		
		

		container.classList.add("swipe-right-old");

		setTimeout(() => {

			changeDay(-1);

			container.style.transition = "none"; 
			container.style.transform = "translateX(-100%)"; 
			container.style.opacity = "0";

			setTimeout(() => {
				container.style.transition = "transform 0.3s ease-in-out, opacity 0.3s ease-in-out";
				container.style.transform = "translateX(0)"; 
				container.style.opacity = "1";
				
				
				
			}, 50);
		}, 300); 
		
		ga("send", "event", "swipe", "right", 1);
			
	}

	function onSwipeLeft() {
		let container = document.getElementById("includedContent");
		
		container.style.position = "relative"; 
		container.style.width = "100%";
		container.style.minHeight = "500px"; 
		container.style.transition = "transform 0.3s ease-in-out, opacity 0.3s ease-in-out";
		container.style.opacity = "1"; 
		container.style.transition = "";
		container.style.transform = ""
		
		if (container.classList.contains("swipe-right-old")) {
		container.classList.remove("swipe-right-old");
		}


		container.classList.add("swipe-left-old");

		setTimeout(() => {
			changeDay(1);

			container.style.transition = "none"; 
			container.style.transform = "translateX(100%)"; 
			container.style.opacity = "0";

			setTimeout(() => {
				container.style.transition = "transform 0.3s ease-in-out, opacity 0.3s ease-in-out";
				container.style.transform = "translateX(0)"; 
				container.style.opacity = "1";
				
			}, 50); 
		}, 300); 
	
		ga("send", "event", "swipe", "left", 1);
	
	}

	

	
});
